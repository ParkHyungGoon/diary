function kApplyPaste(){
  const box=document.getElementById('kpaste'); if(!box)return;
  const raw=box.value.replace(/\r/g,''); if(!raw.trim()){toast('붙여넣은 내용이 없습니다');return;}
  const k=K(), rows=raw.split('\n'); let n=0;
  rows.forEach((row,ri)=>{ if(ri>=k.periods.length)return;
    const cols=row.split(/\t|,/);
    for(let d=1;d<=5;d++){
      const cell=(cols[d-1]||'').replace(/\s+/g,' ').trim();
      let c=kCell(d,k.periods[ri].p);
      if(!cell){ if(c)k.tt=k.tt.filter(x=>x!==c); continue; }
      if(!c){k.tt.push({d:d,p:k.periods[ri].p,g:cell,room:''});} else c.g=cell;
      n++;}});
  save();renderNav();render();toast(n+'칸을 채웠습니다');}
function kRename(oldN,newN){newN=(newN||'').trim(); if(!newN||newN===oldN)return; const k=K();
  k.tt.forEach(x=>{if((x.g||'').trim()===oldN)x.g=newN;});
  const nl={};Object.keys(k.logs).forEach(key=>{const p=key.split('|');if(p[0]===oldN)p[0]=newN;nl[p.join('|')]=k.logs[key];});
  k.logs=nl; if(k.colors[oldN]){k.colors[newN]=k.colors[oldN];delete k.colors[oldN];}
  if(k.ui.g===oldN)k.ui.g=newN; save();renderNav();render();
  toast('«'+oldN+'» → «'+newN+'» — 기록도 함께 옮겼습니다');}

function kAddRange(){
  const a=prompt('시작 날짜 (YYYY-MM-DD)');if(!a)return;
  const b=prompt('끝 날짜 (YYYY-MM-DD)',a);if(!b)return;
  const t=prompt('사유','지필평가')||'휴업일';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(a)||!/^\d{4}-\d{2}-\d{2}$/.test(b)){toast('날짜 형식이 올바르지 않습니다');return;}
  let d=a,n=0,g=0;
  while(d<=b&&g++<400){const w=parseD(d).getDay(); if(w>=1&&w<=5&&kAddOff(d,t,true))n++; d=addDays(d,1);}
  save();render();toast(n+'일을 휴업일로 추가했습니다');}

function kAddMove(kk,fd,fp,td,tp,g,t,quiet){
  const gv=x=>{const e=document.getElementById(x);return e?e.value:'';};
  kk=kk||gv('kmvk')||'move';
  fd=fd||gv('kmvfd'); fp=fp||parseInt(gv('kmvfp')||'0',10);
  td=td||gv('kmvtd'); tp=tp||parseInt(gv('kmvtp')||'0',10);
  g=g||gv('kmvg'); t=(t!==undefined&&t!==null)?t:gv('kmvt');
  if(kk==='move'&&(!fd||!fp||!td||!tp)){toast('원래 시간과 옮길 시간을 모두 고르세요');return false;}
  if(kk==='off'&&(!fd||!fp)){toast('날짜와 교시를 고르세요');return false;}
  if(kk==='add'&&(!td||!tp||!g)){toast('날짜·교시·반을 고르세요');return false;}
  if(kk!=='add'&&!quiet&&!kSlotAt(fd,fp)){

  K().moves.push({k:kk,fd:fd||'',fp:fp||0,td:td||'',tp:tp||0,g:g||'',t:t||''});

function kExportCSV(){

function kImportJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const j=JSON.parse(r.result);
      if(!j||!j.tt)throw new Error('형식');
      const k=K();
      if((k.tt||[]).length&&!confirm('지금 들어 있는 시간표·학사일정·차시 기록을 가져온 파일로 바꿉니다. 계속할까요?'))return;
      k.term=Object.assign({name:'',start:'',end:''},j.term||{});
      if(Array.isArray(j.periods)&&j.periods.length)k.periods=j.periods.map((p,i)=>({p:i+1,s:p.s||'09:00',e:p.e||'09:50'}));
      k.tt=Array.isArray(j.tt)?j.tt:[]; k.colors=j.colors||{};
      k.off=Array.isArray(j.off)?j.off:[]; k.swap=Array.isArray(j.swap)?j.swap:[];
      k.moves=Array.isArray(j.moves)?j.moves:[];
      k.logs=j.logs||{}; k.on=true; k.importedAt=new Date().toISOString();
      KCACHE={sig:'',days:null,map:{}}; save(); renderNav(); render();

    }catch(err){ alert('가져오기 실패: 수업차시누가기록 백업 파일이 맞는지 확인해 주세요.'); } };
  r.readAsText(f); e.target.value='';}

function kNoW(n){return n>=100?27:(n>=10?21:16);}

/* ============================================================
   ⑮ 말풍선 툴팁 — 5분·10분짜리 블록은 글자가 안 보인다.
   마우스를 올리면 제목·시간·우선순위·핵심 성공 요인·메모가 통째로 뜬다.
   내용은 TIPS 맵에 담고 요소에는 키만 붙인다(속성 이스케이프 지옥 회피).
   ============================================================ */
let TIPS={};
function tipSet(k,html){TIPS[k]=html;return k;}
function tipEl(){let e=document.getElementById('dtip');
  if(!e){e=document.createElement('div');e.id='dtip';document.body.appendChild(e);}return e;}
function tipShow(el){
  const k=el.getAttribute('data-tk'); const html=TIPS[k]; if(!html)return;
  const t=tipEl(); t.innerHTML=html; t.classList.add('on');
  const r=el.getBoundingClientRect(), tw=t.offsetWidth, th=t.offsetHeight, m=10;
  let x=r.right+m, y=r.top;
  if(x+tw>window.innerWidth-6)x=r.left-tw-m;
  if(x<6)x=Math.max(6,Math.min(window.innerWidth-tw-6,r.left));
  if(y+th>window.innerHeight-6)y=Math.max(6,window.innerHeight-th-6);
  if(y<6)y=6;
  t.style.left=Math.round(x)+'px'; t.style.top=Math.round(y)+'px';}
function tipHide(){CURTIP=null;const t=document.getElementById('dtip'); if(t)t.classList.remove('on');}
let CURTIP=null;
function tipInit(){
  /* 내부 자식 사이를 오갈 때 깜빡이지 않도록 relatedTarget 으로 진짜 진입/이탈만 잡는다 */
  document.addEventListener('mouseover',e=>{
    const el=e.target.closest&&e.target.closest('[data-tk]'); if(!el)return;
    if(CURTIP===el)return; CURTIP=el; tipShow(el); },true);
  document.addEventListener('mouseout',e=>{
    const el=e.target.closest&&e.target.closest('[data-tk]'); if(!el)return;
    const to=e.relatedTarget;
    if(to&&el.contains(to))return;
    CURTIP=null; tipHide(); },true);
  /* 스크롤 중에는 숨기지 말고 따라붙게 한다 (스크롤 이벤트가 hover 직후에 늦게 오는 경우가 있다) */
  document.addEventListener('scroll',()=>{ if(CURTIP)tipShow(CURTIP); else tipHide(); },true);
  window.addEventListener('resize',tipHide);
  document.addEventListener('click',tipHide,true);}
function tipSec(lab,txt,cls){ if(!txt)return '';
  return `<div class="tsec"><span class="tlab">${lab}</span><div class="twrap ${cls||''}">${esc(txt)}</div></div>`;}

     <span class="tchip">${t.priority} 우선순위</span>

/* ============================================================
   ⑯ 마감일(D-day) — 끝낼 때까지 따라오는 과제
   · 마감일이 있는 미완료 과제는 날짜가 지나도 '오늘'의 우선순위 과제에 계속 나타난다.
   · D-3 → D-DAY → D+2 (지나면 빨강). 완료하면 그날로 사라진다.
   ============================================================ */
function dayDiff(a,b){return Math.round((parseD(b)-parseD(a))/86400000);}
function dueInfo(due){
  if(!due)return null;
  const n=dayDiff(today(),due);
  if(n>0)return {n:n,txt:'D-'+n,cls:(n<=2?'soon':'far'),over:false};
  if(n===0)return {n:0,txt:'D-DAY',cls:'today',over:false};
  return {n:n,txt:'D+'+(-n),cls:'over',over:true};}
function dueBadge(d,t){
  const i=dueInfo(t.due); if(!i)return '';
  /* 마감이 지난 것은 자책 장치가 되지 않게 — 누르면 '다음 신호로 재예약' 창이 열린다 */
  const fn=i.over?`openResched('${d}','${t.id}')`:`openMemo('${d}','task','${t.id}')`;
  return `<button class="dbadge ${i.cls}" onclick="${fn}"
    title="마감 ${t.due} (${wd(t.due)})${i.over?' — 만회하지 말고 다음 신호로 재예약하세요':''}">${i.txt}</button>`;}
function setDue(d,id,v){const t=findTask(d,id);if(!t)return;
  v=(v||'').trim(); if(v)t.due=v; else delete t.due;
  save(); if(S.view==='day'){renderTasks(S.ui.day);renderOne(S.ui.day);renderSchedule(S.ui.day);} else render();}
function dueQuick(id,n){
  const el=document.getElementById('duetx'); if(!el)return;
  el.value = (n===null)?'':addDays(today(),n);
  const t=findTask(S.ui.day,id); if(t){ if(el.value)t.due=el.value; else delete t.due; save(); }
  const box=document.getElementById('duenow');
  if(box){const i=dueInfo(el.value); box.innerHTML=i?`<span class="dbadge ${i.cls}" style="cursor:default">${i.txt}</span> ${el.value} (${wd(el.value)})`:'<span class="hint">마감일 없음</span>';}}

/* 과제가 실제로 들어 있는 날짜 (이월되어 다른 날에 살아 있을 수 있다) */
function taskHome(id,d){ d=d||S.ui.day;
  if(((S.days[d]||{}).tasks||[]).some(t=>t.id===id))return d;
  let x=addDays(d,-1);
  for(let i=0;i<180;i++){const dd=S.days[x]; if(dd&&dd.tasks&&dd.tasks.some(t=>t.id===id))return x; x=addDays(x,-1);}
  return d;}
/* 마감일이 있고 아직 끝내지 않은 지난 과제 — 오늘(그리고 그 이후) 목록에 함께 올린다 */
function carriedTasks(d){
  if(!d||d<today())return [];
  const out=[]; let x=addDays(d,-1);
  for(let i=0;i<180;i++){
    const dd=S.days[x];
    if(dd&&dd.tasks)dd.tasks.forEach(t=>{
      if(t.text&&t.due&&t.status!=='done'&&t.status!=='drop')out.push(t);});
    x=addDays(x,-1);}
  return out;}
function dayTasks(d){return ((S.days[d]||{}).tasks||[]).concat(carriedTasks(d));}


/* ============================================================
   ⑰ 신호(IF) → 첫 행동(THEN) · 착수 · 오늘의 약속 3가지
   ------------------------------------------------------------
   왜 만들었는가 (2026-09 대화의 진단):
   · 실천이 막히는 지점은 '무엇을 할지 모름'이 아니라 '결정과 첫 행동 사이의 협상'이다.
   · 그래서 다이어리를 계획표가 아니라 '행동 스위치'로 바꾼다.
       ① 과제명이 아니라 3분 안에 끝나는 첫 물리적 행동을 적는다 (first)
       ② 시각이 아니라 신호를 정한다 — "3교시가 끝나면" (cueRef / cue)
       ③ 완료가 아니라 착수를 성공으로 센다 (startedAt, status='prog')
       ④ 하루의 약속은 끝낼 것 1 · 시작할 것 1 · 바로 할 것 1 (type)
   이 앱만의 값어치: 신호를 교시·공강 데이터에서 골라 쓸 수 있고,
   휴업일·요일 교체·수업 이동이 반영된 '그날의 실제 공강'으로 자동 계산된다.
   ============================================================ */
const T_TYPES={
  end  :{l:'끝낼 것',  e:'🁢',c:'#c98a1a',h:'오늘 안에 끝낸다'},
  start:{l:'시작할 것',e:'▶', c:'#1f9d8f',h:'착수하면 성공'},
  quick:{l:'바로 할 것',e:'⚡',c:'#5b53b0',h:'2분이면 끝난다'}
};
const T_ORDER=['end','start','quick'];

/* ── 신호(cue) ── */
const CUE_FIX=[
  {ref:'wake', t:'알람이 울리면'},
  {ref:'am',   t:'출근해서 자리에 앉으면'},
  {ref:'gap',  t:'비는 시간(공강)이 시작되면'},
  {ref:'lunch',t:'점심을 먹고 자리에 앉으면'},
  {ref:'pm',   t:'퇴근하기 전에'},
  {ref:'home', t:'저녁 식사를 마치면'}
];
function cuePeriods(){ try{ return (K().periods||[]); }catch(e){ return []; } }
function cueOpts(d){
  const out=CUE_FIX.slice();
  cuePeriods().forEach(p=>out.push({ref:'p'+p.p+'e', t:p.p+'교시가 끝나면'}));
  return out;}
/* 그날의 실제 시간표를 보고 신호를 구체적인 문장·시각으로 바꾼다.
   휴업일이거나 그 교시가 사라졌으면 말이 되게 바꿔 준다. */
function cueResolve(d,ref){
  if(!ref)return null;
  d=d||today();
  let off=null; try{ if(kOn())off=kOffMap()[d]||null; }catch(e){}
  if(ref!=='gap'){
    const fx=CUE_FIX.find(x=>x.ref===ref);
    if(fx)return {txt:fx.t,at:''};
  }else{
    let on=[]; try{ on=kOn()?kLessonsOn(d):[]; }catch(e){}
    if(off)return {txt:'('+off+') 비는 시간이 생기면',at:''};
    if(!on.length)return {txt:'비는 시간이 생기면',at:''};
    const used=on.map(x=>x.p), ps=cuePeriods(), first=Math.min.apply(null,used);
    const c=ps.find(p=>p.p>first&&used.indexOf(p.p)<0);
    if(c)return {txt:c.p+'교시 공강이 시작되면',at:c.s};
    const last=Math.max.apply(null,used); let pe={s:'',e:''};
    try{pe=kPerOf(last);}catch(e){}
    return {txt:last+'교시(오늘 마지막 수업)가 끝나면',at:pe.e||''};
  }
  const m=/^p(\d+)e$/.exec(ref);
  if(m){ const p=+m[1]; let pe={s:'',e:''}; try{pe=kPerOf(p);}catch(e){}
    if(off)return {txt:'('+off+') '+p+'교시쯤',at:pe.e||''};
    return {txt:p+'교시가 끝나면',at:pe.e||''};}
  return null;}
function cueText(d,t){
  if(!t)return '';
  const r=cueResolve(d,t.cueRef);
  if(r)return r.txt+(r.at?' ('+r.at+')':'');
  return (t.cue||'').trim();}
function cueSelOpts(d,t){
  const cur=(t&&t.cueRef)||'';
  return '<option value="">— 신호 고르기 —</option>'+
    cueOpts(d).map(o=>{const r=cueResolve(d,o.ref);
      const lb=r?(r.txt+(r.at?' ('+r.at+')':'')):o.t;
      return `<option value="${o.ref}" ${cur===o.ref?'selected':''}>${esc(lb)}</option>`;}).join('');}
function repaintDay(d){ d=d||S.ui.day||today();
  if(S.view==='day'){renderTasks(d);renderOne(d);renderSchedule(d);} else render(); }
function setCueRef(d,id,ref){const t=findTask(d,id);if(!t)return;
  if(ref)t.cueRef=ref; else delete t.cueRef;
  save();repaintDay(d);}
function setCueTxt(d,id,v){const t=findTask(d,id);if(!t)return;
  v=(v||'').trim(); if(v){t.cue=v; delete t.cueRef;} else delete t.cue;
  save();repaintDay(d);}
function setFirstAct(d,id,v){const t=findTask(d,id);if(!t)return;
  v=(v||'').trim(); if(v)t.first=v; else delete t.first;
  save();repaintDay(d);}
function setTaskType(d,id,ty){const t=findTask(d,id);if(!t)return;
  if(ty){bringHome(d,id);t.type=ty; if(ty==='end'){ensureDay(d);S.days[d].one=id;}}
  else {delete t.type; if(S.days[d]&&S.days[d].one===id)S.days[d].one='';}
  save();repaintDay(d);}

/* ── 착수(started) — 완료가 아니라 시작을 센다 ── */
function isStarted(t){return !!(t&&(t.startedAt||t.status==='prog'||t.status==='done'));}
function cycleTask(id,d){d=d||S.ui.day||today();const t=findTask(d,id);if(!t)return;
  if(t.status==='done'){t.status='todo';delete t.startedAt;}
  else if(isStarted(t)){t.status='done';}
  else {t.status='prog'; t.startedAt=new Date().toISOString();}
  save();
  if(S.view==='dash'){render();return;}
  if(S.view==='checkin'){vCheckin(document.getElementById('view'));return;}
  repaintDay(d);}
function typeBadge(t){const ty=T_TYPES[t.type];if(!ty)return '';
  return `<span class="tbadge" style="background:${ty.c}" title="${ty.l}">${ty.e}</span>`;}

/* ── 이월 과제를 오늘로 데려오기 (약속으로 삼으면 오늘 것이 된다) ── */
function bringHome(d,id){
  const h=taskHome(id,d); if(h===d)return findTask(d,id);
  const src=S.days[h]; if(!src||!src.tasks)return findTask(d,id);
  const i=src.tasks.findIndex(t=>t.id===id); if(i<0)return findTask(d,id);
  const t=src.tasks.splice(i,1)[0];
  if(src.one===id)src.one='';
  ensureDay(d); S.days[d].tasks.push(t); return t;}

/* ── 오늘의 약속 3가지 ── */
function promiseAll(d,ty){
  ensureDay(d);
  const all=dayTasks(d).filter(x=>x.text&&x.status!=='drop');
  const out=all.filter(x=>x.type===ty);
  if(ty==='end'){const o=all.find(x=>x.id===S.days[d].one);
    if(o&&out.indexOf(o)<0)out.unshift(o);
    else if(o)out.splice(out.indexOf(o),1),out.unshift(o);}
  return out;}
function promiseOf(d,ty){return promiseAll(d,ty)[0]||null;}
function promiseCount(d){
  ensureDay(d);
  const all=dayTasks(d).filter(x=>x.text&&x.status!=='drop');
  return all.filter(x=>T_TYPES[x.type]||x.id===S.days[d].one).length;}
function pickPromise(d,ty,id){
  if(!id)return; if(!findTask(d,id))return;
  bringHome(d,id); const t=findTask(d,id); if(!t)return;
  t.type=ty; if(ty==='end')S.days[d].one=id;
  save();repaintDay(d);}
function clearPromise(d,ty,id){
  const t=id?findTask(d,id):promiseOf(d,ty); if(!t)return;
  delete t.type; if(S.days[d]&&S.days[d].one===t.id)S.days[d].one='';
  save();repaintDay(d);}
function newPromise(d,ty,inp){
  const v=(inp.value||'').trim(); if(!v)return;
  ensureDay(d);
  const role=(S.profile.roles[0]||{}).id||'';
  const t={id:uid(),text:v,priority:(ty==='end'?'A':'B'),role:role,
           impact:(ty==='end'?5:3),status:'todo',type:ty};
  S.days[d].tasks.push(t);
  if(ty==='end')S.days[d].one=t.id;
  inp.value=''; save(); repaintDay(d);}

/* 대시보드용 요약 — 첫 화면에서 바로 «착수» 버튼을 누를 수 있게 */
function promiseMini(d){
  ensureDay(d);
  const has=T_ORDER.some(ty=>!!promiseOf(d,ty));
  if(!has)return `<div class="card promise" style="margin-top:16px">
    <div class="phd">🎯 오늘의 약속 <span class="hint">아직 정하지 않았습니다</span></div>
    <p class="hint" style="margin:0">끝낼 것 1 · 시작할 것 1 · 바로 할 것 1 — 이 세 줄이면 오늘의 다이어리는 충분합니다.
      각각에 <b>신호</b>와 <b>첫 행동</b>까지 적어두면, 그 시각에 다시 결정하지 않아도 됩니다.</p>
    <div style="margin-top:9px;display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn sm" onclick="go('day')">오늘의 세 가지 정하기 →</button>
      <button class="btn ghost sm" onclick="ritualStart('am')">☀️ 아침 리추얼로</button></div></div>`;
  const all=dayTasks(d).filter(t=>t.text&&t.status!=='drop');
  const startedN=all.filter(t=>isStarted(t)).length;
  return `<div class="card promise" style="margin-top:16px">
    <div class="phd">🎯 오늘의 약속 <span class="hint">눌러서 ○ 아직 → ◐ 착수 → ✓ 완료</span>
      <span style="margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)">착수 ${startedN}/${all.length}</span></div>
    <div class="pslots">${T_ORDER.map(ty=>{const t=promiseOf(d,ty),c=T_TYPES[ty];
      const done=!!(t&&t.status==='done'), st=!!(t&&isStarted(t)&&!done), ct=t?cueText(d,t):'';
      return `<div class="pslot s-${ty}${done?' done':''}${st?' started':''}"${t?` data-tk="${tipTask(d,t)}"`:''}>
        <div class="plab"><b>${c.e} ${c.l}</b><span>${c.h}</span></div>
        ${t?`<div class="ptxt">${esc(t.text)}</div>
          ${ct?`<div class="pline"><span class="pk">신호</span><span class="pcueTxt">${esc(ct)}</span></div>`:''}
          ${t.first?`<div class="pline"><span class="pk">첫 행동</span><span class="pcueTxt">${esc(t.first)}</span></div>`:''}
          <div class="pact"><button class="p3 ${done?'dn':(st?'st':'')}" onclick="cycleTask('${t.id}','${d}')">${done?'✓ 완료':(st?'◐ 착수함':'○ 아직')}</button>
            <button class="btn ghost sm" onclick="go('day')">자세히</button></div>`
        :`<div class="pempty">비어 있습니다.</div>
          <div class="pact"><button class="btn ghost sm" onclick="go('day')">정하기 →</button></div>`}
      </div>`;}).join('')}</div></div>`;}

function pSlotHtml(d,ty){
  const cfg=T_TYPES[ty], list=promiseAll(d,ty), t=list[0]||null;
  const done=!!(t&&t.status==='done'), started=!!(t&&isStarted(t)&&!done);
  let body;

    const others=dayTasks(d).filter(x=>x.text&&x.status!=='drop'&&x.status!=='done'&&!T_TYPES[x.type]).slice(0,30);
    body=`<div class="pempty">${cfg.h} — 하나만 고르세요.</div>
      <select onchange="pickPromise('${d}','${ty}',this.value)">
        <option value="">오늘 과제에서 고르기…</option>
        ${others.map(x=>`<option value="${x.id}">${esc(x.text)}</option>`).join('')}</select>
      <input type="text" placeholder="＋ 새로 적기" onchange="newPromise('${d}','${ty}',this)"
        onkeydown="if(event.key==='Enter')this.blur()">`;
  }else{
    body=`<div class="ptxt">${esc(t.text)}</div>
      <div class="pline"><span class="pk">신호</span>
        <select onchange="setCueRef('${d}','${t.id}',this.value)" title="시간이 아니라 '무엇을 하고 나면'으로 정합니다">${cueSelOpts(d,t)}</select></div>
      ${(!t.cueRef&&t.cue)?`<div class="pline"><span class="pk"></span><span class="pcueTxt">${esc(t.cue)}</span></div>`:''}
      <div class="pline"><span class="pk">첫 행동</span>
        <input type="text" value="${esc(t.first||'')}" placeholder="3분이면 되는 행동 하나"
          onchange="setFirstAct('${d}','${t.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()"></div>
      ${list.length>1?`<div class="pxtra">${list.slice(1).map(x=>`<span title="${esc(x.text)}">＋ ${esc(x.text.slice(0,12))}${x.text.length>12?'…':''}</span>`).join('')}</div>`:''}
      <div class="pact">
        <button class="p3 ${done?'dn':(started?'st':'')}" onclick="cycleTask('${t.id}','${d}')"
          title="○ 아직 → ◐ 착수 → ✓ 완료">${done?'✓ 완료':(started?'◐ 착수함':'○ 아직')}</button>
        <button class="btn ghost sm" onclick="openMemo('${d}','task','${t.id}')" title="마감일 · 핵심 성공 요인 · 메모">🎯</button>
        ${(ty==='end'&&!t.start)?`<button class="btn ghost sm" onclick="sendOneToSchedule('${d}','${t.id}')">🕘 시간표</button>`:''}
        <button class="btn ghost sm" onclick="clearPromise('${d}','${ty}','${t.id}')">해제</button>
      </div>`;
  }
  return `<div class="pslot s-${ty}${done?' done':''}${started?' started':''}"${t?` data-tk="${tipTask(d,t)}"`:''}>
    <div class="plab"><b>${cfg.e} ${cfg.l}</b><span>${cfg.h}</span></div>${body}</div>`;}

/* ── 마감일이 지난 과제 — 자책이 아니라 재예약 ── */

      <input type="text" id="rsFirst" value="${esc(t.first||'')}" placeholder="예: 평가계획 파일을 연다"></label>

        <button class="btn ghost" onclick="closeModal()">닫기</button>
        <button class="btn" onclick="saveResched()">재예약</button></span></div>`);
  setTimeout(()=>{const e=document.getElementById('rsCue');if(e)e.focus();},60);}
function saveResched(){
  const t=findTask(MEMO.d,MEMO.id); if(!t){closeModal();return;}

function dropTask(d,id){const t=findTask(d,id);if(!t)return;

/* ── 협상 문장 — 미룬 그 순간의 생각 ── */
const NEG_CHIPS=['시간이 애매해서','제대로 하려면 시간이 더 필요해서','조금 피곤해서',
  '결정을 조금 더 생각해보려고','다른 일이 먼저 들어와서','내키지 않아서','자료·준비가 아직 안 돼서','잊어버렸다'];
function setNegot(d,v){ensureDay(d);S.days[d].negot=v;save();}
function negPick(d,v){ensureDay(d);
  const cur=(S.days[d].negot||'').trim();
  S.days[d].negot = cur ? (cur.indexOf(v)>=0?cur:cur+' · '+v) : v;
  save(); if(S.view==='checkin')vCheckin(document.getElementById('view'));}
function notStarted(d){return dayTasks(d).filter(t=>t.text&&t.status!=='drop'&&!isStarted(t));}

/* ── 착수율 · 협상 문장 집계 ── */
function startStats(n){n=n||14;
  let opp=0,st=0;
  const byCue={'교시·공강 신호':[0,0],'그 밖의 신호':[0,0],'신호 없음':[0,0]};
  const neg={}; let d=today(), days=0;
  for(let i=0;i<n;i++){
    const x=S.days[d];
    if(x){
      let any=false;
      (x.tasks||[]).forEach(t=>{
        if(!t.text||t.status==='drop')return;
        if(!(T_TYPES[t.type]||x.one===t.id))return;      /* '약속'한 것만 센다 */
        any=true; opp++; const s=isStarted(t); if(s)st++;
        const k=(t.cueRef&&/^(p\d+e|gap)$/.test(t.cueRef))?'교시·공강 신호'
               :((t.cueRef||t.cue)?'그 밖의 신호':'신호 없음');
        if(s)byCue[k][0]++; byCue[k][1]++;});
      if(any)days++;
      const g=(x.negot||'').trim();
      if(g)g.split(/\s*·\s*/).forEach(p=>{p=p.trim();if(p)neg[p]=(neg[p]||0)+1;});
    }
    d=addDays(d,-1);}
  return {opp:opp,st:st,byCue:byCue,neg:neg,days:days};}
function startCard(){
  const s=startStats(14);
  const negs=Object.keys(s.neg).map(k=>({k:k,n:s.neg[k]})).sort((a,b)=>b.n-a.n).slice(0,8);
  const mx=Math.max(1,...negs.map(x=>x.n));
  const cues=Object.keys(s.byCue).filter(k=>s.byCue[k][1]>0);
  return `<div class="card"><h3>▶ 착수율 · 협상 문장 <span class="hint">(최근 14일 — 완료가 아니라 <b>착수</b>를 봅니다)</span></h3>
    <p class="hint" style="margin-top:-4px">목표는 100%가 아닙니다. <b>“나는 왜 실행하지 못하지?”</b>라는 자기평가를
      <b>“어떤 조건에서 잘 시작하고, 어떤 조건에서 협상이 길어지는가?”</b>라는 관찰로 바꾸는 것이 이 숫자의 쓸모입니다.</p>
    <div class="stat" style="margin-bottom:12px">
      <div class="s"><div class="n">${s.opp?Math.round(s.st/s.opp*100):0}%</div><div class="l">착수율 (${s.st}/${s.opp})</div></div>
      <div class="s"><div class="n">${s.opp}</div><div class="l">실행 기회 (약속한 일)</div></div>
      <div class="s"><div class="n">${s.days}일</div><div class="l">약속을 적은 날</div></div>
    </div>
    ${cues.length?`<h4 style="font-size:13px;margin:4px 0 6px">신호의 종류에 따라 — <span class="hint">신호가 구체적일수록 착수가 쉬운가?</span></h4>
      ${cues.map(k=>{const a=s.byCue[k];const p=a[1]?Math.round(a[0]/a[1]*100):0;
        return `<div class="negrow"><div class="nk">${k} <span class="hint">${a[0]}/${a[1]}</span></div>
          <div class="nb"><i style="width:${p}%;background:var(--accent)"></i></div>
          <div class="nn">${p}%</div></div>`;}).join('')}`:''}
    <h4 style="font-size:13px;margin:14px 0 6px">반복되는 협상 문장 <span class="hint">— 여기에 개입점(leverage point)이 있습니다</span></h4>
    ${negs.length? negs.map(x=>`<div class="negrow"><div class="nk" title="${esc(x.k)}">${esc(x.k)}</div>
        <div class="nb"><i style="width:${Math.round(x.n/mx*100)}%"></i></div>
        <div class="nn">${x.n}회</div></div>`).join('')
      :'<p class="hint">저녁 리추얼에서 <b>“미룬 그 순간 무슨 생각을 했는가”</b>를 적으면 여기에 쌓입니다. 2주만 모으면 패턴이 보입니다.</p>'}
    <p class="hint" style="margin-top:10px">가장 자주 나오는 문장이 형군샘의 <b>협상 문장</b>입니다.
      그것을 없애려 하지 말고, 그 문장이 나오지 않는 <b>조건</b>을 만드세요 — 대개 신호를 더 구체적으로 하거나 첫 행동을 더 작게 하면 됩니다.</p>
  </div>`;}

/* ── 실행 모드 / 설계 모드 ── */

/* ============================================================
   ⑲ 주간 개요 — 종이 플래너 '1주' 시트 양식
   ------------------------------------------------------------
   형식: 7일을 가로로 놓고 각 날짜마다
         [🁢 끝낼 것] → [To-do(우선순위 과제)] → [시간표 05~24시] → [정리]
         를 세로로 쌓아 한 장에 본다.
   연동: 헤더를 누르면 그날 일간 계획으로 / 과제를 누르면 ○→◐→✓ /
         빈 칸에 바로 적으면 그날 과제로 추가됩니다(일간과 같은 데이터).
   ============================================================ */
const WK_S=5, WK_E=24, WK_H=20;
function wkBlocks(d){
  ensureDay(d);
  const out=[];
  /* 수업(차시) — 겹치는 구글/가져온 일정은 일간 계획과 같은 규칙으로 숨긴다 */
  const kR=[];
  try{ if(kOn())kLessonsOn(d).forEach(x=>{
    const l=K().logs[x.key]||{}, sm=toMin(x.start), em=toMin(x.end);
    kR.push([sm,em]);
    out.push({sm:sm,em:em,t:x.g+' '+x.no,c:kColor(x.g),dn:!!l.done,tk:tipLesson(x),go:''});});
  }catch(e){}
  const hide=(S.settings.hideDupG!==false)&&kR.length>0;
  const dup=(sm,em)=>{ if(!hide)return false; const du=Math.max(1,em-sm);
    return kR.some(r=>{const ov=Math.min(em,r[1])-Math.max(sm,r[0]);return ov>0&&ov>=du*0.6;});};
  dayTasks(d).forEach(t=>{ if(!t.start||!t.text)return;
    const sm=toMin(t.start), em=t.end?Math.max(sm+10,toMin(t.end)):sm+60;
    out.push({sm:sm,em:em,t:t.text,c:roleColor(t.role),dn:t.status==='done',st:isStarted(t),tk:tipTask(d,t),go:''});});
  dayEvents(d).forEach(e=>{ if(!e.start)return;
    const sm=toMin(e.start), em=toMin(e.end||addMinStr(e.start,60));
    if(e.fromG&&dup(sm,em))return;
    out.push({sm:sm,em:em,t:e.title,c:e.role?roleColor(e.role):'#5b53b0',dn:!!e.done,tk:tipEvent(d,e),go:''});});
  return layoutBlocks(out);}
function wkItem(d,t){
  const dn=t.status==='done', st=isStarted(t)&&!dn;
  const r=(S.profile.roles||[]).find(x=>x.id===t.role);
  return `<div class="wkitem${dn?' dn':(st?' stt':'')}" data-tk="${tipTask(d,t)}"
    onclick="wkCycle('${d}','${t.id}')" title="누르면 ○ 아직 → ◐ 착수 → ✓ 완료">
    <span class="k" style="background:${r?(r.color||'#5b53b0'):'#8792a3'}">${esc(roleAbbr(t.role))}</span>
    <span class="x">${dn?'✓':(st?'◐':'')} ${esc(t.text)}</span></div>`;}
function wkOverview(ws){
  const days=[]; for(let i=0;i<7;i++)days.push(addDays(ws,i));
  const td=today(), c=[];
  const H=(WK_E-WK_S)*WK_H;
  /* 1행 — 날짜 헤더 */
  c.push(`<div class="wkc f r1 wklab">${ws.slice(0,4).slice(2)}년</div>`);
  days.forEach(d=>{const g=parseD(d).getDay();
    let bg=''; try{ if(kOn()){const o=kOffMap()[d]; const sp=kSwapMap()[d];
      if(o)bg=`<span class="wkbadge">${esc(o)}</span>`;
      else if(sp)bg=`<span class="wkbadge">${KDOW[sp.use]}요일</span>`;} }catch(e){}
    c.push(`<div class="wkc r1 wkhd ${d===td?'tod':''} ${g===0?'sun':(g===6?'sat':'')}" onclick="openDay('${d}')"
      title="${d} — 누르면 일간 계획으로">${(+d.slice(8))} ${wd(d)}${bg}<small>${d.slice(5,7)}월</small></div>`);});
  /* 2행 — 끝낼 것(ONE) */
  c.push(`<div class="wkc f wklab"><span>🁢</span><span>끝낼</span></div>`);

    c.push(`<div class="wkc wkbox one">${t?wkItem(d,t):`<span class="hint" style="font-size:9.5px;cursor:pointer" onclick="openDay('${d}')">＋ 정하기</span>`}</div>`);});
  /* 3행 — To-do */
  c.push(`<div class="wkc f wklab"><span>To</span><span>do</span></div>`);
  days.forEach(d=>{const one=promiseOf(d,'end');
    const ts=dayTasks(d).filter(t=>t.text&&t.status!=='drop'&&(!one||t.id!==one.id));
    c.push(`<div class="wkc wkbox">${ts.map(t=>wkItem(d,t)).join('')}
      <input class="wkadd" data-d="${d}" placeholder="＋ 할 일" onchange="wkAddTask('${ws}','${d}',this)"
        onkeydown="if(event.key==='Enter')this.blur()"></div>`);});
  /* 4행 — 시간표 */
  let rul='';
  for(let h=WK_S;h<WK_E;h++)rul+=`<i style="top:${(h-WK_S)*WK_H+3}px">${h>12?h-12:h}</i>`;
  c.push(`<div class="wkc f wkrul" style="height:${H}px">${rul}</div>`);
  days.forEach(d=>{
    let hr=''; for(let h=WK_S+1;h<WK_E;h++)hr+=`<div class="wkhr" style="top:${(h-WK_S)*WK_H}px"></div>`;
    const bs=wkBlocks(d);
    const bl=bs.map(b=>{
      const top=Math.max(0,(b.sm-WK_S*60)/60*WK_H), hh=Math.max(9,(b.em-b.sm)/60*WK_H-1);
      const w=100/(b.cols||1), left=(b.col||0)*w;
      const cc=blockColors(b.c,!!b.dn);
      return `<div class="wkb" data-tk="${b.tk||''}" onclick="openDay('${d}')"
        style="top:${top}px;height:${hh}px;left:calc(${left}% + 1px);width:calc(${w}% - 2px);
        background:${cc.bg};color:${cc.fg};border-left-color:${b.c}" title="${esc(b.t)}">${esc(b.t)}</div>`;}).join('');
    c.push(`<div class="wkc wklane" style="height:${H}px">${hr}${bl}</div>`);});
  /* 5행 — 정리 */
  c.push(`<div class="wkc f wklab">정리</div>`);
  days.forEach(d=>{const ts=dayTasks(d).filter(t=>t.text&&t.status!=='drop');
    const st=ts.filter(t=>isStarted(t)).length, dn=ts.filter(t=>t.status==='done').length;
    c.push(`<div class="wkc wkft">착수 <b>${st}</b>/${ts.length}<br>완료 ${dn}</div>`);});

  const wk=ensureWeek(ws), mk=monthKey(ws), m=(S.months||{})[mk]||{};
  const rocks=[]; (S.profile.roles||[]).forEach(r=>rocksOf(ws,r.id).forEach(k=>{if(k.text)rocks.push({r:r,k:k});}));
  return `<h3>주간 개요 <span class="hint">(종이 플래너 «1주» 양식 — 일간 계획의 우선순위 과제·시간표가 그대로 올라옵니다)</span></h3>
    ${(m.focus||'').trim()?`<div class="hint" style="margin:-4px 0 6px"><b>${mk} 중점</b> · ${esc((m.focus||'').replace(/\n/g,' / ').slice(0,120))}</div>`:''}
    ${rocks.length?`<div class="wkrock">${rocks.map(o=>{const st=rockStat(o.k.id);
      return `<span title="${esc(o.r.name)}"><b style="background:${o.r.color||'#5b53b0'}">${esc(roleAbbr(o.r.id))}</b>${o.k.done?'✓ ':''}${esc(o.k.text)}${st.n?` <i style="font-style:normal;color:var(--muted);font-weight:700">${st.st}/${st.n}</i>`:''}</span>`;}).join('')}</div>`:''}
    <div class="wkw"><div class="wkgrid">${c.join('')}</div></div>
    <div class="synchint" style="margin-top:7px">날짜를 누르면 그날 <b>일간 계획</b>으로 · 과제를 누르면 <b>○ 아직 → ◐ 착수 → ✓ 완료</b> ·
      빈 칸에 바로 적으면 그날 과제가 됩니다 · 블록에 마우스를 올리면 신호·첫 행동·메모가 보입니다.</div>`;}
function wkRepaint(ws){const el=document.getElementById('wkov');
  if(el)el.innerHTML=wkOverview(ws); else vWeek(document.getElementById('view'));}
function wkCycle(d,id){const t=findTask(d,id);if(!t)return;
  if(t.status==='done'){t.status='todo';delete t.startedAt;}
  else if(isStarted(t))t.status='done';
  else {t.status='prog';t.startedAt=new Date().toISOString();}
  save();wkRepaint(S.ui.week||weekStart(d));}
function wkAddTask(ws,d,inp){const v=(inp.value||'').trim();if(!v)return;
  ensureDay(d);const role=(S.profile.roles[0]||{}).id||'';
  S.days[d].tasks.push({id:uid(),text:v,priority:'B',role:role,impact:3,status:'todo'});
  inp.value='';save();wkRepaint(ws);
  setTimeout(()=>{const e=document.querySelector('.wkadd[data-d="'+d+'"]');if(e)e.focus();},20);}


/* ============================================================
   ⑳ 반복 과제·일정 — 주기에 맞춰 '실제로' 만들어 기록한다
   ------------------------------------------------------------
   왜 가상 표시가 아니라 실체화인가:
   · 가상으로 겹쳐 보여주면 그 날짜의 착수·완료·메모·핵심 성공 요인을 따로 저장할 곳이 없다.
   · 반복되는 일일수록 «했는가»의 기록이 쌓여야 의미가 있다(습관·수업·회의).
   언제 만들어지는가:
   · `ensureDay(d)` 가 불릴 때 그 날짜분만 만든다(게으른 실체화).
     날짜를 열거나 주간 개요가 7일을 훑는 순간 생긴다 — 미래 전체를 미리 만들지 않는다.
   · 한 번 만든 날짜는 `S.days[d].rgen` 에 규칙 id 를 남긴다.
     → 사용자가 그 날 것을 지워도 다시 살아나지 않는다.
   ============================================================ */
const WDN=['일','월','화','수','목','금','토'];
const REC_RULES=[['none','반복 없음'],['daily','매일'],['weekday','평일(월~금)'],['weekly','매주'],
  ['biweekly','격주'],['monthly','매월 같은 날짜'],['nthdow','매월 n번째 요일']];
let RECDRAFT=null;
function recOf(rid){ if(!rid)return null; return (S.recurring||[]).find(x=>x.id===rid)||null; }
function recDays(r){ if(Array.isArray(r.days)&&r.days.length)return r.days;
  return [(r.byday==null?1:r.byday)]; }
function recHits(r,d){
  if(!r||r.off)return false;
  if(r.from&&d<r.from)return false;
  if(r.until&&d>r.until)return false;
  const D=parseD(d), w=D.getDay();
  switch(r.rule){
    case 'daily':   return true;
    case 'weekday': return w>=1&&w<=5;
    case 'weekly':  return recDays(r).indexOf(w)>=0;
    case 'biweekly':{
      if(recDays(r).indexOf(w)<0)return false;
      const a=weekStart(r.anchor||r.from||d), b=weekStart(d);
      const n=Math.round((parseD(b)-parseD(a))/604800000);
      return n>=0 && n%2===0; }
    case 'monthly': return D.getDate()===(r.dom||(r.from?+r.from.slice(8):1));
    case 'nthdow':{
      const nd=(r.ndow==null?1:r.ndow); if(w!==nd)return false;
      const day=D.getDate();
      if((r.nth|0)===-1){const last=new Date(D.getFullYear(),D.getMonth()+1,0).getDate();return day>last-7;}
      return Math.ceil(day/7)===(r.nth||1); }
  }
  return false;}
function recLabel(r){ if(!r)return '';
  const dz=recDays(r).slice().sort().map(x=>WDN[x]).join('·');
  let t='';
  switch(r.rule){
    case 'daily':   t='매일'; break;
    case 'weekday': t='평일(월~금)'; break;
    case 'weekly':  t='매주 '+dz+'요일'; break;
    case 'biweekly':t='격주 '+dz+'요일'; break;
    case 'monthly': t='매월 '+(r.dom||1)+'일'; break;
    case 'nthdow':  t='매월 '+((r.nth|0)===-1?'마지막':(r.nth||1)+'번째')+' '+WDN[r.ndow==null?1:r.ndow]+'요일'; break;
    default: t='반복';
  }
  if(r.until)t+=' ('+r.until+'까지)';
  if(r.off)t+=' · 일시중지';
  return t;}
function recFirstOn(r){ let d=(r.from&&r.from>today())?r.from:today();
  for(let i=0;i<800;i++){ if(recHits(r,d))return d; d=addDays(d,1);} return today();}
function recRRULE(r){
  const C=['SU','MO','TU','WE','TH','FR','SA'];
  const dz=recDays(r).map(x=>C[x]).join(',');
  let t;
  switch(r.rule){
    case 'daily':   t='FREQ=DAILY'; break;
    case 'weekday': t='FREQ=WEEKLY;BYDAY=MO,TU,WE,TH,FR'; break;
    case 'weekly':  t='FREQ=WEEKLY;BYDAY='+dz; break;
    case 'biweekly':t='FREQ=WEEKLY;INTERVAL=2;BYDAY='+dz; break;
    case 'monthly': t='FREQ=MONTHLY;BYMONTHDAY='+(r.dom||1); break;
    case 'nthdow':  t='FREQ=MONTHLY;BYDAY='+(((r.nth|0)===-1)?'-1':(r.nth||1))+C[r.ndow==null?1:r.ndow]; break;
    default:        t='FREQ=WEEKLY;BYDAY='+dz;
  }
  if(r.until)t+=';UNTIL='+r.until.replace(/-/g,'')+'T235900Z';
  return t;}

/* ── 게으른 실체화 (ensureDay 가 호출) ── */
function recFill(d,x){
  const list=S.recurring; if(!list||!list.length)return;
  const t=today();
  if(d<addDays(t,-400)||d>addDays(t,400))return;      /* 터무니없이 먼 날짜는 만들지 않는다 */
  if(!Array.isArray(x.rgen))x.rgen=[];
  for(let i=0;i<list.length;i++){
    const r=list[i];
    if(!r||!r.id||r.off)continue;
    if(x.rgen.indexOf(r.id)>=0)continue;              /* 이 날짜는 이미 만들었다(지웠어도 재생성 안 함) */
    if(!recHits(r,d))continue;
    x.rgen.push(r.id);
    if((r.kind||'event')==='task'){
      const o={id:uid(),text:r.text||r.title||'',priority:r.priority||'B',role:r.role||'',
        impact:r.impact||3,status:'todo',start:r.start||'',end:r.end||'',rid:r.id};
      if(r.cueRef)o.cueRef=r.cueRef;
      if(r.first)o.first=r.first;
      if(r.csf)o.csf=r.csf;
      if(r.type)o.type=r.type;
      x.tasks.push(o);
    }else{
      const st=r.start||'09:00';
      const o={id:uid(),start:st,end:r.end||addMinStr(st,60),title:r.title||r.text||'',role:r.role||'',rid:r.id};
      if(r.csf)o.csf=r.csf;
      x.events.push(o);
    }
  }}
function recStrip(rid){                                /* 연결만 끊고 기록은 남긴다 */
  Object.keys(S.days||{}).forEach(dd=>{const x=S.days[dd]; if(!x)return;
    (x.tasks||[]).forEach(t=>{if(t.rid===rid)delete t.rid;});
    (x.events||[]).forEach(e=>{if(e.rid===rid)delete e.rid;});});}
function recRemoveFrom(rid,from){                      /* from 이후 날짜에서 실제로 지운다 */
  Object.keys(S.days||{}).forEach(dd=>{ if(from&&dd<from)return;
    const x=S.days[dd]; if(!x)return;
    if(x.tasks)x.tasks=x.tasks.filter(t=>t.rid!==rid);
    if(x.events)x.events=x.events.filter(e=>e.rid!==rid);});}

/* ── 반복 설정 창 ── */
function openRecur(d,kind,id){
  const o=findItem(d,kind,id); if(!o){toast('항목을 찾지 못했습니다');return;}
  MEMO={d:d,kind:kind,id:id};
  const r=recOf(o.rid), w=parseD(d).getDay(), dm=+d.slice(8);
  RECDRAFT={ rule:(r?r.rule:'none'),
    days:(r&&r.days&&r.days.length?r.days.slice():[w]),
    from:(r&&r.from)||d, until:(r&&r.until)||'',
    dom:(r&&r.dom)||dm, nth:(r&&r.nth)||Math.ceil(dm/7),
    ndow:(r&&r.ndow!=null)?r.ndow:w, anchor:(r&&r.anchor)||weekStart(d) };
  recModal(d,kind,id);}
function recTogDay(i,d,kind,id){
  const a=RECDRAFT.days, k=a.indexOf(i);
  if(k>=0){ if(a.length>1)a.splice(k,1); } else a.push(i);
  a.sort(); recModal(d,kind,id);}
function recPreview(){
  const R=RECDRAFT; if(!R||R.rule==='none')return '';
  const out=[]; let x=R.from||today();
  for(let i=0;i<900&&out.length<6;i++){ if(recHits(R,x))out.push(x.slice(5)+'('+wd(x)+')'); x=addDays(x,1); }
  return out.length?('만들어질 날짜: '+out.join(' · ')+(R.until?(' … '+R.until+' 까지'):' …')):'해당하는 날짜가 없습니다';}

      <div class="chips">${WDN.map((w,i)=>`<span class="chip ${R.days.indexOf(i)>=0?'on':''}" onclick="recTogDay(${i},'${d}','${kind}','${id}')">${w}</span>`).join('')}</div></label>`:''}

      <span class="hint">31일처럼 없는 달은 건너뜁니다.</span></label>`:''}

      미래 전체를 미리 만들지 않고, <b>그 날짜를 열 때</b> 만들어집니다.</div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap">
      ${has?`<button class="btn ghost" onclick="recDetach('${d}','${kind}','${id}')">반복 해제</button>`:'<span></span>'}
      <span style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">닫기</button>
      <button class="btn" onclick="recApply('${d}','${kind}','${id}')">${has?'반복 수정':'반복 만들기'}</button></span></div>`);}
function recApply(d,kind,id){
  const o=findItem(d,kind,id); if(!o){closeModal();return;}
  const R=RECDRAFT;
  if(!R||R.rule==='none'){ recDetach(d,kind,id,true); return; }
  if(!S.recurring)S.recurring=[];
  let r=recOf(o.rid);
  if(!r){ r={id:uid()}; S.recurring.push(r); }
  Object.assign(r,{kind:kind,rule:R.rule,days:R.days.slice(),byday:R.days[0],
    dom:R.dom,nth:R.nth,ndow:R.ndow,from:R.from,until:R.until,
    anchor:weekStart(R.from||d),off:false,
    start:o.start||'',end:o.end||'',role:o.role||'',
    title:(kind==='event'?(o.title||''):''),
    text:(kind==='task'?(o.text||''):''),
    priority:o.priority||'B',impact:o.impact||3,type:o.type||'',
    cueRef:o.cueRef||'',first:o.first||'',csf:o.csf||''});
  o.rid=r.id;
  ensureDay(d); const x=S.days[d];
  if(!Array.isArray(x.rgen))x.rgen=[];
  if(x.rgen.indexOf(r.id)<0)x.rgen.push(r.id);        /* 오늘 것은 이미 있으니 다시 만들지 않는다 */
  save(); closeModal();
  toast('반복을 설정했습니다 — '+recLabel(r));
  repaintDay(d);}
function recDetach(d,kind,id,quiet){
  const o=findItem(d,kind,id); if(!o){closeModal();return;}
  const rid=o.rid;
  if(rid&&!quiet&&!confirm('이 항목의 반복을 해제할까요?\n\n앞으로 새로 만들어지지 않습니다.\n이미 만들어진 날짜의 기록은 그대로 남습니다.'))return;
  if(rid){ S.recurring=(S.recurring||[]).filter(x=>x.id!==rid); recStrip(rid); }
  delete o.rid;
  save(); closeModal(); toast('반복을 해제했습니다');
  repaintDay(d);}

/* ── 반복 항목 삭제 범위 ── */
function openRecDel(d,kind,id){

  if(!o.rid){ if(kind==='task')delTaskId(id,d); else delEvent(d,id); return; }
  modalBox(`<h3 style="margin:0 0 4px">🔁 반복 항목 삭제</h3>
    <div class="hint" style="margin-bottom:12px"><b>${esc(itemLabel(o,kind))}</b> · ${d} (${wd(d)}) · ${esc(recLabel(recOf(o.rid)))}</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <button class="btn ghost" style="text-align:left" onclick="recDel('${d}','${kind}','${id}','one')">
        이 날만 삭제 <span class="hint">— 다른 날짜는 그대로 둡니다</span></button>
      <button class="btn ghost" style="text-align:left" onclick="recDel('${d}','${kind}','${id}','after')">
        이 날부터 앞으로 전부 <span class="hint">— 지난 기록은 남깁니다</span></button>
      <button class="btn ghost" style="text-align:left" onclick="recDel('${d}','${kind}','${id}','all')">
        모든 날에서 삭제 <span class="hint">— 지난 기록까지 지웁니다</span></button>
    </div>
    <div style="text-align:right;margin-top:12px"><button class="btn" onclick="closeModal()">취소</button></div>`);}
function recDel(d,kind,id,scope){
  const o=findItem(d,kind,id); if(!o){closeModal();return;}
  const rid=o.rid;
  if(scope==='one'){ closeModal(); if(kind==='task')delTaskId(id,d); else delEvent(d,id); return; }
  if(scope==='all'&&!confirm('지난 기록까지 모두 지울까요? 되돌릴 수 없습니다.')){return;}
  const r=recOf(rid);
  if(scope==='after'){
    if(r){ r.until=addDays(d,-1);
      if(r.from&&r.until<r.from)S.recurring=(S.recurring||[]).filter(x=>x.id!==rid); }
    recRemoveFrom(rid,d);
  }else{
    S.recurring=(S.recurring||[]).filter(x=>x.id!==rid);
    recRemoveFrom(rid,'');
  }
  save(); closeModal();
  toast(scope==='after'?'이 날부터 반복을 끝냈습니다':'반복을 모두 삭제했습니다');
  repaintDay(d);}

/* ── 반복 항목 관리 (일정 알림 화면) ── */
function recListCard(){
  const list=(S.recurring||[]);
  return `<div class="card"><h3>🔁 반복 과제 · 일정 <span class="hint">(주기에 맞춰 그 날짜에 자동으로 만들어 둡니다)</span></h3>
    <p class="hint" style="margin-top:-4px">일간 계획에서 과제의 <b>🎯</b> 또는 일정의 <b>🗒</b> 를 누르고 <b>«🔁 반복»</b> 에서 설정합니다.
      새 일정을 만들 때는 시간표 추가 줄의 <b>반복 선택</b>으로도 됩니다.
      반복으로 지정하면 항목이 <b>실제로 생기므로</b> 날짜마다 착수·완료·메모를 따로 기록할 수 있습니다.</p>
    ${list.length? list.map(r=>`<div class="recrow ${r.off?'off':''}">
      <span class="tag" style="flex:none;background:${(r.kind==='task')?'var(--brand)':'var(--accent)'}">${(r.kind==='task')?'과제':'일정'}</span>
      <b style="flex:1;min-width:130px;font-size:13px">${esc(r.title||r.text||'(제목 없음)')}</b>
      <span class="hint" style="flex:none">${r.start?esc(r.start+(r.end?'–'+r.end:'')):'시간 없음'}</span>
      <span style="flex:none;font-size:12px;font-weight:700;color:var(--brand-d)">${esc(recLabel(r))}</span>
      <button class="btn ghost sm no-print" onclick="recToggleOff('${r.id}')">${r.off?'▶ 다시 켜기':'⏸ 일시중지'}</button>
      <button class="btn ghost sm no-print" onclick="recDropAll('${r.id}')">삭제</button></div>`).join('')
     : '<p class="hint">아직 반복으로 지정한 항목이 없습니다.</p>'}
    ${list.length?`<p class="hint" style="margin-top:8px">일시중지하면 <b>앞으로만</b> 만들어지지 않습니다 — 이미 만든 기록은 그대로입니다.</p>`:''}
  </div>`;}
function recToggleOff(rid){const r=recOf(rid); if(!r)return;
  r.off=!r.off; save(); render();
  toast(r.off?'일시중지했습니다 — 새로 만들어지지 않습니다':'다시 켰습니다');}
function recDropAll(rid){const r=recOf(rid); if(!r)return;
  if(!confirm('«'+(r.title||r.text||'')+'» 반복을 삭제할까요?\n\n앞으로 만들어지지 않습니다.\n이미 만들어진 날짜의 기록은 그대로 둡니다.'))return;
  S.recurring=(S.recurring||[]).filter(x=>x.id!==rid); recStrip(rid);
  save(); render(); toast('반복을 삭제했습니다');}


/* ============================================================
   ㉒ 목표를 «계획»으로 — 큰 바위 · 다음 행동 · 월간 중점의 주차 배분
   ------------------------------------------------------------
   «A goal without a plan is just a wish.»
   여기서 plan 은 계획서가 아니라 «다음에 무엇을 하는가» 입니다.

   문제였던 것: rockToTask 가 src:{k:'rock',...} 를 붙여 두었는데
   그 값을 읽는 코드가 한 줄도 없었습니다 — 출처를 적어만 두고 아무도 보지 않아
   큰 바위는 일주일 내내 체크도 진척도 없는 문장 한 줄로 남았습니다.

   고친 방향(새 메뉴 없이 잇기):
     ① 큰 바위를 항목으로(완료 체크·역할당 최대 2개) 하고 src 를 읽어 진척을 집계
     ② «→ 오늘 과제로»(문장 복사)를 «＋ 다음 행동»(첫 행동+신호+날짜)으로
     ③ 월간 중점을 줄 단위로 두고 주차에 배분 — 한 달을 4~5주로 나누면 그게 일정이다
     ④ 과제 말풍선에 계보(올해 목표 → 이 달 중점 → 큰 바위)
     ⑤ 주간 회고는 «완료»가 아니라 «손을 댔는가»로 본다
   일부러 만들지 않은 것: 프로젝트 메뉴·하위 과제 트리·간트·수동 진척률 %.
   ============================================================ */
const ROCK_MAX=2;
let RSEQ=0, RIDX={k:-1,m:null};
function rocksOf(ws,rid){const wk=ensureWeek(ws);const a=wk.rocks[rid];return Array.isArray(a)?a:[];}
function rockFind(ws,id){ if(!ws||!id)return null;
  const wk=(S.weeks||{})[ws]; if(!wk||!wk.rocks)return null;
  let f=null;
  Object.keys(wk.rocks).forEach(k=>{const a=wk.rocks[k];
    if(Array.isArray(a))a.forEach(r=>{if(r&&r.id===id)f=r;});});
  return f;}
function rockRoleOf(ws,id){const wk=(S.weeks||{})[ws]; if(!wk||!wk.rocks)return '';
  let g=''; Object.keys(wk.rocks).forEach(k=>{const a=wk.rocks[k];
    if(Array.isArray(a)&&a.some(r=>r&&r.id===id))g=k;});
  return g;}
function addRock(ws,rid,text,from){
  const wk=ensureWeek(ws); if(!Array.isArray(wk.rocks[rid]))wk.rocks[rid]=[];
  if(wk.rocks[rid].length>=ROCK_MAX){
    toast('한 역할의 큰 바위는 '+ROCK_MAX+'개까지입니다 — 하나를 끝내거나 놓아주세요');return null;}
  const r={id:uid(),text:String(text||'').trim(),done:false};
  if(from)r.from=from;
  wk.rocks[rid].push(r); save(); return r;}
function addRockIn(ws,rid,inp){const v=(inp.value||'').trim(); if(!v)return;
  if(addRock(ws,rid,v))inp.value='';
  vWeek(document.getElementById('view'));}
function setRockText(ws,rid,id,v){
  const r=rocksOf(ws,rid).find(x=>x.id===id); if(!r)return;
  const t=(v||'').trim();
  if(!t){ if(!confirm('내용을 비우면 이 큰 바위가 사라집니다. 삭제할까요?')){rkPaint(ws);return;} return delRock(ws,rid,id); }
  r.text=t; save(); rkPaint(ws);}
function delRock(ws,rid,id){const wk=ensureWeek(ws);
  wk.rocks[rid]=rocksOf(ws,rid).filter(x=>x.id!==id); save(); rkPaint(ws);}
function toggleRockDone(ws,rid,id){const r=rocksOf(ws,rid).find(x=>x.id===id); if(!r)return;
  r.done=!r.done; if(r.done)r.at=today(); else delete r.at;
  save(); rkPaint(ws);}
function rkPaint(ws){
  if(S.view==='week')vWeek(document.getElementById('view'));
  else if(S.view==='review')vReview(document.getElementById('view'));
  else render();}
/* 역할 옮기기 */
function openRockRole(ws,rid,id){
  const r=rockFind(ws,id); if(!r)return;
  modalBox(`<h3 style="margin:0 0 4px">⇄ 큰 바위의 역할 바꾸기</h3>
    <div class="hint" style="margin-bottom:10px"><b>${esc(r.text)}</b> · ${ws} 주</div>
    <div class="chips">${(S.profile.roles||[]).map(x=>{
      const full=rocksOf(ws,x.id).length>=ROCK_MAX&&x.id!==rid;
      return `<span class="chip ${x.id===rid?'on':''}" style="border-color:${x.color||'#5b53b0'}${x.id===rid?';background:'+(x.color||'#5b53b0')+';color:#fff':''}${full?';opacity:.4':''}"
        onclick="${full?`toast('그 역할은 이미 ${ROCK_MAX}개입니다')`:`moveRockRole('${ws}','${rid}','${id}','${x.id}')`}">${esc(x.name)}${full?' (꽉 참)':''}</span>`;}).join('')}</div>
    <div style="text-align:right;margin-top:12px"><button class="btn" onclick="closeModal()">닫기</button></div>`);}
function moveRockRole(ws,from,id,to){
  if(from===to){closeModal();return;}
  const wk=ensureWeek(ws); const r=rockFind(ws,id); if(!r){closeModal();return;}
  if(rocksOf(ws,to).length>=ROCK_MAX){toast('그 역할은 이미 '+ROCK_MAX+'개입니다');return;}
  wk.rocks[from]=rocksOf(ws,from).filter(x=>x.id!==id);
  if(!Array.isArray(wk.rocks[to]))wk.rocks[to]=[];
  wk.rocks[to].push(r);
  /* 이미 내려간 과제들의 역할도 따라 옮긴다 */
  (rockStat(id).items||[]).forEach(x=>{x.t.role=to; if(x.t.src)x.t.src.role=to;});
  save(); closeModal(); toast(roleName(to)+' 역할로 옮겼습니다'); rkPaint(ws);}

/* ── src 를 읽는다 — 큰 바위에서 내려간 과제 집계 ── */
function rockIndex(){
  if(RIDX.k===RSEQ&&RIDX.m)return RIDX.m;
  const m={};
  Object.keys(S.days||{}).forEach(d=>{
    ((S.days[d]||{}).tasks||[]).forEach(t=>{
      const sc=t.src; if(!sc||sc.k!=='rock'||!sc.rid)return;
      (m[sc.rid]=m[sc.rid]||[]).push({d:d,t:t});});});
  Object.keys(m).forEach(k=>m[k].sort((a,b)=>a.d.localeCompare(b.d)));
  RIDX={k:RSEQ,m:m}; return m;}
function rockStat(id){
  const arr=rockIndex()[id]||[];
  return {n:arr.length, st:arr.filter(x=>isStarted(x.t)).length,
          dn:arr.filter(x=>x.t.status==='done').length, items:arr};}
/* 큰 바위는 한 주에 안 끝나는 게 정상 — 보는 것은 완료가 아니라 «손을 댔는가» */
function rockTouched(r){ if(!r)return false; if(r.done)return true; return rockStat(r.id).st>0; }

/* ── «→ 큰 바위로» 는 어느 역할로 갈지 직접 고르게 한다 ──────────────
   전에는 «자리가 빈 첫 역할»에 말없이 넣었습니다. 동작은 했지만
   어디로 갔는지 알 수 없어 «눌러도 반응이 없다»로 보였습니다.
   → 역할을 고르게 하고, 놓인 줄로 스크롤해 잠깐 깜빡이게 합니다. */
let RKPLACE=null, RKFLASH='';
function openRockPlace(ws,text,from,pref){
  const roles=S.profile.roles||[];
  if(!roles.length){toast('먼저 «1 인생 설계»에서 역할을 등록하세요');return;}
  const t=String(text||'').trim();
  if(!t){toast('내용이 비어 있습니다');return;}
  RKPLACE={ws:ws,text:t,from:from||null};
  const free=roles.filter(r=>rocksOf(ws,r.id).length<ROCK_MAX);
  modalBox(`<h3 style="margin:0 0 4px">🪨 어느 역할의 큰 바위로?</h3>
    <div class="hint" style="margin-bottom:10px"><b>${esc(t)}</b><br>
      ${ws} ~ ${addDays(ws,6)} 주 · 역할당 최대 ${ROCK_MAX}개</div>
    ${free.length?`<div class="chips">${roles.map(r=>{
        const cur=rocksOf(ws,r.id), full=cur.length>=ROCK_MAX, on=(!full&&pref===r.id);
        return `<span class="chip ${on?'on':''}" title="${esc(r.name)} — 지금 ${cur.length}/${ROCK_MAX}"
          style="border-color:${r.color||'#5b53b0'}${on?';background:'+(r.color||'#5b53b0')+';color:#fff':''}${full?';opacity:.35;cursor:not-allowed':''}"
          onclick="${full?`toast('그 역할은 이미 꽉 찼습니다')`:`placeRock('${r.id}')`}">${esc(r.name)} ${cur.length}/${ROCK_MAX}${full?' · 꽉 참':''}</span>`;}).join('')}</div>
      <div class="hint" style="margin-top:10px">놓으면 아래 <b>«역할별 큰 바위»</b> 칸으로 내려가고, 그 줄이 잠깐 노랗게 깜빡입니다.</div>`
     :`<div class="callout co-gold">모든 역할의 큰 바위가 ${ROCK_MAX}개씩 찼습니다.<br>
        <b>«역할별 큰 바위»</b> 에서 하나를 <b>✓ 끝냄</b>으로 표시하거나 <b>✕</b> 로 놓아주면 자리가 생깁니다.
        <div style="margin-top:5px">큰 바위가 많아지면 주간 나침반이 아니라 또 하나의 할 일 목록이 됩니다.</div></div>`}
    <div style="text-align:right;margin-top:12px"><button class="btn ghost" onclick="closeModal()">닫기</button></div>`);}
function placeRock(rid){
  if(!RKPLACE)return;
  const ws=RKPLACE.ws, text=RKPLACE.text, from=RKPLACE.from;
  const r=addRock(ws,rid,text,from); if(!r)return;
  closeModal();
  toast('«'+roleName(rid)+'» 역할 · '+ws+' 주 큰 바위로 놓았습니다');
  if(S.view==='month'){vMonth(document.getElementById('view'));return;}
  RKFLASH=r.id;
  if(S.view==='week')vWeek(document.getElementById('view'));
  else {S.ui.week=ws;go('week');}
  rkFlashScroll();}
function rkFlashScroll(){ if(!RKFLASH)return;
  setTimeout(()=>{const el=document.querySelector('.rkrow.flash');
    if(el)try{el.scrollIntoView({block:'center',behavior:'smooth'});}catch(e){el.scrollIntoView();}
    RKFLASH='';},50);}

/* ── ② 다음 행동 내리기 ── */
let RNEXT={ws:'',rid:'',id:''};
function openRockNext(ws,rid,id){
  const r=rockFind(ws,id); if(!r){toast('큰 바위를 찾지 못했습니다');return;}
  RNEXT={ws:ws,rid:rid,id:id};
  const t0=today(), d0=(t0>=ws&&t0<=addDays(ws,6))?t0:ws;
  modalBox(`<h3 style="margin:0 0 4px">🪨 다음 행동 내리기</h3>
    <div class="hint" style="margin-bottom:10px">큰 바위 — <b>${esc(r.text)}</b> · ${ws} 주</div>
    <div class="callout co-brand" style="margin:0 0 12px;font-size:12.5px">
      «A goal without a plan is just a wish.»<br>
      큰 바위를 그대로 옮기지 말고 <b>3분 안에 시작할 수 있는 물리적 행동 하나</b>로 쪼개 내려보내세요.
      «글 완성»이 아니라 «초안을 열고 결론 첫 문장을 다시 쓴다».</div>
    <label class="fld"><span class="lb">▶ 다음 행동 <span class="hint">— 이 문장이 과제 제목이 됩니다</span></span>
      <input type="text" id="rnT" placeholder="${esc(r.text)} → 무엇부터?"></label>
    <label class="fld"><span class="lb">⏱ 신호 (IF) <span class="hint">— 시각이 아니라 «무엇을 하고 나면»</span></span>
      <select id="rnCue">${cueSelOpts(d0,null)}</select></label>
    <div class="grid2">
      <label class="fld"><span class="lb">📅 언제</span><input type="date" id="rnD" value="${d0}"></label>
      <label class="fld"><span class="lb">🧩 오늘의 약속 유형</span>
        <select id="rnTy"><option value="">지정 안 함</option>
          ${T_ORDER.map(x=>`<option value="${x}" ${x==='start'?'selected':''}>${T_TYPES[x].e} ${T_TYPES[x].l}</option>`).join('')}</select></label>
    </div>
    <div class="hint">내려간 과제는 이 큰 바위에 <b>계속 연결</b>됩니다 — 주간 계획에서 진척이 보이고,
      과제에 마우스를 올리면 «어디서 내려왔는가»가 뜹니다. 한 바위에서 여러 번 내릴 수 있습니다.</div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" onclick="closeModal()">닫기</button>
      <button class="btn" onclick="rockNextApply()">내리기</button></div>`);
  setTimeout(()=>{const e=document.getElementById('rnT');if(e)e.focus();},60);}
function rockNextApply(){
  const ws=RNEXT.ws, rid=RNEXT.rid, id=RNEXT.id;
  const r=rockFind(ws,id); if(!r){closeModal();return;}
  const g=x=>{const e=document.getElementById(x);return e?String(e.value||'').trim():''};
  const txt=g('rnT')||r.text, d=g('rnD')||today(), cue=g('rnCue'), ty=g('rnTy');
  ensureDay(d);
  const t={id:uid(),text:txt,priority:'A',role:rid||'',impact:4,status:'todo',
           src:{k:'rock',ws:ws,role:rid||'',rid:id}};
  if(cue)t.cueRef=cue;
  if(ty)t.type=ty;
  S.days[d].tasks.push(t);
  if(ty==='end')S.days[d].one=t.id;
  save(); closeModal();
  toast(d+' ('+wd(d)+') 에 내렸습니다 — '+txt);
  rkPaint(ws);}

/* ── ④ 계보 — 이 과제가 어디서 내려왔는가 ── */
function rockChain(t){
  const sc=t&&t.src; if(!sc||sc.k!=='rock')return null;
  const r=sc.rid?rockFind(sc.ws,sc.rid):null, out=[];
  const fr=r&&r.from;
  if(fr&&fr.k==='goal'){const g=((S.annual||{}).goals||[]).find(x=>x.id===fr.gid);
    if(g&&g.text)out.push('🎯 올해 목표 · '+g.text);}
  if(fr&&fr.k==='focus')out.push('📅 '+fr.mk+' 이 달의 중점');
  out.push('🪨 '+sc.ws+' 주 큰 바위 · '+((r&&r.text)||'(지워짐)')+(r&&r.done?' ✓':''));
  return out;}

/* ── ③ 월간 중점 — 줄 단위(데이터는 문자열 그대로 유지) ── */
function focusLines(mk){const m=ensureMonth(mk);
  return (m.focus||'').split('\n').map(x=>x.replace(/^[·\-\s]+/,'').trim());}
function focusSet(mk,arr){const m=ensureMonth(mk);
  m.focus=arr.map(x=>String(x||'').trim()).filter(Boolean).map(x=>'· '+x).join('\n'); save();}
function setFocusLine(mk,i,v){const a=focusLines(mk); a[i]=v; focusSet(mk,a);
  if(S.view==='month')vMonth(document.getElementById('view'));}
function delFocusLine(mk,i){const a=focusLines(mk); a.splice(i,1); focusSet(mk,a);
  if(S.view==='month')vMonth(document.getElementById('view'));}
function addFocusLine(mk,inp){const v=(inp.value||'').trim(); if(!v)return;
  const a=focusLines(mk).filter(Boolean); a.push(v); focusSet(mk,a); inp.value='';
  if(S.view==='month')vMonth(document.getElementById('view'));}
function monthWeeks(mk){
  const parts=String(mk||'').split('-'), Y=+parts[0], M=+parts[1];
  if(!Y||!M)return [];
  const dim=new Date(Y,M,0).getDate();
  const last=mk+'-'+String(dim).padStart(2,'0');
  const out=[]; let w=weekStart(mk+'-01');
  while(w<=last&&out.length<6){out.push(w); w=addDays(w,7);}
  return out;}
function focusHasRock(ws,text){
  const wk=(S.weeks||{})[ws]; if(!wk||!wk.rocks)return false;
  let f=false; Object.keys(wk.rocks).forEach(k=>{const a=wk.rocks[k];
    if(Array.isArray(a))a.forEach(r=>{if(r&&r.text===text)f=true;});});
  return f;}
function focusToWeek(mk,i,ws){
  const t=focusLines(mk)[i]; if(!t)return;
  if(focusHasRock(ws,t)){toast('이미 '+ws+' 주의 큰 바위에 있습니다 — 주간 계획에서 확인하세요');return;}
  openRockPlace(ws,t,{k:'focus',mk:mk},'');}

/* ── ⑤ 주간 회고 — 완료가 아니라 «손을 댔는가» ── */
function moveRockNext(ws,rid,id){
  const r=rockFind(ws,id); if(!r)return;
  const nw=addDays(ws,7);
  if(!addRock(nw,rid,r.text,r.from))return;
  const wk=ensureWeek(ws); wk.rocks[rid]=rocksOf(ws,rid).filter(x=>x.id!==id);
  save(); toast(nw+' 주로 옮겼습니다'); rkPaint(ws);}
function dropRock(ws,rid,id){
  const r=rockFind(ws,id); if(!r)return;
  if(!confirm('«'+r.text+'» 을 놓아줄까요?\n\n모든 일을 하는 것이 실행력이 아닙니다.\n중요한 일을 실제로 하기 위해 중요하지 않은 일을 하지 않는 것도 실행력입니다.'))return;
  const wk=ensureWeek(ws); wk.rocks[rid]=rocksOf(ws,rid).filter(x=>x.id!==id);
  save(); toast('놓아주었습니다'); rkPaint(ws);}
function rockRows(ws){
  const out=[];
  (S.profile.roles||[]).forEach(r=>rocksOf(ws,r.id).forEach(k=>{
    if(k.text)out.push({r:r,k:k,s:rockStat(k.id)});}));
  return out;}
function rockReviewCard(ws){
  const rows=rockRows(ws);
  if(!rows.length)return `<div class="card"><h3>🪨 이번 주 큰 바위</h3>
    <p class="hint" style="margin-top:-4px">이번 주에는 큰 바위를 놓지 않으셨습니다.
      <button class="btn ghost sm" onclick="go('week')">주간 계획에서 놓기 →</button></p></div>`;
  const un=rows.filter(x=>!x.k.done&&x.s.st===0);
  return `<div class="card"><h3>🪨 이번 주 큰 바위 <span class="hint">(완료가 아니라 «손을 댔는가»로 봅니다)</span></h3>
    <p class="hint" style="margin-top:-4px">큰 바위는 한 주에 끝나지 않는 것이 정상입니다.
      완료율로 재면 매주 실패로 기록되고, 그러면 다음 주에 더 작게 적게 됩니다.</p>
    ${rows.map(x=>`<div class="recrow">
      <span class="tag" style="flex:none;background:${x.r.color||'#5b53b0'}" title="${esc(x.r.name)}">${esc(roleAbbr(x.r.id))}</span>
      <b style="flex:1;min-width:140px;font-size:13px">${x.k.done?'✓ ':''}${esc(x.k.text)}</b>
      <span class="rkst ${(x.k.done||x.s.st)?'ok':'warn'}">${x.k.done?'끝냄':(x.s.st?('손댐 · 착수 '+x.s.st+'/'+x.s.n):'손대지 않음')}</span>
      ${(!x.k.done&&x.s.st===0)?`<button class="btn ghost sm no-print" onclick="moveRockNext('${ws}','${x.r.id}','${x.k.id}')">다음 주로</button>
        <button class="btn ghost sm no-print" onclick="dropRock('${ws}','${x.r.id}','${x.k.id}')">놓아주기</button>`
       :`<button class="btn ghost sm no-print" onclick="openRockNext('${ws}','${x.r.id}','${x.k.id}')">＋ 다음 행동</button>`}
    </div>`).join('')}
    ${un.length?`<div class="callout co-gold" style="margin-top:10px">손대지 않은 큰 바위가 <b>${un.length}개</b> 있습니다.
      계획이 틀린 것이 아니라 <b>한 주에 담을 수 있는 양</b>이 달랐던 것입니다 — 다음 주로 옮기거나 지금 놓아주세요.</div>`
     :`<div class="callout co-acc" style="margin-top:10px">이번 주 큰 바위 모두에 손을 댔습니다. 끝내지 못했어도 <b>그것이 진척</b>입니다.</div>`}
  </div>`;}

/* ── 주간 계획의 큰 바위 카드 ── */
function rockRow(ws,rid,k){
  const st=rockStat(k.id);
  const tag = k.done?'<span class="rkst ok">✓ 끝냄</span>'
    : (st.n===0?'<span class="rkst warn">아직 내려간 것이 없습니다</span>'
      :`<span class="rkst ${st.st?'ok':''}">내려간 것 ${st.n} · 착수 ${st.st} · 완료 ${st.dn}</span>`);
  return `<div class="rkrow ${k.done?'done':''}${RKFLASH===k.id?' flash':''}">
    <button class="rkchk ${k.done?'on':''}" onclick="toggleRockDone('${ws}','${rid}','${k.id}')" title="끝냄으로 표시">${k.done?'✓':'○'}</button>
    <input class="rkin" value="${esc(k.text)}" onchange="setRockText('${ws}','${rid}','${k.id}',this.value)"
      onkeydown="if(event.key==='Enter')this.blur()">
    ${tag}
    ${st.n?`<span class="rkday">${st.items.slice(0,8).map(x=>`<i class="${x.t.status==='done'?'dn':(isStarted(x.t)?'st':'')}"
      title="${esc(x.t.text)}" onclick="openDay('${x.d}')">${x.d.slice(5)}</i>`).join('')}</span>`:''}
    <button class="btn sm no-print" onclick="openRockNext('${ws}','${rid}','${k.id}')">＋ 다음 행동</button>
    <button class="rkchk no-print" onclick="openRockRole('${ws}','${rid}','${k.id}')" title="다른 역할로 옮기기">⇄</button>
    <button class="del-x no-print" onclick="delRock('${ws}','${rid}','${k.id}')" title="삭제">✕</button>
  </div>`;}
function rockCard(ws){
  const roles=S.profile.roles||[];
  return `<div class="card"><h3>역할별 큰 바위 <span class="hint">(이번 주 꼭 할 중요한 일 · 역할당 최대 ${ROCK_MAX}개)</span></h3>
    <p class="hint" style="margin-top:-4px">급한 일은 스스로 자리를 만들지만 중요한 일은 그러지 않습니다.
      큰 바위는 한 주에 끝나지 않아도 됩니다 — <b>«＋ 다음 행동»</b> 으로 3분 안에 시작할 행동 하나를 하루에 내려보내세요.
      그것이 <b>목표를 계획으로 바꾸는 자리</b>입니다.</p>
    <div class="onegrid" style="margin-top:10px">
      ${roles.map(r=>{const arr=rocksOf(ws,r.id);
        return `<div class="rkgrp"><div class="rklab" style="background:${r.color||'#5b53b0'}" title="${esc(r.name)}">${esc(roleAbbr(r.id))}</div>
          <div class="rkrows">
            ${arr.map(k=>rockRow(ws,r.id,k)).join('')}
            ${arr.length<ROCK_MAX?`<input class="rkin newrk" placeholder="＋ 이 역할의 큰 바위"
               onchange="addRockIn('${ws}','${r.id}',this)" onkeydown="if(event.key==='Enter')this.blur()">`:''}
          </div></div>`;}).join('')||'<p class="hint" style="padding:10px">먼저 «1 인생 설계»에서 역할을 등록하세요.</p>'}
    </div>
    <button class="btn ghost sm no-print" style="margin-top:10px" onclick="pushWeekPlan('${ws}')">☁ 이 주 계획 구글 캘린더에 추가(월~일 종일)</button>
  </div>`;}

/* ── 월간 중점 카드 ── */
function focusCard(mk){
  const m=ensureMonth(mk), lines=focusLines(mk).filter(Boolean), wks=monthWeeks(mk);
  return `<div class="card"><h3>이 달의 중점 <span class="hint">(줄마다 주차에 배분하면 그것이 계획이 됩니다)</span></h3>
    ${(m.goalIds||[]).length?`<div class="hint" style="margin-top:-4px;margin-bottom:6px">이 달에 진척시킬 올해 목표:
      ${(m.goalIds||[]).map(gid=>{const g=((S.annual||{}).goals||[]).find(x=>x.id===gid);return g?`<b>${esc(g.text)}</b>`:'';}).filter(Boolean).join(' · ')}</div>`:''}
    ${lines.map((t,i)=>`<div class="fcrow">
      <input class="fcin" value="${esc(t)}" onchange="setFocusLine('${mk}',${i},this.value)"
        onkeydown="if(event.key==='Enter')this.blur()">
      <span class="fcw">${wks.map((w,j)=>`<button class="${focusHasRock(w,t)?'on':''}"
        title="${w} ~ ${addDays(w,6)} 주의 큰 바위로" onclick="focusToWeek('${mk}',${i},'${w}')">${j+1}주</button>`).join('')}</span>
      <button class="del-x no-print" onclick="delFocusLine('${mk}',${i})" title="삭제">✕</button>
    </div>`).join('')}
    <input class="fcin newfc" style="margin-top:6px" placeholder="＋ 이 달의 중점 (3개 안팎이 적당합니다)"
      onchange="addFocusLine('${mk}',this)" onkeydown="if(event.key==='Enter')this.blur()">
    <div class="hint" style="margin-top:9px">주차 단추를 누르면 그 주의 <b>큰 바위</b>로 내려갑니다 —
      한 달을 4~5주에 나누는 것만으로 «계획»이 됩니다. 이미 놓인 주는 색이 찹니다.</div>
    <button class="btn ghost sm no-print" style="margin-top:8px" onclick="pushMonthPlan('${mk}')">☁ 이 달 계획 구글 캘린더에 추가(종일)</button>
  </div>`;}

/* ============ INIT ============ */
(function init(){const had=load();if(!S.view)S.view='dash';
  (S.profile.roles||[]).forEach((r,i)=>{if(!r.color)r.color=ROLE_COLOR_MAP[r.name]||ROLE_PALETTE[i%ROLE_PALETTE.length];});
  pwaInit();
  /* 하루 첫 방문이면 3분 리추얼로 바로 들어간다 — '무엇부터 할까'라는 결정 비용을 0으로. */
  try{
    if(had && S.settings.autoRitual!==false){
      const m=ritualMode(), k=today()+m;
      if(S.meta.lastAutoRitual!==k && !ritualDone(today(),m)){
        S.meta.lastAutoRitual=k; S.view='checkin'; RIT={mode:m,step:0,d:today()};
      }
    }
  }catch(e){}
  renderNav();render();refreshWho();setSave(had?'불러옴 · '+(S.meta.savedAt||''):'자동저장 켜짐');
  try{syncTopbarH();setTimeout(syncTopbarH,120);setTimeout(syncTopbarH,600);}catch(e){}
  /* 상단바는 사명 길이·창 폭에 따라 높이가 달라진다 — 스크롤 중에도 한 프레임에 한 번만 다시 잰다 */
  let tbRaf=0;
  window.addEventListener('scroll',()=>{ if(tbRaf)return;
    tbRaf=requestAnimationFrame(()=>{tbRaf=0;try{syncTopbarH();}catch(e){}}); },{passive:true});
  try{stampTick();}catch(e){}          /* 도장 캐시 초기화 (첫 호출은 기록만) */
  try{utInit();}catch(e){}
  try{tipInit();}catch(e){}
  try{paintCloud();cloudAutoOpen();}catch(e){}
  checkReminders();setInterval(checkReminders,30000);
  let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(()=>{try{syncTopbarH();}catch(e){}alignPanels();},120);});})();
</script>
</body>
