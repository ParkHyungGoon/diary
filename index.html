/* ============================================================
   ⑧ 인생 달력 — 1968년부터 100년 (인생 설계와 오늘을 잇는 장치)
   ============================================================ */
const LIFE_SPAN=100;
function lifeStartYear(){const y=parseInt(S.lifemap.birthYear,10);return (y&&y>1800&&y<2200)?y:1968;}
function setLifeStart(y){S.lifemap.birthYear=parseInt(y,10)||1968;save();vLife(document.getElementById('view'));}
function pickLifeYear(y){S.ui.lcYear=(S.ui.lcYear===y?0:y);save();vLife(document.getElementById('view'));}
function setMilestone(y,val){if(!S.lifemap.milestones)S.lifemap.milestones={};
  if(val&&val.trim())S.lifemap.milestones[y]=val;else delete S.lifemap.milestones[y];save();}
function lifeCalStats(){
  const y0=lifeStartYear(),n=new Date(),tot=LIFE_SPAN*12;
  const passed=Math.max(0,Math.min(tot,(n.getFullYear()-y0)*12+(n.getMonth()+1)));
  return {y0,tot,passed,left:tot-passed,pct:Math.round(passed/tot*100),age:n.getFullYear()-y0};}
function lifeCalHtml(){
  const st=lifeCalStats(), n=new Date(), cy=n.getFullYear(), cm=n.getMonth()+1;
  const ms=S.lifemap.milestones||{}, sel=S.ui.lcYear||0;
  let rows='';
  for(let y=st.y0;y<st.y0+LIFE_SPAN;y++){
    let cells='';
    for(let m=1;m<=12;m++){
      const past=(y<cy)||(y===cy&&m<cm), now=(y===cy&&m===cm);
      cells+=`<i class="${now?'now':(past?'pa':'fu')}"></i>`;
    }
    rows+=`<div class="lcrow${y===cy?' cur':''}${y===sel?' sel':''}${ms[y]?' hasm':''}" onclick="pickLifeYear(${y})" title="${y}년 · 만 ${y-st.y0}세">
      <span class="ly">${y}</span><span class="la">${y-st.y0}</span>
      <span class="lcells">${cells}</span>
      <span class="lnote">${ms[y]?esc(ms[y]):''}</span></div>`;
  }
  const msKeys=Object.keys(ms).sort();
  return `<div class="card"><h3>🗓 인생 달력 — ${st.y0}년부터 100년 <span class="hint">(한 칸 = 한 달)</span></h3>
    <p class="hint" style="margin-top:-4px">시간은 늘 있는 것처럼 느껴지지만, 눈으로 보면 유한합니다. 이 표는 <b>비전·꿈·연간 목표를 오늘로 당겨오는 장치</b>입니다.
      연도를 클릭해 그 해의 <b>이정표</b>를 적어두세요.</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px">
      <label class="fld" style="max-width:180px;margin:0"><span class="lb">시작(출생) 연도</span>
        <input type="number" value="${st.y0}" onchange="setLifeStart(this.value)"></label>
      <div class="stat" style="flex:1;min-width:260px">
        <div class="s"><div class="n">${st.passed}</div><div class="l">살아온 개월 (만 ${st.age}세)</div></div>
        <div class="s"><div class="n">${st.left}</div><div class="l">남은 개월</div></div>
        <div class="s"><div class="n">${st.pct}%</div><div class="l">100년 중 지난 비율</div></div>
      </div>
    </div>
    <div class="bar" style="height:18px"><i style="width:${st.pct}%"></i></div>
    <div class="lclegend"><span><i class="pa"></i> 지나간 달</span><span><i class="now"></i> 이번 달</span><span><i class="fu"></i> 남은 달</span><span>★ 이정표가 적힌 해는 배경이 다릅니다</span></div>
    ${sel?`<div class="callout co-brand" style="margin:10px 0">
      <b>${sel}년 · 만 ${sel-st.y0}세 이정표</b>
      <input type="text" value="${esc(ms[sel]||'')}" placeholder="예: 정년 · 아이 대학 입학 · 책 출간 · 은퇴 후 첫 해"
        oninput="setMilestone(${sel},this.value)" onchange="vLife(document.getElementById('view'))" style="margin-top:6px">
      <div class="hint" style="margin-top:4px">비워두고 화면을 벗어나면 삭제됩니다.</div></div>`:''}
    <div class="lifecal">${rows}</div>
    ${msKeys.length?`<div style="margin-top:12px"><b style="font-size:13px">이정표 목록</b>
      ${msKeys.map(y=>`<div class="row-item" style="padding:4px 0;border:none">
        <div style="flex:none;width:90px;font-weight:800;font-size:13px">${y} · ${y-st.y0}세</div>
        <div style="flex:1;font-size:13px">${esc(ms[y])}</div>
        <button class="del-x" onclick="setMilestone(${y},'');vLife(document.getElementById('view'))">✕</button></div>`).join('')}</div>`:''}
    <div class="callout co-acc" style="margin-top:12px"><div class="tag">다음 단계로</div>
      이정표가 정해졌다면, 가장 가까운 이정표를 <b>비전 → 연간 목표 → 이번 달 중점 → 이번 주 큰 바위 → 오늘의 과제</b>로 내려보내세요.
      각 화면 맨 위의 <b>⬇ 위에서 내려온 것</b> 칸이 그 연결을 도와줍니다.</div>
  </div>`;}

/* ============================================================
   ⑨ 계획의 수직 연결 — 인생설계 → 연간 → 월간 → 주간 → 일간
   상위 기간에서 정한 것이 다음 화면 맨 위에 '내려와' 있고,
   한 번의 클릭으로 하위 단위의 입력이 된다.
   ============================================================ */
function chainBox(title,sub,items,foot){
  if(!items.length)return `<div class="chain empty"><div class="ch-h">⬇ ${title}<span class="ch-s">${sub}</span></div>
    <div class="ch-b"><div class="ch-i" style="color:var(--muted)">아직 위 단계에서 내려온 것이 없습니다. ${foot||''}</div></div></div>`;
  return `<div class="chain"><div class="ch-h">⬇ ${title}<span class="ch-s">${sub}</span></div>
    <div class="ch-b">${items.map(it=>`<div class="ch-i">
      ${it.tag?`<span class="ch-g" style="background:${it.color||'var(--brand)'}">${esc(it.tag)}</span>`:''}
      <span class="ch-t">${esc(it.t)}</span>
      ${(it.btns||[]).map(b=>`<button class="btn ghost sm" onclick="${b.f}">${b.l}</button>`).join('')}</div>`).join('')}
    </div>${foot?`<div class="ch-f">${foot}</div>`:''}</div>`;}

/* 인생 설계 → 연간 */
function chainToAnnual(){
  const items=[];
  if(S.mission.statement)items.push({tag:'사명',t:S.mission.statement});
  const st=lifeCalStats(), ms=S.lifemap.milestones||{};
  Object.keys(ms).map(Number).filter(y=>y>=new Date().getFullYear()).sort().slice(0,2)
    .forEach(y=>items.push({tag:y+'년 이정표',color:'var(--gold)',t:ms[y],
      btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(ms[y])},'')`}]}));
  (S.profile.roles||[]).forEach(r=>{const tx=((S.vision.text||{})[r.id]||'').trim();
    if(tx)items.push({tag:r.name,color:r.color,t:tx.slice(0,90),
      btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(tx.slice(0,90))},'${r.id}')`}]});});
  LIFE_AREAS.forEach(a=>{const w=((S.lifemap.areas[a]||{}).wish||'').trim();
    if(w)items.push({tag:a,color:'var(--accent)',t:w,btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(w)},'')`}]});});
  (S.lifemap.dreams||[]).filter(x=>!x.done&&x.text).slice(0,3)
    .forEach(x=>items.push({tag:'꿈',color:'#b23a55',t:x.text,btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(x.text)},'')`}]}));
  return chainBox('인생 설계 · 비전에서 내려온 것','사명 · 이정표 · 역할별 비전 · 8영역 소망 · 꿈',items,
    '<b>1 인생 설계</b>와 <b>3 비전</b>을 먼저 채우면 이 칸이 올해 목표의 재료가 됩니다.');}
function addGoalFrom(text,role){S.annual.goals.push({id:uid(),role:role||'',text:text,done:false});save();
  toast('올해 목표로 가져왔습니다');vAnnual(document.getElementById('view'));}

/* 연간 → 월간 */
function chainToMonth(mk){
  const m=ensureMonth(mk);
  const items=(S.annual.goals||[]).filter(g=>g.text&&!g.done).map(g=>({
    tag:g.role?roleName(g.role):'올해',color:g.role?roleColor(g.role):'var(--brand)',t:g.text,
    btns:[{l:(m.goalIds.includes(g.id)?'✓ 이 달 목표':'이 달에 진척'),f:`toggleMonthGoal('${mk}','${g.id}')`},
          {l:'→ 중점에 추가',f:`addMonthFocus('${mk}',${JSON.stringify(g.text)})`}]}));
  if(S.annual.word)items.unshift({tag:S.annual.year+' 단어',color:'var(--gold)',t:S.annual.word});
  return chainBox('연간 계획에서 내려온 것','올해의 단어 · 올해 목표',items,
    '<b>4 연간 계획</b>에 목표를 적으면 여기로 내려옵니다.');}
function toggleMonthGoal(mk,gid){const m=ensureMonth(mk);const i=m.goalIds.indexOf(gid);
  if(i>=0)m.goalIds.splice(i,1);else m.goalIds.push(gid);save();vMonth(document.getElementById('view'));}
function addMonthFocus(mk,text){const m=ensureMonth(mk);
  m.focus=(m.focus?m.focus.replace(/\s*$/,'')+'\n':'')+'· '+text;save();
  toast('이 달의 중점에 추가했습니다');vMonth(document.getElementById('view'));}

/* 월간 → 주간 */
function chainToWeek(ws){
  const mk=monthKey(ws), m=ensureMonth(mk), wk=ensureWeek(ws), items=[];
  (m.focus||'').split('\n').map(s=>s.replace(/^[·\-\s]+/,'').trim()).filter(Boolean).slice(0,6)
    .forEach(t=>items.push({tag:mk+' 중점',color:'var(--brand)',t:t,btns:[{l:'→ 큰 바위로',f:`rockFrom('${ws}','',${JSON.stringify(t)})`}]}));
  (m.goalIds||[]).forEach(gid=>{const g=(S.annual.goals||[]).find(x=>x.id===gid);if(!g)return;
    items.push({tag:g.role?roleName(g.role):'올해 목표',color:g.role?roleColor(g.role):'var(--gold)',t:g.text,
      btns:[{l:'→ 큰 바위로',f:`rockFrom('${ws}','${g.role||''}',${JSON.stringify(g.text)})`}]});});
  return chainBox('월간 계획에서 내려온 것','이 달의 중점 · 이 달에 진척시킬 올해 목표',items,
    '<b>5 월간</b>에서 중점을 적거나 올해 목표를 고르면 여기로 내려옵니다.');}
function rockFrom(ws,role,text){const wk=ensureWeek(ws);
  let rid=role;
  if(!rid||!(S.profile.roles||[]).some(r=>r.id===rid)){
    const empty=(S.profile.roles||[]).find(r=>!(wk.rocks[r.id]||'').trim());
    rid=(empty||S.profile.roles[0]||{}).id;}
  if(!rid){toast('먼저 역할을 등록하세요');return;}
  wk.rocks[rid]=((wk.rocks[rid]||'').trim()?wk.rocks[rid]+' / ':'')+text;
  save();toast(roleName(rid)+' 역할의 큰 바위로 놓았습니다');vWeek(document.getElementById('view'));}

/* 주간 → 일간 */
function chainToDay(d){
  const ws=weekStart(d), wk=ensureWeek(ws), items=[];
  (S.profile.roles||[]).forEach(r=>{const t=(wk.rocks[r.id]||'').trim();if(!t)return;
    const already=(S.days[d].tasks||[]).some(x=>x.text===t);
    items.push({tag:r.name,color:r.color,t:t,
      btns:already?[{l:'✓ 오늘 과제에 있음',f:`toast('이미 오늘 과제에 있습니다')`}]
                  :[{l:'→ 오늘 과제로',f:`rockToTask('${d}','${ws}','${r.id}')`}]});});
  return chainBox('주간 계획에서 내려온 것','이번 주 역할별 큰 바위 ('+ws+' ~ '+addDays(ws,6)+')',items,
    '<b>6 주간</b>에서 역할별 큰 바위를 놓으면 여기로 내려옵니다. 급한 일이 아니라 <b>중요한 일</b>이 하루에 자리를 얻는 통로입니다.');}
function rockToTask(d,ws,rid){const wk=ensureWeek(ws);const t=(wk.rocks[rid]||'').trim();if(!t)return;
  ensureDay(d);S.days[d].tasks.push({id:uid(),text:t,priority:'A',role:rid,impact:4,status:'todo',src:{k:'rock',ws:ws,role:rid}});
  save();toast('오늘의 A 과제로 내렸습니다');vDay(document.getElementById('view'));}

/* ============================================================
   ⑩ 시간표 메모 → 일상 기록 연결
   ============================================================ */
let MEMO={d:'',kind:'',id:''};
function modalBox(html){
  let m=document.getElementById('mmask');
  if(!m){m=document.createElement('div');m.id='mmask';m.className='mmask';m.onclick=e=>{if(e.target===m)closeModal();};document.body.appendChild(m);}
  m.innerHTML=`<div class="mbox">${html}</div>`;m.style.display='flex';}
function closeModal(){const m=document.getElementById('mmask');if(m)m.style.display='none';}
function findItem(d,kind,id){ensureDay(d);
  if(kind==='task')return (S.days[d].tasks||[]).find(t=>t.id===id)||null;
  return (S.days[d].events||[]).find(e=>e.id===id)||null;}
function itemLabel(o,kind){return kind==='task'?(o.text||''):(o.title||'');}
function openMemo(d,kind,id){
  const o=findItem(d,kind,id); if(!o){toast('항목을 찾지 못했습니다');return;}
  MEMO={d,kind,id};
  modalBox(`<h3 style="margin:0 0 4px">🗒 메모</h3>
    <div class="hint" style="margin-bottom:10px"><b>${d} (${wd(d)}) ${o.start||''}${o.end?'–'+o.end:''}</b> · ${esc(itemLabel(o,kind))}</div>
    <textarea id="memotx" rows="6" placeholder="이 시간에 무슨 일이 있었는지, 무엇을 느꼈는지 — 짧아도 됩니다">${esc(o.memo||'')}</textarea>
    <div class="hint" style="margin-top:6px">저장하면 <b>일자·시각과 함께 일상 기록</b>에 쌓입니다.</div>
    <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:12px">
      <button class="btn ghost" onclick="closeModal()">닫기</button>
      <button class="btn" onclick="saveMemo()">저장</button></div>`);
  setTimeout(()=>{const t=document.getElementById('memotx');if(t)t.focus();},60);}
function saveMemo(){
  const o=findItem(MEMO.d,MEMO.kind,MEMO.id); if(!o){closeModal();return;}
  const t=document.getElementById('memotx');
  o.memo=(t?t.value:'').trim(); if(!o.memo)delete o.memo;
  o.memoAt=new Date().toISOString(); save(); closeModal();
  toast('메모를 저장했습니다 — 일상 기록에서 함께 볼 수 있습니다');
  if(S.view==='day'){renderTasks(MEMO.d);renderSchedule(MEMO.d);}else render();}
function dayMemos(d){
  const x=S.days[d]; if(!x)return [];
  const out=[];
  (x.tasks||[]).forEach(t=>{if(t.memo)out.push({start:t.start||'',end:t.end||'',title:t.text,memo:t.memo,kind:'task',id:t.id,role:t.role});});
  (x.events||[]).forEach(e=>{if(e.memo)out.push({start:e.start||'',end:e.end||'',title:e.title,memo:e.memo,kind:'event',id:e.id,role:e.role});});
  if(kOn())kLessonsOn(d).forEach(ls=>{const l=K().logs[ls.key]||{};
    const txt=[l.prog,l.note,l.absent?'('+l.absent+')':''].filter(Boolean).join(' · ');
    if(txt)out.push({start:ls.start,end:ls.end,title:ls.g+' '+ls.no+'차시',memo:txt,kind:'lesson',id:ls.key,color:kColor(ls.g)});});
  return out.sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));}
function memoLines(d){return dayMemos(d).map(m=>`${d} ${m.start||'--:--'}${m.end?'–'+m.end:''} · ${m.title}\n  ${m.memo}`).join('\n');}
function memosToJournal(d){
  const lines=memoLines(d); if(!lines){toast('저장된 메모가 없습니다');return;}
  ensureDay(d);const cur=S.days[d].journal||'';
  if(cur.indexOf(lines)>=0){toast('이미 붙여넣은 내용입니다');return;}
  S.days[d].journal=(cur?cur.replace(/\s*$/,'')+'\n\n':'')+'— 시간표 메모 —\n'+lines;
  save();toast('일상 기록에 붙여넣었습니다');
  if(S.view==='day')vDay(document.getElementById('view'));else render();}
function memoCard(d){
  const ms=dayMemos(d);
  return `<div class="card"><h3>🗒 시간표 메모 <span class="hint">(일자·시각과 함께 일상 기록으로 이어집니다)</span></h3>
    ${ms.length? ms.map(m=>`<div class="memoline">
        <span class="mt">${m.start||'--:--'}${m.end?'–'+m.end:''}</span>
        <span class="mh" style="border-color:${m.color||(m.role?roleColor(m.role):'var(--brand)')}">${esc(m.title)}</span>
        <span class="mm">${esc(m.memo)}</span>
        <button class="btn ghost sm no-print" onclick="${m.kind==='lesson'?`openLesson('${esc(m.id)}')`:`openMemo('${d}','${m.kind}','${m.id}')`}">수정</button></div>`).join('')
      : '<p class="hint">시간표의 <b>🗒</b> 단추를 누르면 그 시각의 메모를 남길 수 있습니다. 과제·일정·구글 일정 모두 가능합니다.</p>'}
    ${ms.length?`<div style="margin-top:8px"><button class="btn sm no-print" onclick="memosToJournal('${d}')">↧ 오늘 일상 기록에 붙여넣기</button></div>`:''}
  </div>`;}

/* ============================================================
   ⑪ 구글 일정 편집 — 불러온 일정을 이동·수정·삭제하고 구글에 반영
   ============================================================ */
async function gcalPatchEvent(ev,d){
  if(!ev||!ev.gEventId||!gTokenValid())return;
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  const s=new Date(d+'T'+ev.start+':00'), e=new Date(d+'T'+(ev.end||addMinStr(ev.start,60))+':00');
  const body={summary:ev.title,start:{dateTime:isoLocal(s),timeZone:tzName()},end:{dateTime:isoLocal(e),timeZone:tzName()}};
  if(ev.memo)body.description=ev.memo;
  try{await gFetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events/'+encodeURIComponent(ev.gEventId),
     {method:'PATCH',body:JSON.stringify(body)}); toast('구글 캘린더에도 반영했습니다');}
  catch(err){gReport('구글 반영 실패',err);}}
async function gcalPatchTask(t,d){
  if(!t||!t.gEventId||!gTokenValid()||!t.start)return;
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  const s=new Date(d+'T'+t.start+':00'), e=new Date(d+'T'+(t.end||addMinStr(t.start,60))+':00');
  const body={summary:'['+t.priority+'] '+t.text,start:{dateTime:isoLocal(s),timeZone:tzName()},end:{dateTime:isoLocal(e),timeZone:tzName()}};
  if(t.memo)body.description=t.memo;
  try{await gFetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events/'+encodeURIComponent(t.gEventId),
     {method:'PATCH',body:JSON.stringify(body)});}catch(err){gReport('구글 반영 실패',err);}}
async function gcalDeleteEvent(gid){
  if(!gid||!gTokenValid())return;
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  try{const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events/'+encodeURIComponent(gid),
      {method:'DELETE',headers:{'Authorization':'Bearer '+GCAL.token}});
    if(!r.ok&&r.status!==410&&r.status!==404){const t=await r.text();throw gApiError(r.status,t);}
    toast('구글 캘린더에서도 삭제했습니다');}
  catch(err){gReport('구글 삭제 실패',err);}}
/* 시간 이동/시간 변경 후 호출 — 구글 원본이 있으면 조용히 맞춰준다 */
function syncMoved(d,obj,isEvent){ if(!obj||!obj.gEventId||!gTokenValid())return;
  if(isEvent)gcalPatchEvent(obj,d); else gcalPatchTask(obj,d); }

/* 일정 편집 모달 — 내 일정과 구글에서 불러온 일정 모두 여기서 수정 */
function openEvEdit(d,id){
  const ev=findItem(d,'event',id); if(!ev){toast('일정을 찾지 못했습니다');return;}
  modalBox(`<h3 style="margin:0 0 10px">✏ 일정 수정 ${ev.gEventId?'<span class="tag" style="background:var(--accent)">구글 연결됨</span>':''}</h3>
    <label class="fld"><span class="lb">제목</span><input type="text" id="eeT" value="${esc(ev.title||'')}"></label>
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <label class="fld" style="max-width:150px"><span class="lb">시작</span><input type="time" class="tmin" id="eeS" value="${ev.start||'09:00'}"></label>
      <label class="fld" style="max-width:150px"><span class="lb">종료</span><input type="time" class="tmin" id="eeE" value="${ev.end||'10:00'}"></label>
      <label class="fld" style="flex:1;min-width:150px"><span class="lb">역할(색)</span><select id="eeR">${roleOptions(ev.role||'')}</select></label>
    </div>
    <label class="fld"><span class="lb">메모 <span class="hint">(일상 기록에 함께 쌓입니다)</span></span><textarea id="eeM" rows="3">${esc(ev.memo||'')}</textarea></label>
    ${ev.gEventId?'<div class="hint">저장하면 구글 캘린더의 원본 일정도 함께 수정됩니다.</div>':''}
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" style="color:var(--del)" onclick="delEvent('${d}','${id}');closeModal()">삭제</button>
      <span><button class="btn ghost" onclick="closeModal()">닫기</button>
      <button class="btn" onclick="saveEvEdit('${d}','${id}')">저장</button></span></div>`);}
function saveEvEdit(d,id){
  const ev=findItem(d,'event',id); if(!ev){closeModal();return;}
  const g=x=>{const el=document.getElementById(x);return el?el.value:'';};
  const s=g('eeS'),e=g('eeE');
  if(s&&e&&toMin(e)<=toMin(s)){toast('종료 시간이 시작보다 늦어야 합니다');return;}
  ev.title=g('eeT').trim()||ev.title; if(s)ev.start=s; if(e)ev.end=e;
  ev.role=g('eeR'); const mm=g('eeM').trim(); if(mm)ev.memo=mm; else delete ev.memo;
  save(); closeModal(); renderSchedule(d);
  if(S.view==='day')vDay(document.getElementById('view'));
  syncMoved(d,ev,true);}


/* ============================================================
   ⑫ 사용 시간 기록 — 어느 메뉴에 얼마나 머무는가
   · 화면 오른쪽 위 팝업: 지금 메뉴를 연 뒤 흐른 시간(실시간)
   · 사이드바 제목 아래: 이 다이어리를 쓴 전체 시간
   · 탭이 숨겨지거나 5분 이상 아무 조작이 없으면 세지 않는다(정직한 숫자)
   ============================================================ */
let UT={view:'',t0:0,act:0,seg:0,idleMs:300000,dirty:false,saved:0,int:null};
function fmtDur(s){ s=Math.max(0,Math.round(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  if(h)return h+'시간 '+m+'분';
  if(m)return m+'분';
  return s+'초';}
function fmtClock(s){ s=Math.max(0,Math.round(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  const p=n=>String(n).padStart(2,'0');
  return (h?h+':':'')+p(m)+':'+p(sec);}
function viewTitle(v){const n=NAV.find(x=>x.id===v);return n?(n.e+' '+n.t):v;}
function usageAdd(v,s){
  const u=S.usage; if(!u||!s)return;
  u.total=(u.total||0)+s;
  u.byView[v]=(u.byView[v]||0)+s;
  const d=today(); if(!u.byDay[d])u.byDay[d]={total:0,views:{}};
  u.byDay[d].total+=s; u.byDay[d].views[v]=(u.byDay[d].views[v]||0)+s;}
function utMark(){UT.act=Date.now();}
function utSwitch(v){
  utFlush();
  UT.view=v; UT.seg=0; UT.t0=Date.now(); utMark(); utPaint();}
function utFlush(){
  if(!UT.view||!UT.t0)return;
  const dt=Math.floor((Date.now()-UT.t0)/1000);
  if(dt>0&&!document.hidden){usageAdd(UT.view,Math.min(dt,300));UT.seg+=dt;UT.dirty=true;}
  UT.t0=Date.now();}
function utTick(){
  const now=Date.now();
  const idle=(now-UT.act)>UT.idleMs;
  if(!document.hidden&&!idle&&UT.view){
    let dt=Math.floor((now-UT.t0)/1000);
    if(dt>0){ if(dt>5)dt=1;                       /* 탭 복귀·절전 후의 큰 점프는 버린다 */
      usageAdd(UT.view,dt); UT.seg+=dt; UT.t0+=dt*1000; UT.dirty=true; }
  } else UT.t0=now;
  utPaint();
  if(UT.dirty&&now-UT.saved>15000){UT.saved=now;UT.dirty=false;try{save();}catch(e){}}}
function utToggle(){S.settings.utOpen=!(S.settings.utOpen!==false);save();utPaint();}
function utHide(){S.settings.utShow=false;save();utPaint();toast('사용 시간 표시를 껐습니다 — 성찰·통계에서 다시 켤 수 있습니다');}
function utPaint(){
  const box=document.getElementById('utbox'); if(!box)return;
  const tot=document.getElementById('utTotal');
  const u=S.usage||{total:0,byView:{},byDay:{}};
  const d=today(), td=(u.byDay&&u.byDay[d])||{total:0,views:{}};
  if(tot)tot.textContent='⏱ 총 '+fmtDur(u.total||0)+' · 오늘 '+fmtDur(td.total||0);
  if(S.settings.utShow===false){box.style.display='none';document.body.classList.remove('utgut');return;}
  box.style.display='block'; document.body.classList.add('utgut');
  const open=S.settings.utOpen!==false;
  const rows=Object.keys(td.views||{}).map(k=>({v:k,s:td.views[k]})).filter(x=>x.s>=5).sort((a,b)=>b.s-a.s);
  const mx=Math.max(1,...rows.map(r=>r.s));
  box.className='utbox no-print'+(open?' open':'');
  box.innerHTML=`
    <div class="uth" onclick="utToggle()" title="눌러서 펼치기/접기">
      <span class="ut-v">${esc(viewTitle(UT.view||S.view))}</span>
      <span class="ut-c">${fmtClock(UT.seg)}</span>
      <span class="ut-ar">${open?'▴':'▾'}</span>
    </div>
    ${open?`<div class="utb">
      <div class="ut-sum"><span>오늘 <b>${fmtDur(td.total||0)}</b></span><span>전체 <b>${fmtDur(u.total||0)}</b></span></div>
      ${rows.length?rows.slice(0,8).map(r=>`<div class="ut-row">
        <span class="ut-n">${esc(viewTitle(r.v))}</span>
        <span class="ut-b"><i style="width:${Math.round(r.s/mx*100)}%"></i></span>
        <span class="ut-t">${fmtDur(r.s)}</span></div>`).join('')
       :'<div class="ut-row"><span class="ut-n" style="color:var(--muted)">오늘 기록이 쌓이는 중입니다</span></div>'}
      <div class="ut-f">이 메뉴를 연 뒤 흐른 시간입니다. 탭을 가리거나 5분 이상 조작이 없으면 세지 않습니다.
        <button class="ut-x" onclick="event.stopPropagation();utHide()">표시 끄기</button></div>
    </div>`:''}`;}
function utInit(){
  if(!document.getElementById('utbox')){
    const b=document.createElement('div'); b.id='utbox'; b.className='utbox no-print'; document.body.appendChild(b);}
  UT.view=S.view; UT.t0=Date.now(); UT.act=Date.now(); UT.saved=Date.now();
  ['mousemove','mousedown','keydown','touchstart','wheel','input'].forEach(e=>
    window.addEventListener(e,utMark,{passive:true}));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){utFlush();try{save();}catch(e){}} else {UT.t0=Date.now();utMark();} });
  window.addEventListener('beforeunload',()=>{utFlush();try{save();}catch(e){}});
  if(UT.int)clearInterval(UT.int);
  UT.int=setInterval(utTick,1000);
  utPaint();}
/* 성찰·통계용 — 메뉴별 전체 사용 시간 표 */
function usageTable(){
  const u=S.usage||{total:0,byView:{},byDay:{}};
  const rows=Object.keys(u.byView||{}).map(k=>({v:k,s:u.byView[k]})).filter(x=>x.s>=1).sort((a,b)=>b.s-a.s).slice(0,14);
  const mx=Math.max(1,...rows.map(r=>r.s));
  const d=today(), td=(u.byDay&&u.byDay[d])||{total:0};
  const days=Object.keys(u.byDay||{}).length;
  return `<div class="card"><h3>⏱ 사용 시간 <span class="hint">(어디에 시간을 쓰고 있는가)</span></h3>
    <div class="stat" style="margin-bottom:12px">
      <div class="s"><div class="n">${fmtDur(u.total||0)}</div><div class="l">전체 사용 시간</div></div>
      <div class="s"><div class="n">${fmtDur(td.total||0)}</div><div class="l">오늘</div></div>
      <div class="s"><div class="n">${days?fmtDur(Math.round((u.total||0)/days)):'0분'}</div><div class="l">쓴 날 하루 평균 (${days}일)</div></div>
    </div>
    ${rows.length?rows.map(r=>`<div class="balrow"><div class="bn" title="${esc(viewTitle(r.v))}">${esc(viewTitle(r.v))}</div>
      <div class="bb"><i style="width:${Math.round(r.s/mx*100)}%;background:var(--brand)"></i></div>
      <div class="bv">${fmtDur(r.s)}</div></div>`).join('')
     :'<p class="hint">아직 집계할 기록이 없습니다.</p>'}
    <label style="font-size:13px;font-weight:600;display:block;margin-top:10px">
      <input type="checkbox" ${S.settings.utShow!==false?'checked':''} onchange="S.settings.utShow=this.checked;save();utPaint()" style="width:auto">
      화면 오른쪽 위에 <b>사용 시간 팝업</b> 표시</label>
    <p class="hint" style="margin-top:6px">시간이 곧 가치는 아닙니다. 다만 <b>계획에 쓰는 시간과 실천에 쓰는 시간의 비율</b>은 볼 만합니다 —
      설계·계획 화면에만 시간이 몰려 있다면, 그것은 계획이 실행을 대신하고 있다는 신호입니다.</p>
  </div>`;}


/* ============================================================
   ⑬ 기기 간 동기화 — 노트북 ↔ 휴대폰을 오가며 써도 안전하게
   ------------------------------------------------------------
   [이전 구조의 문제]
   자동 동기화가 '올리기'만 자동이었습니다. 다른 기기에서 열면 옛 기록이 뜨고,
   거기서 한 글자만 입력해도 4초 뒤 그 옛 기록이 클라우드를 덮어써 버렸습니다.
   [지금 구조]
   ① 열 때(로그인 직후) 반드시 '먼저 맞추고' 시작한다 — 맞추기 전에는 절대 올리지 않는다.
   ② 올리기 직전 클라우드가 그새 바뀌었는지 확인한다.
   ③ 마지막에 저장한 쪽이 이기는 방식이 아니라 **날짜·항목 단위로 병합**한다.
      (노트북에서 쓴 8/8과 휴대폰에서 쓴 8/9이 둘 다 살아남는다)
   ============================================================ */
let CLOUD={ready:false,busy:false,state:'off',mtime:'',msg:''};
let STAMP={days:{},weeks:{},months:{},rest:'',init:false};
let stampTimer=null, DIRTY=false;

/* ---- 어떤 항목이 언제 바뀌었는지 도장을 찍는다 (병합의 근거) ---- */
function stripU(o){const c=Object.assign({},o);delete c.u;return c;}
function stampTick(){
  let changed=false;
  ['days','weeks','months'].forEach(k=>{
    const box=S[k]||{}, cache=STAMP[k];
    Object.keys(box).forEach(key=>{
      let s; try{s=JSON.stringify(stripU(box[key]));}catch(e){return;}
      if(cache[key]!==s){
        if(STAMP.init&&cache[key]!==undefined){box[key].u=Date.now();changed=true;}
        else if(STAMP.init){box[key].u=box[key].u||Date.now();changed=true;}
        cache[key]=s;
      }
    });
  });
  let rest='';
  try{ rest=JSON.stringify({p:S.profile,m:S.mission,l:S.lifemap,v:S.vision,a:S.annual,
        h:S.habits,r:S.reading,i:S.ideas,rc:S.recurring,rm:S.reminders,f:S.focusLog,
        st:Object.assign({},S.settings,{gClientId:'',gcalId:'',utShow:'',utOpen:'',autoCloud:''})}); }catch(e){}
  if(STAMP.rest!==rest){ if(STAMP.init&&STAMP.rest!=='')changed=true; STAMP.rest=rest; }
  if(!STAMP.init){STAMP.init=true;return;}
  if(changed){
    S.meta.updatedAt=Date.now(); DIRTY=true;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    try{scheduleCloud();}catch(e){}
  }
}
function stampSchedule(){ if(stampTimer)clearTimeout(stampTimer); stampTimer=setTimeout(stampTick,700); }

/* ---- 병합 ---- */
function mergeDict(A,B,lu,ru){
  A=A||{};B=B||{};const out={};
  Object.keys(A).forEach(k=>{const a=A[k],b=B[k];
    out[k]=(b===undefined)?a:(((a&&a.u)||lu)>=((b&&b.u)||ru)?a:b);});
  Object.keys(B).forEach(k=>{if(out[k]===undefined)out[k]=B[k];});
  return out;}
function mergeMaxNum(A,B){A=A||{};B=B||{};const out={};
  Object.keys(A).forEach(k=>out[k]=Math.max(A[k]||0,B[k]||0));
  Object.keys(B).forEach(k=>{if(out[k]===undefined)out[k]=B[k]||0;});
  return out;}
function itemKey(x){return (x&&x.id)||('#'+String((x&&(x.text||x.title||x.name))||JSON.stringify(x||'')).slice(0,60));}
function mergeArr(A,B,lu,ru){
  A=A||[];B=B||[];const seen={},out=[];
  A.forEach(x=>{const k=itemKey(x);const y=B.find(z=>itemKey(z)===k);
    out.push(y&&((y.u||ru)>(x.u||lu))?y:x);seen[k]=1;});
  B.forEach(x=>{const k=itemKey(x);if(!seen[k]){out.push(x);seen[k]=1;}});
  return out;}
function mergeUsage(a,b){ a=a||{};b=b||{};
  const A=a.byDay||{},B=b.byDay||{},byDay={};
  Object.keys(A).concat(Object.keys(B)).forEach(d=>{ if(byDay[d])return;
    const x=A[d]||{total:0,views:{}},y=B[d]||{total:0,views:{}};
    byDay[d]={total:Math.max(x.total||0,y.total||0),views:mergeMaxNum(x.views,y.views)};});
  const byView=mergeMaxNum(a.byView,b.byView);
  const sum=Object.keys(byDay).reduce((s,d)=>s+(byDay[d].total||0),0);
  return {total:Math.max(a.total||0,b.total||0,sum),byView,byDay};}
function mergeState(L,R){
  const lu=(L.meta&&L.meta.updatedAt)||0, ru=(R.meta&&R.meta.updatedAt)||0;
  const localWins=lu>=ru;
  const base=JSON.parse(JSON.stringify(localWins?L:R));      /* 단일 값(사명·비전 등)의 기준 */
  base.days=mergeDict(L.days,R.days,lu,ru);
  base.weeks=mergeDict(L.weeks,R.weeks,lu,ru);
  base.months=mergeDict(L.months,R.months,lu,ru);
  base.focusLog=mergeMaxNum(L.focusLog,R.focusLog);
  base.usage=mergeUsage(L.usage,R.usage);
  base.habits=mergeArr(L.habits,R.habits,lu,ru);
  base.reading=mergeArr(L.reading,R.reading,lu,ru);
  base.ideas=mergeArr(L.ideas,R.ideas,lu,ru);
  base.recurring=mergeArr(L.recurring,R.recurring,lu,ru);
  base.reminders=mergeArr(L.reminders,R.reminders,lu,ru);
  base.annual=Object.assign({},localWins?L.annual:R.annual,
    {goals:mergeArr((L.annual||{}).goals,(R.annual||{}).goals,lu,ru)});
  /* 키 합집합 — 값이 겹치면 '더 최근에 고친 기기' 쪽을 쓴다 */
  const pref=(A,B)=>localWins?Object.assign({},B||{},A||{}):Object.assign({},A||{},B||{});
  base.lifemap=Object.assign({},localWins?L.lifemap:R.lifemap,{
    dreams:mergeArr((L.lifemap||{}).dreams,(R.lifemap||{}).dreams,lu,ru),
    areas:pref((L.lifemap||{}).areas,(R.lifemap||{}).areas),
    milestones:pref((L.lifemap||{}).milestones,(R.lifemap||{}).milestones)});
  base.vision=Object.assign({},localWins?L.vision:R.vision,
    {text:pref((L.vision||{}).text,(R.vision||{}).text)});
  base.profile=localWins?L.profile:R.profile;
  /* 기기 전용 설정은 이 기기 것을 지킨다 */
  base.settings=Object.assign({},base.settings,{
    gClientId:(L.settings||{}).gClientId, gcalId:(L.settings||{}).gcalId,
    autoCloud:(L.settings||{}).autoCloud, utShow:(L.settings||{}).utShow, utOpen:(L.settings||{}).utOpen});
  base.meta=Object.assign({},base.meta,{
    devId:(L.meta||{}).devId, rev:Math.max((L.meta||{}).rev||0,(R.meta||{}).rev||0),
    updatedAt:Math.max(lu,ru), lastBackup:(L.meta||{}).lastBackup||(R.meta||{}).lastBackup||''});
  base.view=L.view; base.ui=L.ui;
  return base;}

/* ---- 업로드 ---- */
async function cloudPut(content){
  if(!cloudFileId){const f=await driveFind(); if(f)cloudFileId=f.id;}
  if(cloudFileId){
    await gFetch('https://www.googleapis.com/upload/drive/v3/files/'+cloudFileId+'?uploadType=media',
      {method:'PATCH',headers:{'Content-Type':'application/json'},body:content});
  }else{
    const boundary='diarybnd'+Math.abs(0|(performance.now()));
    const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+
      JSON.stringify({name:CLOUD_NAME,parents:['appDataFolder']})+'\r\n--'+boundary+
      '\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+boundary+'--';
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {method:'POST',headers:{'Authorization':'Bearer '+GCAL.token,'Content-Type':'multipart/related; boundary='+boundary},body:body});
    if(!r.ok){const t=await r.text();url_hint_last='drive';throw gApiError(r.status,t);}
    const j=await r.json(); cloudFileId=j.id;
  }}

/* ---- 핵심: 맞추기(내려받아 병합 → 올리기) ---- */
async function cloudSync(silent){
  if(!gTokenValid()){ setCloudState('auth'); if(!silent)toast('먼저 구글 로그인이 필요합니다'); return false; }
  if(CLOUD.busy)return false;
  CLOUD.busy=true; setCloudState('sync');
  try{
    const f=await driveFind();
    let merged=false;
    if(f){
      cloudFileId=f.id;
      const remote=await gFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media');
      if(remote&&typeof remote==='object'&&remote.days){
        const before=JSON.stringify({d:S.days,w:S.weeks,m:S.months,h:S.habits,r:S.reading,i:S.ideas,a:S.annual,l:S.lifemap,v:S.vision});
        S=mergeState(S,remote); migrate();
        const after=JSON.stringify({d:S.days,w:S.weeks,m:S.months,h:S.habits,r:S.reading,i:S.ideas,a:S.annual,l:S.lifemap,v:S.vision});
        merged=(before!==after);
      }
    }
    S.meta.rev=(S.meta.rev||0)+1;
    S.meta.syncedRev=S.meta.rev;
    await cloudPut(JSON.stringify(S));
    const f2=await driveFind(); CLOUD.mtime=(f2&&f2.modifiedTime)||'';
    S.settings.cloudSyncedAt=new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    STAMP={days:{},weeks:{},months:{},rest:'',init:false}; stampTick();   /* 도장 캐시 재설정 */
    CLOUD.ready=true; DIRTY=false; setCloudState('ok');
    if(merged){ renderNav(); render(); refreshWho();
      if(!silent)toast('☁ 다른 기기의 기록과 합쳤습니다 — 최신 상태입니다');
      else toast('☁ 다른 기기의 기록을 가져와 합쳤습니다'); }
    else if(!silent)toast('☁ 최신 상태입니다');
    return true;
  }catch(e){ setCloudState('err'); if(!silent)gReport('동기화 실패',e); return false; }
  finally{ CLOUD.busy=false; }}

/* ---- 자동 저장(가벼운 올리기). 클라우드가 그새 바뀌었으면 전체 맞추기로 전환 ---- */
async function cloudPush(){
  if(!(S.settings&&S.settings.autoCloud))return;
  if(!gTokenValid()||!CLOUD.ready||CLOUD.busy)return;
  CLOUD.busy=true; setCloudState('sync');
  try{
    const f=await driveFind();
    if(f&&CLOUD.mtime&&f.modifiedTime!==CLOUD.mtime){    /* 다른 기기가 먼저 올렸다 → 병합 경로 */
      CLOUD.busy=false; await cloudSync(true); return;
    }
    if(f)cloudFileId=f.id;
    S.meta.rev=(S.meta.rev||0)+1;
    await cloudPut(JSON.stringify(S));
    const f2=await driveFind(); CLOUD.mtime=(f2&&f2.modifiedTime)||'';
    S.settings.cloudSyncedAt=new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    DIRTY=false; setCloudState('ok');
  }catch(e){ setCloudState('err'); }
  finally{ CLOUD.busy=false; }}

/* ---- 상태 칩 ---- */
function setCloudState(s){CLOUD.state=s;paintCloud();}
function cloudChipText(){
  if(!(S.settings&&S.settings.gClientId))return {t:'☁ 동기화 꺼짐',c:'#9aa3af',tip:'구글 연동에서 설정하면 기기 간에 같은 기록을 씁니다'};
  switch(CLOUD.state){
    case 'sync':return {t:'☁ 맞추는 중…',c:'#2f6db3',tip:''};
    case 'ok':{const t=S.settings.cloudSyncedAt?new Date(S.settings.cloudSyncedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
      return {t:'☁ 최신 '+t,c:'#12a594',tip:'이 기기와 클라우드가 같은 내용입니다'};}
    case 'err':return {t:'☁ 동기화 실패 · 다시',c:'#d1495b',tip:'눌러서 다시 시도'};
    case 'auth':return {t:'☁ 로그인하고 맞추기',c:'#c98a1a',tip:'다른 기기에서 쓴 내용을 먼저 가져옵니다'};
    default:return {t:'☁ 맞추기',c:'#c98a1a',tip:'다른 기기에서 쓴 내용을 먼저 가져옵니다'};
  }}
function paintCloud(){
  const el=document.getElementById('cloudchip'); if(!el)return;
  const c=cloudChipText();
  el.textContent=c.t; el.title=c.tip; el.style.color=c.c; el.style.borderColor=c.c+'55';
  el.classList.toggle('busy',CLOUD.state==='sync');}
function cloudChipClick(){
  if(!(S.settings&&S.settings.gClientId)){go('gsync');return;}
  if(!gTokenValid()){gSignIn();return;}
  cloudSync(false);}

/* ---- 열 때 조용히 로그인 시도 → 성공하면 곧바로 맞추기 ---- */
function cloudAutoOpen(){
  if(!(S.settings&&S.settings.gClientId))return;
  if(!(S.settings.autoCloud||S.settings.cloudSyncedAt))return;   /* 한 번이라도 클라우드를 쓴 사람만 */
  setCloudState('auth'); GCAL.quiet=true;
  setTimeout(()=>{GCAL.quiet=false;},15000);
  try{ gInit(()=>{ try{ GCAL.silent=true; if(GCAL.tc)GCAL.tc.requestAccessToken({prompt:''}); }catch(e){GCAL.silent=false;} }); }catch(e){}}

/* ---- 다른 기기 기록이 더 최신일 수 있다는 안내 배너 ---- */
function syncBanner(){
  if(!(S.settings&&S.settings.gClientId))return '';
  if(CLOUD.ready||CLOUD.state==='ok')return '';
  const last=S.settings.cloudSyncedAt;
  if(!last)return '';
  return `<div class="rbanner no-print" style="background:linear-gradient(135deg,#c98a1a,#e0a52f)"><div>
    <div class="bt">☁ 다른 기기에서 쓴 내용이 있을 수 있습니다</div>
    <div class="bs">지금 화면은 <b>이 기기에 저장된 기록</b>입니다. 먼저 맞춘 뒤에 쓰셔야 안전합니다.
      (마지막 동기화 ${new Date(last).toLocaleString('ko-KR')})</div></div>
    <button onclick="cloudChipClick()">☁ 지금 맞추기</button></div>`;}


/* ============================================================
   ⑭ 수업 기록 (교사용 모듈) — 차시 누가기록을 다이어리 안으로
   ------------------------------------------------------------
   왜 합쳤는가:
   · 같은 수업을 '일간 계획 시간표'와 '차시 기록'에 두 번 적는 구조는 반드시 실패한다.
   · 수업은 교사의 하루에서 가장 자주 일어나는 실천이다 — 다이어리를 여는 가장 강한 이유.
   · 합치면 클라우드 동기화·백업·기기 간 병합이 그대로 따라온다.
   교사가 아닌 사용자에게는 보이지 않도록 기본은 꺼져 있다(S.klass.on).
   ============================================================ */
const KDOW=['','월','화','수','목','금'];
const KPAL=['#5b53b0','#1f9d8f','#2f6db3','#c98a1a','#b23a55','#6a4fbb','#2fa36b','#e0552e',
            '#0f9b9b','#cf6a2e','#7b5ea7','#3aa76d'];
const KPERIODS=[['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['12:00','12:50'],
                ['13:50','14:40'],['14:50','15:40'],['15:50','16:40']];
function kBlank(){return{on:false,importedAt:'',
  term:{name:'',start:'',end:''},
  periods:KPERIODS.map((x,i)=>({p:i+1,s:x[0],e:x[1]})),
  tt:[],colors:{},off:[],swap:[],logs:{},ui:{g:'',tab:'today'}};}
function kFix(){
  const b=kBlank(); const k=Object.assign(b,S.klass||{});
  k.term=Object.assign(b.term,k.term||{}); k.ui=Object.assign(b.ui,k.ui||{});
  if(!Array.isArray(k.periods)||!k.periods.length)k.periods=b.periods;
  k.periods=k.periods.map((p,i)=>({p:i+1,s:p.s||'09:00',e:p.e||'09:50'}));
  ['tt','off','swap'].forEach(f=>{if(!Array.isArray(k[f]))k[f]=[];});
  if(!k.colors||typeof k.colors!=='object')k.colors={};
  if(!k.logs||typeof k.logs!=='object')k.logs={};
  S.klass=k; return k;}
function K(){return S.klass||kFix();}
function kReady(){const k=K();return !!(k.term.start&&k.term.end&&k.tt.length);}
function kOn(){return !!(K().on&&kReady());}
function kPerOf(p){return K().periods.find(x=>x.p===p)||{p:p,s:'',e:''};}
function kOffMap(){const m={};(K().off||[]).forEach(o=>{if(o.d)m[o.d]=o.t||'휴업일';});return m;}
function kSwapMap(){const m={};(K().swap||[]).forEach(o=>{if(o.d&&o.use>=1&&o.use<=5)m[o.d]=o;});return m;}
function kGroups(){const k=K(),seen=[];
  k.tt.slice().sort((a,b)=>a.d-b.d||a.p-b.p).forEach(x=>{const n=(x.g||'').trim();if(n&&seen.indexOf(n)<0)seen.push(n);});
  return seen.sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));}
function kColor(g){const k=K(); if(k.colors[g])return k.colors[g];
  const i=kGroups().indexOf(g); return KPAL[(i<0?0:i)%KPAL.length];}

/* 차시 계산 — 같은 입력이면 다시 세지 않는다(시간표 렌더가 잦다) */
let KCACHE={sig:'',map:{}};
function kSig(){const k=K();return JSON.stringify([k.term,k.tt,k.off,k.swap,k.periods]);}
function kLessons(g){
  const sig=kSig(); if(KCACHE.sig!==sig){KCACHE={sig:sig,map:{}};}
  if(KCACHE.map[g])return KCACHE.map[g];
  const out=[],k=K();
  if(!kReady()){KCACHE.map[g]=out;return out;}
  const off=kOffMap(), sw=kSwapMap(), slots=k.tt.filter(x=>(x.g||'').trim()===g);
  if(!slots.length){KCACHE.map[g]=out;return out;}
  let d=k.term.start, guard=0, n=0;
  while(d<=k.term.end && guard++<2000){
    const real=parseD(d).getDay(), sp=sw[d], dow=sp?sp.use:real;
    if(dow>=1&&dow<=5&&!off[d]){
      slots.filter(x=>x.d===dow).sort((a,b)=>a.p-b.p).forEach(x=>{
        const pe=kPerOf(x.p); n++;
        out.push({no:n,date:d,p:x.p,room:x.room||'',g:g,start:pe.s,end:pe.e,
          key:g+'|'+d+'|'+x.p, swap:sp?{real:real,use:sp.use,t:sp.t||''}:null});});
    }
    d=addDays(d,1);
  }
  KCACHE.map[g]=out; return out;}
function kLessonsOn(d){const out=[];
  if(!kReady())return out;
  kGroups().forEach(g=>kLessons(g).forEach(x=>{if(x.date===d)out.push(x);}));
  return out.sort((a,b)=>a.p-b.p);}
function kFind(key){const g=String(key).split('|')[0];return kLessons(g).find(x=>x.key===key)||null;}
function kLog(key){const k=K(); if(!k.logs[key])k.logs[key]={done:false,prog:'',note:'',absent:''}; return k.logs[key];}
function kSetLog(key,f,v){kLog(key)[f]=v;save();}
function kToggleDone(key){const l=kLog(key);l.done=!l.done;if(l.done&&!l.at)l.at=today();save();render();}
function kProgress(g){const ls=kLessons(g),k=K();
  const done=ls.filter(x=>(k.logs[x.key]||{}).done).length;
  return {done,total:ls.length,pct:ls.length?Math.round(done/ls.length*100):0};}
function kNext(g){const t=today();return kLessons(g).find(x=>x.date>=t)||null;}

/* ── 차시 기록 모달 (시간표 블록·오늘 수업 어디서나 같은 창) ── */
function openLesson(key){
  const x=kFind(key); if(!x){toast('수업을 찾지 못했습니다');return;}
  const l=kLog(key);
  modalBox(`<h3 style="margin:0 0 4px">📚 ${esc(x.g)} <span class="tag" style="background:${kColor(x.g)}">${x.no}차시</span></h3>
    <div class="hint" style="margin-bottom:10px"><b>${x.date} (${wd(x.date)})</b> ${x.p}교시 ${x.start}–${x.end}
      ${x.room?' · '+esc(x.room):''}${x.swap?` · <span style="color:var(--gold);font-weight:800">${wd(x.date)}→${KDOW[x.swap.use]}요일 시간표</span>`:''}</div>
    <label class="fld"><span class="lb">진도 (단원 · 학습 내용)</span>
      <input type="text" id="klProg" value="${esc(l.prog||'')}" placeholder="예: 2단원 운동량 보존 — 충돌 실험"></label>
    <label class="fld"><span class="lb">수업 방법 · 특이사항</span>
      <textarea id="klNote" rows="3" placeholder="어떻게 했고, 무엇이 보였는가">${esc(l.note||'')}</textarea></label>
    <label class="fld"><span class="lb">결시 · 비고</span>

function kAddPeriod(){const k=K(),last=k.periods[k.periods.length-1]||{e:'09:00'};
  const m=toMin(last.e)+10, s=m2s(m), e=m2s(m+50);
  k.periods.push({p:k.periods.length+1,s:s,e:e});save();render();}
function kDelPeriod(){const k=K(),n=k.periods.length; if(n<=1){toast('최소 1교시는 있어야 합니다');return;}
  const used=k.tt.filter(x=>x.p===n).length;
  if(used&&!confirm(n+'교시에 입력된 수업 '+used+'칸도 함께 지워집니다. 계속할까요?'))return;
  k.tt=k.tt.filter(x=>x.p!==n);k.periods.pop();save();render();renderNav();}
function kCell(d,p){return K().tt.find(x=>x.d===d&&x.p===p)||null;}
function kSetCell(d,p,f,val){const k=K();val=(val||'').trim();let c=kCell(d,p);
  if(f==='g'){ if(!val){if(c)k.tt=k.tt.filter(x=>x!==c);} else {if(!c){c={d:d,p:p,g:val,room:''};k.tt.push(c);}else c.g=val;} }
  else { if(!c)return; c.room=val; }
  save();renderNav();render();}
function kRenderTT(){
  const t=document.getElementById('kttgrid'); if(!t)return; const k=K(),gs=kGroups();

   <tbody>${k.periods.map(pp=>`<tr><td class="ph"><b>${pp.p}교시</b><br><span class="hint">${pp.s}</span></td>
     ${[1,2,3,4,5].map(d=>{const c=kCell(d,pp.p);const col=c&&c.g?kColor(c.g.trim()):'transparent';
       return `<td class="tc" style="box-shadow:inset 4px 0 0 ${col}">
         <input type="text" list="kglist" value="${c?esc(c.g):''}" placeholder="—" onchange="kSetCell(${d},${pp.p},'g',this.value)">
         ${c?`<input type="text" class="rm" value="${esc(c.room||'')}" placeholder="교실" onchange="kSetCell(${d},${pp.p},'room',this.value)">`:''}
       </td>`;}).join('')}</tr>`).join('')}</tbody>`;
  let dl=document.getElementById('kglist');
  if(!dl){dl=document.createElement('datalist');dl.id='kglist';document.body.appendChild(dl);}
  dl.innerHTML=gs.map(g=>`<option value="${esc(g)}">`).join('');}
function kApplyPaste(){
  const box=document.getElementById('kpaste'); if(!box)return;
  const raw=box.value.replace(/\r/g,''); if(!raw.trim()){toast('붙여넣은 내용이 없습니다');return;}
  const k=K(), rows=raw.split('\n'); let n=0;
  rows.forEach((row,ri)=>{ if(ri>=k.periods.length)return;
    const cols=row.split(/\t|,/);
    for(let d=1;d<=5;d++){
      const cell=(cols[d-1]||'').replace(/\s+/g,' ').trim();
      let c=kCell(d,k.periods[ri].p);
      if(!cell){ if(c)k.tt=k.tt.filter(x=>x!==c); continue; }
      if(!c){k.tt.push({d:d,p:k.periods[ri].p,g:cell,room:''});} else c.g=cell;
      n++;}});
  save();renderNav();render();toast(n+'칸을 채웠습니다');}
function kRename(oldN,newN){newN=(newN||'').trim(); if(!newN||newN===oldN)return; const k=K();
  k.tt.forEach(x=>{if((x.g||'').trim()===oldN)x.g=newN;});
  const nl={};Object.keys(k.logs).forEach(key=>{const p=key.split('|');if(p[0]===oldN)p[0]=newN;nl[p.join('|')]=k.logs[key];});
  k.logs=nl; if(k.colors[oldN]){k.colors[newN]=k.colors[oldN];delete k.colors[oldN];}
  if(k.ui.g===oldN)k.ui.g=newN; save();renderNav();render();
  toast('«'+oldN+'» → «'+newN+'» — 기록도 함께 옮겼습니다');}
function kRenderOff(){const el=document.getElementById('koff'); if(!el)return;
  const off=(K().off||[]).slice().sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  el.innerHTML=off.length?off.map((o,i)=>`<div class="row-item">
    <input type="date" style="max-width:165px" value="${o.d}" onchange="kEditOff(${i},'d',this.value)">
    <span class="hint" style="flex:none;width:24px;padding-top:8px">${o.d?wd(o.d):''}</span>
    <input type="text" value="${esc(o.t||'')}" onchange="kEditOff(${i},'t',this.value)">
    <button class="del-x" onclick="kDelOff(${i})">✕</button></div>`).join('')
    :'<p class="hint">등록된 휴업일이 없습니다.</p>';}
function kOffIdx(i){const o=(K().off||[]).slice().sort((a,b)=>String(a.d).localeCompare(String(b.d)));return K().off.indexOf(o[i]);}
function kEditOff(i,f,v){const j=kOffIdx(i);if(j<0)return;K().off[j][f]=v;save();render();}
function kDelOff(i){const j=kOffIdx(i);if(j<0)return;K().off.splice(j,1);save();render();}
function kAddOff(d,t,quiet){
  d=d||(document.getElementById('koffd')||{}).value;
  t=t||((document.getElementById('kofft')||{}).value||'').trim();
  if(!d){toast('날짜를 고르세요');return false;}
  if((K().off||[]).some(o=>o.d===d)){if(!quiet)toast('이미 등록된 날짜입니다');return false;}
  K().off.push({d:d,t:t||'휴업일'});
  if(!quiet){save();render();toast(d+' 추가 — 이후 차시가 조정되었습니다');}
  return true;}
function kAddRange(){
  const a=prompt('시작 날짜 (YYYY-MM-DD)');if(!a)return;
  const b=prompt('끝 날짜 (YYYY-MM-DD)',a);if(!b)return;
  const t=prompt('사유','지필평가')||'휴업일';
  if(!/^\d{4}-\d{2}-\d{2}$/.test(a)||!/^\d{4}-\d{2}-\d{2}$/.test(b)){toast('날짜 형식이 올바르지 않습니다');return;}
  let d=a,n=0,g=0;
  while(d<=b&&g++<400){const w=parseD(d).getDay(); if(w>=1&&w<=5&&kAddOff(d,t,true))n++; d=addDays(d,1);}
  save();render();toast(n+'일을 휴업일로 추가했습니다');}
function kRenderSwap(){const el=document.getElementById('kswap'); if(!el)return;
  const sw=(K().swap||[]).slice().sort((a,b)=>String(a.d).localeCompare(String(b.d)));
  el.innerHTML=sw.length?sw.map((o,i)=>`<div class="row-item">
    <input type="date" style="max-width:165px" value="${o.d}" onchange="kEditSwap(${i},'d',this.value)">
    <span class="hint" style="flex:none;width:52px;padding-top:8px">${o.d?wd(o.d)+' →':''}</span>
    <select style="max-width:140px" onchange="kEditSwap(${i},'use',parseInt(this.value,10))">
      ${[1,2,3,4,5].map(d=>`<option value="${d}" ${o.use===d?'selected':''}>${KDOW[d]}요일</option>`).join('')}</select>
    <input type="text" value="${esc(o.t||'')}" onchange="kEditSwap(${i},'t',this.value)">
    <button class="del-x" onclick="kDelSwap(${i})">✕</button></div>`).join('')
    :'<p class="hint">등록된 요일 교체가 없습니다.</p>';}
function kSwapIdx(i){const o=(K().swap||[]).slice().sort((a,b)=>String(a.d).localeCompare(String(b.d)));return K().swap.indexOf(o[i]);}
function kEditSwap(i,f,v){const j=kSwapIdx(i);if(j<0)return;K().swap[j][f]=v;save();render();}
function kDelSwap(i){const j=kSwapIdx(i);if(j<0)return;K().swap.splice(j,1);save();render();}
function kAddSwap(d,use,t,quiet){
  d=d||(document.getElementById('kswd')||{}).value;
  use=use||parseInt((document.getElementById('kswu')||{}).value||'1',10);
  t=t||((document.getElementById('kswt')||{}).value||'').trim();
  if(!d){toast('날짜를 고르세요');return false;}
  if((K().swap||[]).some(o=>o.d===d)){if(!quiet)toast('이미 등록된 날짜입니다');return false;}
  K().swap.push({d:d,use:use,t:t});
  if(!quiet){save();render();toast(d+' → '+KDOW[use]+'요일 시간표로 운영합니다');}
  return true;}

/* ── 주고받기 ── */
function kCsvCell(s){s=String(s==null?'':s);return /[",\n]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;}
function kExportCSV(){
  const k=K(), gs=kGroups(); if(!gs.length){toast('시간표를 먼저 넣으세요');return;}
  const rows=[['교사',S.profile.name||'','학기',k.term.name||''],[],
    ['반·강좌','차시','날짜','요일','교시','시작','종료','장소','진도','수업 방법·특이사항','결시·비고','완료']];
  gs.forEach(g=>kLessons(g).forEach(x=>{const l=k.logs[x.key]||{};
    rows.push([g,x.no,x.date,wd(x.date)+(x.swap?'('+KDOW[x.swap.use]+'시간표)':''),x.p+'교시',x.start,x.end,x.room||'',
      l.prog||'',l.note||'',l.absent||'',l.done?'O':'']);}));
  const csv='﻿'+rows.map(r=>r.map(kCsvCell).join(',')).join('\r\n');
  const b=new Blob([csv],{type:'text/csv;charset=utf-8;'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='차시누가기록_'+today()+'.csv';a.click();toast('CSV로 내려받았습니다');}
function kExportJSON(){
  const k=K();
  const out={meta:{savedAt:new Date().toLocaleString('ko-KR'),v:2},
    school:{name:'',teacher:S.profile.name||''},
    term:k.term,periods:k.periods,tt:k.tt,colors:k.colors,off:k.off,swap:k.swap,logs:k.logs,
    view:'today',ui:{g:k.ui.g||''}};
  const b=new Blob([JSON.stringify(out,null,2)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='수업차시누가기록_백업_'+today()+'.json';a.click();
  toast('수업차시누가기록 앱에서 열 수 있는 파일로 내려받았습니다');}
function kImportJSON(e){
  const f=e.target.files[0]; if(!f)return;
  const r=new FileReader();
  r.onload=()=>{ try{
      const j=JSON.parse(r.result);
      if(!j||!j.tt)throw new Error('형식');
      const k=K();
      if((k.tt||[]).length&&!confirm('지금 들어 있는 시간표·학사일정·차시 기록을 가져온 파일로 바꿉니다. 계속할까요?'))return;
      k.term=Object.assign({name:'',start:'',end:''},j.term||{});
      if(Array.isArray(j.periods)&&j.periods.length)k.periods=j.periods.map((p,i)=>({p:i+1,s:p.s||'09:00',e:p.e||'09:50'}));
      k.tt=Array.isArray(j.tt)?j.tt:[]; k.colors=j.colors||{};
      k.off=Array.isArray(j.off)?j.off:[]; k.swap=Array.isArray(j.swap)?j.swap:[];
      k.logs=j.logs||{}; k.on=true; k.importedAt=new Date().toISOString();
      KCACHE={sig:'',map:{}}; save(); renderNav(); render();
      toast('수업 기록을 가져왔습니다 — 반 '+kGroups().length+'개');
    }catch(err){ alert('가져오기 실패: 수업차시누가기록 백업 파일이 맞는지 확인해 주세요.'); } };
  r.readAsText(f); e.target.value='';}

/* ── 다른 화면과의 연결 ── */
function kScheduleBlocks(d){                      /* 일간 계획 시간표에 얹을 수업 블록 */
  if(!kOn())return [];
  return kLessonsOn(d).map(x=>{
    const l=K().logs[x.key]||{}, base=kColor(x.g), c=blockColors(base,!!l.done);
    return {sm:toMin(x.start),em:toMin(x.end),build:st=>`<div class="ev kl" onclick="openLesson('${esc(x.key)}')"
      title="${esc(x.g)} ${x.no}차시${l.prog?' — '+esc(l.prog):''}"
      style="${st};background:${c.bg};color:${c.fg};border:2px solid ${base};cursor:pointer">
      <span class="klno" style="background:${base}">${x.no}</span>
      <span class="tm" style="color:${c.fg}">${x.start} · ${x.p}교시${l.done?' ✓':''}</span>
      <span class="ttl" style="${l.done?DONE_BLK:''}">${esc(x.g)}</span>
      ${l.prog?`<span class="klp">${esc(l.prog)}</span>`:''}</div>`};
  });}
function kTodayCard(){                            /* 대시보드·일간 계획용 요약 */
  if(!kOn())return '';
  const d=today(), ls=kLessonsOn(d); if(!ls.length)return '';
  const k=K(), done=ls.filter(x=>(k.logs[x.key]||{}).done).length;
  const sp=kSwapMap()[d];
  return `<div class="card"><h3>📚 오늘 수업 <span class="hint">(${done}/${ls.length} 기록)</span></h3>
    ${sp?`<div class="callout co-gold" style="margin:0 0 10px">⚠ 오늘은 <b>${wd(d)}요일이지만 ${KDOW[sp.use]}요일 시간표</b>입니다.</div>`:''}
    ${ls.map(x=>{const l=k.logs[x.key]||{};
      return `<div class="memoline" style="cursor:pointer" onclick="openLesson('${esc(x.key)}')">
        <span class="mt">${x.p}교시 ${x.start}</span>
        <span class="mh" style="border-color:${kColor(x.g)}"><b style="color:${kColor(x.g)}">${esc(x.g)}</b> ${x.no}차시</span>
        <span class="mm">${l.prog?esc(l.prog):'<span class="hint">진도를 적어주세요</span>'}</span>
        <span class="chk ${l.done?'on':''}" style="pointer-events:none">${l.done?'✓':'✎'}</span></div>`;}).join('')}
    <div style="margin-top:8px" class="no-print"><button class="btn ghost sm" onclick="go('klass')">수업 기록 열기 →</button></div>
  </div>`;}
function kReviewCard(){                           /* 주간 회고용 */
  if(!kOn())return '';
  const rows=kGroups().map(g=>({g,...kProgress(g)}));
  const tot=rows.reduce((a,r)=>({d:a.d+r.done,t:a.t+r.total}),{d:0,t:0});
  const ws=weekStart(today()); let wDone=0,wTot=0;
  const k=K();
  kGroups().forEach(g=>kLessons(g).forEach(x=>{
    if(x.date>=ws&&x.date<=addDays(ws,6)){wTot++;if((k.logs[x.key]||{}).done)wDone++;}}));
  return `<div class="card"><h3>📚 수업 진도 <span class="hint">(이번 주 ${wDone}/${wTot} · 학기 누적 ${tot.d}/${tot.t})</span></h3>
    ${rows.map(r=>`<div class="balrow"><div class="bn" title="${esc(r.g)}">${esc(r.g)}</div>
      <div class="bb"><i style="width:${r.pct}%;background:${kColor(r.g)}"></i></div>
      <div class="bv">${r.done}/${r.total}</div></div>`).join('')}
    <p class="hint" style="margin-top:8px">기록이 비어 있는 차시는 학기 말 진도표와 세특을 쓸 때 그대로 빈칸이 됩니다.
      ${wTot>wDone?`이번 주에 <b>${wTot-wDone}차시</b>가 비어 있습니다.`:'이번 주는 모두 채워져 있습니다.'}</p>
    <div style="margin-top:8px" class="no-print"><button class="btn ghost sm" onclick="go('klass')">수업 기록 열기 →</button></div></div>`;}

/* ============ INIT ============ */
(function init(){const had=load();if(!S.view)S.view='dash';
  (S.profile.roles||[]).forEach((r,i)=>{if(!r.color)r.color=ROLE_COLOR_MAP[r.name]||ROLE_PALETTE[i%ROLE_PALETTE.length];});
  pwaInit();
  /* 하루 첫 방문이면 3분 리추얼로 바로 들어간다 — '무엇부터 할까'라는 결정 비용을 0으로. */
  try{
    if(had && S.settings.autoRitual!==false){
      const m=ritualMode(), k=today()+m;
      if(S.meta.lastAutoRitual!==k && !ritualDone(today(),m)){
        S.meta.lastAutoRitual=k; S.view='checkin'; RIT={mode:m,step:0,d:today()};
      }
    }
  }catch(e){}
  renderNav();render();refreshWho();setSave(had?'불러옴 · '+(S.meta.savedAt||''):'자동저장 켜짐');
  try{stampTick();}catch(e){}          /* 도장 캐시 초기화 (첫 호출은 기록만) */
  try{utInit();}catch(e){}
  try{paintCloud();cloudAutoOpen();}catch(e){}
  checkReminders();setInterval(checkReminders,30000);
  let rz=null;window.addEventListener('resize',()=>{clearTimeout(rz);rz=setTimeout(alignPanels,120);});})();
</script>
