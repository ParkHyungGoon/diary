<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>나의 인생·실천 다이어리 (구글 연동)</title>
<style>
  :root{
    --bg:#f5f6fa;--card:#fff;--ink:#20242e;--muted:#6b7280;--line:#e6e8ef;
    --brand:#5b53b0;--brand-d:#403a86;--brand-soft:#eeecfa;
    --accent:#1f9d8f;--accent-soft:#e5f6f3;--gold:#c98a1a;
    --done:#12a594;--prog:#2f6db3;--hold:#e0a52f;--drop:#9aa3af;--del:#d1495b;
    --shadow:0 2px 10px rgba(30,25,60,.06),0 10px 30px rgba(30,25,60,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  /* layout */
  .app{display:flex;min-height:100vh}
  .side{width:210px;flex:none;background:linear-gradient(180deg,#403a86,#2c2860);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .logo{font-size:16px;font-weight:800;padding:6px 8px 12px;line-height:1.3}
  .side .logo small{display:block;font-weight:500;opacity:.7;font-size:11px;margin-top:3px}
  .side .grp{font-size:10.5px;font-weight:700;letter-spacing:1px;opacity:.55;margin:14px 8px 5px}
  .navi{display:block;width:100%;text-align:left;border:none;background:transparent;color:#e7e5f5;
    padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:2px}
  .navi:hover{background:rgba(255,255,255,.1)}
  .navi.on{background:#fff;color:var(--brand-d);font-weight:800}
  .navi .em{margin-right:8px}
  .main{flex:1;min-width:0}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;flex-wrap:wrap;gap:8px}
  .topbar .who{font-size:13px;color:var(--muted)}
  .topbar .who b{color:var(--ink)}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tbtn{background:var(--brand-soft);color:var(--brand-d);border:1px solid #ddd8f5;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .tbtn:hover{background:#e2ddf7}
  .save{font-size:11px;color:var(--muted);align-self:center}
  .wrap{padding:22px 24px 80px;max-width:1000px}
  @media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}
    .side .logo{width:100%}.side .grp{display:none}.navi{width:auto;margin:0}.wrap{padding:16px 14px 70px}}

  h2.vh{font-size:22px;margin:0 0 4px;font-weight:800}
  .vsub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .step-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--brand);border-radius:6px;padding:2px 9px;margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:16px;font-weight:800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
  label.fld{display:block;margin-bottom:12px}
  label.fld .lb{display:block;font-size:12.5px;font-weight:700;color:var(--brand-d);margin-bottom:4px}
  .hint{font-weight:500;color:var(--muted);font-size:11.5px}
  input[type=text],input[type=number],input[type=time],input[type=date],input[type=datetime-local],input[type=month],input[type=week],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#fdfdff}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,83,176,.13)}
  textarea{resize:vertical;min-height:60px}
  .btn{background:var(--brand);color:#fff;border:none;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand-d);border:1px solid #ddd8f5}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.acc{background:var(--accent)} .btn.acc:hover{filter:brightness(.92)}
  .row-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .row-item input,.row-item select,.row-item textarea{flex:1}
  .del-x{border:none;background:transparent;color:#c2c7d6;cursor:pointer;font-size:15px;font-weight:800;padding:2px 4px}
  .del-x:hover{color:var(--del)}
  .callout{border-radius:12px;padding:14px 16px;font-size:13.5px;border:1px solid;margin:0 0 16px}
  .co-brand{background:var(--brand-soft);border-color:#ddd8f5}
  .co-acc{background:var(--accent-soft);border-color:#c4e8e2}
  .co-gold{background:#fbf3e2;border-color:#f0e0b8}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--brand);border-radius:5px;padding:2px 8px;margin-bottom:6px}
  .co-acc .tag{background:var(--accent)} .co-gold .tag{background:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .mini{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
  .foot-nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}

  /* quote */
  .quote{background:linear-gradient(135deg,var(--brand-soft),var(--accent-soft));border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .quote .qk{font-size:10.5px;font-weight:800;color:var(--brand);letter-spacing:.5px}
  .quote .qen{font-size:16px;font-weight:700;font-style:italic;color:var(--brand-d);margin-top:5px;line-height:1.5}
  .quote .qko{font-size:14px;margin-top:6px}
  .quote .qby{font-size:12px;color:var(--muted);margin-top:5px}
  .quote .qword{font-size:12.5px;color:var(--brand-d);background:rgba(255,255,255,.6);border-radius:6px;padding:5px 9px;margin-top:8px;font-weight:600}
  .quote .qbtns{margin-top:9px}

  /* tasks */
  .task{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:9px;border:1px solid transparent;margin-bottom:4px}
  .task.s-todo{border-bottom:1px dashed var(--line);border-radius:0}
  .task.s-done{background:#e6f6ee;border-color:#bfe6d4}
  .task.s-prog{background:#e9f1fb;border-color:#cfe0f2}
  .task.s-hold{background:#fdf6e3;border-color:#f0dfa8}
  .task.s-deleg{background:#f1f0fb;border-color:#d8d4f2}
  .task.s-drop{background:#f3f4f6;border-color:#e2e5ea}
  .task .pri{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
  .pri.A{background:#d1495b} .pri.B{background:#e0a52f} .pri.C{background:#7c8798}
  .task .txt{flex:1;font-size:13.5px}
  .task .txt .role{font-size:10px;color:#fff;background:var(--brand);border-radius:4px;padding:1px 6px;margin-right:5px;font-weight:700}
  .task.s-done .txt,.task.s-drop .txt{color:var(--muted);text-decoration:line-through}
  .stsel{flex:none;width:auto;font-size:11px;padding:3px 5px;border-radius:6px;border:1px solid var(--line);background:#fff}
  .addrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .addrow input{flex:1;min-width:120px}

  table.cal{width:100%;border-collapse:collapse;table-layout:fixed}
  table.cal th{font-size:11.5px;color:var(--muted);padding:5px;font-weight:700}
  table.cal td{border:1px solid var(--line);height:74px;vertical-align:top;padding:4px 5px;cursor:pointer;border-radius:6px}
  table.cal td:hover{background:var(--brand-soft)}
  table.cal td.oth{background:#fafafe;color:#c2c7d6}
  table.cal td.today{outline:2px solid var(--brand);outline-offset:-2px}
  table.cal .dn{font-size:12px;font-weight:700}
  table.cal .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:1px}
  table.cal .mini-goal{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;max-height:28px}

  .habgrid{overflow-x:auto}
  table.hab{border-collapse:collapse;font-size:11px;min-width:100%}
  table.hab th,table.hab td{border:1px solid var(--line);padding:3px;text-align:center;min-width:22px}
  table.hab td.name{text-align:left;font-weight:700;white-space:nowrap;padding:4px 8px;position:sticky;left:0;background:#fff}
  table.hab .hc{cursor:pointer}
  table.hab .hc.on{background:var(--accent);color:#fff}

  .sched{display:grid;grid-template-columns:52px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .sched .h{border-top:1px solid var(--line);padding:6px 8px;font-size:11.5px;color:var(--muted);font-weight:700;background:#fafafe}
  .sched .c{border-top:1px solid var(--line);padding:0}
  .sched .c input{border:none;border-radius:0;background:transparent;font-size:12.5px;padding:6px 8px}
  .sched>div:nth-child(1),.sched>div:nth-child(2){border-top:none}
  .gcal{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .gcal .lines{position:absolute;inset:0}
  .gcal .hr{height:40px;border-top:1px solid #eef1f5;position:relative}
  .gcal .hr:first-child{border-top:none}
  .gcal .hrlab{position:absolute;left:4px;top:-1px;font-size:10px;color:#9aa3af}
  .gcal .lane{position:absolute;left:46px;right:6px;top:0;bottom:0}
  .gcal .ev{position:absolute;border-radius:6px;padding:2px 16px 2px 6px;font-size:11px;color:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);line-height:1.25}
  .gcal .ev .tm{font-size:9.5px;opacity:.92;display:block;padding-right:2px}
  .gcal .ev.g{background:#e8eaed;color:#3c4043;border:1px dashed #9aa3af}
  .gcal .ev.rec{box-shadow:inset 3px 0 0 rgba(255,255,255,.75),0 1px 3px rgba(0,0,0,.18)}
  .gcal .ev.tk{border:1px dashed rgba(255,255,255,.9)}
  .task .ttime{display:inline-block;margin-left:6px;font-size:10.5px;color:#fff;background:#8792a3;border-radius:5px;padding:1px 6px;font-weight:700;white-space:nowrap}
  .gcal .ev .evx{position:absolute;z-index:3;top:0;right:0;background:rgba(0,0,0,.14);border:none;border-radius:0 5px 0 6px;color:#fff;cursor:pointer;font-size:12px;font-weight:800;padding:1px 5px;line-height:1.1}
  .gcal .ev .evx:hover{background:rgba(0,0,0,.3)}
  .synchint{font-size:11.5px;color:var(--muted)}

  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
  .stat .s .n{font-size:26px;font-weight:800;color:var(--brand)}
  .stat .s .l{font-size:12px;color:var(--muted);margin-top:2px}
  .bar{height:14px;background:#eceef3;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}

  .list-item{border:1px solid var(--line);border-radius:11px;padding:12px 14px;margin-bottom:10px;background:#fff}
  .list-item .li-h{display:flex;justify-content:space-between;gap:8px}
  .list-item .li-t{font-weight:800;font-size:14px}
  .list-item .li-m{font-size:11.5px;color:var(--muted)}
  .stars{color:var(--gold);font-size:13px}

  /* timer */
  .disc{position:relative;width:250px;height:250px;margin:2px auto 10px}
  .disc .center{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
  .disc .time{font-size:44px;font-weight:800;font-variant-numeric:tabular-nums}
  .disc .pl{font-size:13px;font-weight:800;margin-top:2px}
  .modeseg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-bottom:12px}
  .modeseg button{border:none;background:#fff;padding:8px 15px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--muted)}
  .modeseg button.on{background:var(--brand);color:#fff}
  .tmc{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-top:4px}
  .presets{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:10px}
  .presets button{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 11px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit;color:var(--brand-d)}

  #toast{position:fixed;right:18px;bottom:18px;z-index:100;display:flex;flex-direction:column;gap:8px}
  #toast .t{background:#20242e;color:#fff;padding:11px 15px;border-radius:10px;font-size:13px;box-shadow:0 6px 20px rgba(0,0,0,.25);max-width:300px}

  @media print{
    .side,.topbar,.foot-nav,.addrow,.no-print,.del-x{display:none!important}
    .app{display:block}.wrap{max-width:none;padding:0}
    .card{box-shadow:none;break-inside:avoid}
    body{background:#fff}
  }
</style>
</head>
<body>
<div class="app">
  <nav class="side" id="side"></nav>
  <div class="main">
    <div class="topbar">
      <div class="who" id="who">이름을 설정하세요</div>
      <div class="tools">
        <span class="save" id="save"></span>
        <button class="tbtn" onclick="exportJSON()">💾 백업</button>
        <button class="tbtn" onclick="document.getElementById('imp').click()">📂 복원</button>
        <button class="tbtn" onclick="window.print()">🖨 인쇄/PDF</button>
        <input type="file" id="imp" accept="application/json" style="display:none" onchange="importJSON(event)">
      </div>
    </div>
    <div class="wrap"><div id="view"></div></div>
  </div>
</div>
<div id="toast"></div>

<script>
/* ============ QUOTES (영/한/단어/듣기) ============ */
const QUOTES=[
 {en:"The secret of getting ahead is getting started.",ko:"앞서 나가는 비결은 일단 시작하는 것이다.",by:"Mark Twain",k:"get ahead 앞서가다"},
 {en:"We are what we repeatedly do. Excellence, then, is not an act, but a habit.",ko:"우리는 반복하는 행동의 결과다. 탁월함은 행위가 아니라 습관이다.",by:"Will Durant",k:"excellence 탁월함"},
 {en:"The best way to predict the future is to create it.",ko:"미래를 예측하는 가장 좋은 방법은 미래를 만드는 것이다.",by:"Peter Drucker",k:"predict 예측하다"},
 {en:"What lies behind us and before us are tiny matters compared to what lies within us.",ko:"우리 뒤와 앞의 것은 우리 안의 것에 비하면 사소하다.",by:"R. W. Emerson",k:"lie within 내면에 있다"},
 {en:"Begin with the end in mind.",ko:"끝을 생각하며 시작하라.",by:"Stephen Covey",k:"in mind 마음에 두고"},
 {en:"The main thing is to keep the main thing the main thing.",ko:"가장 중요한 것은, 가장 중요한 것을 가장 중요하게 두는 것이다.",by:"Stephen Covey",k:"main thing 핵심"},
 {en:"Discipline is the bridge between goals and accomplishment.",ko:"자기 절제는 목표와 성취를 잇는 다리다.",by:"Jim Rohn",k:"accomplishment 성취"},
 {en:"Motivation is what gets you started. Habit is what keeps you going.",ko:"동기는 시작하게 하고, 습관은 계속하게 한다.",by:"Jim Ryun",k:"habit 습관"},
 {en:"Small disciplines repeated with consistency lead to great achievements.",ko:"일관된 작은 절제가 큰 성취로 이어진다.",by:"John C. Maxwell",k:"consistency 일관성"},
 {en:"Well done is better than well said.",ko:"말을 잘하는 것보다 실천을 잘하는 것이 낫다.",by:"Benjamin Franklin",k:"well done 잘 해낸"},
 {en:"By failing to prepare, you are preparing to fail.",ko:"준비에 실패하는 것은 곧 실패를 준비하는 것이다.",by:"Benjamin Franklin",k:"prepare 준비하다"},
 {en:"The mind is not a vessel to be filled but a fire to be kindled.",ko:"마음은 채워야 할 그릇이 아니라 지펴야 할 불꽃이다.",by:"Plutarch",k:"kindle 불붙이다"},
 {en:"Education is the most powerful weapon which you can use to change the world.",ko:"교육은 세상을 바꿀 수 있는 가장 강력한 무기다.",by:"Nelson Mandela",k:"weapon 무기"},
 {en:"It always seems impossible until it's done.",ko:"무엇이든 이루기 전까지는 늘 불가능해 보인다.",by:"Nelson Mandela",k:"impossible 불가능한"},
 {en:"Perseverance is not a long race; it is many short races one after another.",ko:"끈기란 하나의 긴 경주가 아니라, 이어지는 여러 짧은 경주다.",by:"Walter Elliot",k:"perseverance 끈기"},
 {en:"Our greatest glory is not in never falling, but in rising every time we fall.",ko:"가장 큰 영광은 넘어지지 않음이 아니라, 넘어질 때마다 일어섬에 있다.",by:"Confucius",k:"glory 영광"},
 {en:"It does not matter how slowly you go as long as you do not stop.",ko:"멈추지 않는 한, 아무리 천천히 가도 괜찮다.",by:"Confucius",k:"as long as ~하는 한"},
 {en:"The journey of a thousand miles begins with a single step.",ko:"천 리 길도 한 걸음부터 시작된다.",by:"Lao Tzu",k:"journey 여정"},
 {en:"Setting goals is the first step in turning the invisible into the visible.",ko:"목표를 세우는 것은 보이지 않는 것을 보이게 하는 첫걸음이다.",by:"Tony Robbins",k:"invisible 보이지 않는"},
 {en:"You miss 100% of the shots you don't take.",ko:"시도하지 않은 기회는 100퍼센트 놓친다.",by:"Wayne Gretzky",k:"miss 놓치다"},
 {en:"Fortune favors the prepared mind.",ko:"행운은 준비된 사람에게 미소 짓는다.",by:"Louis Pasteur",k:"favor 호의를 베풀다"},
 {en:"Strive not to be a success, but rather to be of value.",ko:"성공하려 애쓰기보다, 가치 있는 사람이 되려 애써라.",by:"Albert Einstein",k:"strive 애쓰다"},
 {en:"Continuous improvement is better than delayed perfection.",ko:"미뤄진 완벽보다 꾸준한 개선이 낫다.",by:"Mark Twain",k:"continuous 지속적인"},
 {en:"Live as if you were to die tomorrow. Learn as if you were to live forever.",ko:"내일 죽을 것처럼 살고, 영원히 살 것처럼 배워라.",by:"Mahatma Gandhi",k:"forever 영원히"},
 {en:"The future depends on what you do today.",ko:"미래는 오늘 당신이 하는 일에 달려 있다.",by:"Mahatma Gandhi",k:"depend on ~에 달려 있다"},
 {en:"Quality is not an act, it is a habit.",ko:"탁월함은 한 번의 행동이 아니라 습관이다.",by:"Aristotle",k:"quality 질, 우수함"},
 {en:"Knowing yourself is the beginning of all wisdom.",ko:"자신을 아는 것이 모든 지혜의 시작이다.",by:"Aristotle",k:"wisdom 지혜"},
 {en:"What we learn with pleasure we never forget.",ko:"즐겁게 배운 것은 결코 잊지 않는다.",by:"Alfred Mercier",k:"pleasure 즐거움"},
 {en:"He who has a why to live can bear almost any how.",ko:"살아야 할 이유가 있는 사람은 거의 어떤 방식도 견딘다.",by:"Friedrich Nietzsche",k:"bear 견디다"},
 {en:"Do not wait to strike till the iron is hot; but make it hot by striking.",ko:"쇠가 뜨거워질 때까지 기다리지 말고, 두드려서 뜨겁게 만들어라.",by:"W. B. Yeats",k:"strike 치다"},
 {en:"A goal without a plan is just a wish.",ko:"계획 없는 목표는 그저 소원일 뿐이다.",by:"Antoine de Saint-Exupery",k:"goal 목표"},

function quoteFor(dateStr){ const d=parseD(dateStr); const idx=Math.floor((d-new Date(d.getFullYear(),0,0))/864e5); return QUOTES[((idx%QUOTES.length)+QUOTES.length)%QUOTES.length]; }
function quoteCard(dateStr){ const q=quoteFor(dateStr);
  return `<div class="quote"><div class="qk">오늘의 명언 · QUOTE OF THE DAY</div>
   <div class="qen">"${q.en}"</div><div class="qko">"${q.ko}"</div><div class="qby">— ${q.by}</div>
   <div class="qword">🔑 오늘의 표현 · <b>${q.k}</b></div>
   <div class="qbtns"><button class="btn ghost sm" onclick="speak('${dateStr}')">🔊 영어 듣기</button></div></div>`; }
function speak(dateStr){ try{ const q=quoteFor(dateStr); if(!('speechSynthesis'in window))return; const u=new SpeechSynthesisUtterance(q.en); u.lang='en-US'; u.rate=0.92; speechSynthesis.cancel(); speechSynthesis.speak(u);}catch(e){} }

/* ============ DATE HELPERS ============ */
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){return new Date(s+'T00:00:00');}
function today(){return fmt(new Date());}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d);}
function wd(s){return ['일','월','화','수','목','금','토'][parseD(s).getDay()];}
function monthKey(s){return s.slice(0,7);}
function weekStart(s){const d=parseD(s);const g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);return fmt(d);} // Monday
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const w=document.getElementById('toast');const t=document.createElement('div');t.className='t';t.textContent=msg;w.appendChild(t);setTimeout(()=>t.remove(),4000);}

  v.innerHTML=`
   <h2 class="vh">🏠 오늘 · ${d} (${wd(d)})</h2>
   <p class="vsub">${esc(S.mission.statement||'사명을 설정해 보세요')}</p>

         <div class="chips">${S.habits.map(h=>`<span class="chip ${day.habits.includes(h.id)?'on':''}" onclick="toggleHabit('${d}','${h.id}')">${esc(h.name)}</span>`).join('')||'<span class="hint">습관을 등록하세요</span>'}</div>
       </div>
       <div class="card"><h3>다가오는 알림</h3>
         ${upNext.length? upNext.map(r=>`<div style="font-size:13px;margin:4px 0">🔔 <b>${r.dt.replace('T',' ')}</b> · ${esc(r.text)}</div>`).join('') : '<p class="hint">예정된 알림이 없습니다.</p>'}

function shiftDay(n){S.ui.day=addDays(S.ui.day,n);save();vDay(document.getElementById('view'));}
function openDay(ds){S.ui.day=ds;S.view='day';save();renderNav();render();window.scrollTo(0,0);}
const STATUSES=[["todo","○ 예정"],["prog","→ 진행"],["done","✓ 완료"],["hold","‖ 연기"],["deleg","» 위임"],["drop","✗ 취소"]];
function taskRow(d,i,t){
  return `<div class="task s-${t.status}">
    <div class="pri ${t.priority}">${t.priority}</div>
    <div class="txt">${t.role?`<span class="role" style="background:${roleColor(t.role)}">${esc(roleName(t.role))}</span>`:''}${esc(t.text)}${t.start?`<span class="ttime">🕘 ${t.start}${t.end?'–'+t.end:''}</span>`:''}</div>
    <button class="btn sm no-print" onclick="toggleTaskDone('${d}',${i})" title="완료" style="flex:none;padding:4px 9px;background:${t.status==='done'?'var(--done)':'#eef0f6'};color:${t.status==='done'?'#fff':'#66707f'}">✓</button>
    <select class="stsel no-print" onchange="setTaskStatus('${d}',${i},this.value)">${STATUSES.map(s=>`<option value="${s[0]}" ${t.status===s[0]?'selected':''}>${s[1]}</option>`).join('')}</select>
    <button class="del-x no-print" onclick="delTask('${d}',${i})">✕</button></div>`;
}
function renderTasks(d){const el=document.getElementById('tasks');if(!el)return;const day=S.days[d];
  if(!day.tasks.length){el.innerHTML='<p class="hint">할 일을 추가하세요. 가장 중요한 일부터 A로.</p>';return;}
  const order={A:0,B:1,C:2};
  day.tasks.sort((a,b)=>(order[a.priority]-order[b.priority]));
  el.innerHTML=day.tasks.map((t,i)=>taskRow(d,i,t)).join('');
}
function addTask(){const d=S.ui.day;const txt=document.getElementById('nttext').value.trim();if(!txt)return;
  const st=document.getElementById('ntstart').value, en=document.getElementById('ntend').value;
  const t={text:txt,priority:document.getElementById('ntpri').value,role:document.getElementById('ntrole').value,status:'todo'};
  if(st){t.start=st;t.end=(en&&toMin(en)>toMin(st))?en:addMinStr(st,60);}
  S.days[d].tasks.push(t);
  save();document.getElementById('nttext').value='';document.getElementById('ntstart').value='';document.getElementById('ntend').value='';renderTasks(d);renderSchedule(d);}
function setTaskStatus(d,i,st){S.days[d].tasks[i].status=st;save();renderTasks(d);}
function delTask(d,i){S.days[d].tasks.splice(i,1);save();renderTasks(d);}
function carryOver(d){const nd=addDays(d,1);ensureDay(nd);let moved=0;
  S.days[d].tasks.forEach(t=>{if(t.status!=='done'&&t.status!=='drop'){S.days[nd].tasks.push({...t,status:'todo'});moved++;}});
  save();toast(moved+'개 과제를 '+nd+'로 이월했습니다');}
const SC_START=5,SC_END=24,SC_H=40;
const EVCOL=['#5b53b0','#2f6db3','#1f9d8f','#c98a1a','#b23a55','#6a5acd'];
let gDayCache={};
function dayEvents(d){ensureDay(d);return S.days[d].events;}
function toMin(t){const p=t.split(':');return (+p[0])*60+(+p[1]);}
function addMinStr(t,mins){let m=Math.min(23*60+59,toMin(t)+mins);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function priColor(p){return p==='A'?'#d1495b':(p==='B'?'#e0a52f':'#2fa36b');}
const ROLE_COLOR_MAP={"교사·수업(물리)":"#2f6db3","수업":"#6a4fbb","학습공동체·연구":"#d1495b","가족·관계":"#2fa36b","자기계발·독서":"#e0552e","건강·자기돌봄":"#3aa76d"};
const ROLE_PALETTE=["#2f6db3","#6a4fbb","#d1495b","#2fa36b","#e0552e","#3aa76d","#c98a1a","#5b53b0"];
function hexRGB(h){h=(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(h.length<6)return[91,83,176];return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function roleColor(rid){const r=(S.profile.roles||[]).find(x=>x.id===rid);return (r&&r.color)||'#5b53b0';}
function blockColors(base,done){const c=hexRGB(base);return done?{bg:base,fg:'#fff'}:{bg:`rgba(${c[0]},${c[1]},${c[2]},0.16)`,fg:base};}
function toMinISO(iso){return toMin(iso.slice(11,16));}
function addEvent(d){const s=document.getElementById('evs').value,e=document.getElementById('eve').value,t=document.getElementById('evt').value.trim();
  const rep=(document.getElementById('evrep')||{}).value||'none';
  if(!s||!e||!t){toast('시작·종료 시간과 제목을 입력하세요');return;}
  if(toMin(e)<=toMin(s)){toast('종료 시간이 시작보다 늦어야 합니다');return;}
  const role=(document.getElementById('evrole')||{}).value||'';
  if(rep==='none'){const arr=dayEvents(d);arr.push({id:uid(),start:s,end:e,title:t,role:role});}
  else{if(!S.recurring)S.recurring=[];S.recurring.push({id:uid(),start:s,end:e,title:t,role:role,rule:rep,byday:parseD(d).getDay()});toast('반복 일정을 추가했습니다 ('+({daily:'매일',weekday:'평일',weekly:'매주 '+wd(d)+'요일'}[rep])+')');}
  save();document.getElementById('evt').value='';renderSchedule(d);}
function delEvent(d,id){S.days[d].events=dayEvents(d).filter(x=>x.id!==id);save();renderSchedule(d);}
function delRecur(id){if(!confirm('이 반복 일정을 삭제할까요? (모든 반복 날짜에서 사라집니다)'))return;S.recurring=(S.recurring||[]).filter(x=>x.id!==id);save();renderSchedule(S.ui.day);}
function toggleTaskDone(d,i){const t=S.days[d].tasks[i];if(!t)return;t.status=(t.status==='done')?'todo':'done';save();renderTasks(d);renderSchedule(d);}
function toggleEventDone(d,id){const ev=dayEvents(d).find(x=>x.id===id);if(!ev)return;ev.done=!ev.done;save();renderSchedule(d);}
function toggleRecDone(d,id){ensureDay(d);const a=S.days[d].recDone||(S.days[d].recDone=[]);const k=a.indexOf(id);if(k>=0)a.splice(k,1);else a.push(id);save();renderSchedule(d);}
function recForDay(d){const wn=parseD(d).getDay();return (S.recurring||[]).filter(r=> r.rule==='daily' || (r.rule==='weekday'&&wn>=1&&wn<=5) || (r.rule==='weekly'&&r.byday===wn));}
function blockStyle(sm,em,side){const top=Math.max(0,(sm-SC_START*60)/60*SC_H);const h=Math.max(15,(em-sm)/60*SC_H-2);
  const lr=side==='g'?'left:56%;right:1%':(side==='me'?'left:1%;right:45%':'left:1%;right:1%');return `top:${top}px;height:${h}px;${lr}`;}
function renderSchedule(d){const el=document.getElementById('gcal');if(!el)return;
  const gev=gDayCache[d]||[];const hasG=gev.length>0;const side=hasG?'me':'full';
  const items=dayEvents(d).map(ev=>({o:ev,rec:false})).concat(recForDay(d).map(r=>({o:r,rec:true})));
  const tks=(S.days[d].tasks||[]).map((t,i)=>({t,i})).filter(x=>x.t.start);
  const recDone=S.days[d].recDone||[];
  let lines='';for(let hr=SC_START;hr<SC_END;hr++)lines+=`<div class="hr"><span class="hrlab">${String(hr).padStart(2,'0')}:00</span></div>`;
  const mine=items.map(it=>{const ev=it.o;const isRec=it.rec;
    const base=ev.role?roleColor(ev.role):(ev.color||'#5b53b0');
    const done=isRec?recDone.includes(ev.id):!!ev.done; const c=blockColors(base,done);
    const tog=isRec?`toggleRecDone('${d}','${ev.id}')`:`toggleEventDone('${d}','${ev.id}')`;
    const del=isRec?`delRecur('${ev.id}')`:`delEvent('${d}','${ev.id}')`;
    return `<div class="ev${isRec?' rec':''}" style="${blockStyle(toMin(ev.start),toMin(ev.end),side)};background:${c.bg};color:${c.fg};border:2px solid ${base}">
      <button class="evx" style="color:${c.fg};right:19px" onclick="${tog}" title="완료">${done?'↺':'✓'}</button>
      <button class="evx" style="color:${c.fg}" onclick="${del}" title="삭제">✕</button>
      <span class="tm" style="color:${c.fg}">${ev.start}–${ev.end}${isRec?' ↻':''}${ev.gEventId?' ✓구글':''}</span><span style="${done?'text-decoration:line-through':''}">${esc(ev.title)}</span></div>`;}).join('');
  const tblocks=tks.map(({t,i})=>{const done=t.status==='done';const c=blockColors(roleColor(t.role),done);
    return `<div class="ev tk" style="${blockStyle(toMin(t.start),toMin(t.end||addMinStr(t.start,60)),side)};background:${c.bg};color:${c.fg};border:3px solid ${priColor(t.priority)}">
      <button class="evx" style="color:${c.fg}" onclick="toggleTaskDone('${d}',${i})" title="완료">${done?'↺':'✓'}</button>
      <span class="tm" style="color:${c.fg}">${t.start}–${t.end||''} · ${t.priority} 과제${t.gEventId?' ✓구글':''}</span><span style="${done?'text-decoration:line-through':''}">${esc(t.text)}</span></div>`;}).join('');
  const gg=gev.map(g=>`<div class="ev g" style="${blockStyle(g.sm,g.em,'g')}"><span class="tm">${g.t} · G</span>${esc(g.title)}</div>`).join('');
  el.style.height=((SC_END-SC_START)*SC_H)+'px';
  el.innerHTML=`<div class="lines">${lines}</div><div class="lane">${mine}${tblocks}</div>${hasG?`<div class="lane">${gg}</div>`:''}`;
  const sr=document.getElementById('syncrow');
  if(sr){const hasRec=(S.recurring||[]).some(r=>!r.gEventId);
    sr.innerHTML=gTokenValid()
    ? `<button class="btn ghost sm" onclick="pullDay('${d}')">↧ 구글 일정 불러오기</button> <button class="btn ghost sm" onclick="pushDay('${d}')">↥ 이 날 시간표 등록</button> ${(S.recurring||[]).length?`<button class="btn ghost sm" onclick="pushRecurring()">↻ 반복 일정 구글 등록</button>`:''} <span class="synchint">↻=반복 · 왼쪽=내 계획 · 오른쪽=구글</span>`
    : `<span class="synchint">구글과 주고받으려면 ‘🔗 구글 연동’ 탭에서 로그인하세요. (로그인 전에도 작성·저장·반복 설정은 됩니다)</span>`;}
}

let TM={mode:'pomo',phase:'focus',running:false,remaining:1500,total:1500,endAt:0,cycle:0,auto:true,cfg:{focus:25,short:5,long:15,longEvery:4},free:15};
let tmInt=null,AC=null;
function fmtT(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function phInfo(){if(TM.mode==='free')return{l:'집중',c:'#e0554f'};if(TM.phase==='focus')return{l:'집중 '+(TM.cycle+1),c:'#e0554f'};if(TM.phase==='long')return{l:'긴 휴식',c:'#2fa36b'};return{l:'휴식',c:'#2fa36b'};}
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{if(!AC)return;const n=AC.currentTime;[880,1174,880].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=n+i*.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.34,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.start(t);o.stop(t+.24);});}catch(e){}}
function tmSetMode(m){tmPause();TM.mode=m;if(m==='pomo'){TM.phase='focus';TM.cycle=0;TM.total=TM.cfg.focus*60;}else TM.total=TM.free*60;TM.remaining=TM.total;if(S.view==='timer')vTimer(document.getElementById('view'));}
function tmSetFree(min){tmPause();TM.mode='free';TM.free=min;TM.total=min*60;TM.remaining=min*60;tmDraw();tmRead();}
function tmToggle(){TM.running?tmPause():tmStart();}
function tmStart(){if(TM.running)return;ensureAudio();TM.running=true;TM.endAt=Date.now()+TM.remaining*1000;tmInt=setInterval(tmTick,200);tmBtn();}
function tmPause(){if(!TM.running)return;TM.running=false;TM.remaining=Math.max(0,(TM.endAt-Date.now())/1000);if(tmInt){clearInterval(tmInt);tmInt=null;}document.title='나의 인생·실천 다이어리';tmBtn();}
function tmReset(){tmPause();TM.remaining=TM.total;tmDraw();tmRead();}
function tmTick(){const r=(TM.endAt-Date.now())/1000;TM.remaining=r;if(r<=0){TM.remaining=0;tmDraw();tmRead();tmDone();return;}tmDraw();tmRead();document.title='⏱ '+fmtT(r)+' · '+phInfo().l;}
function tmDone(){if(tmInt){clearInterval(tmInt);tmInt=null;}TM.running=false;document.title='나의 인생·실천 다이어리';beep();let msg='';
  if(TM.mode==='pomo'){if(TM.phase==='focus'){addFocus(TM.cfg.focus);TM.cycle++;if(TM.cycle%TM.cfg.longEvery===0){TM.phase='long';TM.total=TM.cfg.long*60;msg='긴 휴식!';}else{TM.phase='short';TM.total=TM.cfg.short*60;msg='집중 완료! 휴식하세요.';}}else{TM.phase='focus';TM.total=TM.cfg.focus*60;msg='다시 집중!';}}
  else{addFocus(Math.round(TM.total/60));msg='집중 완료! 잘했어요.';}
  TM.remaining=TM.total;if(S.view==='timer')vTimer(document.getElementById('view'));toast('⏱ '+msg);if(TM.auto&&TM.mode==='pomo')tmStart();}
function addFocus(min){const d=today();S.focusLog[d]=(S.focusLog[d]||0)+min;save();}
function tmDraw(){const p=document.getElementById('discFill');if(!p)return;const f=TM.total?Math.max(0,Math.min(1,TM.remaining/TM.total)):0;const cx=125,cy=125,r=108;
  if(f>=.9999)p.setAttribute('d',`M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`);else if(f<=0)p.setAttribute('d','');
  else{const th=f*2*Math.PI,ex=cx+r*Math.sin(th),ey=cy-r*Math.cos(th),la=f>.5?1:0;p.setAttribute('d',`M ${cx} ${cy} L ${cx} ${cy-r} A ${r} ${r} 0 ${la} 1 ${ex.toFixed(2)} ${ey.toFixed(2)} Z`);}
  p.setAttribute('fill',phInfo().c);}
function tmRead(){const t=document.getElementById('discTime');if(t)t.textContent=fmtT(TM.remaining);const l=document.getElementById('discPl');if(l){const pi=phInfo();l.textContent=pi.l;l.style.color=pi.c;}}
function tmBtn(){const b=document.getElementById('tmToggle');if(b)b.textContent=TM.running?'⏸ 일시정지':'▶ 시작';}
function ticks(){let s='';const cx=125,cy=125;for(let i=0;i<60;i++){const a=i/60*2*Math.PI,mj=i%5===0,r1=108,r2=mj?96:102,x1=cx+r1*Math.sin(a),y1=cy-r1*Math.cos(a),x2=cx+r2*Math.sin(a),y2=cy-r2*Math.cos(a);s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${mj?'#9fb0c0':'#d6dee6'}" stroke-width="${mj?2:1}"/>`;}return s;}

   <h2 class="vh">⏱ 집중 타이머</h2>
   <p class="vsub">시간이 줄면 원판이 함께 줄어드는 비주얼 타이머입니다. 오늘 집중: <b>${ft}분</b></p>

       <div class="center"><div class="time" id="discTime">25:00</div><div class="pl" id="discPl">집중</div></div></div>
     <div class="tmc"><button class="btn" id="tmToggle" onclick="tmToggle()">▶ 시작</button><button class="btn ghost" onclick="tmReset()">↺ 리셋</button></div>
     ${TM.mode==='free'?`<div class="presets">${[5,10,15,25,50].map(m=>`<button onclick="tmSetFree(${m})">${m}분</button>`).join('')}</div>`:
       `<div style="margin-top:12px"><label style="font-size:13px;font-weight:600"><input type="checkbox" ${TM.auto?'checked':''} onchange="TM.auto=this.checked" style="width:auto"> 다음 단계 자동 시작</label></div>`}
   </div>
   <div class="callout co-acc" style="max-width:420px">타이머를 켠 동안은 <b>딱 한 가지</b>만 하세요. 폰은 화면 밖에.</div>`;
  tmDraw();tmRead();tmBtn();

const GCAL={token:null,exp:0,tc:null};
function tzName(){try{return Intl.DateTimeFormat().resolvedOptions().timeZone||'Asia/Seoul';}catch(e){return 'Asia/Seoul';}}
function gTokenValid(){return GCAL.token&&Date.now()<GCAL.exp-10000;}
function loadGIS(cb){
  if(window.google&&google.accounts&&google.accounts.oauth2){cb&&cb();return;}
  if(document.getElementById('gis-src')){let n=0;const iv=setInterval(()=>{n++;if(window.google&&google.accounts&&google.accounts.oauth2){clearInterval(iv);cb&&cb();}else if(n>40){clearInterval(iv);toast('구글 라이브러리 로드 지연 — 다시 시도하세요');}},200);return;}

  s.onload=()=>cb&&cb();s.onerror=()=>toast('구글 라이브러리 로드 실패 — 인터넷 연결/차단을 확인하세요');

  loadGIS(()=>{try{
    if(!GCAL.tc){
      GCAL.tc=google.accounts.oauth2.initTokenClient({
        client_id:id, scope:'https://www.googleapis.com/auth/calendar.events https://www.googleapis.com/auth/drive.appdata',
        callback:(resp)=>{ if(resp&&resp.access_token){GCAL.token=resp.access_token;GCAL.exp=Date.now()+((resp.expires_in||3600)*1000);toast('구글 로그인 완료');if(S.view==='gsync')vGSync(document.getElementById('view'));afterSignIn();} else {toast('로그인 취소/실패');} }
      });
    }

}
function gSignIn(){ gInit(()=>{ if(GCAL.tc)GCAL.tc.requestAccessToken({prompt:gTokenValid()?'':'consent'}); }); }
function gSignOut(){ try{ if(GCAL.token&&window.google&&google.accounts&&google.accounts.oauth2)google.accounts.oauth2.revoke(GCAL.token,()=>{}); }catch(e){} GCAL.token=null;GCAL.exp=0;toast('구글 로그아웃');if(S.view==='gsync')vGSync(document.getElementById('view')); }
async function gFetch(url,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+GCAL.token,'Content-Type':'application/json'},opt.headers||{});
  const r=await fetch(url,opt);if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t.slice(0,140));}return r.json();}
function isoLocal(x){const p=n=>String(n).padStart(2,'0');return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+'T'+p(x.getHours())+':'+p(x.getMinutes())+':00';}
async function gcalInsert(summary,dtLocal,mins){ if(!gTokenValid())throw new Error('로그인 필요');
  const start=dtLocal.length===16?dtLocal+':00':dtLocal;const s=new Date(start);const e=new Date(s.getTime()+(mins||60)*60000);
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  const body={summary:summary,start:{dateTime:isoLocal(s),timeZone:tzName()},end:{dateTime:isoLocal(e),timeZone:tzName()},reminders:{useDefault:false,overrides:[{method:'popup',minutes:10}]}};
  return gFetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events',{method:'POST',body:JSON.stringify(body)});}
async function gcalList(dateStr){ if(!gTokenValid())throw new Error('로그인 필요');
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  const tMin=new Date(dateStr+'T00:00:00').toISOString(),tMax=new Date(dateStr+'T23:59:59').toISOString();

  const res=await gFetch(url);return res.items||[];}
async function gcalInsertRange(summary,dateStr,start,end){ if(!gTokenValid())throw new Error('로그인 필요');

const DAYCODE=['SU','MO','TU','WE','TH','FR','SA'];
function nextMatch(rule,byday){let d=today();for(let i=0;i<7;i++){const wn=parseD(d).getDay();
  if(rule==='daily')return d; if(rule==='weekday'&&wn>=1&&wn<=5)return d; if(rule==='weekly'&&wn===byday)return d; d=addDays(d,1);}return today();}

  const body={summary:r.title,start:{dateTime:isoLocal(s),timeZone:tzName()},end:{dateTime:isoLocal(e),timeZone:tzName()},recurrence:['RRULE:'+rrule],reminders:{useDefault:false,overrides:[{method:'popup',minutes:10}]}};

let cloudFileId=null, cloudBusy=false, cloudTimer=null;
async function driveFind(){ const url="https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&q="+encodeURIComponent("name='"+CLOUD_NAME+"'");
  const r=await gFetch(url); return (r.files&&r.files[0])||null; }
async function cloudSave(){ if(!gTokenValid()){toast('구글 로그인이 필요합니다');return;} if(cloudBusy)return; cloudBusy=true;
  try{ const content=JSON.stringify(S);
    if(!cloudFileId){const f=await driveFind(); if(f)cloudFileId=f.id;}
    if(cloudFileId){
      await gFetch('https://www.googleapis.com/upload/drive/v3/files/'+cloudFileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:content});
    } else {
      const boundary='diarybnd'+Math.abs(0|(performance.now()));
      const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:CLOUD_NAME,parents:['appDataFolder']})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+boundary+'--';
      const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Authorization':'Bearer '+GCAL.token,'Content-Type':'multipart/related; boundary='+boundary},body:body});
      if(!r.ok){const t=await r.text();throw new Error(r.status+' '+t.slice(0,100));} const j=await r.json(); cloudFileId=j.id;
    }
    S.settings.cloudSyncedAt=new Date().toISOString(); localStorage.setItem(KEY,JSON.stringify(S));
    toast('☁ 클라우드에 저장되었습니다'); if(S.view==='gsync')vGSync(document.getElementById('view'));
  }catch(e){toast('클라우드 저장 실패: '+e.message);} finally{cloudBusy=false;} }
async function cloudLoad(silent){ if(!gTokenValid()){if(!silent)toast('구글 로그인이 필요합니다');return;}
  try{ const f=await driveFind(); if(!f){ if(!silent)toast('클라우드에 저장된 다이어리가 없습니다'); return; } cloudFileId=f.id;
    const data=await gFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media');
    if(!data||typeof data!=='object')throw new Error('형식 오류');
    if(!silent && !confirm('클라우드 기록을 불러와 이 기기의 현재 내용을 덮어쓸까요? (이 기기에만 있는 미동기화 내용은 사라질 수 있습니다)'))return;
    const cid=S.settings.gClientId, gid=S.settings.gcalId; // 로그인 설정은 유지
    S=Object.assign(blank(),data); S.settings=Object.assign(S.settings||{},{gClientId:cid,gcalId:gid});
    save(); renderNav(); render(); refreshWho(); toast('☁ 클라우드에서 불러왔습니다');
  }catch(e){ if(!silent)toast('클라우드 불러오기 실패: '+e.message); } }
function scheduleCloud(){ if(!(S.settings&&S.settings.autoCloud)||!gTokenValid())return; if(cloudTimer)clearTimeout(cloudTimer); cloudTimer=setTimeout(()=>{cloudSave();},4000); }
function afterSignIn(){ try{ const empty=Object.keys(S.days||{}).length===0 && (S.reading||[]).length===0 && (S.ideas||[]).length===0;
  driveFind().then(f=>{ if(!f)return; if(empty){cloudLoad(true);} else {toast('☁ 클라우드 저장본이 있습니다 — 구글 연동 탭에서 불러오기/저장을 선택하세요');} }).catch(()=>{}); }catch(e){} }

function vGSync(v){
  const on=gTokenValid(); const cid=(S.settings.gClientId||'');
  v.innerHTML=`
   <h2 class="vh">🔗 구글 계정 연동 (캘린더)</h2>
   <p class="vsub">구글 로그인(OAuth)으로 다이어리의 알림·일정을 <b>내 구글 캘린더에 직접 등록</b>하고, 오늘 일정을 불러옵니다. 휴대폰 구글 캘린더 앱에서도 알림이 울립니다.</p>
   <div class="callout co-brand">여기(구글 연동)는 <b>로그인 설정</b> 화면입니다. 실제 일정 등록·불러오기는 <b>📆 일간 계획</b>의 <b>‘시간표’</b>에서 합니다 — 시간 블록을 추가한 뒤 <b>↥ 내 시간표 구글에 등록</b> / <b>↧ 구글 일정 불러오기</b> 버튼을 사용하세요. (알림은 🔔 일정 알림에서 등록)</div>
   <div class="card"><h3>연결 설정</h3>
     <label class="fld"><span class="lb">OAuth 클라이언트 ID <span class="hint">(구글 클라우드에서 발급 — 아래 안내 참고)</span></span>
       <input type="text" value="${esc(cid)}" oninput="setV('settings.gClientId',this.value)" placeholder="000000-xxxx.apps.googleusercontent.com"></label>
     <label class="fld"><span class="lb">캘린더 ID <span class="hint">(기본: primary / 특정 캘린더는 그 캘린더 설정의 '캘린더 ID')</span></span>
       <input type="text" value="${esc(S.settings.gcalId||'primary')}" oninput="setV('settings.gcalId',this.value)" placeholder="primary"></label>
     <div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:6px">
       ${on?`<button class="btn ghost" onclick="gSignOut()">로그아웃</button><span class="tag" style="background:var(--accent);align-self:center">● 연결됨</span>`
            :`<button class="btn" onclick="gSignIn()">구글 계정으로 로그인</button>`}
     </div>
   </div>
   ${on?`<div class="card"><h3>☁ 클라우드 동기화 (기기 간 사용)</h3>
       <p class="synchint" style="margin-top:-4px">내 구글 드라이브의 <b>앱 전용 비공개 공간</b>에 다이어리를 저장해, 휴대폰·노트북 어디서든 로그인하면 <b>같은 기록</b>을 씁니다. (주간·월간·일간·기록 전부 동기화)</p>
       <div style="display:flex;gap:8px;flex-wrap:wrap;margin:10px 0">
         <button class="btn" onclick="cloudSave()">☁ 클라우드에 저장</button>
         <button class="btn ghost" onclick="cloudLoad()">↧ 클라우드에서 불러오기</button></div>
       <label style="font-size:13px;font-weight:600;display:block"><input type="checkbox" ${S.settings.autoCloud?'checked':''} onchange="S.settings.autoCloud=this.checked;save();toast(this.checked?'자동 동기화 켜짐':'자동 동기화 꺼짐')" style="width:auto"> 자동 동기화 (기록을 바꾸면 몇 초 뒤 자동으로 클라우드에 저장)</label>
       <div class="synchint" style="margin-top:6px">마지막 동기화: ${S.settings.cloudSyncedAt?new Date(S.settings.cloudSyncedAt).toLocaleString('ko-KR'):'없음'}</div>
       <div class="callout co-brand" style="margin-top:10px;font-size:12px">💡 <b>다른 기기에서 처음 열 때</b>: 로그인 → ‘↧ 클라우드에서 불러오기’ 한 번이면 최신 기록이 내려옵니다. 자동 동기화를 켜두면 이후엔 알아서 맞춰집니다.</div>
     </div>
     <div class="card"><h3>오늘 구글 일정</h3><div id="gevents"><p class="hint">아래 버튼으로 불러오세요.</p></div>
     <div style="margin-top:8px"><button class="btn ghost sm" onclick="loadTodayG()">오늘 일정 불러오기</button>
       <button class="btn ghost sm" onclick="pushAllReminders()">미등록 알림 모두 캘린더에 등록</button></div></div>`:''}
   <div class="card"><h3>설정 방법 (처음 1회, 약 5분)</h3>
     <ol style="font-size:13px;line-height:1.9;padding-left:20px;margin:4px 0">
       <li><b>console.cloud.google.com</b> 접속 → 프로젝트 만들기(아무 이름).</li>
       <li>왼쪽 <b>API 및 서비스 → 라이브러리</b>에서 <b>Google Calendar API</b> 검색 → <b>사용 설정</b>.</li>
       <li><b>OAuth 동의 화면</b> 구성: User Type <b>외부</b>, 앱 이름/이메일 입력, 저장. 테스트 사용자에 <b>본인 지메일</b> 추가.</li>
       <li><b>사용자 인증 정보 → 사용자 인증 정보 만들기 → OAuth 클라이언트 ID</b> → 유형 <b>웹 애플리케이션</b>.</li>
       <li><b>승인된 자바스크립트 원본</b>에 이 다이어리를 여는 주소를 추가:
         <div class="url" style="background:#0f172a;color:#e2e8f0;border-radius:8px;padding:8px 10px;font-family:ui-monospace,monospace;font-size:12.5px;margin:4px 0;word-break:break-all">https://parkhyunggoon.github.io</div>
         (GitHub Pages에 올려 쓸 경우. 다른 곳에 올리면 그 주소를 넣으세요. 파일을 그냥 더블클릭한 <b>file:// 방식은 구글 로그인이 안 됩니다</b> — 반드시 https 주소 필요.)</li>
       <li>생성된 <b>클라이언트 ID</b>(…apps.googleusercontent.com)를 위 칸에 붙여넣고, <b>구글 계정으로 로그인</b>을 누르세요.</li>
     </ol>
     <div class="callout co-brand" style="margin-top:6px">로그인 시 구글이 <b>캘린더</b>와 <b>드라이브(앱 전용 공간)</b> 접근을 함께 요청합니다. 드라이브 권한은 <b>기기 간 동기화</b>를 위한 것으로, 데이터는 <b>내 드라이브의 앱 전용 비공개 공간(appDataFolder)</b>에만 저장되어 다른 사람이 볼 수 없고 다른 파일에도 접근하지 않습니다. 로그인 정보(액세스 토큰)는 이 브라우저 메모리에만 잠깐 보관되며, 클라이언트 ID는 공개돼도 안전한 값입니다.</div>
   </div>`;
}

/* ============ INIT ============ */
(function init(){const had=load();if(!S.view)S.view='dash';
  (S.profile.roles||[]).forEach((r,i)=>{if(!r.color)r.color=ROLE_COLOR_MAP[r.name]||ROLE_PALETTE[i%ROLE_PALETTE.length];});
  renderNav();render();refreshWho();setSave(had?'불러옴 · '+(S.meta.savedAt||''):'자동저장 켜짐');
  checkReminders();setInterval(checkReminders,30000);})();
</script>
</body>
