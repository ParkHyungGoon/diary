function buildBookMd(){const b=curBook();const a=b.ai;
  let m='# '+(b.title||'제목 없음')+'\n\n';
  if(b.author)m+='**저자** '+b.author+'  \n';
  m+='**기록일** '+b.date+' · **별점** '+'★'.repeat(b.rating||0)+' · **진행률** '+rprog(b)+'%  \n';
  m+='**활용 목적** '+purp(b)[1]+' — '+purp(b)[2]+'\n\n';
  if(a.structure)m+='## 1단계 · 책 세팅 — 문제의식과 논리 구조 (AI)\n'+a.structure+'\n\n';
  if(a.chapters.length){m+='## 2단계 · 장별 3줄 요약 (지식 지도)\n';
    a.chapters.forEach((c,i)=>{m+='### '+(i+1)+'. '+c.name+'\n';
      if(c.myLine)m+='- 내 한 줄: '+c.myLine+'\n';
      if(c.final)m+='\n'+c.final+'\n';m+='\n';});}
  m+='## 3단계 · 독서카드\n'+cardText()+'\n';
  const cs=a.review.claims.filter(c=>c.text.trim());
  if(cs.length){m+='## 4단계 · 독서감상록 — 333 개조식\n';
    cs.forEach((c,i)=>{m+='**'+['①','②','③'][i]+' '+c.text+'**\n';
      if(c.why)m+='- 근거: '+c.why+'\n';if(c.ex)m+='- 경험·감정: '+c.ex+'\n';m+='\n';});}
  if(a.review.full)m+='### 감상록 전문 ('+rlen(a.review.full)+'자)\n'+a.review.full+'\n\n';
  const dl=debateLog();if(dl)m+='### 저자와의 토론 로그\n'+dl+'\n\n';
  if(a.review.fullFeedback)m+='> **수석 에디터 피드백**\n> '+a.review.fullFeedback.replace(/\n/g,'\n> ')+'\n\n';
  const st=spText(b);
  if(st){m+='## 5단계 · 1분 발표 ('+rlen(st)+'자)\n';
    SPBLK.forEach(k=>{if(a.speech[k[0]])m+='**'+k[1]+' · '+k[2]+'** '+a.speech[k[0]]+'\n\n';});}
  if(a.speech.transcript)m+='### 실제 발표 전사\n'+a.speech.transcript+'\n\n';
  if(b.note)m+='## 핵심 문장\n'+b.note+'\n\n';
  if(b.apply)m+='## 나의 적용\n'+b.apply+'\n';
  return m;}

function renderHList(){const el=document.getElementById('hlist');if(!el)return;

    <button class="btn ghost sm" style="flex:none" onclick="shrinkHabit(${i})" title="더 작게 — 성공할 수밖에 없는 크기로">↓작게</button>

function addHabit(){const n=document.getElementById('hn').value.trim();if(!n)return;S.habits.push({id:uid(),name:n,principle:document.getElementById('hpr').value});save();renderHList();document.getElementById('hn').value='';}
function toggleHabit(d,hid,stay){ensureDay(d);const a=S.days[d].habits;const i=a.indexOf(hid);if(i>=0)a.splice(i,1);else a.push(hid);save();render();}
function habitDayPct(d){if(!S.habits.length)return 0;const day=S.days[d];return Math.round((day.habits.length/S.habits.length)*100);}
function habitStreak(hid){
  let d=today();const t=S.days[d];
  if(!(t&&(t.habits||[]).includes(hid)))d=addDays(d,-1);   // 오늘은 아직 안 했어도 연속을 끊지 않는다
  let s=0;
  for(let i=0;i<400;i++){const day=S.days[d];
    if(day&&(day.habits||[]).includes(hid)){s++;d=addDays(d,-1);continue;}
    if(isRestDay(d)){d=addDays(d,-1);continue;}            // 주 1회 휴식일은 연속을 끊지 않는다
    break;}
  return s;}

/* ============ TIMER (뽀모도로 + 비주얼) ============ */
let TM={mode:'pomo',phase:'focus',running:false,remaining:1500,total:1500,endAt:0,cycle:0,auto:true,cfg:{focus:25,short:5,long:15,longEvery:4},free:15};
let tmInt=null,AC=null;
function fmtT(s){s=Math.max(0,Math.round(s));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function phInfo(){if(TM.mode==='free')return{l:'집중',c:'#e0554f'};if(TM.phase==='focus')return{l:'집중 '+(TM.cycle+1),c:'#e0554f'};if(TM.phase==='long')return{l:'긴 휴식',c:'#2fa36b'};return{l:'휴식',c:'#2fa36b'};}
function ensureAudio(){try{if(!AC)AC=new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}}
function beep(){try{if(!AC)return;const n=AC.currentTime;[880,1174,880].forEach((f,i)=>{const o=AC.createOscillator(),g=AC.createGain();o.frequency.value=f;o.connect(g);g.connect(AC.destination);const t=n+i*.25;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.34,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.23);o.start(t);o.stop(t+.24);});}catch(e){}}
function tmSetMode(m){tmPause();TM.mode=m;if(m==='pomo'){TM.phase='focus';TM.cycle=0;TM.total=TM.cfg.focus*60;}else TM.total=TM.free*60;TM.remaining=TM.total;if(S.view==='timer')vTimer(document.getElementById('view'));}
function tmSetFree(min){tmPause();TM.mode='free';TM.free=min;TM.total=min*60;TM.remaining=min*60;tmDraw();tmRead();}
function tmToggle(){TM.running?tmPause():tmStart();}
function tmStart(){if(TM.running)return;ensureAudio();TM.running=true;TM.endAt=Date.now()+TM.remaining*1000;tmInt=setInterval(tmTick,200);tmBtn();}
function tmPause(){if(!TM.running)return;TM.running=false;TM.remaining=Math.max(0,(TM.endAt-Date.now())/1000);if(tmInt){clearInterval(tmInt);tmInt=null;}document.title='나의 인생·실천 다이어리';tmBtn();}
function tmReset(){tmPause();TM.remaining=TM.total;tmDraw();tmRead();}
function tmTick(){const r=(TM.endAt-Date.now())/1000;TM.remaining=r;if(r<=0){TM.remaining=0;tmDraw();tmRead();tmDone();return;}tmDraw();tmRead();document.title='⏱ '+fmtT(r)+' · '+phInfo().l;}
function tmDone(){if(tmInt){clearInterval(tmInt);tmInt=null;}TM.running=false;document.title='나의 인생·실천 다이어리';beep();let msg='';
  if(TM.mode==='pomo'){if(TM.phase==='focus'){addFocus(TM.cfg.focus);TM.cycle++;if(TM.cycle%TM.cfg.longEvery===0){TM.phase='long';TM.total=TM.cfg.long*60;msg='긴 휴식!';}else{TM.phase='short';TM.total=TM.cfg.short*60;msg='집중 완료! 휴식하세요.';}}else{TM.phase='focus';TM.total=TM.cfg.focus*60;msg='다시 집중!';}}
  else{addFocus(Math.round(TM.total/60));msg='집중 완료! 잘했어요.';}
  TM.remaining=TM.total;if(S.view==='timer')vTimer(document.getElementById('view'));toast('⏱ '+msg);if(TM.auto&&TM.mode==='pomo')tmStart();}
function addFocus(min){const d=today();S.focusLog[d]=(S.focusLog[d]||0)+min;save();}
function tmDraw(){const p=document.getElementById('discFill');if(!p)return;const f=TM.total?Math.max(0,Math.min(1,TM.remaining/TM.total)):0;const cx=125,cy=125,r=108;
  if(f>=.9999)p.setAttribute('d',`M ${cx} ${cy-r} A ${r} ${r} 0 1 1 ${cx-0.01} ${cy-r} Z`);else if(f<=0)p.setAttribute('d','');
  else{const th=f*2*Math.PI,ex=cx+r*Math.sin(th),ey=cy-r*Math.cos(th),la=f>.5?1:0;p.setAttribute('d',`M ${cx} ${cy} L ${cx} ${cy-r} A ${r} ${r} 0 ${la} 1 ${ex.toFixed(2)} ${ey.toFixed(2)} Z`);}
  p.setAttribute('fill',phInfo().c);}
function tmRead(){const t=document.getElementById('discTime');if(t)t.textContent=fmtT(TM.remaining);const l=document.getElementById('discPl');if(l){const pi=phInfo();l.textContent=pi.l;l.style.color=pi.c;}}
function tmBtn(){const b=document.getElementById('tmToggle');if(b)b.textContent=TM.running?'⏸ 일시정지':'▶ 시작';}
function ticks(){let s='';const cx=125,cy=125;for(let i=0;i<60;i++){const a=i/60*2*Math.PI,mj=i%5===0,r1=108,r2=mj?96:102,x1=cx+r1*Math.sin(a),y1=cy-r1*Math.cos(a),x2=cx+r2*Math.sin(a),y2=cy-r2*Math.cos(a);s+=`<line x1="${x1.toFixed(1)}" y1="${y1.toFixed(1)}" x2="${x2.toFixed(1)}" y2="${y2.toFixed(1)}" stroke="${mj?'#9fb0c0':'#d6dee6'}" stroke-width="${mj?2:1}"/>`;}return s;}

     <div class="tmc"><button class="btn" id="tmToggle" onclick="tmToggle()">▶ 시작</button><button class="btn ghost" onclick="tmReset()">↺ 리셋</button></div>
     ${TM.mode==='free'?`<div class="presets">${[5,10,15,25,50].map(m=>`<button onclick="tmSetFree(${m})">${m}분</button>`).join('')}</div>`:

function askNoti(){if(!('Notification'in window)){toast('이 브라우저는 알림을 지원하지 않습니다');return;}Notification.requestPermission().then(p=>{toast(p==='granted'?'알림이 켜졌습니다':'알림 권한이 거부되었습니다');vRemind(document.getElementById('view'));});}

function gcalLink(r){const s=r.dt.replace(/[-:]/g,'').slice(0,15);const dt=s.length===13?s+'00':s;const start=dt.replace('T','T');
  // build start/end (1h)

    lines.push('BEGIN:VEVENT','UID:'+r.id+'@lifediary','DTSTART:'+f(d),'DTEND:'+f(e),'SUMMARY:'+r.text.replace(/\n/g,' '),'END:VEVENT');});
  lines.push('END:VCALENDAR');const blob=new Blob([lines.join('\r\n')],{type:'text/calendar'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='diary_events.ics';a.click();toast('.ics 파일을 내려받았습니다 (구글 캘린더에서 가져오기)');}

function ensureDay(d){if(!S.days[d])S.days[d]={tasks:[],sched:{},events:[],habits:[],praise:"",gratitude:"",reflect:"",journal:""};
  const x=S.days[d];x.tasks=x.tasks||[];x.sched=x.sched||{};x.events=x.events||[];x.recDone=x.recDone||[];x.habits=x.habits||[];if(x.praise==null)x.praise="";if(x.gratitude==null)x.gratitude="";if(x.reflect==null)x.reflect="";if(x.journal==null)x.journal="";
  x.tasks.forEach(t=>{if(!t.id)t.id=uid();if(t.impact==null)t.impact=3;if(!t.priority)t.priority='B';if(!t.status)t.status='todo';});
  if(x.one==null)x.one="";
  if(x.negot==null)x.negot="";      /* 미룬 순간의 생각 — 협상 문장 */
  if(!x.ci||typeof x.ci!=='object')x.ci={am:"",pm:""};
  if(x.one&&!x.tasks.some(t=>t.id===x.one))x.one="";
  try{recFill(d,x);}catch(e){}        /* 반복 항목을 이 날짜에 실제로 만들어 둔다 */
  return x;}
function ensureMonth(mk){if(!S.months[mk])S.months[mk]={focus:"",good:"",next:""};
  const m=S.months[mk];if(!Array.isArray(m.goalIds))m.goalIds=[];if(m.focus==null)m.focus="";return m;}
function ensureWeek(ws){if(!S.weeks[ws])S.weeks[ws]={rocks:{},good:"",next:""};
  const w=S.weeks[ws];if(!w.rocks||typeof w.rocks!=='object')w.rocks={};
  /* 큰 바위: 문자열 한 줄 → 항목 배열. 구버전의 "a / b" 는 두 개로 갈라 준다. */
  Object.keys(w.rocks).forEach(k=>{const v=w.rocks[k];
    if(typeof v==='string'){
      w.rocks[k]=v.split(/\s*\/\s*/).map(x=>x.trim()).filter(Boolean).slice(0,2)
        .map(t=>({id:uid(),text:t,done:false}));}
    else if(!Array.isArray(v))w.rocks[k]=[];
    else w.rocks[k]=v.filter(x=>x&&typeof x==='object').map(x=>{
      if(!x.id)x.id=uid(); if(x.done==null)x.done=false; if(x.text==null)x.text=''; return x;});});
  return w;}
function setDay(d,k,val){ensureDay(d);S.days[d][k]=val;save();}
function setMonth(mk,k,val){ensureMonth(mk)[k]=val;save();}
function setWeek(ws,k,val){ensureWeek(ws)[k]=val;save();}

/* ---- 구글 API 오류를 '무엇을 하면 되는지'로 번역 ---- */

function gApiError(status,text){
  let j=null; try{j=JSON.parse(text);}catch(e){}

  const reason=((err.errors||[])[0]||{}).reason||err.status||'';
  const proj=(msg.match(/project\s+(\d{6,})/)||[])[1]||'';
  const api=/drive/i.test(msg+url_hint_last)?'drive':(/calendar/i.test(msg+url_hint_last)?'calendar':'');
  const e=new Error(msg); e.status=status; e.raw=String(text||'').slice(0,400); e.reason=reason;
  if(status===403&&/has not been used in project|is disabled|SERVICE_DISABLED|accessNotConfigured/i.test(msg+reason)){
    const svc=api==='calendar'?'calendar-json.googleapis.com':'drive.googleapis.com';
    const name=api==='calendar'?'Google Calendar API':'Google Drive API';
    e.fix={title:name+' 가 아직 켜지지 않았습니다',
      sub:'구글 클라우드 프로젝트에서 이 API를 한 번 켜주면 됩니다. 로그인·클라이언트 ID 설정은 정상입니다.',
      steps:['아래 링크를 열어 (프로젝트 소유 구글 계정으로 로그인된 상태여야 합니다)',
             '상단의 <b>사용 / ENABLE</b> 버튼을 누릅니다',
             '<b>1~2분 기다린 뒤</b> 이 화면으로 돌아와 다시 시도합니다 (구글이 설정을 퍼뜨리는 시간이 필요합니다)'],
      url:'https://console.developers.google.com/apis/api/'+svc+'/overview'+(proj?'?project='+proj:'')};
  } else if(status===403&&/insufficient|ACCESS_TOKEN_SCOPE|Request had insufficient authentication scopes/i.test(msg+reason)){
    e.fix={title:'권한(스코프)이 부족합니다',
      sub:'예전에 로그인한 권한에는 드라이브 접근이 포함되지 않았습니다. 로그아웃 후 다시 로그인하면 동의 화면이 새로 떠서 해결됩니다.',
      steps:['이 창을 닫고 <b>로그아웃</b>을 누릅니다','<b>구글 계정으로 로그인</b>을 다시 누릅니다','동의 화면에서 <b>드라이브(앱 전용 공간)</b> 항목까지 체크하고 계속을 누릅니다'],url:''};
  } else if(status===401){
    e.fix={title:'로그인이 만료되었습니다',sub:'구글 액세스 토큰은 약 1시간만 유효합니다.',
      steps:['<b>구글 계정으로 로그인</b>을 한 번 더 누르면 바로 이어집니다'],url:''};
  } else if(status===404&&/File not found/i.test(msg)){
    e.fix={title:'클라우드 파일을 찾지 못했습니다',sub:'다른 계정으로 로그인했거나 저장본이 아직 없습니다.',
      steps:['<b>☁ 클라우드에 저장</b>을 먼저 한 번 눌러 새로 만듭니다'],url:''};
  } else if(status===429||status===403&&/quota|rateLimit/i.test(msg+reason)){
    e.fix={title:'요청이 너무 잦습니다',sub:'구글의 분당 요청 한도에 걸렸습니다.',
      steps:['1~2분 뒤 다시 시도합니다','자동 동기화를 잠시 껐다가 다시 켜도 됩니다'],url:''};
  }
  return e;
}
function gfixShow(e){

function gReport(prefix,e){ if(e&&e.fix){gfixShow(e);return;} toast(prefix+': '+((e&&e.message)||'알 수 없는 오류').slice(0,80)); }
async function gFetch(url,opt){opt=opt||{};opt.headers=Object.assign({'Authorization':'Bearer '+GCAL.token,'Content-Type':'application/json'},opt.headers||{});
  url_hint_last=url;
  const r=await fetch(url,opt);if(!r.ok){const t=await r.text();throw gApiError(r.status,t);}return r.json();}
function isoLocal(x){const p=n=>String(n).padStart(2,'0');return x.getFullYear()+'-'+p(x.getMonth()+1)+'-'+p(x.getDate())+'T'+p(x.getHours())+':'+p(x.getMinutes())+':00';}
async function gcalInsert(summary,dtLocal,mins){ if(!gTokenValid())throw new Error('로그인 필요');
  const start=dtLocal.length===16?dtLocal+':00':dtLocal;const s=new Date(start);const e=new Date(s.getTime()+(mins||60)*60000);

  return gFetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events',{method:'POST',body:JSON.stringify(body)});}
async function gcalList(dateStr){ if(!gTokenValid())throw new Error('로그인 필요');

  const tMin=new Date(dateStr+'T00:00:00').toISOString(),tMax=new Date(dateStr+'T23:59:59').toISOString();

async function gcalInsertRange(summary,dateStr,start,end){ if(!gTokenValid())throw new Error('로그인 필요');

  return gFetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events',{method:'POST',body:JSON.stringify(body)});}
async function pushDay(d){ if(!gTokenValid()){toast('구글 로그인이 필요합니다');return;} let n=0;
  for(const ev of dayEvents(d)){ if(ev.gEventId)continue; try{const r=await gcalInsertRange(ev.title,d,ev.start,ev.end); if(r&&r.id){ev.gEventId=r.id;n++;}}catch(e){gReport('등록 실패',e);} }

async function pullDay(d){ if(!gTokenValid()){toast('구글 로그인이 필요합니다');return;}
  try{
    const items=await gcalList(d);

    items.filter(ev=>ev.start&&ev.start.dateTime).forEach(ev=>{
      const s=ev.start.dateTime, e=(ev.end&&ev.end.dateTime)||s;
      const rec={start:s.slice(11,16),end:e.slice(11,16),title:ev.summary||'(제목 없음)',gEventId:ev.id,fromG:true};
      if(ev.description&&!rec.memo)rec.memo=String(ev.description).slice(0,2000);
      const dup=arr.find(x=>x.gEventId===ev.id);

      if(taken)return;
      if(dup){Object.assign(dup,rec);upd++;}
      else{arr.push(Object.assign({id:uid(),role:'',color:gColor(ev.colorId)},rec));add++;}
    });
    gDayCache[d]=[];

const CLOUD_NAME='life_diary.json';
let cloudFileId=null, cloudBusy=false, cloudTimer=null;
async function driveFind(){ const url="https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&fields=files(id,name,modifiedTime)&q="+encodeURIComponent("name='"+CLOUD_NAME+"'");
  const r=await gFetch(url); return (r.files&&r.files[0])||null; }

async function cloudSave(){ if(!gTokenValid()){toast('구글 로그인이 필요합니다');return;} if(cloudBusy)return;
  if(!confirm('이 기기의 내용으로 클라우드를 덮어씁니다.\n다른 기기에서만 쓴 기록이 있다면 사라집니다.\n\n보통은 [☁ 지금 맞추기]를 쓰세요. 계속할까요?'))return;
  cloudBusy=true;
  try{ const content=JSON.stringify(S);
    if(!cloudFileId){const f=await driveFind(); if(f)cloudFileId=f.id;}
    if(cloudFileId){
      await gFetch('https://www.googleapis.com/upload/drive/v3/files/'+cloudFileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json'},body:content});
    } else {
      const boundary='diarybnd'+Math.abs(0|(performance.now()));
      const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+JSON.stringify({name:CLOUD_NAME,parents:['appDataFolder']})+'\r\n--'+boundary+'\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+boundary+'--';
      const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Authorization':'Bearer '+GCAL.token,'Content-Type':'multipart/related; boundary='+boundary},body:body});
      if(!r.ok){const t=await r.text();url_hint_last='drive';throw gApiError(r.status,t);} const j=await r.json(); cloudFileId=j.id;
    }

     <div class="callout co-brand" style="margin-top:6px">로그인 시 구글이 <b>캘린더</b>와 <b>드라이브(앱 전용 공간)</b> 접근을 함께 요청합니다. 드라이브 권한은 <b>기기 간 동기화</b>를 위한 것으로, 데이터는 <b>내 드라이브의 앱 전용 비공개 공간(appDataFolder)</b>에만 저장되어 다른 사람이 볼 수 없고 다른 파일에도 접근하지 않습니다. 로그인 정보(액세스 토큰)는 이 브라우저 메모리에만 잠깐 보관되며, 클라이언트 ID는 공개돼도 안전한 값입니다.</div>
   </div>`;
}

/* ── 구글 캘린더에 아침·저녁 리추얼 알람 등록 (브라우저를 열어두지 않아도 울립니다) ── */
async function pushRitualAlarms(){
  if(!gTokenValid()){toast('먼저 구글 연동에서 로그인해 주세요');go('gsync');return;}
  const am=S.settings.amTime||'07:00', pm=S.settings.pmTime||'21:30';
  try{
    await gcalInsertRecurring({title:'☀️ 아침 다이어리 3분 — 오늘의 ONE 정하기',rule:'daily',start:am,end:addMinStr(am,10)});
    await gcalInsertRecurring({title:'🌙 저녁 다이어리 3분 — 완료·칭찬·감사',rule:'daily',start:pm,end:addMinStr(pm,10)});
    toast('구글 캘린더에 아침·저녁 리추얼을 매일 반복으로 등록했습니다 (10분 전 팝업 알림)');
  }catch(e){ gReport('리추얼 알람 등록 실패',e); }
}

/* ============================================================
   ② 3분 리추얼 — 하루 6분이면 다이어리를 "다 쓴 것"
   ============================================================ */
let RIT={mode:'',step:0,d:''};
function ritualMode(){const h=new Date().getHours();return h<(S.settings.pmFrom||18)?'am':'pm';}
function ritualDone(d,m){ensureDay(d);return !!(S.days[d].ci&&S.days[d].ci[m]);}
function ritualMark(d,m){ensureDay(d);S.days[d].ci[m]=new Date().toISOString();save();}
function ritualStreak(){let d=today();const t=S.days[d];
  if(!(t&&t.ci&&(t.ci.am||t.ci.pm)))d=addDays(d,-1);
  let n=0;for(let i=0;i<400;i++){const x=S.days[d];
    if(x&&x.ci&&(x.ci.am||x.ci.pm)){n++;d=addDays(d,-1);}else break;}
  return n;}
function ritualStart(m){RIT={mode:m||ritualMode(),step:0,d:today()};go('checkin');}
function ritualSwitch(){RIT={mode:RIT.mode==='am'?'pm':'am',step:0,d:today()};vCheckin(document.getElementById('view'));}
function ritualGo(n){RIT.step=Math.max(0,n);vCheckin(document.getElementById('view'));}
function ritualNext(){ritualGo(RIT.step+1);}
function ritualBack(){ritualGo(RIT.step-1);}

/* 아침 1단계 — 오늘의 ONE */
function ritualPickOne(id){const d=RIT.d;S.days[d].one=id;save();vCheckin(document.getElementById('view'));}
function ritualNewOne(){
  const d=RIT.d, el=document.getElementById('roneinput'); if(!el)return;
  const v=(el.value||'').trim();
  const cur=findTask(d,S.days[d].one);
  if(!v){ if(!cur){toast('오늘의 ONE 하나만 적어주세요');return;} ritualNext(); return; }
  if(cur&&cur.text===v){ritualNext();return;}
  const role=(S.profile.roles[0]||{}).id||'';
  const t={id:uid(),text:v,priority:'A',role:role,impact:5,status:'todo'};
  ensureDay(d);S.days[d].tasks.push(t);S.days[d].one=t.id;save();ritualNext();
}
function ritualTime(hhmm){
  const d=RIT.d, id=S.days[d].one; if(!id){toast('먼저 오늘의 ONE을 정해주세요');return;}
  placeTaskAt(d,id,toMin(hhmm));
  if(S.view==='checkin')vCheckin(document.getElementById('view'));
}
function ritualTimeNow(){const n=new Date();ritualTime(m2s(snap5(n.getHours()*60+n.getMinutes()+10)));}
function ritualFinish(m){ritualMark(RIT.d,m);ritualGo(999);}

/* 저녁 4단계 — 내일의 ONE */
/* 저녁 리추얼 2단 — 내일의 '첫 착수' 하나만 예약한다.
   · 하나만 받는다: 내일의 나를 대신해 결정하는 자리라 과적재되기 가장 쉽다.
   · 끝낼 것(ONE)은 건드리지 않는다 — 그것은 내일 아침에 정한다.
   · 오늘 미룬 과제를 자동으로 채우지 않는다 — 만회가 아니라 재예약이어야 한다. */
function ritualTomorrowOne(){
  const nd=addDays(RIT.d,1); ensureDay(nd);
  const el=document.getElementById('rtomo'); const v=el?(el.value||'').trim():'';
  if(v){ const role=(S.profile.roles[0]||{}).id||'';
    const c=document.getElementById('rtCue'), f=document.getElementById('rtFirst');
    const t={id:uid(),text:v,priority:'B',role:role,impact:4,status:'todo',type:'start'};
    if(c&&c.value)t.cueRef=c.value;
    if(f&&(f.value||'').trim())t.first=f.value.trim();
    S.days[nd].tasks.push(t); save(); }
  ritualFinish('pm');
}
function ritTomoPick(txt){const el=document.getElementById('rtomo'); if(el){el.value=txt;el.focus();}}
function ritualCarryCandidate(){
  const d=RIT.d;const ts=dayTasks(d).filter(t=>t.text&&t.status!=='done'&&t.status!=='drop');
  if(!ts.length)return null; return ts.slice().sort((a,b)=>oneScore(b)-oneScore(a))[0];}

/* ○ 아직 → ◐ 착수 → ✓ 완료 — 완료가 아니라 착수를 성공으로 센다 */
function ritQuickTasks(d){
  const ts=dayTasks(d).filter(t=>t.text&&t.status!=='drop');
  if(!ts.length)return '<p class="hint">오늘 등록된 과제가 없습니다.</p>';

function vCheckin(v){
  if(!RIT.d||RIT.d!==today()||!RIT.mode)RIT={mode:ritualMode(),step:0,d:today()};
  const d=RIT.d, m=RIT.mode; ensureDay(d); const day=S.days[d];
  const steps=(m==='am')?ritAM(d,day):ritPM(d,day);
  const i=Math.min(RIT.step,steps.length-1);
  const cur=findTask(d,day.one);
  v.innerHTML=`<div class="ritual">
    <div class="rhd">
      <div class="rt">${m==='am'?'☀️ 아침 리추얼':'🌙 저녁 리추얼'} <span style="font-weight:600;color:var(--muted);font-size:15px">· 3분</span></div>
      <div class="rs">${d} (${wd(d)}) · ${m==='am'?'오늘을 여는 세 가지':'오늘 닫기 → 내일 열기'} · 🔥 연속 ${ritualStreak()}일
        ${ritualDone(d,m)?' · <b style="color:var(--accent)">오늘 완료</b>':''}</div>
    </div>
    <div class="rdots">${steps.map((s,k)=>`<i class="${k<i?'done':(k===i?'on':'')}"></i>`).join('')}</div>
    <div class="rstep">
      <div class="q">${steps[i].q}</div>
      ${steps[i].why?`<div class="why">${steps[i].why}</div>`:''}
      <div class="bd">${steps[i].bd}</div>
    </div>
    <div class="rnav">
      <button class="btn ghost sm" onclick="${i===0?"go('dash')":'ritualBack()'}">${i===0?'나중에 하기':'← 이전'}</button>
      <button class="btn ghost sm" onclick="ritualSwitch()">${m==='am'?'🌙 저녁 리추얼로':'☀️ 아침 리추얼로'}</button>
    </div>
    <p class="hint" style="text-align:center;margin-top:14px">
      이 화면만으로 오늘의 다이어리는 충분합니다. 더 깊이 쓰고 싶을 때만 메뉴를 여세요.</p>
  </div>`;
  const inp=v.querySelector('#roneinput'); if(inp&&!inp.value&&cur)inp.value=cur.text;
  const f=v.querySelector('[data-focus]'); if(f)try{f.focus();}catch(e){}
}

function ritAM(d,day){
  const cur=findTask(d,day.one);
  const cands=(day.tasks||[]).filter(t=>t.text&&t.status!=='done'&&t.status!=='drop').slice(0,8);
  const hDone=day.habits.length, hAll=S.habits.length;
  return [
  { q:'오늘, 이 하나를 끝내면 나머지가 쉬워지는 일은 무엇입니까?',
    why:'The ONE Thing — 목록이 아니라 <b>선두 도미노 하나</b>. 오늘 다른 걸 다 못해도 이것만 하면 성공한 하루입니다.',
    bd:`<input type="text" id="roneinput" data-focus placeholder="예: 3단원 수행평가 루브릭 확정" value="${cur?esc(cur.text):''}"
          onkeydown="if(event.key==='Enter')ritualNewOne()">
        ${cands.length?`<div class="why" style="margin:10px 0 6px">이미 적어둔 과제에서 고르기</div>
          <div class="rpick">${cands.map(t=>`<button class="${day.one===t.id?'on':''}" onclick="ritualPickOne('${t.id}')">${esc(t.text)}</button>`).join('')}</div>`:''}
        <button class="rbig" style="margin-top:16px" onclick="ritualNewOne()">이걸로 정하고 다음 →</button>` },
  { q:'그 하나를 <u>몇 시에</u> 하시겠습니까?',
    why:'실행의도(implementation intention) — “언제·어디서”를 못 박으면 실천율이 크게 오릅니다. 의지가 아니라 <b>시각</b>이 행동을 부릅니다.',
    bd:`${cur?`<div class="callout co-brand" style="margin:0 0 12px"><b>🁢 ${esc(cur.text)}</b>
          ${cur.start?`<div style="margin-top:4px;font-size:13px">🕘 ${cur.start}${cur.end?'–'+cur.end:''} 에 배치됨</div>`:'<div style="margin-top:4px;font-size:13px;color:var(--muted)">아직 시각이 정해지지 않았습니다</div>'}</div>`
        :'<p class="hint">먼저 오늘의 ONE을 정해주세요.</p>'}
        <div class="rpick">
          <button onclick="ritualTimeNow()">지금부터 (10분 뒤)</button>
          ${['07:00','08:30','09:00','10:00','13:00','15:00','16:30','20:00','21:00'].map(h=>`<button class="${cur&&cur.start===h?'on':''}" onclick="ritualTime('${h}')">${h}</button>`).join('')}
        </div>
        <div style="margin-top:12px;display:flex;gap:8px;align-items:center;flex-wrap:wrap">
          <span class="why">직접 입력</span>
          <input type="time" class="tmin" style="max-width:120px" onchange="if(this.value)ritualTime(this.value)">
        </div>
        <button class="rbig" style="margin-top:16px" onclick="ritualNext()">다음 →</button>` },
  { q:'오늘 지킬 습관을 고르세요.',
    why:'작게·쉽게·빠르게 — <b>성공할 수밖에 없는 크기</b>로. 다 지키는 것보다 하나라도 끊기지 않는 것이 중요합니다.',
    bd:`<div class="chips">${S.habits.map(h=>`<span class="chip ${day.habits.includes(h.id)?'on':''}"
          onclick="toggleHabit('${d}','${h.id}')">${esc(h.name)}</span>`).join('')||'<span class="hint">습관 관리에서 먼저 등록하세요</span>'}</div>
        <div class="why" style="margin-top:8px">${hAll?`오늘 ${hDone}/${hAll} 선택`:''}</div>
        <button class="rbig acc" style="margin-top:16px" onclick="ritualFinish('am')">아침 리추얼 마치기 ✓</button>` },
  { q:'', why:'',
    bd:`<div class="rdone"><div class="big">☀️</div>
        <div class="msg">오늘의 방향이 정해졌습니다</div>
        <div class="sub">🁢 ${cur?esc(cur.text):'—'}${cur&&cur.start?` · 🕘 ${cur.start}`:''}<br>🔥 리추얼 연속 ${ritualStreak()}일</div>
        <div style="margin-top:18px;display:flex;gap:8px;justify-content:center;flex-wrap:wrap">
          <button class="btn" onclick="go('dash')">대시보드</button>
          <button class="btn ghost" onclick="go('day')">일간 계획 자세히 →</button></div></div>` }];
}

function ritPM(d,day){
  const arr=ritPMSteps(d,day);
  const kl=kOn()?kLessonsOn(d):[];
  if(kl.length){
    const k=K(), n=kl.filter(x=>(k.logs[x.key]||{}).prog).length;
    arr.unshift({
      q:'오늘 수업, 어디까지 나갔습니까?',
      why:'기억이 가장 생생한 지금이 <b>가장 정확한 기록</b>입니다. 한 줄이면 충분합니다 — 학기 말 진도표와 세특이 여기서 나옵니다.',
      bd:`<div style="display:flex;flex-direction:column;gap:8px">
        ${kl.map(x=>{const l=k.logs[x.key]||{};
          return `<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
            <span class="chip" style="flex:none;border-color:${kColor(x.g)}55">
              <b style="color:${kColor(x.g)}">${esc(x.g)}</b> ${x.no}차시</span>
            <input type="text" style="flex:1;min-width:160px" value="${esc(l.prog||'')}"
              placeholder="진도 한 줄" oninput="kSetLog('${esc(x.key)}','prog',this.value)">
            <button class="btn ghost sm" onclick="openLessonPick('${esc(x.key)}')" title="다른 반에서 같은 내용 가져오기">↧ 불러오기</button>
            <button class="btn ghost sm" onclick="openLesson('${esc(x.key)}')">자세히</button>
          </div>`;}).join('')}
      </div>
      <div class="why" style="margin-top:10px">${n}/${kl.length} 적었습니다. 적으면 그 차시는 자동으로 완료 표시됩니다.</div>
      <button class="rbig" style="margin-top:16px" onclick="kMarkTodayDone('${d}');ritualNext()">다음 →</button>`});
  }
  return arr;
}
function kMarkTodayDone(d){
  if(!kOn())return; const k=K();
  kLessonsOn(d).forEach(x=>{const l=k.logs[x.key]; if(l&&(l.prog||l.note)&&!l.done){l.done=true;l.at=today();}});
  save();
}
function ritPMSteps(d,day){
  /* ── 저녁 리추얼은 성격이 다른 두 단계로 나뉜다 ──────────────────────
     1단 «오늘 닫기»  = 과거 · 관찰 · 기록   → 협상 문장이라는 데이터를 모은다
     2단 «내일 열기»  = 미래 · 결정 · 이관   → 내일 아침의 결정 비용을 0으로 만든다
     섞으면 "오늘 못한 걸 만회해야지"가 내일 계획의 입력값이 되어 복귀 규칙이 그 자리에서 깨진다.
     ------------------------------------------------------------------ */
  const ts=dayTasks(d).filter(t=>t.text&&t.status!=='drop');
  const doneN=ts.filter(t=>t.status==='done').length;
  const startN=ts.filter(t=>isStarted(t)).length;
  const left=notStarted(d);

/* ============================================================
   ③ 실패 복구 설계 — 연속(streak)이 아니라 회복력
   ============================================================ */
function isRestDay(d){const rd=S.settings.restDay;return rd>=0&&parseD(d).getDay()===rd;}
function habitRecent(hid,n){n=n||7;let c=0,d=today();
  for(let i=0;i<n;i++){const x=S.days[d];if(x&&(x.habits||[]).includes(hid))c++;d=addDays(d,-1);}return c;}
function habitEverDone(hid){return Object.keys(S.days).some(d=>((S.days[d].habits)||[]).includes(hid));}
function habitLapse(hid){ if(!habitEverDone(hid))return 0;
  let n=0,d=addDays(today(),-1);
  for(let i=0;i<14;i++){ if(isRestDay(d)){d=addDays(d,-1);continue;}
    const x=S.days[d]; if(x&&(x.habits||[]).includes(hid))break;
    n++; d=addDays(d,-1); }
  return n;}
function shrinkHabit(i){
  const h=S.habits[i]; if(!h)return;
  const m=(h.name||'').match(/(\d+)\s*(분|쪽|개|회|번|장|페이지|km|칸|줄)/);
  if(m){const cur=parseInt(m[1],10), nx=Math.max(1,Math.floor(cur/2));
    h.name=h.name.replace(m[0],nx+m[2]);}
  else h.name=(h.name||'').replace(/\s*\(더 작게\)$/,'')+' (더 작게)';
  h.size=(h.size||0)+1; save();
  toast('“'+h.name+'” — 다시 시작할 수 있는 크기로 줄였습니다');
  render();}
function recoverCard(){
  const list=S.habits.map((h,i)=>({h,i,lap:habitLapse(h.id)})).filter(x=>x.lap>=2);
  if(!list.length)return '';
  const mx=Math.max.apply(null,list.map(x=>x.lap));
  return `<div class="recover no-print"><h4>🌱 다시 시작하기</h4>
    <p>${list.length}개 습관이 ${mx}일째 쉬고 있습니다. 습관 연구에서 <b>한두 번 거른 것은 형성에 거의 영향이 없고</b>,
       실제로 그만두게 만드는 건 그 뒤의 자기비난입니다. 연속 기록은 이미 지나간 일입니다 — 오늘 한 번이면 다시 시작입니다.
       잘 안 되면 의지가 아니라 <b>크기</b>를 의심하세요.</p>
    <div style="margin-top:10px;display:flex;flex-direction:column;gap:6px">
      ${list.map(x=>`<div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:13px">
        <b style="flex:1;min-width:130px">${esc(x.h.name)}</b>
        <button class="btn sm" onclick="toggleHabit('${today()}','${x.h.id}')">오늘 실천 ✓</button>
        <button class="btn ghost sm" onclick="shrinkHabit(${x.i})">절반 크기로 ↓</button></div>`).join('')}
    </div></div>`;}

/* ============================================================
   ④ 계획량 자동 캘리브레이션 — 균형루프 B1 끊기
   ============================================================ */
function avgDone(n){n=n||14;const arr=[];let d=addDays(today(),-1);
  for(let i=0;i<n;i++){const x=S.days[d];
    if(x&&x.tasks&&x.tasks.filter(t=>t.text).length)arr.push(x.tasks.filter(t=>t.status==='done').length);
    d=addDays(d,-1);}
  if(arr.length<3)return null;
  return Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10;}
function plannedMin(d){ensureDay(d);let m=0;
  (S.days[d].tasks||[]).forEach(t=>{if(t.start&&t.end)m+=Math.max(0,toMin(t.end)-toMin(t.start));});return m;}
function setCap(n){S.settings.dailyCap=n;save();toast('하루 계획 상한을 '+n+'개로 정했습니다');render();}
function deferC(d){
  ensureDay(d);const nd=addDays(d,1);ensureDay(nd);let n=0;
  S.days[d].tasks=S.days[d].tasks.filter(t=>{
    if(t.priority==='C'&&t.status!=='done'){S.days[nd].tasks.push(Object.assign({},t,{id:uid(),status:'todo',start:'',end:''}));n++;return false;}
    return true;});
  if(S.days[d].one&&!S.days[d].tasks.some(t=>t.id===S.days[d].one))S.days[d].one='';
  save(); toast(n?n+'개 C 과제를 '+nd+'로 옮겼습니다':'옮길 C 과제가 없습니다');
  vDay(document.getElementById('view'));}
function calibHtml(d){
  const ts=dayTasks(d).filter(t=>t.text&&t.status!=='drop');
  const n=ts.length, avg=avgDone(14), cap=S.settings.dailyCap||0;
  const lim=cap||(avg!=null?Math.max(3,Math.round(avg*1.3)):0);
  const over=!!(lim&&n>lim);
  const pm=plannedMin(d);
  return `<div class="calib no-print ${over?'warn':''}">
    <span>오늘 계획 <b>${n}개</b></span>
    ${avg!=null?`<span>· 최근 2주 하루 평균 완료 <b>${avg}개</b></span>`:'<span>· 비교할 기록이 아직 부족합니다</span>'}
    ${cap?`<span>· 내가 정한 상한 <b>${cap}개</b></span>`:''}
    ${pm?`<span>· 시간표에 <b>${Math.floor(pm/60)}시간 ${String(pm%60).padStart(2,'0')}분</b> 배치됨</span>`:''}
    ${over?`<span style="flex:1 0 100%;margin-top:2px">계획이 실제 완료량보다 많습니다. 미완료가 쌓이면 <b>의욕이 먼저 꺾입니다</b> — 오늘을 이길 수 있는 하루로 줄이세요.</span>
      <button class="btn sm no-print" onclick="deferC('${d}')">C 과제 내일로 밀기</button>`:''}
  </div>`;}

/* ============================================================
   ⑤ 주간 5분 회고 — 관찰 → 진단 → 조정을 한 화면에서 닫기
   ============================================================ */
function wkAgg(ws){
  const ds=[];for(let i=0;i<7;i++)ds.push(addDays(ws,i));
  let tot=0,done=0,focus=0,ci=0,hab=0;
  ds.forEach(d=>{const x=S.days[d];focus+=(S.focusLog&&S.focusLog[d])||0;if(!x)return;
    (x.tasks||[]).forEach(t=>{if(!t.text||t.status==='drop')return;tot++;if(t.status==='done')done++;});
    if(x.ci&&(x.ci.am||x.ci.pm))ci++;
    hab+=((x.habits)||[]).length;});
  return {ws,tot,done,pct:tot?Math.round(done/tot*100):0,focus,ci,
    habPct:S.habits.length?Math.round(hab/(S.habits.length*7)*100):0};}
function last4(){const cw=weekStart(today());return [3,2,1,0].map(k=>wkAgg(addDays(cw,-7*k)));}
function roleTally(weeks){
  const cw=weekStart(today());const map={};(S.profile.roles||[]).forEach(r=>map[r.id]={n:0,done:0,name:r.name,color:r.color});
  for(let k=0;k<(weeks||4);k++){const ws=addDays(cw,-7*k);
    for(let i=0;i<7;i++){const x=S.days[addDays(ws,i)];if(!x)continue;
      (x.tasks||[]).forEach(t=>{if(!t.text||t.status==='drop')return;if(map[t.role]){map[t.role].n++;if(t.status==='done')map[t.role].done++;}});}}
  return Object.keys(map).map(k=>Object.assign({id:k},map[k]));}
function weakAreas(){return LIFE_AREAS.map(a=>({a,s:parseInt((S.lifemap.areas[a]||{}).score||0,10)||0}))
  .filter(x=>x.s>0&&x.s<=5).sort((x,y)=>x.s-y.s);}

function diagnose(){
  const w=last4(), cur=w[3], out=[];
  const rec=w.slice(1).filter(x=>x.tot>0);
  const low=rec.filter(x=>x.pct<50).length;
  const avg=avgDone(21);
  if(low>=2){
    const n=Math.max(3,Math.round((avg||3)));
    out.push({t:'⚠ 균형루프 B1이 돌고 있습니다 — 계획 과다 → 완료율 하락 → 의욕 하락',
      d:`최근 ${rec.length}주 중 <b>${low}주</b>가 완료율 50% 아래입니다. 문제는 실행력이 아니라 <b>계획량</b>일 가능성이 큽니다.
         지난 3주 하루 평균 완료는 <b>${avg==null?'집계 부족':avg+'개'}</b>였습니다.`,
      a:[{l:`하루 계획 상한 ${n}개로 정하기`,f:`setCap(${n})`}]});}
  else if(cur.tot>=5&&cur.pct>=70){
    out.push({t:'✅ 강화루프 R1이 돌고 있습니다 — 실행 → 성공 → 유능감 → 다시 실행',
      d:`이번 주 완료율 <b>${cur.pct}%</b>. 지금 리듬이 맞습니다. 계획량을 늘리기보다 <b>이 상태를 한 주 더 유지</b>하는 편이 장기적으로 유리합니다.`,a:[]});}
  const rt=roleTally(4).filter(r=>r.name);
  const zero=rt.filter(r=>r.n===0);
  if(zero.length&&rt.some(r=>r.n>0)){
    out.push({t:'⚖ 역할 균형이 한쪽으로 기울었습니다',
      d:`최근 4주간 <b>${zero.map(r=>esc(r.name)).join(' · ')}</b> 역할에 과제가 <b>0건</b>입니다.
         비어 있는 역할은 대개 급하지 않아서 밀린 <b>중요한 일</b>입니다. 주간 계획에서 이 역할의 ‘큰 바위’를 하나만 놓아보세요.`,
      a:[{l:'주간 계획에서 큰 바위 놓기',f:"go('week')"}]});}
  const wa=weakAreas();
  if(wa.length){
    out.push({t:'🧭 인생 설계와 이번 주 실천이 어긋난 지점',
      d:`삶의 8영역에서 스스로 낮게 매긴 영역: <b>${wa.slice(0,3).map(x=>esc(x.a)+' '+x.s+'점').join(' · ')}</b>.
         이 영역을 살리는 일이 이번 주 계획 안에 있었습니까? 없다면 다음 주 큰 바위 한 자리를 여기에 주세요.`,
      a:[{l:'인생 설계 다시 보기',f:"go('life')"}]});}
  const lapsed=S.habits.filter(h=>habitLapse(h.id)>=2);
  if(lapsed.length){
    out.push({t:'🌱 습관은 의지가 아니라 크기의 문제입니다',
      d:`<b>${lapsed.map(h=>esc(h.name)).join(' · ')}</b> 이(가) 이틀 이상 쉬고 있습니다. 벌점 대신 <b>절반 크기</b>로 줄여 다시 붙이세요.`,
      a:[{l:'습관 관리 열기',f:"go('habits')"}]});}
  if(cur.ci<=2){
    out.push({t:'⏰ 다이어리를 여는 신호가 약합니다',
      d:`이번 주 3분 리추얼을 <b>${cur.ci}일</b> 하셨습니다. 실천율의 첫 병목은 계획의 질이 아니라 <b>여는 횟수</b>입니다.
         구글 캘린더에 아침·저녁 알람을 걸어두면 브라우저를 열어두지 않아도 울립니다.`,
      a:[{l:'캘린더에 리추얼 알람 등록',f:'pushRitualAlarms()'},{l:'홈 화면에 앱 설치',f:'installApp()'}]});}
  if(!out.length)out.push({t:'기록이 더 쌓이면 진단이 정확해집니다',d:'2주 정도만 리추얼을 이어가면, 이 화면이 다음 주 계획량을 대신 정해 줍니다.',a:[]});
  return out;}

function markReviewed(){const ws=weekStart(today());ensureWeek(ws);S.weeks[ws].reviewedAt=new Date().toISOString();save();toast('이번 주 회고를 마쳤습니다');render();}
function reviewDue(){const ws=weekStart(today());const wk=S.weeks[ws];
  const wday=new Date().getDay(), rd=(S.settings.reviewDay==null?0:S.settings.reviewDay);
  return (wday===rd)&&!(wk&&wk.reviewedAt);}

  const w=last4(), cur=w[3], ws=cur.ws, wk=ensureWeek(ws);
  const rt=roleTally(4).filter(r=>r.name);
  const rmax=Math.max(1,...rt.map(r=>r.n));
  const dx=diagnose();
  v.innerHTML=`
   <span class="step-badge">주 1회 · 5분</span>
   <h2 class="vh">🔁 주간 회고</h2>
   <p class="vsub">관찰 → 진단 → 조정. 이 셋이 한 화면에서 닫혀야 다음 주가 달라집니다. ${ws} ~ ${addDays(ws,6)}</p>

   <div class="stat">

/* ============================================================
   ⑧ 인생 달력 — 1968년부터 100년 (인생 설계와 오늘을 잇는 장치)
   ============================================================ */
const LIFE_SPAN=100;
function lifeStartYear(){const y=parseInt(S.lifemap.birthYear,10);return (y&&y>1800&&y<2200)?y:1968;}
function setLifeStart(y){S.lifemap.birthYear=parseInt(y,10)||1968;save();vLife(document.getElementById('view'));}
function pickLifeYear(y){S.ui.lcYear=(S.ui.lcYear===y?0:y);save();vLife(document.getElementById('view'));}
function setMilestone(y,val){if(!S.lifemap.milestones)S.lifemap.milestones={};
  if(val&&val.trim())S.lifemap.milestones[y]=val;else delete S.lifemap.milestones[y];save();}
function lifeCalStats(){
  const y0=lifeStartYear(),n=new Date(),tot=LIFE_SPAN*12;
  const passed=Math.max(0,Math.min(tot,(n.getFullYear()-y0)*12+(n.getMonth()+1)));
  return {y0,tot,passed,left:tot-passed,pct:Math.round(passed/tot*100),age:n.getFullYear()-y0};}
function lifeCalHtml(){
  const st=lifeCalStats(), n=new Date(), cy=n.getFullYear(), cm=n.getMonth()+1;
  const ms=S.lifemap.milestones||{}, sel=S.ui.lcYear||0;
  let rows='';
  for(let y=st.y0;y<st.y0+LIFE_SPAN;y++){
    let cells='';
    for(let m=1;m<=12;m++){
      const past=(y<cy)||(y===cy&&m<cm), now=(y===cy&&m===cm);
      cells+=`<i class="${now?'now':(past?'pa':'fu')}"></i>`;
    }
    rows+=`<div class="lcrow${y===cy?' cur':''}${y===sel?' sel':''}${ms[y]?' hasm':''}" onclick="pickLifeYear(${y})" title="${y}년 · 만 ${y-st.y0}세">
      <span class="ly">${y}</span><span class="la">${y-st.y0}</span>
      <span class="lcells">${cells}</span>
      <span class="lnote">${ms[y]?esc(ms[y]):''}</span></div>`;
  }
  const msKeys=Object.keys(ms).sort();
  return `<div class="card"><h3>🗓 인생 달력 — ${st.y0}년부터 100년 <span class="hint">(한 칸 = 한 달)</span></h3>
    <p class="hint" style="margin-top:-4px">시간은 늘 있는 것처럼 느껴지지만, 눈으로 보면 유한합니다. 이 표는 <b>비전·꿈·연간 목표를 오늘로 당겨오는 장치</b>입니다.
      연도를 클릭해 그 해의 <b>이정표</b>를 적어두세요.</p>
    <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px">
      <label class="fld" style="max-width:180px;margin:0"><span class="lb">시작(출생) 연도</span>
        <input type="number" value="${st.y0}" onchange="setLifeStart(this.value)"></label>
      <div class="stat" style="flex:1;min-width:260px">
        <div class="s"><div class="n">${st.passed}</div><div class="l">살아온 개월 (만 ${st.age}세)</div></div>
        <div class="s"><div class="n">${st.left}</div><div class="l">남은 개월</div></div>
        <div class="s"><div class="n">${st.pct}%</div><div class="l">100년 중 지난 비율</div></div>
      </div>
    </div>
    <div class="bar" style="height:18px"><i style="width:${st.pct}%"></i></div>
    <div class="lclegend"><span><i class="pa"></i> 지나간 달</span><span><i class="now"></i> 이번 달</span><span><i class="fu"></i> 남은 달</span><span>★ 이정표가 적힌 해는 배경이 다릅니다</span></div>
    ${sel?`<div class="callout co-brand" style="margin:10px 0">
      <b>${sel}년 · 만 ${sel-st.y0}세 이정표</b>
      <input type="text" value="${esc(ms[sel]||'')}" placeholder="예: 정년 · 아이 대학 입학 · 책 출간 · 은퇴 후 첫 해"
        oninput="setMilestone(${sel},this.value)" onchange="vLife(document.getElementById('view'))" style="margin-top:6px">
      <div class="hint" style="margin-top:4px">비워두고 화면을 벗어나면 삭제됩니다.</div></div>`:''}
    <div class="lifecal">${rows}</div>
    ${msKeys.length?`<div style="margin-top:12px"><b style="font-size:13px">이정표 목록</b>
      ${msKeys.map(y=>`<div class="row-item" style="padding:4px 0;border:none">
        <div style="flex:none;width:90px;font-weight:800;font-size:13px">${y} · ${y-st.y0}세</div>
        <div style="flex:1;font-size:13px">${esc(ms[y])}</div>
        <button class="del-x" onclick="setMilestone(${y},'');vLife(document.getElementById('view'))">✕</button></div>`).join('')}</div>`:''}
    <div class="callout co-acc" style="margin-top:12px"><div class="tag">다음 단계로</div>
      이정표가 정해졌다면, 가장 가까운 이정표를 <b>비전 → 연간 목표 → 이번 달 중점 → 이번 주 큰 바위 → 오늘의 과제</b>로 내려보내세요.
      각 화면 맨 위의 <b>⬇ 위에서 내려온 것</b> 칸이 그 연결을 도와줍니다.</div>
  </div>`;}

/* ============================================================
   ⑨ 계획의 수직 연결 — 인생설계 → 연간 → 월간 → 주간 → 일간
   상위 기간에서 정한 것이 다음 화면 맨 위에 '내려와' 있고,
   한 번의 클릭으로 하위 단위의 입력이 된다.
   ============================================================ */
function chainBox(title,sub,items,foot){
  if(!items.length)return `<div class="chain empty"><div class="ch-h">⬇ ${title}<span class="ch-s">${sub}</span></div>
    <div class="ch-b"><div class="ch-i" style="color:var(--muted)">아직 위 단계에서 내려온 것이 없습니다. ${foot||''}</div></div></div>`;
  return `<div class="chain"><div class="ch-h">⬇ ${title}<span class="ch-s">${sub}</span></div>
    <div class="ch-b">${items.map(it=>`<div class="ch-i">
      ${it.tag?`<span class="ch-g" style="background:${it.color||'var(--brand)'}">${esc(it.tag)}</span>`:''}
      <span class="ch-t">${esc(it.t)}</span>
      ${(it.btns||[]).map(b=>`<button class="btn ghost sm" onclick="${esc(b.f)}">${b.l}</button>`).join('')}</div>`).join('')}
    </div>${foot?`<div class="ch-f">${foot}</div>`:''}</div>`;}

/* 인생 설계 → 연간 */
function chainToAnnual(){
  const items=[];
  if(S.mission.statement)items.push({tag:'사명',t:S.mission.statement});
  const st=lifeCalStats(), ms=S.lifemap.milestones||{};
  Object.keys(ms).map(Number).filter(y=>y>=new Date().getFullYear()).sort().slice(0,2)
    .forEach(y=>items.push({tag:y+'년 이정표',color:'var(--gold)',t:ms[y],
      btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(ms[y])},'')`}]}));
  (S.profile.roles||[]).forEach(r=>{const tx=((S.vision.text||{})[r.id]||'').trim();
    if(tx)items.push({tag:r.name,color:r.color,t:tx.slice(0,90),
      btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(tx.slice(0,90))},'${r.id}')`}]});});
  LIFE_AREAS.forEach(a=>{const w=((S.lifemap.areas[a]||{}).wish||'').trim();
    if(w)items.push({tag:a,color:'var(--accent)',t:w,btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(w)},'')`}]});});
  (S.lifemap.dreams||[]).filter(x=>!x.done&&x.text).slice(0,3)
    .forEach(x=>items.push({tag:'꿈',color:'#b23a55',t:x.text,btns:[{l:'→ 올해 목표로',f:`addGoalFrom(${JSON.stringify(x.text)},'')`}]}));
  return chainBox('인생 설계 · 비전에서 내려온 것','사명 · 이정표 · 역할별 비전 · 8영역 소망 · 꿈',items,
    '<b>1 인생 설계</b>와 <b>3 비전</b>을 먼저 채우면 이 칸이 올해 목표의 재료가 됩니다.');}
function addGoalFrom(text,role){S.annual.goals.push({id:uid(),role:role||'',text:text,done:false});save();
  toast('올해 목표로 가져왔습니다');vAnnual(document.getElementById('view'));}

/* 연간 → 월간 */
function chainToMonth(mk){
  const m=ensureMonth(mk);
  const items=(S.annual.goals||[]).filter(g=>g.text&&!g.done).map(g=>({
    tag:g.role?roleName(g.role):'올해',color:g.role?roleColor(g.role):'var(--brand)',t:g.text,
    btns:[{l:(m.goalIds.includes(g.id)?'✓ 이 달 목표':'이 달에 진척'),f:`toggleMonthGoal('${mk}','${g.id}')`},
          {l:'→ 중점에 추가',f:`addMonthFocus('${mk}',${JSON.stringify(g.text)})`}]}));
  if(S.annual.word)items.unshift({tag:S.annual.year+' 단어',color:'var(--gold)',t:S.annual.word});
  return chainBox('연간 계획에서 내려온 것','올해의 단어 · 올해 목표',items,
    '<b>4 연간 계획</b>에 목표를 적으면 여기로 내려옵니다.');}
function toggleMonthGoal(mk,gid){const m=ensureMonth(mk);const i=m.goalIds.indexOf(gid);
  if(i>=0)m.goalIds.splice(i,1);else m.goalIds.push(gid);save();vMonth(document.getElementById('view'));}
function addMonthFocus(mk,text){const m=ensureMonth(mk);
  m.focus=(m.focus?m.focus.replace(/\s*$/,'')+'\n':'')+'· '+text;save();
  toast('이 달의 중점에 추가했습니다');vMonth(document.getElementById('view'));}

/* 월간 → 주간 */
function chainToWeek(ws){
  const mk=monthKey(ws), m=ensureMonth(mk), wk=ensureWeek(ws), items=[];
  (m.focus||'').split('\n').map(s=>s.replace(/^[·\-\s]+/,'').trim()).filter(Boolean).slice(0,6)
    .forEach(t=>items.push({tag:mk+' 중점',color:'var(--brand)',t:t,
      btns:[{l:'→ 큰 바위로',f:`rockFrom('${ws}','',${JSON.stringify(t)},{k:'focus',mk:'${mk}'})`}]}));
  (m.goalIds||[]).forEach(gid=>{const g=(S.annual.goals||[]).find(x=>x.id===gid);if(!g)return;
    items.push({tag:g.role?roleName(g.role):'올해 목표',color:g.role?roleColor(g.role):'var(--gold)',t:g.text,
      btns:[{l:'→ 큰 바위로',f:`rockFrom('${ws}','${g.role||''}',${JSON.stringify(g.text)},{k:'goal',gid:'${g.id}'})`}]});});
  return chainBox('월간 계획에서 내려온 것','이 달의 중점 · 이 달에 진척시킬 올해 목표',items,
    '<b>5 월간</b>에서 중점을 적거나 올해 목표를 고르면 여기로 내려옵니다. <b>«→ 큰 바위로»</b> 를 누르면 '
    +'어느 역할에 놓을지 고른 뒤 아래 <b>«역할별 큰 바위»</b> 칸으로 내려갑니다.');}
function rockFrom(ws,role,text,from){
  ensureWeek(ws);
  const roles=S.profile.roles||[];
  const pref=(role&&roles.some(r=>r.id===role))?role:'';
  openRockPlace(ws,text,from,pref);}

/* 주간 → 일간 */
function chainToDay(d){
  const ws=weekStart(d); ensureWeek(ws); const items=[];
  (S.profile.roles||[]).forEach(r=>{
    rocksOf(ws,r.id).forEach(k=>{ if(!k.text||k.done)return;
      const st=rockStat(k.id);
      const here=st.items.filter(x=>x.d===d).length;
      items.push({tag:r.name,color:r.color,
        t:k.text+(st.n?'   — 내려간 것 '+st.n+' · 착수 '+st.st+(here?' · 오늘 '+here+'건':''):'   — 아직 내려간 것이 없습니다'),
        btns:[{l:'＋ 다음 행동',f:`openRockNext('${ws}','${r.id}','${k.id}')`}]});});});
  return chainBox('주간 계획에서 내려온 것','이번 주 역할별 큰 바위 ('+ws+' ~ '+addDays(ws,6)+')',items,
    '<b>6 주간</b>에서 큰 바위를 놓으면 여기로 내려옵니다. 큰 바위를 그대로 옮기지 말고 <b>＋ 다음 행동</b>으로 3분 안에 시작할 행동 하나를 내려보내세요.');}
function rockToTask(d,ws,rid){const a=rocksOf(ws,rid); if(!a.length)return; openRockNext(ws,rid,a[0].id);}

function closeModal(){const m=document.getElementById('mmask');if(m)m.style.display='none';}
function findItem(d,kind,id){ensureDay(d);

function itemLabel(o,kind){return kind==='task'?(o.text||''):(o.title||'');}
function openMemo(d,kind,id){

        <input type="date" id="duetx" style="max-width:170px" value="${esc(o.due||'')}"

        <button class="btn ghost sm" onclick="dueQuick('${id}',3)">+3일</button>

      <div style="display:flex;gap:6px;flex-wrap:wrap">

    <label class="fld"><span class="lb">⏱ 실행 신호 (IF) <span class="hint">— 시각이 아니라 «무엇을 하고 나면»</span></span>
      <select id="cuesel" onchange="memoCapture();setCueRef('${d}','${id}',this.value);openMemo('${d}','task','${id}')">${cueSelOpts(d,o)}</select>
      <input type="text" id="cuetx" value="${esc(o.cue||'')}" style="margin-top:5px"

      <input type="text" id="firsttx" value="${esc(o.first||'')}" placeholder="예: 평가계획 파일을 연다 · 초안을 열고 결론 첫 문장을 읽는다"></label>

      <textarea id="csftx" rows="3" placeholder="예: 학생 예시 답안 2개를 미리 준비 · 도입 5분 안에 질문 던지기">${esc(o.csf||'')}</textarea></label>

          title="이 항목을 주기에 맞춰 자동으로 만들어 둡니다">🔁 반복${recOf(o.rid)?' · '+esc(recLabel(recOf(o.rid))):''}</button></span>
      <span style="display:flex;gap:8px"><button class="btn ghost" onclick="closeModal()">닫기</button>

/* 모달이 열린 채로 다시 그려야 할 때(유형·신호 변경) 입력 중인 값을 잃지 않도록 먼저 거둬들인다 */
function memoCapture(){
  const o=findItem(MEMO.d,MEMO.kind,MEMO.id); if(!o)return null;
  const t=document.getElementById('memotx'), c=document.getElementById('csftx'),
        dq=document.getElementById('duetx'), ct=document.getElementById('cuetx'), ft=document.getElementById('firsttx');
  if(t){o.memo=t.value.trim(); if(!o.memo)delete o.memo;}
  if(c){o.csf=c.value.trim(); if(!o.csf)delete o.csf;}
  if(dq){const v=dq.value.trim(); if(v)o.due=v; else delete o.due;}
  if(ct){const v=ct.value.trim(); if(v)o.cue=v; else delete o.cue;}
  if(ft){const v=ft.value.trim(); if(v)o.first=v; else delete o.first;}
  save(); return o;}
function saveMemo(){
  const o=memoCapture(); if(!o){closeModal();return;}
  o.memoAt=new Date().toISOString(); save(); closeModal();
  toast('저장했습니다 — 시간표에 마우스를 올리면 바로 보입니다');
  if(S.view==='day'){renderTasks(MEMO.d);renderOne(MEMO.d);renderSchedule(MEMO.d);}else render();}
function dayMemos(d){
  const x=S.days[d]; if(!x)return [];
  const out=[];
  (x.tasks||[]).forEach(t=>{if(t.memo||t.csf)out.push({start:t.start||'',end:t.end||'',title:t.text,memo:t.memo||'',csf:t.csf||'',kind:'task',id:t.id,role:t.role});});
  (x.events||[]).forEach(e=>{if(e.memo||e.csf)out.push({start:e.start||'',end:e.end||'',title:e.title,memo:e.memo||'',csf:e.csf||'',kind:'event',id:e.id,role:e.role});});
  if(kOn())kLessonsOn(d).forEach(ls=>{const l=K().logs[ls.key]||{};
    const txt=[l.prog,l.note,l.absent?'('+l.absent+')':''].filter(Boolean).join(' · ');
    if(txt)out.push({start:ls.start,end:ls.end,title:ls.g+' '+ls.no+'차시',memo:txt,kind:'lesson',id:ls.key,color:kColor(ls.g)});});
  return out.sort((a,b)=>(a.start||'99:99').localeCompare(b.start||'99:99'));}
function memoLines(d){return dayMemos(d).map(m=>`${d} ${m.start||'--:--'}${m.end?'–'+m.end:''} · ${m.title}`
  +(m.csf?`\n  🎯 ${m.csf}`:'')+(m.memo?`\n  ${m.memo}`:'')).join('\n');}
function memosToJournal(d){
  const lines=memoLines(d); if(!lines){toast('저장된 메모가 없습니다');return;}
  ensureDay(d);const cur=S.days[d].journal||'';
  if(cur.indexOf(lines)>=0){toast('이미 붙여넣은 내용입니다');return;}
  S.days[d].journal=(cur?cur.replace(/\s*$/,'')+'\n\n':'')+'— 시간표 메모 —\n'+lines;
  save();toast('일상 기록에 붙여넣었습니다');
  if(S.view==='day')vDay(document.getElementById('view'));else render();}
function memoCard(d){
  const ms=dayMemos(d);
  return `<div class="card"><h3>🎯 핵심 성공 요인 · 시간표 메모 <span class="hint">(일자·시각과 함께 일상 기록으로 이어집니다)</span></h3>
    ${ms.length? ms.map(m=>`<div class="memoline">
        <span class="mt">${m.start||'--:--'}${m.end?'–'+m.end:''}</span>
        <span class="mh" style="border-color:${m.color||(m.role?roleColor(m.role):'var(--brand)')}">${esc(m.title)}</span>
        <span class="mm">${m.csf?`<span class="csfline">🎯 ${esc(m.csf)}</span>`:''}${esc(m.memo)}</span>
        <button class="btn ghost sm no-print" onclick="${m.kind==='lesson'?`openLesson('${esc(m.id)}')`:`openMemo('${d}','${m.kind}','${m.id}')`}">수정</button></div>`).join('')
      : '<p class="hint">과제 줄의 <b>🎯</b> 또는 시간표 블록의 <b>🗒</b> 를 누르면 <b>핵심 성공 요인</b>과 메모를 적을 수 있습니다. 적어두면 시간표에 마우스만 올려도 보입니다.</p>'}
    ${ms.length?`<div style="margin-top:8px"><button class="btn sm no-print" onclick="memosToJournal('${d}')">↧ 오늘 일상 기록에 붙여넣기</button></div>`:''}
  </div>`;}

/* ============================================================
   ⑪ 구글 일정 편집 — 불러온 일정을 이동·수정·삭제하고 구글에 반영
   ============================================================ */
async function gcalPatchEvent(ev,d){
  if(!ev||!ev.gEventId||!gTokenValid())return;
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  const s=new Date(d+'T'+ev.start+':00'), e=new Date(d+'T'+(ev.end||addMinStr(ev.start,60))+':00');
  const body={summary:ev.title,start:{dateTime:isoLocal(s),timeZone:tzName()},end:{dateTime:isoLocal(e),timeZone:tzName()}};
  if(ev.memo)body.description=ev.memo;
  try{await gFetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events/'+encodeURIComponent(ev.gEventId),
     {method:'PATCH',body:JSON.stringify(body)}); toast('구글 캘린더에도 반영했습니다');}
  catch(err){gReport('구글 반영 실패',err);}}
async function gcalPatchTask(t,d){
  if(!t||!t.gEventId||!gTokenValid()||!t.start)return;
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  const s=new Date(d+'T'+t.start+':00'), e=new Date(d+'T'+(t.end||addMinStr(t.start,60))+':00');
  const body={summary:'['+t.priority+'] '+t.text,start:{dateTime:isoLocal(s),timeZone:tzName()},end:{dateTime:isoLocal(e),timeZone:tzName()}};
  if(t.memo)body.description=t.memo;
  try{await gFetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events/'+encodeURIComponent(t.gEventId),
     {method:'PATCH',body:JSON.stringify(body)});}catch(err){gReport('구글 반영 실패',err);}}
async function gcalDeleteEvent(gid){
  if(!gid||!gTokenValid())return;
  const cal=encodeURIComponent(S.settings.gcalId||'primary');
  try{const r=await fetch('https://www.googleapis.com/calendar/v3/calendars/'+cal+'/events/'+encodeURIComponent(gid),
      {method:'DELETE',headers:{'Authorization':'Bearer '+GCAL.token}});
    if(!r.ok&&r.status!==410&&r.status!==404){const t=await r.text();throw gApiError(r.status,t);}
    toast('구글 캘린더에서도 삭제했습니다');}
  catch(err){gReport('구글 삭제 실패',err);}}
/* 시간 이동/시간 변경 후 호출 — 구글 원본이 있으면 조용히 맞춰준다 */
function syncMoved(d,obj,isEvent){ if(!obj||!obj.gEventId||!gTokenValid())return;
  if(isEvent)gcalPatchEvent(obj,d); else gcalPatchTask(obj,d); }

/* 일정 편집 모달 — 내 일정과 구글에서 불러온 일정 모두 여기서 수정 */
function openEvEdit(d,id){
  const ev=findItem(d,'event',id); if(!ev){toast('일정을 찾지 못했습니다');return;}
  modalBox(`<h3 style="margin:0 0 10px">✏ 일정 수정 ${ev.gEventId?'<span class="tag" style="background:var(--accent)">구글 연결됨</span>':''}</h3>

    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <label class="fld" style="max-width:150px"><span class="lb">시작</span><input type="time" class="tmin" id="eeS" value="${ev.start||'09:00'}"></label>
      <label class="fld" style="max-width:150px"><span class="lb">종료</span><input type="time" class="tmin" id="eeE" value="${ev.end||'10:00'}"></label>
      <label class="fld" style="flex:1;min-width:150px"><span class="lb">역할(색)</span><select id="eeR">${roleOptions(ev.role||'')}</select></label>
    </div>
    <label class="fld"><span class="lb">🎯 핵심 성공 요인 (CSF)</span><textarea id="eeC" rows="2" placeholder="이 일정이 성공하려면 반드시 지켜야 할 것">${esc(ev.csf||'')}</textarea></label>
    <label class="fld"><span class="lb">메모 <span class="hint">(일상 기록에 함께 쌓입니다)</span></span><textarea id="eeM" rows="3">${esc(ev.memo||'')}</textarea></label>
    ${ev.gEventId?'<div class="hint">저장하면 구글 캘린더의 원본 일정도 함께 수정됩니다.</div>':''}
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" style="color:var(--del)" onclick="delEvent('${d}','${id}');closeModal()">삭제</button>
      <span><button class="btn ghost" onclick="closeModal()">닫기</button>
      <button class="btn" onclick="saveEvEdit('${d}','${id}')">저장</button></span></div>`);}
function saveEvEdit(d,id){
  const ev=findItem(d,'event',id); if(!ev){closeModal();return;}
  const g=x=>{const el=document.getElementById(x);return el?el.value:'';};
  const s=g('eeS'),e=g('eeE');
  if(s&&e&&toMin(e)<=toMin(s)){toast('종료 시간이 시작보다 늦어야 합니다');return;}
  ev.title=g('eeT').trim()||ev.title; if(s)ev.start=s; if(e)ev.end=e;
  ev.role=g('eeR'); const mm=g('eeM').trim(); if(mm)ev.memo=mm; else delete ev.memo;
  const cc=g('eeC').trim(); if(cc)ev.csf=cc; else delete ev.csf;
  save(); closeModal(); renderSchedule(d);
  if(S.view==='day')vDay(document.getElementById('view'));
  syncMoved(d,ev,true);}


/* ============================================================
   ⑫ 사용 시간 기록 — 어느 메뉴에 얼마나 머무는가
   · 화면 오른쪽 위 팝업: 지금 메뉴를 연 뒤 흐른 시간(실시간)
   · 사이드바 제목 아래: 이 다이어리를 쓴 전체 시간
   · 탭이 숨겨지거나 5분 이상 아무 조작이 없으면 세지 않는다(정직한 숫자)
   ============================================================ */
let UT={view:'',t0:0,act:0,seg:0,idleMs:300000,dirty:false,saved:0,int:null};
function fmtDur(s){ s=Math.max(0,Math.round(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60);
  if(h)return h+'시간 '+m+'분';
  if(m)return m+'분';
  return s+'초';}
function fmtClock(s){ s=Math.max(0,Math.round(s));
  const h=Math.floor(s/3600),m=Math.floor(s%3600/60),sec=s%60;
  const p=n=>String(n).padStart(2,'0');
  return (h?h+':':'')+p(m)+':'+p(sec);}
function viewTitle(v){const n=NAV.find(x=>x.id===v);return n?(n.e+' '+n.t):v;}
function usageAdd(v,s){
  const u=S.usage; if(!u||!s)return;
  u.total=(u.total||0)+s;
  u.byView[v]=(u.byView[v]||0)+s;
  const d=today(); if(!u.byDay[d])u.byDay[d]={total:0,views:{}};
  u.byDay[d].total+=s; u.byDay[d].views[v]=(u.byDay[d].views[v]||0)+s;}
function utMark(){UT.act=Date.now();}
function utSwitch(v){
  utFlush();
  UT.view=v; UT.seg=0; UT.t0=Date.now(); utMark(); utPaint();}
function utFlush(){
  if(!UT.view||!UT.t0)return;
  const dt=Math.floor((Date.now()-UT.t0)/1000);
  if(dt>0&&!document.hidden){usageAdd(UT.view,Math.min(dt,300));UT.seg+=dt;UT.dirty=true;}
  UT.t0=Date.now();}
function utTick(){
  const now=Date.now();
  const idle=(now-UT.act)>UT.idleMs;
  if(!document.hidden&&!idle&&UT.view){
    let dt=Math.floor((now-UT.t0)/1000);
    if(dt>0){ if(dt>5)dt=1;                       /* 탭 복귀·절전 후의 큰 점프는 버린다 */
      usageAdd(UT.view,dt); UT.seg+=dt; UT.t0+=dt*1000; UT.dirty=true; }
  } else UT.t0=now;
  utPaint();
  if(UT.dirty&&now-UT.saved>15000){UT.saved=now;UT.dirty=false;try{save();}catch(e){}}}
function utToggle(){S.settings.utOpen=!(S.settings.utOpen!==false);save();utPaint();}
function utHide(){S.settings.utShow=false;save();utPaint();toast('사용 시간 표시를 껐습니다 — 성찰·통계에서 다시 켤 수 있습니다');}
function utPaint(){
  const box=document.getElementById('utbox'); if(!box)return;
  const tot=document.getElementById('utTotal');
  const u=S.usage||{total:0,byView:{},byDay:{}};
  const d=today(), td=(u.byDay&&u.byDay[d])||{total:0,views:{}};
  if(tot)tot.textContent='⏱ 총 '+fmtDur(u.total||0)+' · 오늘 '+fmtDur(td.total||0);
  if(S.settings.utShow===false){box.style.display='none';document.body.classList.remove('utgut');return;}
  box.style.display='block'; document.body.classList.add('utgut');
  const open=S.settings.utOpen!==false;
  const rows=Object.keys(td.views||{}).map(k=>({v:k,s:td.views[k]})).filter(x=>x.s>=5).sort((a,b)=>b.s-a.s);
  const mx=Math.max(1,...rows.map(r=>r.s));
  box.className='utbox no-print'+(open?' open':'');
  box.innerHTML=`
    <div class="uth" onclick="utToggle()" title="눌러서 펼치기/접기">
      <span class="ut-v">${esc(viewTitle(UT.view||S.view))}</span>
      <span class="ut-c">${fmtClock(UT.seg)}</span>
      <span class="ut-ar">${open?'▴':'▾'}</span>
    </div>
    ${open?`<div class="utb">
      <div class="ut-sum"><span>오늘 <b>${fmtDur(td.total||0)}</b></span><span>전체 <b>${fmtDur(u.total||0)}</b></span></div>
      ${rows.length?rows.slice(0,8).map(r=>`<div class="ut-row">
        <span class="ut-n">${esc(viewTitle(r.v))}</span>
        <span class="ut-b"><i style="width:${Math.round(r.s/mx*100)}%"></i></span>
        <span class="ut-t">${fmtDur(r.s)}</span></div>`).join('')
       :'<div class="ut-row"><span class="ut-n" style="color:var(--muted)">오늘 기록이 쌓이는 중입니다</span></div>'}
      <div class="ut-f">이 메뉴를 연 뒤 흐른 시간입니다. 탭을 가리거나 5분 이상 조작이 없으면 세지 않습니다.
        <button class="ut-x" onclick="event.stopPropagation();utHide()">표시 끄기</button></div>
    </div>`:''}`;}
function utInit(){
  if(!document.getElementById('utbox')){
    const b=document.createElement('div'); b.id='utbox'; b.className='utbox no-print'; document.body.appendChild(b);}
  UT.view=S.view; UT.t0=Date.now(); UT.act=Date.now(); UT.saved=Date.now();
  ['mousemove','mousedown','keydown','touchstart','wheel','input'].forEach(e=>
    window.addEventListener(e,utMark,{passive:true}));
  document.addEventListener('visibilitychange',()=>{ if(document.hidden){utFlush();try{save();}catch(e){}} else {UT.t0=Date.now();utMark();} });
  window.addEventListener('beforeunload',()=>{utFlush();try{save();}catch(e){}});
  if(UT.int)clearInterval(UT.int);
  UT.int=setInterval(utTick,1000);
  utPaint();}
/* 성찰·통계용 — 메뉴별 전체 사용 시간 표 */

    <label style="font-size:13px;font-weight:600;display:block;margin-top:10px">

      설계·계획 화면에만 시간이 몰려 있다면, 그것은 계획이 실행을 대신하고 있다는 신호입니다.</p>
  </div>`;}


/* ============================================================
   ⑬ 기기 간 동기화 — 노트북 ↔ 휴대폰을 오가며 써도 안전하게
   ------------------------------------------------------------
   [이전 구조의 문제]
   자동 동기화가 '올리기'만 자동이었습니다. 다른 기기에서 열면 옛 기록이 뜨고,
   거기서 한 글자만 입력해도 4초 뒤 그 옛 기록이 클라우드를 덮어써 버렸습니다.
   [지금 구조]
   ① 열 때(로그인 직후) 반드시 '먼저 맞추고' 시작한다 — 맞추기 전에는 절대 올리지 않는다.
   ② 올리기 직전 클라우드가 그새 바뀌었는지 확인한다.
   ③ 마지막에 저장한 쪽이 이기는 방식이 아니라 **날짜·항목 단위로 병합**한다.
      (노트북에서 쓴 8/8과 휴대폰에서 쓴 8/9이 둘 다 살아남는다)
   ============================================================ */
let CLOUD={ready:false,busy:false,state:'off',mtime:'',msg:''};
let STAMP={days:{},weeks:{},months:{},rest:'',init:false};
let stampTimer=null, DIRTY=false;

/* ---- 어떤 항목이 언제 바뀌었는지 도장을 찍는다 (병합의 근거) ---- */
function stripU(o){const c=Object.assign({},o);delete c.u;return c;}
function stampTick(){
  let changed=false;
  ['days','weeks','months'].forEach(k=>{
    const box=S[k]||{}, cache=STAMP[k];
    Object.keys(box).forEach(key=>{
      let s; try{s=JSON.stringify(stripU(box[key]));}catch(e){return;}
      if(cache[key]!==s){
        if(STAMP.init&&cache[key]!==undefined){box[key].u=Date.now();changed=true;}
        else if(STAMP.init){box[key].u=box[key].u||Date.now();changed=true;}
        cache[key]=s;
      }
    });
  });
  let rest='';
  try{ rest=JSON.stringify({p:S.profile,m:S.mission,l:S.lifemap,v:S.vision,a:S.annual,
        h:S.habits,r:S.reading,i:S.ideas,rc:S.recurring,rm:S.reminders,f:S.focusLog,
        st:Object.assign({},S.settings,{gClientId:'',gcalId:'',utShow:'',utOpen:'',autoCloud:''})}); }catch(e){}
  if(STAMP.rest!==rest){ if(STAMP.init&&STAMP.rest!=='')changed=true; STAMP.rest=rest; }
  if(!STAMP.init){STAMP.init=true;return;}
  if(changed){
    S.meta.updatedAt=Date.now(); DIRTY=true;
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    try{scheduleCloud();}catch(e){}
  }
}
function stampSchedule(){ if(stampTimer)clearTimeout(stampTimer); stampTimer=setTimeout(stampTick,700); }

/* ---- 병합 ---- */
function mergeDict(A,B,lu,ru){
  A=A||{};B=B||{};const out={};
  Object.keys(A).forEach(k=>{const a=A[k],b=B[k];
    out[k]=(b===undefined)?a:(((a&&a.u)||lu)>=((b&&b.u)||ru)?a:b);});
  Object.keys(B).forEach(k=>{if(out[k]===undefined)out[k]=B[k];});
  return out;}
function mergeMaxNum(A,B){A=A||{};B=B||{};const out={};
  Object.keys(A).forEach(k=>out[k]=Math.max(A[k]||0,B[k]||0));
  Object.keys(B).forEach(k=>{if(out[k]===undefined)out[k]=B[k]||0;});
  return out;}
function itemKey(x){return (x&&x.id)||('#'+String((x&&(x.text||x.title||x.name))||JSON.stringify(x||'')).slice(0,60));}
function mergeArr(A,B,lu,ru){
  A=A||[];B=B||[];const seen={},out=[];
  A.forEach(x=>{const k=itemKey(x);const y=B.find(z=>itemKey(z)===k);
    out.push(y&&((y.u||ru)>(x.u||lu))?y:x);seen[k]=1;});
  B.forEach(x=>{const k=itemKey(x);if(!seen[k]){out.push(x);seen[k]=1;}});
  return out;}
function mergeUsage(a,b){ a=a||{};b=b||{};
  const A=a.byDay||{},B=b.byDay||{},byDay={};
  Object.keys(A).concat(Object.keys(B)).forEach(d=>{ if(byDay[d])return;
    const x=A[d]||{total:0,views:{}},y=B[d]||{total:0,views:{}};
    byDay[d]={total:Math.max(x.total||0,y.total||0),views:mergeMaxNum(x.views,y.views)};});
  const byView=mergeMaxNum(a.byView,b.byView);
  const sum=Object.keys(byDay).reduce((s,d)=>s+(byDay[d].total||0),0);
  return {total:Math.max(a.total||0,b.total||0,sum),byView,byDay};}
function mergeState(L,R){
  const lu=(L.meta&&L.meta.updatedAt)||0, ru=(R.meta&&R.meta.updatedAt)||0;
  const localWins=lu>=ru;
  const base=JSON.parse(JSON.stringify(localWins?L:R));      /* 단일 값(사명·비전 등)의 기준 */
  base.days=mergeDict(L.days,R.days,lu,ru);
  base.weeks=mergeDict(L.weeks,R.weeks,lu,ru);
  base.months=mergeDict(L.months,R.months,lu,ru);
  base.focusLog=mergeMaxNum(L.focusLog,R.focusLog);
  base.usage=mergeUsage(L.usage,R.usage);
  base.habits=mergeArr(L.habits,R.habits,lu,ru);
  base.reading=mergeArr(L.reading,R.reading,lu,ru);
  base.ideas=mergeArr(L.ideas,R.ideas,lu,ru);
  base.recurring=mergeArr(L.recurring,R.recurring,lu,ru);
  base.reminders=mergeArr(L.reminders,R.reminders,lu,ru);
  base.annual=Object.assign({},localWins?L.annual:R.annual,
    {goals:mergeArr((L.annual||{}).goals,(R.annual||{}).goals,lu,ru)});
  /* 키 합집합 — 값이 겹치면 '더 최근에 고친 기기' 쪽을 쓴다 */
  const pref=(A,B)=>localWins?Object.assign({},B||{},A||{}):Object.assign({},A||{},B||{});
  base.lifemap=Object.assign({},localWins?L.lifemap:R.lifemap,{
    dreams:mergeArr((L.lifemap||{}).dreams,(R.lifemap||{}).dreams,lu,ru),
    areas:pref((L.lifemap||{}).areas,(R.lifemap||{}).areas),
    milestones:pref((L.lifemap||{}).milestones,(R.lifemap||{}).milestones)});
  base.vision=Object.assign({},localWins?L.vision:R.vision,
    {text:pref((L.vision||{}).text,(R.vision||{}).text)});
  base.profile=localWins?L.profile:R.profile;
  /* 기기 전용 설정은 이 기기 것을 지킨다 */
  base.settings=Object.assign({},base.settings,{
    gClientId:(L.settings||{}).gClientId, gcalId:(L.settings||{}).gcalId,
    autoCloud:(L.settings||{}).autoCloud, utShow:(L.settings||{}).utShow, utOpen:(L.settings||{}).utOpen});
  base.meta=Object.assign({},base.meta,{
    devId:(L.meta||{}).devId, rev:Math.max((L.meta||{}).rev||0,(R.meta||{}).rev||0),
    updatedAt:Math.max(lu,ru), lastBackup:(L.meta||{}).lastBackup||(R.meta||{}).lastBackup||''});
  base.view=L.view; base.ui=L.ui;
  return base;}

/* ---- 업로드 ---- */
async function cloudPut(content){
  if(!cloudFileId){const f=await driveFind(); if(f)cloudFileId=f.id;}
  if(cloudFileId){
    await gFetch('https://www.googleapis.com/upload/drive/v3/files/'+cloudFileId+'?uploadType=media',
      {method:'PATCH',headers:{'Content-Type':'application/json'},body:content});
  }else{
    const boundary='diarybnd'+Math.abs(0|(performance.now()));
    const body='--'+boundary+'\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n'+
      JSON.stringify({name:CLOUD_NAME,parents:['appDataFolder']})+'\r\n--'+boundary+
      '\r\nContent-Type: application/json\r\n\r\n'+content+'\r\n--'+boundary+'--';
    const r=await fetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id',
      {method:'POST',headers:{'Authorization':'Bearer '+GCAL.token,'Content-Type':'multipart/related; boundary='+boundary},body:body});
    if(!r.ok){const t=await r.text();url_hint_last='drive';throw gApiError(r.status,t);}
    const j=await r.json(); cloudFileId=j.id;
  }}

/* ---- 핵심: 맞추기(내려받아 병합 → 올리기) ---- */
async function cloudSync(silent){
  if(!gTokenValid()){ setCloudState('auth'); if(!silent)toast('먼저 구글 로그인이 필요합니다'); return false; }
  if(CLOUD.busy)return false;
  CLOUD.busy=true; setCloudState('sync');
  try{
    const f=await driveFind();
    let merged=false;
    if(f){
      cloudFileId=f.id;
      const remote=await gFetch('https://www.googleapis.com/drive/v3/files/'+f.id+'?alt=media');
      if(remote&&typeof remote==='object'&&remote.days){
        const before=JSON.stringify({d:S.days,w:S.weeks,m:S.months,h:S.habits,r:S.reading,i:S.ideas,a:S.annual,l:S.lifemap,v:S.vision});
        S=mergeState(S,remote); migrate();
        const after=JSON.stringify({d:S.days,w:S.weeks,m:S.months,h:S.habits,r:S.reading,i:S.ideas,a:S.annual,l:S.lifemap,v:S.vision});
        merged=(before!==after);
      }
    }
    S.meta.rev=(S.meta.rev||0)+1;
    S.meta.syncedRev=S.meta.rev;
    await cloudPut(JSON.stringify(S));
    const f2=await driveFind(); CLOUD.mtime=(f2&&f2.modifiedTime)||'';
    S.settings.cloudSyncedAt=new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    STAMP={days:{},weeks:{},months:{},rest:'',init:false}; stampTick();   /* 도장 캐시 재설정 */
    CLOUD.ready=true; DIRTY=false; setCloudState('ok');
    if(merged){ renderNav(); render(); refreshWho();
      if(!silent)toast('☁ 다른 기기의 기록과 합쳤습니다 — 최신 상태입니다');
      else toast('☁ 다른 기기의 기록을 가져와 합쳤습니다'); }
    else if(!silent)toast('☁ 최신 상태입니다');
    return true;
  }catch(e){ setCloudState('err'); if(!silent)gReport('동기화 실패',e); return false; }
  finally{ CLOUD.busy=false; }}

/* ---- 자동 저장(가벼운 올리기). 클라우드가 그새 바뀌었으면 전체 맞추기로 전환 ---- */
async function cloudPush(){
  if(!(S.settings&&S.settings.autoCloud))return;
  if(!gTokenValid()||!CLOUD.ready||CLOUD.busy)return;
  CLOUD.busy=true; setCloudState('sync');
  try{
    const f=await driveFind();
    if(f&&CLOUD.mtime&&f.modifiedTime!==CLOUD.mtime){    /* 다른 기기가 먼저 올렸다 → 병합 경로 */
      CLOUD.busy=false; await cloudSync(true); return;
    }
    if(f)cloudFileId=f.id;
    S.meta.rev=(S.meta.rev||0)+1;
    await cloudPut(JSON.stringify(S));
    const f2=await driveFind(); CLOUD.mtime=(f2&&f2.modifiedTime)||'';
    S.settings.cloudSyncedAt=new Date().toISOString();
    try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}
    DIRTY=false; setCloudState('ok');
  }catch(e){ setCloudState('err'); }
  finally{ CLOUD.busy=false; }}

/* ---- 상태 칩 ---- */
function setCloudState(s){CLOUD.state=s;paintCloud();}
function cloudChipText(){
  if(!(S.settings&&S.settings.gClientId))return {t:'☁ 동기화 꺼짐',c:'#9aa3af',tip:'구글 연동에서 설정하면 기기 간에 같은 기록을 씁니다'};
  switch(CLOUD.state){
    case 'sync':return {t:'☁ 맞추는 중…',c:'#2f6db3',tip:''};
    case 'ok':{const t=S.settings.cloudSyncedAt?new Date(S.settings.cloudSyncedAt).toLocaleTimeString('ko-KR',{hour:'2-digit',minute:'2-digit'}):'';
      return {t:'☁ 최신 '+t,c:'#12a594',tip:'이 기기와 클라우드가 같은 내용입니다'};}

  }}

/* ============================================================
   ⑭ 수업 기록 (교사용 모듈) — 차시 누가기록을 다이어리 안으로
   ------------------------------------------------------------
   왜 합쳤는가:
   · 같은 수업을 '일간 계획 시간표'와 '차시 기록'에 두 번 적는 구조는 반드시 실패한다.
   · 수업은 교사의 하루에서 가장 자주 일어나는 실천이다 — 다이어리를 여는 가장 강한 이유.
   · 합치면 클라우드 동기화·백업·기기 간 병합이 그대로 따라온다.
   교사가 아닌 사용자에게는 보이지 않도록 기본은 꺼져 있다(S.klass.on).
   ============================================================ */
const KDOW=['','월','화','수','목','금'];
const KPAL=['#5b53b0','#1f9d8f','#2f6db3','#c98a1a','#b23a55','#6a4fbb','#2fa36b','#e0552e',
            '#0f9b9b','#cf6a2e','#7b5ea7','#3aa76d'];
const KPERIODS=[['09:00','09:50'],['10:00','10:50'],['11:00','11:50'],['12:00','12:50'],
                ['13:50','14:40'],['14:50','15:40'],['15:50','16:40']];
function kBlank(){return{on:false,importedAt:'',
  term:{name:'',start:'',end:''},
  periods:KPERIODS.map((x,i)=>({p:i+1,s:x[0],e:x[1]})),
  tt:[],colors:{},off:[],swap:[],moves:[],logs:{},ui:{g:'',tab:'today'}};}
function kFix(){
  const b=kBlank(); const k=Object.assign(b,S.klass||{});
  k.term=Object.assign(b.term,k.term||{}); k.ui=Object.assign(b.ui,k.ui||{});
  if(!Array.isArray(k.periods)||!k.periods.length)k.periods=b.periods;
  k.periods=k.periods.map((p,i)=>({p:i+1,s:p.s||'09:00',e:p.e||'09:50'}));
  ['tt','off','swap','moves'].forEach(f=>{if(!Array.isArray(k[f]))k[f]=[];});
  if(!k.colors||typeof k.colors!=='object')k.colors={};
  if(!k.logs||typeof k.logs!=='object')k.logs={};
  S.klass=k; return k;}
function K(){return S.klass||kFix();}
function kReady(){const k=K();return !!(k.term.start&&k.term.end&&k.tt.length);}
function kOn(){return !!(K().on&&kReady());}
function kPerOf(p){return K().periods.find(x=>x.p===p)||{p:p,s:'',e:''};}
function kOffMap(){const m={};(K().off||[]).forEach(o=>{if(o.d)m[o.d]=o.t||'휴업일';});return m;}
function kSwapMap(){const m={};(K().swap||[]).forEach(o=>{if(o.d&&o.use>=1&&o.use<=5)m[o.d]=o;});return m;}
/* 교시 단위 수업 이동·취소·보강 — k='move'|'off'|'add' */
function kMoveOut(){const m={};(K().moves||[]).forEach(o=>{
  if((o.k==='move'||o.k==='off')&&o.fd&&o.fp)m[o.fd+'|'+o.fp]=o;});return m;}
function kMoveIn(){const m={};(K().moves||[]).forEach(o=>{
  if((o.k==='move'||o.k==='add')&&o.td&&o.tp)(m[o.td]=m[o.td]||[]).push(o);});return m;}
function kSlotAt(d,p){const sp=kSwapMap()[d];
  const dow=sp?sp.use:parseD(d).getDay();
  if(dow<1||dow>5)return null;
  return K().tt.find(x=>x.d===dow&&x.p===p)||null;}
function kMoveLabel(o){
  const f=o.fd?`${o.fd.slice(5)}(${wd(o.fd)}) ${o.fp}교시`:'';
  const t=o.td?`${o.td.slice(5)}(${wd(o.td)}) ${o.tp}교시`:'';
  if(o.k==='move')return f+' → '+t;
  if(o.k==='off')return f+' 수업 없음';
  return t+' 보강';}
function kGroups(){const k=K(),seen=[];
  k.tt.slice().sort((a,b)=>a.d-b.d||a.p-b.p).forEach(x=>{const n=(x.g||'').trim();if(n&&seen.indexOf(n)<0)seen.push(n);});
  return seen.sort((a,b)=>a.localeCompare(b,'ko',{numeric:true}));}
function kColor(g){const k=K(); if(k.colors[g])return k.colors[g];
  const i=kGroups().indexOf(g); return KPAL[(i<0?0:i)%KPAL.length];}

/* 차시 계산 — 같은 입력이면 다시 세지 않는다(시간표 렌더가 잦다) */
let KCACHE={sig:'',days:null,map:{}};
function kSig(){const k=K();return JSON.stringify([k.term,k.tt,k.off,k.swap,k.moves,k.periods]);}
function kDayMap(){
  const sig=kSig(); if(KCACHE.sig!==sig)KCACHE={sig:sig,days:null,map:{}};
  if(KCACHE.days)return KCACHE.days;
  const days={}, k=K();
  if(kReady()){
    const off=kOffMap(), sw=kSwapMap(), mo=kMoveOut(), mi=kMoveIn();
    let d=k.term.start, guard=0;
    while(d<=k.term.end && guard++<2000){
      let arr=[];
      if(!off[d]){
        const sp=sw[d], dow=sp?sp.use:parseD(d).getDay();
        if(dow>=1&&dow<=5)arr=k.tt.filter(x=>x.d===dow&&(x.g||'').trim()&&!mo[d+'|'+x.p])
          .map(x=>({g:(x.g||'').trim(),p:x.p,room:x.room||'',sp:sp||null,mv:null}));
        (mi[d]||[]).forEach(o=>{
          let g='',room='';
          if(o.k==='add'){g=(o.g||'').trim();}
          else{const s=kSlotAt(o.fd,o.fp); if(s){g=(s.g||'').trim();room=s.room||'';}}
          if(g)arr.push({g:g,p:o.tp,room:room,sp:sp||null,mv:o});});
        arr.sort((a,b)=>a.p-b.p);
      }
      days[d]=arr; d=addDays(d,1);
    }
  }
  KCACHE.days=days; return days;}
function kLessons(g){
  if(!kReady())return [];
  const dm=kDayMap(); if(KCACHE.map[g])return KCACHE.map[g];
  const out=[]; let n=0;
  Object.keys(dm).sort().forEach(d=>{
    dm[d].filter(x=>x.g===g).forEach(x=>{
      const pe=kPerOf(x.p); n++;
      out.push({no:n,date:d,p:x.p,room:x.room,g:g,start:pe.s,end:pe.e,
        key:g+'|'+d+'|'+x.p,
        swap:x.sp?{real:parseD(d).getDay(),use:x.sp.use,t:x.sp.t||''}:null,
        mv:x.mv||null});});});
  KCACHE.map[g]=out; return out;}
function kLessonsOn(d){const out=[];
  if(!kReady())return out;
  kGroups().forEach(g=>kLessons(g).forEach(x=>{if(x.date===d)out.push(x);}));
  return out.sort((a,b)=>a.p-b.p);}
function kFind(key){const g=String(key).split('|')[0];return kLessons(g).find(x=>x.key===key)||null;}
function kLog(key){const k=K(); if(!k.logs[key])k.logs[key]={done:false,prog:'',note:'',absent:''}; return k.logs[key];}
function kSetLog(key,f,v){kLog(key)[f]=v;save();}
function kToggleDone(key){const l=kLog(key);l.done=!l.done;if(l.done&&!l.at)l.at=today();save();render();}
function kProgress(g){const ls=kLessons(g),k=K();
  const done=ls.filter(x=>(k.logs[x.key]||{}).done).length;
  return {done,total:ls.length,pct:ls.length?Math.round(done/ls.length*100):0};}
function kNext(g){const t=today();return kLessons(g).find(x=>x.date>=t)||null;}

/* ── 차시 기록 모달 (시간표 블록·오늘 수업 어디서나 같은 창) ── */
function openLesson(key){
  const x=kFind(key); if(!x){toast('수업을 찾지 못했습니다');return;}
  const l=kLog(key);
  modalBox(`<h3 style="margin:0 0 4px">📚 ${esc(x.g)} <span class="tag" style="background:${kColor(x.g)}">${x.no}차시</span></h3>

      ${x.room?' · '+esc(x.room):''}${x.swap?` · <span style="color:var(--gold);font-weight:800">${wd(x.date)}→${KDOW[x.swap.use]}요일 시간표</span>`:''}${x.mv?` · <span style="color:var(--brand);font-weight:800">${x.mv.k==='add'?'보강':'이동 ←'+x.mv.fd+' '+x.mv.fp+'교시'}</span>`:''}</div>
    <label class="fld"><span class="lb">진도 (단원 · 학습 내용)</span>

        title="지금 적은 내용을 다른 반의 같은 차시에 한 번에 넣습니다">↗ 다른 반에도 적용</button>

/* ============================================================
   ㉑ 같은 수업을 여러 반에 — «수업 내용 불러오기» · «다른 반에도 적용»
   ------------------------------------------------------------
   과학탐구실험 9개 반, 역학과 에너지 3개 반처럼 같은 내용을 여러 번 적는 일이
   기록을 포기하게 만드는 가장 큰 마찰입니다. 그렇다고 자동으로 똑같이 채우면
   반마다 진도가 달라지는 실제를 담지 못합니다. 그래서 «자동»이 아니라
   «한 번 고르면 한 번에 들어가는» 방식으로 만들었습니다.
   ============================================================ */
let KPICK={key:'',mode:'over',f:{prog:true,note:true,absent:false},q:''};
function kAfter(){
  if(S.view==='day'){renderSchedule(S.ui.day);vDay(document.getElementById('view'));}
  else if(S.view==='checkin'){vCheckin(document.getElementById('view'));}
  else render();}
/* 모달을 갈아끼우기 전에 지금 입력한 값을 잃지 않도록 먼저 거둬들인다 */
function klCapture(key){
  const l=kLog(key), g=x=>{const e=document.getElementById(x);return e?e.value.trim():null};
  const p=g('klProg'), n=g('klNote'), a=g('klAbs');
  if(p!==null)l.prog=p; if(n!==null)l.note=n; if(a!==null)l.absent=a;
  save(); return l;}

/* 반 이름에서 숫자·기호를 뺀 부분을 «과목»으로 본다.
   «과탐실 1~9» 와 «역학 1~3» 은 차시 번호가 같아도 다른 수업이므로 갈라서 보여준다.
   «2-1 · 2-3» 처럼 숫자만인 이름은 모두 빈 문자열이 되어 한 과목으로 묶인다(한 과목만 가르치는 경우). */
function kSubj(g){return String(g||'').replace(/[0-9\s\-_.·]+/g,'').trim();}

/* 불러올 후보 — 같은 차시 → 같은 날 → 이 반 이전 차시 → 다른 과목 → 최근 기록 */
function kSources(key){
  const x=kFind(key); if(!x)return [];
  const k=K(), out=[], seen={};
  const push=(y,tag,c)=>{
    if(!y||y.key===key||seen[y.key])return;
    const l=k.logs[y.key]||{};
    if(!(l.prog||l.note||l.absent))return;         /* 내용이 있는 것만 */
    seen[y.key]=1; out.push({x:y,l:l,tag:tag,c:c});};
  const sj=kSubj(x.g);
  kGroups().forEach(g=>{ if(g===x.g||kSubj(g)!==sj)return;
    kLessons(g).forEach(y=>{ if(y.no===x.no)push(y,'같은 차시','var(--brand)'); }); });
  kLessonsOn(x.date).forEach(y=>push(y,'같은 날','var(--accent)'));
  kGroups().forEach(g=>{ if(g===x.g||kSubj(g)===sj)return;
    kLessons(g).forEach(y=>{ if(y.no===x.no)push(y,'다른 과목','var(--gold)'); }); });
  kLessons(x.g).filter(y=>y.no<x.no).slice(-4).reverse().forEach(y=>push(y,'이 반 이전','var(--gold)'));
  const all=[]; kGroups().forEach(g=>kLessons(g).forEach(y=>all.push(y)));
  all.sort((a,b)=>b.date.localeCompare(a.date)||b.p-a.p);
  all.slice(0,120).forEach(y=>push(y,'최근','#8792a3'));
  return out.slice(0,60);}

    <div class="klist" id="ksrclist">
      ${src.length? src.map(o=>{

            ${o.l.prog?`<div class="kp">${esc(o.l.prog)}</div>`:''}

          </span>

       :'<p class="hint">아직 불러올 기록이 없습니다. 한 반을 먼저 적으면 나머지 반에서 여기로 불러올 수 있습니다.</p>'}
    </div>
    <div style="display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap">
      <button class="btn ghost" onclick="openLessonApply('${esc(key)}')">↗ 반대로 — 이 내용을 다른 반에</button>
      <button class="btn ghost" onclick="openLesson('${esc(key)}')">← 기록 창으로</button></div>`);

function kPullFrom(key,srcKey){

    const v=(sl[f]||'').trim(); if(!v)return;

    else l[f]=v; };
  put('prog'); put('note'); put('absent');
  if(!l.done&&(l.prog||l.note)){l.done=true;l.at=today();}

/* 반대 방향 — 지금 쓴 내용을 다른 반의 같은 차시에 한 번에 넣기 */
function kTargets(key){
  const x=kFind(key); if(!x)return [];
  const k=K(), out=[], seen={};
  const push=(y,tag,c,same)=>{ if(!y||y.key===key||seen[y.key])return; seen[y.key]=1;
    const l=k.logs[y.key]||{};
    out.push({x:y,l:l,tag:tag,c:c,empty:!(l.prog||l.note),same:!!same});};
  const sj=kSubj(x.g);
  kGroups().forEach(g=>{ if(g===x.g||kSubj(g)!==sj)return;
    kLessons(g).forEach(y=>{ if(y.no===x.no)push(y,'같은 차시','var(--brand)',true); }); });
  kLessonsOn(x.date).forEach(y=>push(y,'같은 날','var(--accent)',kSubj(y.g)===sj));
  kGroups().forEach(g=>{ if(g===x.g||kSubj(g)===sj)return;
    kLessons(g).forEach(y=>{ if(y.no===x.no)push(y,'다른 과목','var(--gold)',false); }); });
  return out;}

          ${o.l.prog?`<span class="hint"> — ${esc(o.l.prog.slice(0,26))}</span>`:''}</span>
        ${o.empty?'':'<span class="kw">이미 적힘</span>'}

    </div>

function kApplyTo(key){
  const l=kLog(key), k=K();
  const gf=i=>{const e=document.getElementById(i);return !!(e&&e.checked)};
  const F={prog:gf('kaP'),note:gf('kaN'),absent:gf('kaA')}, over=gf('kaOver');
  const keys=[...document.querySelectorAll('.katg:checked')].map(e=>e.value);
  if(!keys.length){toast('넣을 반을 고르세요');return;}
  let n=0,skip=0;
  keys.forEach(tk=>{
    const t=kLog(tk);
    if(!over&&(t.prog||t.note)){skip++;return;}
    let put=false;
    ['prog','note','absent'].forEach(f=>{ if(!F[f])return;
      const v=(l[f]||'').trim(); if(!v)return; t[f]=v; put=true;});
    if(put){ if(!t.done){t.done=true;t.at=today();} n++; }});
  save(); closeModal();
  toast(n+'개 반에 넣었습니다'+(skip?' (이미 적힌 '+skip+'개는 건너뜀)':''));
  kAfter();}

function kSaveLesson(key,toggle){
  const l=kLog(key), g=x=>{const e=document.getElementById(x);return e?e.value.trim():'';};

  else if(!l.done&&(l.prog||l.note)){l.done=true;l.at=today();}   /* 적었으면 한 것이다 */
  save(); closeModal(); toast('차시 기록을 저장했습니다');
  kAfter();}

function kAddPeriod(){const k=K(),last=k.periods[k.periods.length-1]||{e:'09:00'};
  const m=toMin(last.e)+10, s=m2s(m), e=m2s(m+50);
  k.periods.push({p:k.periods.length+1,s:s,e:e});save();render();}
function kDelPeriod(){const k=K(),n=k.periods.length; if(n<=1){toast('최소 1교시는 있어야 합니다');return;}
  const used=k.tt.filter(x=>x.p===n).length;
  if(used&&!confirm(n+'교시에 입력된 수업 '+used+'칸도 함께 지워집니다. 계속할까요?'))return;
  k.tt=k.tt.filter(x=>x.p!==n);k.periods.pop();save();render();renderNav();}
function kCell(d,p){return K().tt.find(x=>x.d===d&&x.p===p)||null;}
function kSetCell(d,p,f,val){const k=K();val=(val||'').trim();let c=kCell(d,p);
  if(f==='g'){ if(!val){if(c)k.tt=k.tt.filter(x=>x!==c);} else {if(!c){c={d:d,p:p,g:val,room:''};k.tt.push(c);}else c.g=val;} }
  else { if(!c)return; c.room=val; }
  save();renderNav();render();}
