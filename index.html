<title>나의 인생·실천 다이어리 (구글 연동)</title>
<style>
  :root{
    --bg:#f5f6fa;--card:#fff;--ink:#20242e;--muted:#6b7280;--line:#e6e8ef;
    --brand:#5b53b0;--brand-d:#403a86;--brand-soft:#eeecfa;
    --accent:#1f9d8f;--accent-soft:#e5f6f3;--gold:#c98a1a;
    --done:#12a594;--prog:#2f6db3;--hold:#e0a52f;--drop:#9aa3af;--del:#d1495b;
    --shadow:0 2px 10px rgba(30,25,60,.06),0 10px 30px rgba(30,25,60,.05);
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Pretendard","Apple SD Gothic Neo","Malgun Gothic",system-ui,-apple-system,sans-serif;
    color:var(--ink);background:var(--bg);line-height:1.6;-webkit-font-smoothing:antialiased}
  /* layout */
  .app{display:flex;min-height:100vh}
  .side{width:210px;flex:none;background:linear-gradient(180deg,#403a86,#2c2860);color:#fff;padding:16px 12px;position:sticky;top:0;height:100vh;overflow-y:auto}
  .side .logo{font-size:16px;font-weight:800;padding:6px 8px 12px;line-height:1.3}
  .side .logo small{display:block;font-weight:500;opacity:.7;font-size:11px;margin-top:3px}
  .side .logo small#utTotal{opacity:1;color:#ffe6a8;font-weight:700;font-size:11.5px;margin-top:5px}
  .side .grp{font-size:10.5px;font-weight:700;letter-spacing:1px;opacity:.55;margin:14px 8px 5px}
  .navi{display:block;width:100%;text-align:left;border:none;background:transparent;color:#e7e5f5;
    padding:9px 10px;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;margin-bottom:2px}
  .navi:hover{background:rgba(255,255,255,.1)}
  .navi.on{background:#fff;color:var(--brand-d);font-weight:800}
  .navi .em{margin-right:8px}
  .main{flex:1;min-width:0}
  .topbar{background:#fff;border-bottom:1px solid var(--line);padding:10px 22px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:30;flex-wrap:wrap;gap:8px}
  .topbar .who{font-size:13px;color:var(--muted)}
  .topbar .who b{color:var(--ink)}
  .tools{display:flex;gap:6px;flex-wrap:wrap}
  .tbtn{background:var(--brand-soft);color:var(--brand-d);border:1px solid #ddd8f5;padding:7px 11px;border-radius:8px;font-size:12px;font-weight:700;cursor:pointer;font-family:inherit}
  .tbtn:hover{background:#e2ddf7}
  .tbtn.cloudchip{background:#fff;border:1px solid var(--line)}
  .tbtn.cloudchip.busy{animation:cpulse 1.1s ease-in-out infinite}
  @keyframes cpulse{0%,100%{opacity:1}50%{opacity:.45}}
  .save{font-size:11px;color:var(--muted);align-self:center}
  .wrap{padding:22px 24px 80px;max-width:1000px}
  @media(max-width:820px){.app{flex-direction:column}.side{width:100%;height:auto;position:static;display:flex;flex-wrap:wrap;gap:4px}
    .side .logo{width:100%}.side .grp{display:none}.navi{width:auto;margin:0}.wrap{padding:16px 14px 70px}}

  h2.vh{font-size:22px;margin:0 0 4px;font-weight:800}
  .vsub{color:var(--muted);font-size:14px;margin:0 0 18px}
  .step-badge{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--brand);border-radius:6px;padding:2px 9px;margin-bottom:8px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:15px;padding:20px 22px;box-shadow:var(--shadow);margin-bottom:16px}
  .card h3{margin:0 0 12px;font-size:16px;font-weight:800}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px}
  @media(max-width:720px){.grid2,.grid3{grid-template-columns:1fr}}
  label.fld{display:block;margin-bottom:12px}
  label.fld .lb{display:block;font-size:12.5px;font-weight:700;color:var(--brand-d);margin-bottom:4px}
  .hint{font-weight:500;color:var(--muted);font-size:11.5px}
  input[type=text],input[type=number],input[type=time],input[type=date],input[type=datetime-local],input[type=month],input[type=week],textarea,select{
    width:100%;border:1px solid var(--line);border-radius:9px;padding:9px 11px;font-size:14px;font-family:inherit;color:var(--ink);background:#fdfdff}
  input:focus,textarea:focus,select:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px rgba(91,83,176,.13)}
  textarea{resize:vertical;min-height:60px}
  .btn{background:var(--brand);color:#fff;border:none;padding:9px 15px;border-radius:9px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
  .btn:hover{background:var(--brand-d)}
  .btn.ghost{background:var(--brand-soft);color:var(--brand-d);border:1px solid #ddd8f5}
  .btn.sm{padding:6px 10px;font-size:12px}
  .btn.acc{background:var(--accent)} .btn.acc:hover{filter:brightness(.92)}
  .row-item{display:flex;gap:8px;align-items:flex-start;margin-bottom:8px}
  .row-item input,.row-item select,.row-item textarea{flex:1}
  .del-x{border:none;background:transparent;color:#c2c7d6;cursor:pointer;font-size:15px;font-weight:800;padding:2px 4px}
  .del-x:hover{color:var(--del)}
  .callout{border-radius:12px;padding:14px 16px;font-size:13.5px;border:1px solid;margin:0 0 16px}
  .co-brand{background:var(--brand-soft);border-color:#ddd8f5}
  .co-acc{background:var(--accent-soft);border-color:#c4e8e2}
  .co-gold{background:#fbf3e2;border-color:#f0e0b8}
  .tag{display:inline-block;font-size:10.5px;font-weight:800;color:#fff;background:var(--brand);border-radius:5px;padding:2px 8px;margin-bottom:6px}
  .co-acc .tag{background:var(--accent)} .co-gold .tag{background:var(--gold)}
  .chips{display:flex;flex-wrap:wrap;gap:7px}
  .chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 12px;font-size:12.5px;font-weight:600;cursor:pointer;user-select:none}
  .chip.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .mini{font-size:11.5px;font-weight:800;color:var(--brand);letter-spacing:.4px;text-transform:uppercase;margin-bottom:6px}
  .foot-nav{display:flex;justify-content:space-between;margin-top:18px;gap:10px}

  /* quote */
  .quote{background:linear-gradient(135deg,var(--brand-soft),var(--accent-soft));border:1px solid var(--line);border-radius:14px;padding:16px 18px}
  .quote .qk{font-size:10.5px;font-weight:800;color:var(--brand);letter-spacing:.5px}
  .quote .qen{font-size:16px;font-weight:700;font-style:italic;color:var(--brand-d);margin-top:5px;line-height:1.5}
  .quote .qko{font-size:14px;margin-top:6px}
  .quote .qby{font-size:12px;color:var(--muted);margin-top:5px}
  .quote .qword{font-size:12.5px;color:var(--brand-d);background:rgba(255,255,255,.6);border-radius:6px;padding:5px 9px;margin-top:8px;font-weight:600}
  .quote .qbtns{margin-top:9px}

  /* tasks */
  .task{display:flex;gap:8px;align-items:flex-start;padding:8px 9px;border-radius:9px;border:1px solid transparent;margin-bottom:4px}
  .task.s-todo{border-bottom:1px dashed var(--line);border-radius:0}
  .task.s-done{background:#e6f6ee;border:2px solid var(--done);box-shadow:inset 3px 0 0 var(--done)}
  .task.s-prog{background:#e9f1fb;border-color:#cfe0f2}
  .task.s-hold{background:#fdf6e3;border-color:#f0dfa8}
  .task.s-deleg{background:#f1f0fb;border-color:#d8d4f2}
  .task.s-drop{background:#f3f4f6;border-color:#e2e5ea}
  .task .pri{flex:none;width:26px;height:26px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
  .pri.A{background:#d1495b} .pri.B{background:#e0a52f} .pri.C{background:#7c8798}
  .task .txt{flex:1;font-size:13.5px}
  .task .txt .role{font-size:10px;color:#fff;background:var(--brand);border-radius:4px;padding:1px 6px;margin-right:5px;font-weight:700}
  /* 완료는 '지워진 것'이 아니라 '해낸 것' — 취소선 대신 밑줄과 두꺼운 테두리로 강조한다 */
  .task.s-done .txt{color:var(--brand-d);font-weight:800;
    text-decoration:underline;text-decoration-color:var(--done);text-decoration-thickness:3px;text-underline-offset:3px}
  .task.s-drop .txt{color:var(--muted);opacity:.7}
  .stsel{flex:none;width:auto;font-size:11px;padding:3px 5px;border-radius:6px;border:1px solid var(--line);background:#fff}
  .addrow{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
  .addrow input{flex:1;min-width:120px}

  table.cal{width:100%;border-collapse:collapse;table-layout:fixed}
  table.cal th{font-size:11.5px;color:var(--muted);padding:5px;font-weight:700}
  table.cal td{border:1px solid var(--line);height:74px;vertical-align:top;padding:4px 5px;cursor:pointer;border-radius:6px}
  table.cal td:hover{background:var(--brand-soft)}
  table.cal td.oth{background:#fafafe;color:#c2c7d6}
  table.cal td.today{outline:2px solid var(--brand);outline-offset:-2px}
  table.cal .dn{font-size:12px;font-weight:700}
  table.cal .dot{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--accent);margin:1px}
  table.cal .mini-goal{font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;max-height:28px}

  .habgrid{overflow-x:auto}
  table.hab{border-collapse:collapse;font-size:11px;min-width:100%}
  table.hab th,table.hab td{border:1px solid var(--line);padding:3px;text-align:center;min-width:22px}
  table.hab td.name{text-align:left;font-weight:700;white-space:nowrap;padding:4px 8px;position:sticky;left:0;background:#fff}
  table.hab .hc{cursor:pointer}
  table.hab .hc.on{background:var(--accent);color:#fff}

  .sched{display:grid;grid-template-columns:52px 1fr;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden}
  .sched .h{border-top:1px solid var(--line);padding:6px 8px;font-size:11.5px;color:var(--muted);font-weight:700;background:#fafafe}
  .sched .c{border-top:1px solid var(--line);padding:0}
  .sched .c input{border:none;border-radius:0;background:transparent;font-size:12.5px;padding:6px 8px}
  .sched>div:nth-child(1),.sched>div:nth-child(2){border-top:none}
  .gcal{position:relative;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .gcal .lines{position:absolute;inset:0}
  .gcal .hr{height:40px;border-top:1px solid #eef1f5;position:relative}
  .gcal .hr:first-child{border-top:none}
  .gcal .hr::after{content:"";position:absolute;left:0;right:0;top:20px;border-top:1px dashed #f4f6f9}
  .gcal .hrlab{position:absolute;left:4px;top:-1px;font-size:10px;color:#9aa3af}
  .gcal .lane{position:absolute;left:46px;right:6px;top:0;bottom:0}
  .gcal .ev{position:absolute;border-radius:6px;padding:2px 16px 2px 5px;font-size:11px;color:#fff;overflow:hidden;box-shadow:0 1px 3px rgba(0,0,0,.18);line-height:1.2;box-sizing:border-box}
  .gcal .ev .tm{font-size:9.5px;opacity:.92;display:block;padding-right:2px}
  .gcal .ev.g{background:#e8eaed;color:#3c4043;border:none;padding:2px 6px}
  .gcal .ev .ttl{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;font-size:11px;line-height:1.25}
  .gcal .ev.rec{box-shadow:inset 3px 0 0 rgba(255,255,255,.75),0 1px 3px rgba(0,0,0,.18)}
  .gcal .ev.tk{border:1px dashed rgba(255,255,255,.9)}
  .task .ttime{display:inline-block;margin-left:6px;font-size:10.5px;color:#fff;background:#8792a3;border-radius:5px;padding:1px 6px;font-weight:700;white-space:nowrap}
  .gcal .ev .evx{position:absolute;z-index:3;top:0;right:0;background:rgba(0,0,0,.14);border:none;border-radius:0 5px 0 6px;color:#fff;cursor:pointer;font-size:12px;font-weight:800;padding:1px 5px;line-height:1.1}

  .gcal .ev.one{box-shadow:0 0 0 2px #b8860b,0 1px 4px rgba(0,0,0,.22)}

  .synchint{font-size:11.5px;color:var(--muted)}
  .dropline{position:absolute;left:0;right:0;height:0;border-top:2px dashed #6a4fbb;z-index:6;pointer-events:none}
  .dropline span{position:absolute;left:0;top:-9px;background:#6a4fbb;color:#fff;font-size:9.5px;padding:1px 6px;border-radius:5px;font-weight:800;white-space:nowrap}

  /* ── The ONE Thing (선두 도미노) ── */
  .onecard{border:2px solid #cfa227;background:linear-gradient(180deg,#fffdf3,#fff)}
  .onehd{font-size:14.5px;font-weight:800;color:#8a6512;margin-bottom:9px;display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .onehd .hint{color:#b09148}
  .onebody{display:flex;gap:11px;align-items:center;flex-wrap:wrap}
  .onechk{flex:none;width:36px;height:36px;border-radius:11px;border:2px solid #cfa227;background:#fff;color:#cfa227;font-size:17px;font-weight:800;cursor:pointer;line-height:1}
  .onebody.done .onechk{background:var(--done,#2fa36b);border-color:#2fa36b;color:#fff}
  .onetxt{flex:1;min-width:170px;font-size:19px;font-weight:800;line-height:1.35;color:#2a2f3a}
  .onebody.done .onetxt{color:var(--brand-d);
    text-decoration:underline;text-decoration-color:var(--done);text-decoration-thickness:4px;text-underline-offset:4px}
  .onecard.done{border:3px solid var(--done)}
  .onemeta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .pchip{flex:none;width:24px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-weight:800;font-size:12px;color:#fff}
  .impbig{font-size:11px;color:#8a6512;background:#fdf3d8;border-radius:6px;padding:3px 8px;font-weight:800;letter-spacing:1px}
  .oneempty{font-size:13px;color:#6b7280;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .oneq{margin-top:10px;font-size:12.5px;color:#8a6512;font-style:italic;border-top:1px dashed #ecdcae;padding-top:8px}

  /* ── 역할별 우선순위 과제 그리드 ── */
  .onegrid{display:grid;gap:0;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff}
  .rgrp{display:flex;min-height:0;border-top:1px solid var(--line)}
  .rgrp:first-child{border-top:none}
  .rlab{flex:none;width:24px;color:#fff;font-size:10.5px;font-weight:800;writing-mode:vertical-rl;text-orientation:upright;letter-spacing:-1.5px;display:flex;align-items:center;justify-content:center;text-align:center;padding:3px 0;overflow:hidden}
  .rrows{flex:1;min-width:0;display:flex;flex-direction:column;overflow:auto}
  .rrows::-webkit-scrollbar{width:5px}.rrows::-webkit-scrollbar-thumb{background:#dfe3ec;border-radius:3px}
  .trow{flex:1 1 0;min-height:29px;max-height:42px;display:flex;align-items:center;gap:4px;padding:0 5px;border-bottom:1px dotted #e9ecf3}
  .trow:last-child{border-bottom:none}
  .trow.done{background:#f0faf5;box-shadow:inset 3px 0 0 var(--done)}
  .trow.one{background:#fffbe9;box-shadow:inset 3px 0 0 #cfa227}
  .trow.dover{background:#f1eefc}
  .grip{flex:none;width:11px;color:#c6cbd8;cursor:grab;font-size:11px;line-height:1;user-select:none;text-align:center}
  .grip:active{cursor:grabbing}
  .prisel{flex:none;width:36px;font-size:10.5px;padding:2px 1px;border-radius:5px;border:1px solid var(--line);font-weight:800;text-align:center;background:#fff}
  .prisel.pA{background:#fdeaed;color:#d1495b;border-color:#f3c6ce}
  .prisel.pB{background:#fdf5e2;color:#b07f11;border-color:#f0e0b0}
  .prisel.pC{background:#eaf7f0;color:#2fa36b;border-color:#c4e8d5}
  .tin{flex:1 1 60px;min-width:0;border:none;background:transparent;font-size:12.5px;padding:3px 2px;outline:none;font-family:inherit;color:inherit}
  .tin::placeholder{color:#c8ccd8;font-weight:400}
  .tin:focus{background:#f4f6fb;border-radius:5px}
  .trow.done .tin{color:var(--brand-d);font-weight:800;
    text-decoration:underline;text-decoration-color:var(--done);text-decoration-thickness:2.5px;text-underline-offset:3px}
  .imp{flex:none;display:flex;gap:2px;cursor:pointer;padding:2px 0}
  .imp i{width:5px;height:13px;border-radius:2px;background:#e5e8f0;display:block}
  .imp i.on{background:#6a4fbb}
  .imp i:hover{outline:1px solid #6a4fbb}
  input.tmin{flex:0 0 auto;width:52px;min-width:52px;max-width:52px;font-size:11px;padding:3px 2px;border:1px solid var(--line);border-radius:5px;color:#4b5563;background:#fff;text-align:center;font-family:inherit;letter-spacing:-.2px}
  input.tmin::placeholder{color:#c8ccd8;letter-spacing:0}
  input.tmin:focus{background:#f4f6fb;border-color:var(--brand);box-shadow:0 0 0 2px rgba(91,83,176,.13)}
  input.tmin.set{color:#2f3a4a;font-weight:700;background:#f7f6fd;border-color:#ddd8f5}
  input.tin{width:auto;border:none;background:transparent;border-radius:0;padding:2px 2px}
  .onebtn{flex:none;border:none;background:transparent;color:#d3d7e2;font-size:14px;cursor:pointer;padding:0 1px;line-height:1}
  .onebtn:hover{color:#cfa227}
  .onebtn.on{color:#cfa227;text-shadow:0 0 6px rgba(207,162,39,.5)}
  .tdone{flex:none;width:19px;height:19px;border-radius:6px;border:1px solid var(--line);background:#fff;color:#b9bfcc;font-size:11px;cursor:pointer;padding:0;line-height:1}
  .tdone.on{background:#2fa36b;border-color:#2fa36b;color:#fff}
  @media(max-width:720px){input.tmin{width:48px;min-width:48px;max-width:48px;font-size:10.5px}
    .trow{gap:3px;padding:0 3px}.imp i{width:4px}}

  /* ── AI 독서 여정 ── */
  .rshelf{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:12px}
  .bchip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:6px 13px;font-size:12.5px;cursor:pointer;font-family:inherit;color:var(--ink)}
  .bchip:hover{border-color:var(--brand)}
  .bchip.on{background:var(--brand-d);color:#fff;border-color:var(--brand-d)}
  .bchip.new{border-style:dashed;color:var(--brand-d);font-weight:800}
  .rrail{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:14px}
  .rstep{flex:1 1 0;min-width:92px;border:none;background:#fff;border-radius:10px;padding:9px 8px;cursor:pointer;font-family:inherit;text-align:left;border-bottom:3px solid var(--line)}
  .rstep .n{display:block;font-size:10.5px;color:var(--muted);font-weight:800;letter-spacing:.06em}
  .rstep .t{display:block;font-size:13px;font-weight:800;color:var(--ink)}
  .rstep.on{border-bottom-color:var(--brand)}
  .rstep.ok .n::after{content:' ✓';color:#2fa36b}
  .aiout{background:#eef7f2;border:1px solid #cbe7da;border-radius:10px;padding:12px 14px;margin-top:10px;font-size:13.5px;white-space:pre-wrap;line-height:1.65}
  .aiout .tg{display:block;font-size:10.5px;font-weight:800;color:#1c7a58;letter-spacing:.09em;margin-bottom:5px}
  .myzone{background:#fdf1ec;border:1px solid #f3d2c6;border-radius:10px;padding:12px 14px;margin-top:10px}
  .myzone .tg{display:block;font-size:10.5px;font-weight:800;color:#c3552f;letter-spacing:.09em;margin-bottom:5px}
  .lockn{font-size:12px;color:#c3552f;font-weight:700}
  .aibtn{background:#1f9268;color:#fff}
  .aibtn:hover{background:#146a4b}
  .aibtn:disabled{background:#c3c8d2;cursor:not-allowed}
  .chcard{border:1px solid var(--line);border-radius:11px;padding:13px 15px;margin-bottom:11px;background:#fcfcfe}
  .chhd{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:2px}
  .chhd .nm{font-weight:800;font-size:14px}
  .chhd .st{font-size:11.5px;color:var(--muted)}
  .chhd .st.ok{color:#2fa36b;font-weight:800}
  .dbate{margin-top:9px;border:1px solid var(--line);border-radius:10px;background:#fcfcfe;padding:10px 12px}
  .dmsg{margin-bottom:9px;font-size:13.5px;white-space:pre-wrap;line-height:1.6}
  .dmsg .who{display:block;font-size:10.5px;font-weight:800;letter-spacing:.07em;margin-bottom:2px}
  .dmsg.au{background:#eef7f2;border-radius:8px;padding:8px 11px}
  .dmsg.au .who{color:#1c7a58}
  .dmsg.me .who{color:#c3552f}
  .cnt{font-size:11.5px;color:var(--muted);text-align:right;margin-top:3px}
  .cnt.ok{color:#1c7a58;font-weight:800}
  .mapi{display:flex;gap:12px;padding:10px 0;border-bottom:1px dashed var(--line)}
  .mapi .no{font-weight:800;color:var(--brand-d);min-width:30px;font-size:14px}
  .mapi .bd{white-space:pre-wrap;font-size:13.5px;line-height:1.6}
  .aiset{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .aiset select{max-width:280px}
  .aiset input{max-width:210px}
  .ovl{position:fixed;inset:0;background:rgba(18,20,28,.55);z-index:200;display:flex;align-items:center;justify-content:center;padding:18px}
  .ovlbox{background:#fff;border-radius:14px;max-width:680px;width:100%;max-height:88vh;overflow:auto;padding:20px}
  .ovlbox h3{margin-bottom:6px}
  .ovlpre{background:#f6f7fb;border:1px solid var(--line);border-radius:9px;padding:11px 13px;font-size:12px;white-space:pre-wrap;max-height:190px;overflow:auto;line-height:1.6}
  .spin{display:inline-block;width:13px;height:13px;border:2.5px solid rgba(255,255,255,.45);border-top-color:#fff;border-radius:50%;animation:spn .7s linear infinite;vertical-align:-2px}
  @keyframes spn{to{transform:rotate(360deg)}}
  .rstep .w{display:block;font-size:9.5px;color:var(--muted);margin-top:3px;font-weight:600}
  .obadge{display:inline-block;font-size:10.5px;font-weight:800;letter-spacing:.05em;color:#1c7a58;background:#eef7f2;border:1px solid #cbe7da;border-radius:999px;padding:3px 10px;margin-left:6px}
  .chain{font-size:12px;color:var(--muted);text-align:center;margin:-2px 0 12px}
  .whyb{border-left:3px solid #1f9268;background:#f4faf7;border-radius:0 10px 10px 0;padding:11px 14px;margin:0 0 12px;font-size:12.8px;line-height:1.8;color:#2b4a40}
  .whyb b{color:#155e44}
  .whyb .wt{display:block;font-size:10.5px;font-weight:800;letter-spacing:.08em;color:#1f9268;margin-bottom:5px}
  .exb{border:1px dashed var(--line);border-radius:10px;margin:10px 0;background:#fcfcfe}
  .exb>summary{cursor:pointer;padding:9px 13px;font-size:12.5px;font-weight:700;color:var(--muted);list-style:none}
  .exb>summary::-webkit-details-marker{display:none}
  .exb>summary::before{content:"▸ ";color:#1f9268}
  .exb[open]>summary::before{content:"▾ "}
  .exbd{padding:0 14px 13px;font-size:12.7px;line-height:1.85;color:#3b4252}
  .exbd .q{color:#155e44}
  .dorow{display:grid;grid-template-columns:1fr 1fr;gap:12px}
  .dolist{border-radius:11px;padding:12px 15px;font-size:13px;line-height:1.75}
  .dolist.ok{background:#eef7f2;border:1px solid #cbe7da}
  .dolist.no{background:#fdf1ec;border:1px solid #f3d2c6}
  .dolist b{display:block;font-size:11.5px;letter-spacing:.08em;margin-bottom:5px}
  .dolist.ok b{color:#1c7a58}.dolist.no b{color:#c3552f}
  .secblk{border:1px solid var(--line);border-radius:11px;padding:11px 13px;margin-bottom:9px;background:#fcfcfe}
  .secblk .hd{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:5px}
  .secblk .sec{font-weight:800;font-size:13px}
  .secblk .tt{font-size:11px;color:var(--muted)}
  @media(max-width:720px){.dorow{grid-template-columns:1fr}}

  .stat{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
  .stat .s{background:#fff;border:1px solid var(--line);border-radius:13px;padding:15px 16px;box-shadow:var(--shadow)}
  .stat .s .n{font-size:26px;font-weight:800;color:var(--brand)}
  .stat .s .l{font-size:12px;color:var(--muted);margin-top:2px}
  .bar{height:14px;background:#eceef3;border-radius:99px;overflow:hidden}
  .bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--accent));border-radius:99px}

  /* ===== 3분 리추얼 (체크인) ===== */
  .ritual{max-width:640px;margin:0 auto}
  .ritual .rhd{text-align:center;margin-bottom:14px}
  .ritual .rhd .rt{font-size:22px;font-weight:800;letter-spacing:-.4px}
  .ritual .rhd .rs{font-size:13px;color:var(--muted);margin-top:2px}
  .rdots{display:flex;gap:6px;justify-content:center;margin:10px 0 16px}
  .rdots i{width:26px;height:5px;border-radius:99px;background:#dcdfe9}
  .rdots i.on{background:var(--brand)}
  .rdots i.done{background:var(--accent)}
  .rstep{background:#fff;border:1px solid var(--line);border-radius:16px;padding:22px 22px 18px;box-shadow:var(--shadow)}
  .rstep .q{font-size:17px;font-weight:800;line-height:1.45}
  .rstep .why{font-size:12.5px;color:var(--muted);margin-top:4px}
  .rstep .bd{margin-top:14px}
  .rstep input[type=text],.rstep textarea{font-size:15px}
  .rnav{display:flex;justify-content:space-between;gap:8px;margin-top:16px}
  .rbig{width:100%;background:var(--brand);color:#fff;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit}
  .rbig:hover{background:var(--brand-d)}
  .rbig.acc{background:var(--accent)}
  .rpick{display:flex;flex-wrap:wrap;gap:8px}
  .rpick button{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:13.5px;font-weight:700;
    cursor:pointer;font-family:inherit;color:var(--ink);text-align:left}
  .rpick button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
  .rdone{text-align:center;padding:14px 0}
  .rdone .big{font-size:40px}
  .rdone .msg{font-size:17px;font-weight:800;margin-top:6px}
  .rdone .sub{font-size:13px;color:var(--muted);margin-top:4px}
  /* 대시보드 리추얼 배너 */
  .rbanner{display:flex;align-items:center;gap:14px;background:linear-gradient(135deg,#403a86,#5b53b0);color:#fff;
    border-radius:16px;padding:16px 18px;margin-bottom:16px;box-shadow:var(--shadow);flex-wrap:wrap}
  .rbanner .bt{font-size:16px;font-weight:800}
  .rbanner .bs{font-size:12.5px;opacity:.85;margin-top:2px}
  .rbanner button{margin-left:auto;background:#fff;color:var(--brand-d);border:none;border-radius:10px;
    padding:11px 18px;font-size:14px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap}
  .rbanner.ok{background:linear-gradient(135deg,#12a594,#1f9d8f)}
  /* 회복 / 캘리브레이션 / 회고 */
  .recover{border:1px solid #f0d9b4;background:#fdf6e8;border-radius:14px;padding:14px 16px;margin-bottom:16px}
  .recover h4{margin:0 0 4px;font-size:14px;font-weight:800;color:#8a5a00}
  .recover p{margin:0;font-size:13px;color:#6b5a3a}
  .calib{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:12.5px;
    background:var(--brand-soft);border:1px solid #ddd8f5;border-radius:10px;padding:8px 12px;margin-bottom:8px}
  .calib.warn{background:#fdf1f2;border-color:#f2ced3;color:#8a2e3b}
  .calib b{font-weight:800}
  .spark{display:flex;align-items:stretch;gap:5px;height:78px;margin:8px 0}
  .spark .sk{flex:1;height:100%;background:var(--brand-soft);border-radius:6px 6px 0 0;position:relative}
  .spark .sk i{position:absolute;inset:auto 0 0 0;background:linear-gradient(180deg,var(--brand),var(--brand-d));border-radius:6px 6px 0 0;display:block}
  .sparkl{display:flex;gap:5px;font-size:10.5px;color:var(--muted);text-align:center}
  .sparkl span{flex:1}
  .loopdx{border-left:4px solid var(--brand);background:#fbfaff;border-radius:0 10px 10px 0;padding:11px 14px;margin:9px 0}
  .loopdx .lx{font-size:13.5px;font-weight:700;line-height:1.55}
  .loopdx .ly{font-size:12px;color:var(--muted);margin-top:3px}
  .loopdx .lz{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap}
  .balrow{display:flex;align-items:center;gap:8px;margin:6px 0;font-size:12.5px}
  .balrow .bn{flex:none;width:120px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .balrow .bb{flex:1;height:11px;background:#eceef3;border-radius:99px;overflow:hidden}
  .balrow .bb i{display:block;height:100%;border-radius:99px}
  .balrow .bv{flex:none;width:96px;text-align:right;color:var(--muted);white-space:nowrap}
  .navgrp{display:flex;align-items:center;width:100%;background:transparent;border:none;color:#fff;opacity:.6;
    font-size:10.5px;font-weight:700;letter-spacing:1px;margin:14px 0 5px;padding:2px 8px;cursor:pointer;font-family:inherit}
  .navgrp:hover{opacity:.95}
  .navgrp .ar{margin-left:auto;font-size:9px;transition:transform .15s}
  .navgrp.cl .ar{transform:rotate(-90deg)}
  .mtog{display:none}
  /* 계획의 수직 연결 — '위에서 내려온 것' */
  .chain{border:1px solid #ddd8f5;background:linear-gradient(180deg,#faf9ff,#fff);border-radius:14px;padding:12px 14px;margin-bottom:16px}
  .chain.empty{background:#fafbfd;border-color:var(--line)}
  .chain .ch-h{font-size:13px;font-weight:800;color:var(--brand-d);display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
  .chain .ch-s{font-size:11.5px;font-weight:600;color:var(--muted)}

  .lifecal{max-height:420px;overflow:auto;border:1px solid var(--line);border-radius:12px;padding:6px 8px;background:#fff}
  .lcrow{display:flex;align-items:center;gap:6px;padding:1px 4px;border-radius:5px;cursor:pointer}
  .lcrow:hover{background:var(--brand-soft)}
  .lcrow.cur{background:#fff8e6;box-shadow:inset 3px 0 0 var(--gold)}
  .lcrow.sel{background:var(--brand-soft);box-shadow:inset 3px 0 0 var(--brand)}
  .lcrow.hasm{background:#f2fbf9}

  .lcrow .la{flex:none;width:24px;font-size:9.5px;color:#aab0bd;text-align:right;font-variant-numeric:tabular-nums}

/* 얕은 병합(Object.assign) 때문에 새로 추가된 하위 키는 기존 사용자 데이터에서 사라집니다.
   아래 migrate()가 그 구멍을 메웁니다. load()와 importJSON() 두 곳 모두에서 호출해야 합니다. */
function migrate(){
  const b=blank();
  S.meta=Object.assign({},b.meta,S.meta||{});
  S.settings=Object.assign({},b.settings,S.settings||{});
  S.settings.ai=Object.assign({},b.settings.ai,S.settings.ai||{});
  S.ui=Object.assign({},b.ui,S.ui||{});
  S.usage=Object.assign({total:0,byView:{},byDay:{}},S.usage||{});
  if(!S.usage.byView||typeof S.usage.byView!=='object')S.usage.byView={};
  if(!S.usage.byDay||typeof S.usage.byDay!=='object')S.usage.byDay={};
  if(!S.ui.navOpen||typeof S.ui.navOpen!=='object')S.ui.navOpen={};
  S.profile=Object.assign({},b.profile,S.profile||{});
  S.mission=Object.assign({},b.mission,S.mission||{});
  S.lifemap=Object.assign({},b.lifemap,S.lifemap||{});
  if(!S.lifemap.milestones||typeof S.lifemap.milestones!=='object')S.lifemap.milestones={};
  (S.habits||[]).forEach(h=>{if(!h.id)h.id=uid();if(h.size==null)h.size=0;});
  /* 병합에 쓰이는 식별자 — 없으면 만들어 둔다 */
  if(!S.meta.devId)S.meta.devId='dev'+Math.abs(Math.floor(Math.random()*1e9)).toString(36)+Date.now().toString(36).slice(-4);
  if(!S.meta.updatedAt)S.meta.updatedAt=Date.now();
  ['reading','ideas','recurring','reminders'].forEach(k=>{(S[k]||[]).forEach(x=>{if(x&&!x.id)x.id=uid();});});
  /* 반복 항목 — 구버전(일정 전용·가상 표시)에서 실체화 방식으로 올린다 */
  (S.recurring||[]).forEach(r=>{ if(!r)return;
    if(!r.kind)r.kind='event';
    if(!Array.isArray(r.days)||!r.days.length)r.days=[(r.byday==null?1:r.byday)];
    if(!r.from)r.from=weekStart(today());      /* 지난 날짜를 거슬러 만들지는 않는다 */
    if(r.until==null)r.until='';
    if(!r.anchor)r.anchor=weekStart(r.from);
    if(r.off==null)r.off=false;});
  ((S.lifemap||{}).dreams||[]).forEach(x=>{if(x&&!x.id)x.id=uid();});
  ((S.annual||{}).goals||[]).forEach(x=>{if(x&&!x.id)x.id=uid();});
  try{kFix();}catch(e){}
  return S;
}

/* ============ DATE HELPERS ============ */
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function parseD(s){return new Date(s+'T00:00:00');}
function today(){return fmt(new Date());}
function addDays(s,n){const d=parseD(s);d.setDate(d.getDate()+n);return fmt(d);}
function wd(s){return ['일','월','화','수','목','금','토'][parseD(s).getDay()];}
function monthKey(s){return s.slice(0,7);}
function weekStart(s){const d=parseD(s);const g=(d.getDay()+6)%7;d.setDate(d.getDate()-g);return fmt(d);} // Monday
function esc(s){return (s==null?'':String(s)).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function toast(msg){const w=document.getElementById('toast');const t=document.createElement('div');t.className='t';t.textContent=msg;w.appendChild(t);setTimeout(()=>t.remove(),4000);}

function vMonth(v){
  if(!S.ui.month)S.ui.month=monthKey(today());
  const mk=S.ui.month; const m=ensureMonth(mk);
  const [Y,M]=mk.split('-').map(Number);
  const first=new Date(Y,M-1,1); const startPad=(first.getDay()+6)%7; // Monday-based
  const dim=new Date(Y,M,0).getDate();
  let cells='';
  for(let i=0;i<startPad;i++)cells+=`<td class="oth"></td>`;
  for(let d=1;d<=dim;d++){ const ds=`${mk}-${String(d).padStart(2,'0')}`; const day=S.days[ds];
    const hasTask=day&&day.tasks&&day.tasks.length; const goal=day&&day.tasks&&day.tasks.find(t=>t.priority==='A');
    cells+=`<td class="${ds===today()?'today':''}" onclick="openDay('${ds}')"><div class="dn">${d} <span class="hint">${wd(ds)}</span></div>
      ${hasTask?'<span class="dot"></span>'.repeat(Math.min(3,day.tasks.length)):''}
      ${goal?`<div class="mini-goal">${esc(goal.text)}</div>`:''}</td>`;
    if((startPad+d)%7===0)cells+='</tr><tr>';
  }
  v.innerHTML=`
   <span class="step-badge">5단계 · 실행</span>
   <h2 class="vh">📅 월간 계획</h2>
   <p class="vsub">올해 목표 중 <b>이 달에 진척시킬 것</b>을 고르고, 그것을 이 달의 중점으로 내려놓습니다.</p>
   ${chainToMonth(mk)}
   <div class="card"><div style="display:flex;gap:10px;align-items:center;margin-bottom:12px">
     <button class="btn ghost sm" onclick="shiftMonth(-1)">‹ 이전달</button>
     <input type="month" value="${mk}" onchange="S.ui.month=this.value;save();vMonth(document.getElementById('view'))" style="max-width:170px">
     <button class="btn ghost sm" onclick="shiftMonth(1)">다음달 ›</button></div>
     <table class="cal"><thead><tr>${['월','화','수','목','금','토','일'].map(x=>`<th>${x}</th>`).join('')}</tr></thead>
       <tbody><tr>${cells}</tr></tbody></table>
     <p class="hint" style="margin-top:8px">날짜를 클릭하면 그날의 일간 계획으로 이동합니다.</p>
   </div>
   <div class="grid2">
     ${focusCard(mk)}
     <div class="card"><h3>월 성찰</h3>
       <label class="fld"><span class="lb">잘된 점</span><textarea oninput="setMonth('${mk}','good',this.value)">${esc(m.good)}</textarea></label>
       <label class="fld"><span class="lb">아쉬운 점 · 다음 달 조정</span><textarea oninput="setMonth('${mk}','next',this.value)">${esc(m.next)}</textarea></label></div>
   </div>
   <div class="card"><h3>이 달 습관 트래커</h3><div class="habgrid" id="habmonth"></div></div>
   <div class="foot-nav"><button class="btn ghost" onclick="go('annual')">← 연간</button><button class="btn" onclick="go('week')">다음: 주간 →</button></div>`;
  renderHabMonth(mk,dim);
}
function shiftMonth(n){const [Y,M]=S.ui.month.split('-').map(Number);const d=new Date(Y,M-1+n,1);S.ui.month=fmt(d).slice(0,7);save();vMonth(document.getElementById('view'));}
function renderHabMonth(mk,dim){const el=document.getElementById('habmonth');if(!el)return;
  let head='<tr><th class="name">습관</th>';for(let d=1;d<=dim;d++)head+=`<th>${d}</th>`;head+='</tr>';
  let body=S.habits.map(h=>{let row=`<tr><td class="name">${esc(h.name)}</td>`;
    for(let d=1;d<=dim;d++){const ds=`${mk}-${String(d).padStart(2,'0')}`;const on=S.days[ds]&&S.days[ds].habits&&S.days[ds].habits.includes(h.id);
      row+=`<td class="hc ${on?'on':''}" onclick="toggleHabit('${ds}','${h.id}',true)">${on?'●':''}</td>`;}
    return row+'</tr>';}).join('');
  el.innerHTML=`<table class="hab">${head}${body}</table>`;
}

/* 스크롤해도 위에 남는 얇은 날짜 바 — 어제/내일·직접 선택·오늘 버튼 */
function dayBar(d){
  const t=today(), g=parseD(d).getDay(), n=dayDiff(t,d);
  const all=dayTasks(d).filter(x=>x.text&&x.status!=='drop');
  const st=all.filter(x=>isStarted(x)).length, dn=all.filter(x=>x.status==='done').length;
  return `<div class="daybar no-print">
    <button class="btn ghost sm" onclick="shiftDay(-1)" title="어제로">‹ 어제</button>
    <input type="date" class="dbin" value="${d}"
      onchange="S.ui.day=this.value||today();save();vDay(document.getElementById('view'))">
    <button class="btn ghost sm" onclick="shiftDay(1)" title="내일로">내일 ›</button>
    <b class="dbw ${g===0?'sun':(g===6?'sat':'')}">${wd(d)}요일</b>
    <button class="dbtoday ${d===t?'on':''}" onclick="goToday()"
      title="${d===t?'오늘을 보고 있습니다':'오늘로 돌아가기'}">오늘</button>
    ${n!==0?`<span class="dbrel">${n>0?'+':''}${n}일</span>`:''}
    <span class="dbsum">착수 ${st}/${all.length} · 완료 ${dn}</span>
  </div>`;}
function goToday(){ if(S.ui.day===today())return; S.ui.day=today(); save(); vDay(document.getElementById('view')); window.scrollTo(0,0); }
function shiftDay(n){S.ui.day=addDays(S.ui.day,n);save();vDay(document.getElementById('view'));}
function openDay(ds){S.ui.day=ds;S.view='day';save();renderNav();render();window.scrollTo(0,0);}

/* ── 과제 조회·수정 (id 기반) ── */
function findTask(d,id){if(!id)return null;ensureDay(d);
  const t=(S.days[d].tasks||[]).find(x=>x.id===id); if(t)return t;
  let x=addDays(d,-1);                       /* 이월된 과제는 원래 날짜에 살아 있다 */
  for(let i=0;i<180;i++){const dd=S.days[x];
    if(dd&&dd.tasks){const f=dd.tasks.find(y=>y.id===id); if(f)return f;} x=addDays(x,-1);}
  return null;}
function setTaskText(d,id,val){const t=findTask(d,id);if(!t)return;const v=val.trim();
  if(!v){if(!confirm('내용을 비우면 이 과제가 삭제됩니다. 삭제할까요?')){renderTasks(d);return;} return delTaskId(id,d);}
  t.text=v;save();renderTasks(d);renderOne(d);renderSchedule(d);}
function setTaskPri(d,id,p){const t=findTask(d,id);if(!t)return;t.priority=p;save();renderTasks(d);renderOne(d);renderSchedule(d);}
function setImpact(d,id,k){const t=findTask(d,id);if(!t)return;t.impact=(t.impact===k?Math.max(1,k-1):k);save();renderTasks(d);renderOne(d);}
function setTaskStatusId(id,st,d){d=d||S.ui.day;const t=findTask(d,id);if(!t)return;t.status=st;save();renderTasks(d);renderOne(d);renderSchedule(d);if(S.view==='dash')render();}
function toggleTaskDoneId(id,d){d=d||S.ui.day;const t=findTask(d,id);if(!t)return;t.status=(t.status==='done')?'todo':'done';save();
  if(S.view==='dash'){render();return;} renderTasks(d);renderOne(d);renderSchedule(d);}
function delTaskId(id,d){d=taskHome(id,d||S.ui.day);const day=S.days[d];if(!day)return;
  day.tasks=day.tasks.filter(t=>t.id!==id); if(day.one===id)day.one='';
  save(); if(S.view==='dash'){render();return;} renderTasks(d);renderOne(d);renderSchedule(d);}
/* 시각 파서 — "9" "930" "9:30" "09.30" "9시30분" "오후2" 모두 HH:MM 으로 */
function parseHM(raw){
  let s=String(raw||'').trim(); if(!s)return '';
  let pm=/오후|pm|p\.m/i.test(s), am=/오전|am|a\.m/i.test(s);
  s=s.replace(/[^0-9]/g,'');
  if(!s)return '';
  let h,m;
  if(s.length<=2){h=+s;m=0;}
  else if(s.length===3){h=+s.slice(0,1);m=+s.slice(1);}
  else {h=+s.slice(0,2);m=+s.slice(2,4);}
  if(pm&&h<12)h+=12; if(am&&h===12)h=0;
  if(!isFinite(h)||!isFinite(m)||m>59)return null;
  if(h>23)return null;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0');
}
/* "930-1030", "9:30~10:30" → [시작,끝] */
function parseRange(raw){
  const s=String(raw||'').trim();
  const p=s.split(/\s*[-~–—]\s*/);
  if(p.length!==2)return null;
  const a=parseHM(p[0]),b=parseHM(p[1]);
  if(!a||!b)return null;
  return [a,b];
}
function setTaskTimeStr(d,id,v){const t=findTask(d,id);if(!t)return;
  const raw=String(v||'').trim();
  if(!raw){delete t.start;delete t.end;save();renderTasks(d);renderOne(d);renderSchedule(d);return;}
  const rg=parseRange(raw);
  if(rg){t.start=rg[0];t.end=(toMin(rg[1])>toMin(rg[0]))?rg[1]:addMinStr(rg[0],60);}
  else{
    const hm=parseHM(raw);
    if(!hm){toast('시간을 읽지 못했습니다 — 930 · 9:30 · 1430 처럼 입력하세요');renderTasks(d);return;}
    const dur=(t.start&&t.end)?Math.max(5,toMin(t.end)-toMin(t.start)):60;
    t.start=hm;t.end=addMinStr(hm,dur);
  }
  save();renderTasks(d);renderOne(d);renderSchedule(d);syncMoved(d,t,false);}
/* ↑↓ 5분 조정 · Enter 확정 */
function tminKey(e,d,id){
  if(e.key==='Enter'){e.preventDefault();e.target.blur();return;}
  if(e.key==='Escape'){const t=findTask(d,id);e.target.value=(t&&t.start)||'';e.target.blur();return;}
  if(e.key!=='ArrowUp'&&e.key!=='ArrowDown')return;
  e.preventDefault();
  const base=parseHM(e.target.value)||'09:00';
  const step=(e.shiftKey?60:5)*(e.key==='ArrowUp'?1:-1);
  const nm=Math.max(0,Math.min(23*60+55,toMin(base)+step));
  const nv=String(Math.floor(nm/60)).padStart(2,'0')+':'+String(nm%60).padStart(2,'0');
  setTaskTimeStr(d,id,nv);
  const el=document.querySelector('.trow[data-tid="'+id+'"] input.tmin');
  if(el){el.focus();el.select();}
}
function newTaskIn(d,role,inp){const v=(inp.value||'').trim();if(!v)return;
  ensureDay(d);S.days[d].tasks.push({id:uid(),text:v,priority:'B',role:role,impact:3,status:'todo'});
  inp.value='';save();renderTasks(d);renderOne(d);
  const el=document.getElementById('tasks');if(el){const bl=el.querySelectorAll('.tin.blank');for(const b of bl){if(b.dataset.role===role){b.focus();break;}}}}
/* ── The ONE Thing (선두 도미노) ── */
function setOneThing(d,id){ensureDay(d);
  if(S.days[d].one===id){S.days[d].one='';const t=findTask(d,id);if(t&&t.type==='end')delete t.type;}
  else{const t=bringHome(d,id);S.days[d].one=id;if(t)t.type='end';}
  save();renderOne(d);renderTasks(d);renderSchedule(d);}
function clearOne(d){ensureDay(d);S.days[d].one='';save();renderOne(d);renderTasks(d);renderSchedule(d);}
function oneScore(t){const pw={A:3,B:2,C:1}[t.priority]||1;return (t.impact||3)*2+pw;}
function oneCandidate(d){const ts=dayTasks(d).filter(t=>t.status!=='done'&&t.status!=='drop'&&t.text);
  if(!ts.length)return null;return ts.slice().sort((a,b)=>oneScore(b)-oneScore(a))[0];}
function recommendOne(d){const c=oneCandidate(d);
  if(!c){toast('먼저 할 일을 적어주세요');return;}
  S.days[d].one=c.id;save();renderOne(d);renderTasks(d);renderSchedule(d);
  toast('🁢 영향도 기준 선두 도미노: '+c.text);}
function sendOneToSchedule(d,id){const t=findTask(d,id);if(!t)return;
  const now=new Date();let m=(d===today())?snap5(now.getHours()*60+now.getMinutes()+5):9*60;
  m=Math.max(SC_START*60,Math.min(m,SC_END*60-60));placeTaskAt(d,id,m);}
function renderOne(d){const el=document.getElementById('oneslot');if(!el)return;ensureDay(d);
  const all=dayTasks(d).filter(t=>t.text&&t.status!=='drop');
  const kept=T_ORDER.filter(ty=>!!promiseOf(d,ty)).length;
  const startedN=all.filter(t=>isStarted(t)).length;
  const pn=promiseCount(d);
  const rec=promiseOf(d,'end')?null:oneCandidate(d);
  el.innerHTML=`<div class="card promise">
   <div class="phd">🎯 오늘의 약속
     <span class="hint">끝낼 것 1 · 시작할 것 1 · 바로 할 것 1 — <b>착수하면 성공</b>입니다</span>
     <span style="margin-left:auto;font-size:12px;font-weight:700;color:var(--muted)">약속 ${kept}/3 · 착수 ${startedN}/${all.length}</span></div>
   <div class="pslots">${T_ORDER.map(ty=>pSlotHtml(d,ty)).join('')}</div>
   ${rec?`<div style="margin-top:9px"><button class="btn ghost sm no-print" onclick="pickPromise('${d}','end','${rec.id}')">🁢 영향도로 «끝낼 것» 추천: ${esc(rec.text)}</button></div>`:''}
   ${pn>3?`<div class="pwarn">오늘 <b>${pn}개</b>를 약속하셨습니다. 막지는 않겠습니다 — 다만 실행을 가르는 것은 의지가 아니라 <b>선택의 수</b>입니다.
      약속이 늘수록 신호가 왔을 때 “무엇부터 하지?”를 다시 결정하게 되고, 그 자리에서 협상이 시작됩니다.
      하나를 <b>내일로 예약</b>하거나 <b>하지 않기로</b> 정하면 나머지 셋의 착수 확률이 올라갑니다.</div>`:''}
   <div class="oneq">신호가 오면 <b>다시 결정하지 않습니다.</b> 결정은 어제의 내가 했고, 지금의 나는 첫 행동만 합니다 —
     완성이 아니라 <b>착수</b>가 오늘의 성공입니다.</div>
  </div>`;}
/* ── 역할별 과제 그리드 ── */
const PRIS=['A','B','C'];
function impHtml(d,t){return `<span class="imp" title="영향도(선두 도미노 후보) — 이 일을 끝내면 다른 일이 얼마나 쉬워지는가">${[1,2,3,4,5].map(k=>`<i class="${k<=(t.impact||3)?'on':''}" onclick="setImpact('${d}','${t.id}',${k})"></i>`).join('')}</span>`;}
function taskRowG(d,t,showRole){const done=t.status==='done';const isOne=S.days[d].one===t.id;

    <span class="grip" draggable="true" ondragstart="taskDrag(event,'${t.id}')" title="시간표로 끌어놓기 · 다른 항목 칸으로 끌어놓으면 항목이 바뀝니다">⠿</span>
    ${showRole?roleChip(d,t):''}
    <select class="prisel p${t.priority}" onchange="setTaskPri('${d}','${t.id}',this.value)" title="중요도">${PRIS.map(p=>`<option ${t.priority===p?'selected':''}>${p}</option>`).join('')}</select>
    ${typeBadge(t)}${t.rid&&recOf(t.rid)?`<span class="rmk" title="반복 — ${esc(recLabel(recOf(t.rid)))}" onclick="openRecur('${d}','task','${t.id}')">↻</span>`:''}${dueBadge(d,t)}
    <input class="tin" value="${esc(t.text)}" onchange="setTaskText('${d}','${t.id}',this.value)" onkeydown="if(event.key==='Enter')this.blur()">
    ${impHtml(d,t)}
    <input class="tmin no-print${t.start?' set':''}" inputmode="numeric" autocomplete="off" placeholder="--:--" value="${t.start||''}"
      onchange="setTaskTimeStr('${d}','${t.id}',this.value)" onkeydown="tminKey(event,'${d}','${t.id}')"
      title="시작 시간 — 숫자만 쳐도 됩니다&#10;9 → 09:00 · 930 → 09:30 · 1430 → 14:30&#10;930-1030 처럼 쓰면 끝 시각까지 지정&#10;↑↓ 키로 5분씩 조정 · 비우면 시간표에서 내려옵니다">
    <button class="csfb${(t.csf||t.memo)?' on':''}" onclick="openMemo('${d}','task','${t.id}')" title="핵심 성공 요인 · 메모">🎯</button>
    <button class="onebtn${isOne?' on':''}" onclick="setOneThing('${d}','${t.id}')" title="오늘의 The ONE Thing으로 지정">🁢</button>
    <button class="tdone${done?' on':(started?' mid':'')}" onclick="cycleTask('${t.id}','${d}')"
      title="${done?'완료 — 누르면 처음으로':(started?'착수함 — 누르면 완료':'누르면 ◐ 착수 (3분만 해도 시작입니다)')}">${done?'✓':(started?'◐':'○')}</button>
    <button class="del-x no-print" onclick="${t.rid?`openRecDel('${d}','task','${t.id}')`:`delTaskId('${t.id}','${d}')`}" title="삭제">✕</button>
  </div>`;}
function blankRow(d,role){return `<div class="trow"><span class="grip" style="opacity:.25">⠿</span>
    <input class="tin blank" data-role="${role}" placeholder="＋ 할 일" onchange="newTaskIn('${d}','${role}',this)" onkeydown="if(event.key==='Enter')this.blur()"></div>`;}
/* ── 항목(역할) 배지 — 색 + 앞 글자. 누르면 이동 창이 열린다 ── */
function roleCut(x){return String(x||'').replace(/[\s·・,\/()\-]/g,'');}
function roleAbbr(rid){
  const rs=S.profile.roles||[], r=rs.find(x=>x.id===rid);
  if(!r)return '기';
  const n=roleCut(r.name)||'?';
  const dup=rs.some(x=>x.id!==rid&&roleCut(x.name).slice(0,1)===n.slice(0,1));
  return dup?n.slice(0,2):n.slice(0,1);}
function roleChip(d,t){
  const r=(S.profile.roles||[]).find(x=>x.id===t.role);
  const nm=r?r.name:'기타', col=r?(r.color||'#5b53b0'):'#8792a3';
  return `<button class="rchip" style="background:${col}" title="${esc(nm)} — 눌러서 항목·순서·날짜 이동"
    onclick="openMoveTask('${d}','${t.id}')">${esc(roleAbbr(t.role))}</button>`;}

/* ── 보기 모드: 항목별(기본) / 실행 시간순 ── */
function taskSortMode(){return ((S.ui||{}).taskSort==='time')?'time':'role';}
function setTaskSort(m){S.ui.taskSort=(m==='time')?'time':'role';save();
  if(S.view==='day'){renderTasks(S.ui.day);}else render();}
function tSortKey(t){
  if(t.start)return [0,toMin(t.start)];
  const i=dueInfo(t.due);
  const od=i?(i.over?0:(i.n<=2?1:2)):3;
  return [1,od*1000+({A:0,B:1,C:2}[t.priority]||1)*100+(5-(t.impact||3))];}

/* ── 드래그로 항목 간·항목 안 이동 ── */
function taskOver(e){ if(DRAG&&DRAG.kind==='task'){e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(_){}} }
function taskDropAt(e,d,beforeId,rid){
  if(!DRAG||DRAG.kind!=='task')return;
  e.preventDefault(); e.stopPropagation();
  const id=DRAG.id; DRAG=null;
  moveTaskInto(d,id,rid,beforeId);}
function moveTaskInto(d,id,rid,beforeId){
  if(id===beforeId)return;
  const t=bringHome(d,id); if(!t)return;
  const arr=S.days[d].tasks, i=arr.indexOf(t); if(i<0)return;
  arr.splice(i,1);
  if(rid!==null&&rid!==undefined)t.role=rid;
  let j=arr.length;
  if(beforeId){const k=arr.findIndex(x=>x.id===beforeId); if(k>=0)j=k;}
  arr.splice(j,0,t);
  save(); renderTasks(d); renderOne(d); renderSchedule(d);}

function newTaskTime(d,inp){
  const v=(inp.value||'').trim(); if(!v)return;
  const sel=document.getElementById('tmrole');
  const role=(sel&&sel.value)||((S.profile.roles[0]||{}).id||'');
  ensureDay(d);S.days[d].tasks.push({id:uid(),text:v,priority:'B',role:role,impact:3,status:'todo'});
  inp.value='';save();renderTasks(d);renderOne(d);
  const el=document.querySelector('#tasks input.tin.blank'); if(el)el.focus();}

function renderTasks(d){const el=document.getElementById('tasks');if(!el)return;ensureDay(d);
  const all=dayTasks(d);                                   /* 오늘 과제 + 마감일이 남은 이월 과제 */
  el.style.height=((SC_END-SC_START)*SC_H)+'px';

  /* ① 실행 시간순 — 항목 경계를 없애고 하루의 흐름대로 한 줄로 세운다.
        항목은 색 + 앞 글자 배지로 앞에 남는다(누르면 이동 창). */
  if(taskSortMode()==='time'){
    const list=all.filter(t=>t.text).slice()
      .sort((a,b)=>{const x=tSortKey(a),y=tSortKey(b);return (x[0]-y[0])||(x[1]-y[1]);});
    const timed=list.filter(t=>t.start), free=list.filter(t=>!t.start);
    el.style.gridTemplateRows='1fr';
    el.innerHTML=`<div class="rgrp tmode"><div class="rrows">
      ${timed.map(t=>taskRowG(d,t,true)).join('')}
      ${free.length?`<div class="tsep">⏳ 시간 미정 <span style="font-weight:600">— 마감 지난 것 → 임박 → 우선순위 순</span></div>`:''}
      ${free.map(t=>taskRowG(d,t,true)).join('')}
      <div class="trow"><span class="grip" style="opacity:.25">⠿</span>
        <select class="prisel" id="tmrole" style="width:52px" title="새 과제의 항목">${(S.profile.roles||[]).map((r,i)=>`<option value="${r.id}">${esc(roleAbbr(r.id))}</option>`).join('')}</select>
        <input class="tin blank" placeholder="＋ 할 일" onchange="newTaskTime('${d}',this)"
          onkeydown="if(event.key==='Enter')this.blur()"></div>
    </div></div>`;
    return;
  }

  /* ② 항목(역할)별 — 기본. 칸으로 끌어놓으면 항목이 바뀐다 */
  const roles=(S.profile.roles||[]);
  const groups=roles.map(r=>({id:r.id,name:r.name,color:r.color||'#5b53b0',ts:all.filter(t=>t.role===r.id)}));
  const orphan=all.filter(t=>!t.role||!roles.some(r=>r.id===t.role));
  if(orphan.length)groups.push({id:'',name:'기타',color:'#8792a3',ts:orphan});
  const ord={A:0,B:1,C:2};
  const od=t=>{const i=dueInfo(t.due);return i?(i.over?0:(i.n<=2?1:2)):3;};   /* 지난 마감 → 임박 → 나머지 */
  groups.forEach(g=>g.ts.sort((a,b)=>(od(a)-od(b))||(ord[a.priority]-ord[b.priority])||((b.impact||3)-(a.impact||3))));
  el.style.gridTemplateRows=`repeat(${groups.length||1},1fr)`;
  el.innerHTML=groups.map(g=>{
    const blanks=Math.max(1,3-g.ts.length);
    return `<div class="rgrp"><div class="rlab" style="background:${g.color}" title="${esc(g.name)}">${esc(g.name)}</div>
      <div class="rrows" ondragover="taskOver(event)" ondrop="taskDropAt(event,'${d}','','${g.id}')">${
        g.ts.map(t=>taskRowG(d,t).replace('<div class="trow','<div ondragover="taskOver(event)" ondrop="taskDropAt(event,\''+d+'\',\''+t.id+'\',\''+g.id+'\')" class="trow')).join('')
      }${Array.from({length:blanks},()=>blankRow(d,g.id)).join('')}</div></div>`;}).join('');
}

/* ── 과제 이동 창 (항목 · 순서 · 날짜) ── */

  const t=findTask(d,id); if(!t){toast('과제를 찾지 못했습니다');return;}
  MEMO={d:d,kind:'task',id:id};
  const home=taskHome(id,d);
  modalBox(`<h3 style="margin:0 0 4px">⇄ 과제 이동</h3>
    <div class="hint" style="margin-bottom:10px"><b>${esc(t.text||'')}</b>${t.start?` · 🕘 ${t.start}${t.end?'–'+t.end:''}`:''}</div>
    <label class="fld"><span class="lb">🎭 항목(역할) 바꾸기</span>

function moveTaskRole(d,id,rid){const t=bringHome(d,id);if(!t)return;

function nudgeTask(d,id,n){
  const t=bringHome(d,id); if(!t)return;
  const arr=S.days[d].tasks, same=arr.filter(x=>x.role===t.role);
  const i=same.indexOf(t); if(i<0)return;
  const j=(n<=-99)?0:(n>=99?same.length-1:Math.max(0,Math.min(same.length-1,i+n)));
  if(j===i){toast(n<0?'이미 맨 위입니다':'이미 맨 아래입니다');return;}
  same.splice(i,1); same.splice(j,0,t);
  let k=0; for(let x=0;x<arr.length;x++){ if(arr[x].role===t.role)arr[x]=same[k++]; }
  save(); repaintDay(d); openMoveTask(d,id);}
function moveTaskDay(d,id,nd){

  if(S.view==='day'){renderTasks(S.ui.day);renderOne(S.ui.day);renderSchedule(S.ui.day);}else render();}
function shiftTaskDay(d,id,n){moveTaskDay(d,id,addDays(taskHome(id,d),n));}

function carryOver(d){const nd=addDays(d,1);ensureDay(nd);let moved=0;

const SC_START=5,SC_END=24,SC_H=40;
const EVCOL=['#5b53b0','#2f6db3','#1f9d8f','#c98a1a','#b23a55','#6a5acd'];

function dayEvents(d){ensureDay(d);return S.days[d].events;}
function toMin(t){const p=t.split(':');return (+p[0])*60+(+p[1]);}
function addMinStr(t,mins){let m=Math.min(23*60+59,toMin(t)+mins);return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function priColor(p){return p==='A'?'#d1495b':(p==='B'?'#e0a52f':'#2fa36b');}
const ROLE_COLOR_MAP={"교사·수업(물리)":"#2f6db3","수업":"#6a4fbb","학습공동체·연구":"#d1495b","가족·관계":"#2fa36b","자기계발·독서":"#e0552e","건강·자기돌봄":"#3aa76d"};

function hexRGB(h){h=(h||'').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');if(h.length<6)return[91,83,176];return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)];}
function roleColor(rid){const r=(S.profile.roles||[]).find(x=>x.id===rid);return (r&&r.color)||'#5b53b0';}
function blockColors(base,done){const c=hexRGB(base);return done?{bg:base,fg:'#fff'}:{bg:`rgba(${c[0]},${c[1]},${c[2]},0.16)`,fg:base};}
const GCOLORS={'1':'#7986cb','2':'#33b679','3':'#8e24aa','4':'#e67c73','5':'#f6bf26','6':'#f4511e','7':'#039be5','8':'#616161','9':'#3f51b5','10':'#0b8043','11':'#d50000'};
function gColor(id){return GCOLORS[id]||'#039be5';}
function contrastText(hex){const c=hexRGB(hex);return (0.299*c[0]+0.587*c[1]+0.114*c[2])>150?'#20242e':'#fff';}
function toMinISO(iso){return toMin(iso.slice(11,16));}
function addEvent(d){const s=document.getElementById('evs').value,e=document.getElementById('eve').value,t=document.getElementById('evt').value.trim();
  const rep=(document.getElementById('evrep')||{}).value||'none';
  if(!s||!e||!t){toast('시작·종료 시간과 제목을 입력하세요');return;}
  if(toMin(e)<=toMin(s)){toast('종료 시간이 시작보다 늦어야 합니다');return;}
  const role=(document.getElementById('evrole')||{}).value||'';
  if(rep==='none'){const arr=dayEvents(d);arr.push({id:uid(),start:s,end:e,title:t,role:role});}
  else{ if(!S.recurring)S.recurring=[];
    const w=parseD(d).getDay(), dm=+d.slice(8);
    const r={id:uid(),kind:'event',start:s,end:e,title:t,role:role,rule:rep,
      days:[w],byday:w,dom:dm,nth:Math.ceil(dm/7),ndow:w,
      from:d,until:'',anchor:weekStart(d),off:false};
    S.recurring.push(r); ensureDay(d);      /* 오늘 것부터 바로 만들어 둔다 */
    toast('반복 일정을 만들었습니다 — '+recLabel(r));}
  save();document.getElementById('evt').value='';renderSchedule(d);}
function delEvent(d,id){

  if(ev&&ev.gEventId&&gTokenValid()){
    if(confirm('구글 캘린더의 원본 일정도 함께 삭제할까요?\n\n확인 = 구글에서도 삭제\n취소 = 이 다이어리에서만 삭제'))

function delRecur(id){if(!confirm('이 반복 일정을 삭제할까요? (모든 반복 날짜에서 사라집니다)'))return;S.recurring=(S.recurring||[]).filter(x=>x.id!==id);save();renderSchedule(S.ui.day);}
function toggleTaskDone(d,i){const t=S.days[d].tasks[i];if(!t)return;t.status=(t.status==='done')?'todo':'done';save();renderTasks(d);renderSchedule(d);}
function toggleEventDone(d,id){const ev=dayEvents(d).find(x=>x.id===id);if(!ev)return;ev.done=!ev.done;save();renderSchedule(d);}
function toggleRecDone(d,id){ensureDay(d);const a=S.days[d].recDone||(S.days[d].recDone=[]);const k=a.indexOf(id);if(k>=0)a.splice(k,1);else a.push(id);save();renderSchedule(d);}
function recForDay(d){return [];}   /* (구버전 가상 레이어 — 실체화 방식으로 바뀌어 더 쓰지 않습니다) */
function snap5(m){return Math.round(m/5)*5;}
function blockStyle(sm,em,col,cols){const ss=snap5(sm),ee=Math.max(snap5(em),ss+5);
  const top=Math.max(0,(ss-SC_START*60)/60*SC_H);const h=Math.max(14,(ee-ss)/60*SC_H-2);
  const w=100/(cols||1),left=(col||0)*w;
  return `top:${top}px;height:${h}px;left:calc(${left}% + 1px);width:calc(${w}% - 2px)`;}
function layoutBlocks(bs){const arr=bs.slice().sort((a,b)=>a.sm-b.sm||a.em-b.em);let i=0;
  while(i<arr.length){let clusterEnd=arr[i].em;const cluster=[arr[i]];let j=i+1;
    while(j<arr.length&&arr[j].sm<clusterEnd){cluster.push(arr[j]);clusterEnd=Math.max(clusterEnd,arr[j].em);j++;}
    const colEnds=[];cluster.forEach(b=>{let placed=false;
      for(let c=0;c<colEnds.length;c++){if(b.sm>=colEnds[c]){b.col=c;colEnds[c]=b.em;placed=true;break;}}
      if(!placed){b.col=colEnds.length;colEnds.push(b.em);}});
    const cols=colEnds.length;cluster.forEach(b=>b.cols=cols);i=j;}
  return arr;}

/* ===== 드래그 앤 드롭: 과제/일정 → 시간표 ===== */
let DRAG=null;
function m2s(m){m=Math.max(0,Math.min(24*60-5,Math.round(m)));const h=Math.floor(m/60),mi=m%60;return String(h).padStart(2,'0')+':'+String(mi).padStart(2,'0');}
function taskDrag(e,id){DRAG={kind:'task',id:id,grab:0};
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);}catch(_){}}
function blockDrag(e,id,kind){const lane=document.querySelector('#gcal .lane');let grab=0;
  if(lane){const r=e.currentTarget.getBoundingClientRect();grab=(e.clientY-r.top)/SC_H*60;}
  DRAG={kind:kind||'task',id:id,grab:grab};
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',id);}catch(_){}}
function laneMin(e){const lane=document.querySelector('#gcal .lane');if(!lane)return SC_START*60;
  const r=lane.getBoundingClientRect();
  let m=SC_START*60+((e.clientY-r.top)/SC_H*60)-(DRAG?DRAG.grab:0);
  m=snap5(m);return Math.max(SC_START*60,Math.min(SC_END*60-5,m));}
function showDropLine(m){const dl=document.getElementById('dropline');if(!dl)return;
  dl.style.display='block';dl.style.top=((m-SC_START*60)/60*SC_H)+'px';
  const s=dl.querySelector('span');if(s)s.textContent='⏱ '+m2s(m)+' 에 놓기';}
function hideDropLine(){const dl=document.getElementById('dropline');if(dl)dl.style.display='none';}
function laneOver(e){if(!DRAG)return;e.preventDefault();try{e.dataTransfer.dropEffect='move';}catch(_){}showDropLine(laneMin(e));}
function laneLeave(e){const lane=document.querySelector('#gcal .lane');
  if(lane&&e.relatedTarget&&lane.contains(e.relatedTarget))return;hideDropLine();}
function laneDrop(e){if(!DRAG)return;e.preventDefault();const m=laneMin(e);const dr=DRAG;DRAG=null;hideDropLine();
  placeTaskAt(S.ui.day,dr.id,m,dr.kind);}
function placeTaskAt(d,id,sm,kind){ensureDay(d);
  sm=Math.max(SC_START*60,Math.min(SC_END*60-5,snap5(sm)));
  let obj=null,isEv=false;
  if(kind==='event'){obj=dayEvents(d).find(x=>x.id===id);isEv=true;}
  if(!obj){obj=findTask(d,id);}
  if(!obj){obj=dayEvents(d).find(x=>x.id===id);isEv=!!obj;}
  if(!obj){toast('옮길 항목을 찾지 못했습니다');return;}
  if(!isEv){const home=taskHome(id,d);            /* 이월 과제를 시간표에 놓으면 그날로 옮긴다 */
    if(home!==d){S.days[home].tasks=S.days[home].tasks.filter(t=>t.id!==id);
      if(S.days[home].one===id)S.days[home].one='';
      S.days[d].tasks.push(obj);}}
  let dur=60;
  if(obj.start&&obj.end){dur=Math.max(5,toMin(obj.end)-toMin(obj.start));}
  else if(obj.start){dur=60;}
  if(sm+dur>SC_END*60)sm=Math.max(SC_START*60,SC_END*60-dur);
  obj.start=m2s(sm);obj.end=m2s(sm+dur);
  save();renderTasks(d);renderOne(d);renderSchedule(d);
  syncMoved(d,obj,isEv);
  toast((isEv?'일정':'과제')+' → '+obj.start+'–'+obj.end+' 배치');}
function renderSchedule(d){const el=document.getElementById('gcal');if(!el)return;
  const gev=gDayCache[d]||[];
  /* 수업 시간과 겹치는 구글 일정은 숨긴다 (같은 수업이 두 번 그려지는 문제) */
  const kBlocks=kScheduleBlocks(d);
  const kRanges=kBlocks.map(b=>[b.sm,b.em]);
  const hideDup=(S.settings.hideDupG!==false)&&kRanges.length>0;
  let dupN=0;
  const isDupOfLesson=(sm,em)=>{ if(!hideDup)return false;
    const dur=Math.max(1,em-sm);
    return kRanges.some(r=>{const ov=Math.min(em,r[1])-Math.max(sm,r[0]); return ov>0 && ov>=dur*0.6;});};
  const items=dayEvents(d).map(ev=>({o:ev,rec:false}));   /* 반복은 이제 실제 일정으로 들어와 있다 */
  const tks=(S.days[d].tasks||[]).map((t,i)=>({t,i})).filter(x=>x.t.start);
  const recDone=S.days[d].recDone||[];const oneId=S.days[d].one||'';
  let lines='';for(let hr=SC_START;hr<SC_END;hr++)lines+=`<div class="hr"><span class="hrlab">${String(hr).padStart(2,'0')}:00</span></div>`;
  // 내 계획 + 반복 + 과제 + 구글 일정을 하나의 블록 목록으로 통합
  const blocks=[];
  items.forEach(it=>{const ev=it.o;const isRec=it.rec;
    if(!isRec&&ev.fromG&&isDupOfLesson(toMin(ev.start),toMin(ev.end))){dupN++;return;}
    const base=ev.role?roleColor(ev.role):(ev.color||'#5b53b0');
    const done=isRec?recDone.includes(ev.id):!!ev.done;const c=blockColors(base,done);
    const tog=isRec?`toggleRecDone('${d}','${ev.id}')`:`toggleEventDone('${d}','${ev.id}')`;

    const dg=isRec?'':` draggable="true" ondragstart="blockDrag(event,'${ev.id}','event')" ondragend="hideDropLine()"`;
    blocks.push({sm:toMin(ev.start),em:toMin(ev.end),build:st=>`<div class="ev${isRec?' rec':' grab'}"${dg} data-tk="${tipEvent(d,ev,isRec)}" style="${st};background:${c.bg};color:${c.fg};border:${done?'4px':'2px'} solid ${base}">
      ${isRec?'':`<button class="evx" style="color:${c.fg};right:57px" onclick="openEvEdit('${d}','${ev.id}')" title="수정${ev.gEventId?' (구글에도 반영)':''}">✏</button>`}
      ${isRec?'':`<button class="evx" style="color:${c.fg};right:38px;${ev.memo?'background:rgba(0,0,0,.34)':''}" onclick="openMemo('${d}','event','${ev.id}')" title="${ev.memo?'메모 있음 — 수정':'메모 남기기'}">🗒</button>`}
      <button class="evx" style="color:${c.fg};right:19px" onclick="${tog}" title="완료">${done?'↺':'✓'}</button>
      <button class="evx" style="color:${c.fg}" onclick="${del}" title="삭제">✕</button>
      <span class="tm" style="color:${c.fg}">${ev.start}–${ev.end}${ev.rid?' ↻':''}${ev.gEventId?' ✓구글':''}${ev.csf?' 🎯':''}</span><span class="ttl" style="${done?DONE_BLK:''}">${esc(ev.title)}</span></div>`});});
  tks.forEach(({t,i})=>{const done=t.status==='done';const c=blockColors(roleColor(t.role),done);const isOne=oneId===t.id;
    blocks.push({sm:toMin(t.start),em:toMin(t.end||addMinStr(t.start,60)),build:st=>`<div class="ev tk grab${isOne?' one':''}" draggable="true" ondragstart="blockDrag(event,'${t.id}','task')" ondragend="hideDropLine()" data-tk="${tipTask(d,t)}" style="${st};background:${c.bg};color:${c.fg};border:${done?'5px':'3px'} solid ${priColor(t.priority)}">
      <button class="evx" style="color:${c.fg};right:19px;${t.memo?'background:rgba(0,0,0,.34)':''}" onclick="openMemo('${d}','task','${t.id}')" title="${t.memo?'메모 있음 — 수정':'메모 남기기'}">🗒</button>
      <button class="evx" style="color:${c.fg}" onclick="toggleTaskDoneId('${t.id}','${d}')" title="완료">${done?'↺':'✓'}</button>
      <span class="tm" style="color:${c.fg}">${t.start}–${t.end||''} · ${t.priority} 과제${t.gEventId?' ✓구글':''}${t.csf?' 🎯':''}</span><span class="ttl" style="${done?DONE_BLK:''}">${isOne?'🁢 ':''}${esc(t.text)}</span></div>`});});
  kBlocks.forEach(b=>blocks.push(b));                 /* 교사용 수업 블록 (차시 번호 포함) */
  gev.forEach((g,gi)=>{
    if(isDupOfLesson(g.sm,g.em)){dupN++;return;}

  const sr=document.getElementById('syncrow');
  if(sr){const hasRec=(S.recurring||[]).some(r=>!r.gEventId);
    const dupNote=dupN?`<span class="synchint" style="color:var(--brand-d);font-weight:700">

        <button class="btn ghost sm" style="padding:2px 7px;font-size:11px" onclick="S.settings.hideDupG=false;save();renderSchedule('${d}')">모두 보기</button></span>`
      :((S.settings.hideDupG===false&&kRanges.length)?`<span class="synchint">
        · <button class="btn ghost sm" style="padding:2px 7px;font-size:11px" onclick="S.settings.hideDupG=true;save();renderSchedule('${d}')">수업과 겹치는 구글 일정 숨기기</button></span>`:'');
    sr.innerHTML=gTokenValid()
    ? `<button class="btn ghost sm" onclick="pullDay('${d}')">↧ 구글 일정 불러오기(편집 가능)</button> <button class="btn ghost sm" onclick="pushDay('${d}')">↥ 이 날 시간표 등록</button> ${(S.recurring||[]).length?`<button class="btn ghost sm" onclick="pushRecurring()">↻ 반복 일정 구글 등록</button>`:''} <span class="synchint">불러온 구글 일정은 <b>내 일정으로 들어와</b> 드래그 이동·✏ 수정·✕ 삭제가 되고, 변경은 구글 원본에도 반영됩니다 · 🗒 = 핵심 성공 요인·메모 · <b>블록에 마우스를 올리면</b> 전체 내용이 뜹니다</span>${dupNote}`
    : `<span class="synchint">구글과 주고받으려면 ‘🔗 구글 연동’ 탭에서 로그인하세요. (로그인 전에도 작성·저장·반복 설정은 됩니다) · <b>블록에 마우스를 올리면</b> 전체 내용이 뜹니다</span>${dupNote}`;}

/* 왼쪽 과제표와 오른쪽 시간표의 첫 줄 높이를 맞춘다 */
function alignPanels(){const t=document.getElementById('tasks'),g=document.getElementById('gcal'),sp=document.getElementById('taskspacer');
  if(!t||!g||!sp)return;
  sp.style.height='0px';
  const a=t.getBoundingClientRect(),b=g.getBoundingClientRect();
  if(Math.abs(a.left-b.left)<60){sp.style.height='0px';return;}   // 좁은 화면: 위아래로 쌓임
  const diff=Math.round(b.top-a.top);
  sp.style.height=(diff>0?diff:0)+'px';
}

function ensureAI(b){
  if(!b.id)b.id=uid(); if(!b.date)b.date=today();
  b.ai=b.ai||{};const a=b.ai;
  a.toc=a.toc||''; a.structure=a.structure||'';
  a.chapters=a.chapters||[];
  a.chapters.forEach(c=>{if(!c.id)c.id=uid();c.name=c.name||'';c.myLine=c.myLine||'';c.ai=c.ai||'';c.final=c.final||'';});
  /* 독서카드 — 書 脈 骨 我 */
  a.card=a.card||{};
  if(a.card.research&&!a.card.seo){a.card.seo=a.card.research;}      /* 구버전 마이그레이션 */
  a.card.seo=a.card.seo||''; a.card.maek=a.card.maek||''; a.card.gol=a.card.gol||''; a.card.judgment=a.card.judgment||'';
  a.review=a.review||{}; const rv=a.review;
  rv.claims=rv.claims||[];
  while(rv.claims.length<3)rv.claims.push({id:uid(),text:'',why:'',ex:'',debate:[],draft:'',feedback:''});
  rv.claims.forEach(c=>{if(!c.id)c.id=uid();c.text=c.text||'';c.why=c.why||'';c.ex=c.ex||'';c.debate=c.debate||[];c.draft=c.draft||'';c.feedback=c.feedback||'';});
  rv.full=rv.full||''; rv.fullFeedback=rv.fullFeedback||'';
  /* 1분 발표 — 60초 4블록 */
  a.speech=a.speech||{};const sp=a.speech;
  sp.hook=sp.hook||''; sp.core=sp.core||''; sp.msg=sp.msg||''; sp.close=sp.close||'';
  if(sp.script&&!sp.hook){sp.hook=sp.script;sp.script='';}           /* 구버전 마이그레이션 */
  sp.transcript=sp.transcript||''; sp.practice=sp.practice||''; sp.feedback=sp.feedback||'';
  a.pledge=a.pledge||{p1:false,p2:false,p3:false};
  a.purpose=a.purpose||'life';
  if(!a.step)a.step='setup';
  return b;
}

/* ---------- AI 연결 (Claude API / Gemini API / 복사 모드) ---------- */
function aiCfg(){S.settings.ai=S.settings.ai||{prov:'copy',key:'',model:''};return S.settings.ai;}
function setAiCfg(k,v){const c=aiCfg();c[k]=v;save();if(k==='prov')vReading(document.getElementById('view'));}
async function callAI(prompt,system){
  const c=aiCfg();
  if(c.prov==='claude'&&c.key){
    const r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':c.key,'anthropic-version':'2023-06-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:c.model||'claude-sonnet-4-5-20250929',max_tokens:1800,system:system||'',messages:[{role:'user',content:prompt}]})});
    if(!r.ok)throw new Error('Claude '+r.status+' — '+(await r.text()).slice(0,160));
    const j=await r.json();return (j.content||[]).map(x=>x.text||'').join('').trim();
  }
  if(c.prov==='gemini'&&c.key){
    const m=c.model||'gemini-2.0-flash';
    const body={contents:[{role:'user',parts:[{text:prompt}]}]};
    if(system)body.system_instruction={parts:[{text:system}]};
    const r=await fetch('https://generativelanguage.googleapis.com/v1beta/models/'+m+':generateContent?key='+encodeURIComponent(c.key),
      {method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});
    if(!r.ok)throw new Error('Gemini '+r.status+' — '+(await r.text()).slice(0,160));
    const j=await r.json();const cd=(j.candidates||[])[0]||{};const ps=((cd.content||{}).parts)||[];
    return ps.map(x=>x.text||'').join('').trim();
  }
  const v=await pasteModal((system?('[역할] '+system+'\n\n'):'')+prompt);
  if(v==null)throw new Error('__cancel__');
  return v;
}
function pasteModal(prompt){return new Promise(res=>{
  const ov=document.createElement('div');ov.className='ovl';
  ov.innerHTML='<div class="ovlbox">'+
    '<h3>🤖 AI에게 물어보기 <span class="hint">(복사 모드)</span></h3>'+
    '<p class="hint" style="margin:0 0 9px">아래 프롬프트를 복사해 Claude·ChatGPT·Gemini 등에 붙여넣고, 받은 답을 아래 칸에 붙여 넣으세요.</p>'+
    '<div class="ovlpre" id="ovlp"></div>'+
    '<div style="display:flex;gap:6px;margin:9px 0"><button class="btn sm" id="ovlcopy">📋 프롬프트 복사</button></div>'+
    '<textarea id="ovlans" placeholder="AI 답변을 여기에 붙여넣기" style="min-height:150px"></textarea>'+
    '<div style="display:flex;gap:6px;justify-content:flex-end;margin-top:9px">'+
    '<button class="btn ghost sm" id="ovlx">취소</button><button class="btn sm" id="ovlok">저장</button></div></div>';
  document.body.appendChild(ov);
  ov.querySelector('#ovlp').textContent=prompt;
  ov.querySelector('#ovlcopy').onclick=()=>rcopy(prompt);
  const done=v=>{ov.remove();res(v);};
  ov.querySelector('#ovlx').onclick=()=>done(null);
  ov.querySelector('#ovlok').onclick=()=>{const t=ov.querySelector('#ovlans').value.trim();done(t||null);};
  ov.addEventListener('click',e=>{if(e.target===ov)done(null);});
  setTimeout(()=>{const a=ov.querySelector('#ovlans');if(a)a.focus();},60);
});}
async function askAI(btn,prompt,system,cb){
  const old=btn.innerHTML;btn.disabled=true;btn.innerHTML='<span class="spin"></span> 생각 중…';
  let out=null,err=null;
  try{out=await callAI(prompt,system);}catch(e){err=e;}
  try{btn.disabled=false;btn.innerHTML=old;}catch(_){}
  if(err){if(String(err.message)!=='__cancel__')toast('AI 오류: '+err.message);return;}
  if(out)cb(out);
}

    '<p class="hint" style="margin-top:10px">＋ 새 책을 눌러 시작하세요. 먼저 할 일은 딱 셋 — ① 책 고르기 ② 목차를 입력해 책 세팅 ③ 1장을 읽고 “내 한 줄” 쓰기.</p></div>';
    return; }

  /* 단계 레일 */
  h+='<div class="rrail no-print">'+RSTEPS.map(s=>
     '<button class="rstep'+(b.ai.step===s[0]?' on':'')+(stepDone(b,s[0])?' ok':'')+'" onclick="goStep(\''+s[0]+'\')" title="'+s[4]+'">'+
     '<span class="n">'+s[1]+'</span><span class="t">'+s[2]+'</span><span class="w">'+s[3]+'</span></button>').join('')+'</div>'+
     '<p class="chain no-print">앞 단계의 산출물이 다음 단계의 재료가 됩니다 — <b>요약이 카드로, 카드가 글로, 글이 말로.</b><br>'+
     '시간은 권장일 뿐입니다. <b>4주에 나눠 해도, 하루에 몰아서 끝내도 됩니다.</b></p>';

  h+={setup:pSetup,l1:pL1,l2:pL2,l3:pL3,l4:pL4,rec:pRec}[b.ai.step](b);

  h+='<div class="card"><h3>전체 독서 기록</h3><div id="rlist"></div></div>';
  v.innerHTML=h; renderReading();
}
function stepHd(k,extra){const s=RSTEPS.find(x=>x[0]===k);
  return '<h3>'+s[1]+' · '+s[2]+' <span class="hint">'+s[3]+(extra?' — '+extra:'')+'</span><span class="obadge">'+s[4]+'</span></h3>';}
function goStep(k){const b=curBook();if(!b)return;b.ai.step=k;save();vReading(document.getElementById('view'));window.scrollTo(0,0);}
function nextBtn(k){const s=RSTEPS.find(x=>x[0]===k);
  return '<button class="btn sm" onclick="goStep(\''+k+'\')">'+s[1]+' · '+s[2]+' →</button>';}
/* 왜 이걸 써야 하는가 — 각 단계 맨 위에 붙는 근거 상자 */
function whyBox(t,body){return '<div class="whyb"><span class="wt">'+t+'</span>'+body+'</div>';}
/* 커리큘럼의 『코스모스』 예시 — 접었다 펴는 안내 */
function exBox(label,body){return '<details class="exb"><summary>『코스모스』 예시 보기 — '+label+'</summary><div class="exbd">'+body+'</div></details>';}
function newBook(){const b=ensureAI({id:uid(),date:today(),title:'',author:'',note:'',apply:'',rating:5});
  S.reading.unshift(b);S.ui.book=b.id;save();vReading(document.getElementById('view'));toast('새 책을 시작했습니다');}
function openBook(id){S.ui.book=id;save();vReading(document.getElementById('view'));window.scrollTo(0,0);}
function delBook(id){if(!confirm('이 책의 독서 여정 전체를 삭제할까요?'))return;
  S.reading=S.reading.filter(x=>x.id!==id);if(S.ui.book===id)S.ui.book='';save();vReading(document.getElementById('view'));}
function stepDone(b,k){const a=b.ai;
  if(k==='setup')return !!(b.title&&a.structure);
  if(k==='l1')return a.chapters.length>0&&a.chapters.every(c=>c.final||c.myLine);
  if(k==='l2')return !!(a.card.judgment&&a.card.seo);
  if(k==='l3')return rlen(a.review.full)>=1500;
  if(k==='l4')return rlen(spText(b))>=300;
  if(k==='rec')return !!(b.apply);
  return false;}
function rprog(b){ensureAI(b);let n=0;RSTEPS.forEach(s=>{if(stepDone(b,s[0]))n++;});return Math.round(n/RSTEPS.length*100);}

/* ---------- 1단계 · 책 세팅 (1강 ①) ---------- */
function pSetup(b){const a=b.ai;
  return '<div class="card"><h3>왜 AI에게 먼저 시키면 안 될까? <span class="hint">이 여정의 단 하나의 규칙</span></h3>'+
   '<p class="vsub" style="margin-top:0">① 내 생각 먼저 → ② AI로 보강 → ③ 다시 내 언어로 출력. 순서를 바꾸면 도구가 아니라 대필이 됩니다.</p>'+
   '<div class="mapi"><span class="no">생성</span><span class="bd"><b>생성 효과</b> — 내가 만든 답은 받아 적은 답보다 훨씬 오래 남습니다. 그래서 <b>“내 한 줄 먼저”</b>.</span></div>'+
   '<div class="mapi"><span class="no">인출</span><span class="bd"><b>인출 연습</b> — 책을 덮고 떠올리는 그 순간 진짜 내 기억이 됩니다. 그래서 <b>“책 덮고 쓰기”</b>.</span></div>'+
   '<div class="mapi" style="border:none"><span class="no">설명</span><span class="bd"><b>설명 효과</b> — 남에게 말할 수 있어야 정말 아는 것입니다. 그래서 마지막은 <b>1분 말하기</b>.</span></div>'+
   '<div class="lockn" style="margin-top:8px">⚠ AI가 먼저 읽어주면 — 결과물은 남아도, 내 실력은 0이 됩니다.</div></div>'+
   '<div class="card">'+stepHd('setup','제목·저자·목차를 AI에 입력하면, 이후 모든 대화가 이 책의 논리 구조 안에서 이루어집니다')+
   whyBox('왜 목차부터 입력하나',
     '세팅 없이 “이 책 어때?”라고 물으면 AI는 인터넷 어딘가의 <b>일반론</b>을 말합니다. 목차를 넣어 두면 이후 모든 대화가 <b>이 책의 논리 구조 안에서</b> 이루어집니다. '+
     '또 목차를 옮겨 적는 동안 내가 <b>책의 전체 지도</b>를 한 번 훑게 됩니다 — 이 5분이 이후 전 과정의 방향을 잡습니다.')+
   '<div class="grid2">'+
     '<label class="fld"><span class="lb">제목</span><input type="text" placeholder="예) 코스모스" value="'+esc(b.title)+'" onchange="bsetR(\'title\',this.value)"></label>'+
     '<label class="fld"><span class="lb">저자</span><input type="text" placeholder="예) 칼 세이건" value="'+esc(b.author)+'" onchange="bset(\'author\',this.value)"></label>'+
   '</div>'+
   '<label class="fld"><span class="lb">이 책을 어디에 쓸 것인가 <span class="hint">— 고르면 이후 단계의 안내와 예시가 그 맥락으로 바뀝니다</span></span>'+
   '<select onchange="bsetR(\'ai.purpose\',this.value)">'+
     PURP.map(p=>'<option value="'+p[0]+'"'+(a.purpose===p[0]?' selected':'')+'>'+p[1]+' — '+p[2]+'</option>').join('')+
   '</select></label>'+
   '<label class="fld"><span class="lb">목차 (책 앞의 차례를 그대로 옮겨 적으세요 — 한 줄에 한 장)</span>'+
   '<textarea style="min-height:150px" placeholder="1장 코스모스의 바닷가에서&#10;2장 우주 생명의 푸가&#10;3장 지상과 천상의 하모니" onchange="bset(\'ai.toc\',this.value)">'+esc(a.toc)+'</textarea></label>'+
   '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px">'+
     '<button class="btn aibtn sm"'+(a.toc.trim()?'':' disabled')+' onclick="aiSetup(this)">🤖 책 세팅 — 문제의식 · 논리 구조 파악</button>'+
     '<button class="btn ghost sm" onclick="applyToc()">목차 → 장 목록 만들기 (2단계로)</button>'+
     '<button class="btn ghost sm" onclick="delBook(\''+b.id+'\')">✕ 이 책 삭제</button></div>'+

   (a.structure?'<div class="aiout"><span class="tg">AI — 핵심 문제의식 · 전체 논리 구조 (문제 제기 → 분석 → 대안)</span>'+esc(a.structure)+'</div>':'')+
   exBox('책 세팅',
     '<b>입력</b> — 『코스모스』(칼 세이건) + 목차 전체<br>'+
     '<b>AI 답</b> — <span class="q">“문제의식: 인간은 우주에서 어떤 존재인가. 구조: 우주의 규모 제시(문제 제기) → 과학사의 오류와 발견(분석) → 과학적 사고와 겸손(대안)”</span><br>'+
     '이 구조가 잡히면, 이후 장별 요약·토론·감상록이 모두 이 뼈대 위에서 이어집니다.')+

function aiSetup(btn){const b=curBook();
  const p='『'+(b.title||'제목 미상')+'』'+(b.author?'('+b.author+')':'')+'를 함께 분석할 거야.\n목차는 다음과 같아.\n\n'+b.ai.toc+
   '\n\n이 책의 핵심 문제의식과 전체 논리 구조(문제 제기→분석→대안)를 먼저 6~8줄 개조식으로 정리해줘. 이후 대화에서도 이 구조를 기준으로 답해줘.';
  askAI(btn,p,'당신은 독서 코치입니다. 간결한 한국어 개조식으로 답합니다.',t=>{bset('ai.structure',t);vReading(document.getElementById('view'));});}
function applyToc(){const b=curBook();
  const names=b.ai.toc.split('\n').map(s=>s.trim()).filter(s=>s.length>1);
  if(!names.length){toast('목차를 먼저 입력하세요');return;}
  const old=b.ai.chapters;
  b.ai.chapters=names.map(n=>{const p=old.find(o=>o.name===n);return p||{id:uid(),name:n,myLine:'',ai:'',final:''};});
  b.ai.step='l1';save();vReading(document.getElementById('view'));toast(names.length+'개 장을 만들었습니다');}

/* ---------- 2단계 · 장별 3줄 요약 (1강 ②③④) ---------- */
function pL1(b){const a=b.ai;
  if(!a.chapters.length)return '<div class="card">'+stepHd('l1')+'<p class="hint">먼저 [1단계]에서 <b>목차 → 장 목록 만들기</b>를 눌러 주세요.</p>'+
    '<button class="btn ghost sm" onclick="goStep(\'setup\')">← 1단계로</button></div>';
  const done=a.chapters.filter(c=>c.final).length;
  let h='<div class="card">'+stepHd('l1','내 한 줄 + AI 보완 = 장별 3줄 요약')+
   whyBox('왜 “내 한 줄”을 먼저 쓰나',
     '<b>책을 덮고</b> 기억만으로 한 줄을 쓰는 이 순간이 학습의 전부입니다(<b>인출 연습</b>). 책을 펴 놓고 베껴 적으면 손은 움직여도 기억은 남지 않습니다. '+
     '<b>이 단계를 건너뛰면 학습이 사라집니다.</b><br>'+
     'AI를 나중에 부르는 이유도 같습니다 — AI 요약을 먼저 읽으면 내 머리는 “아, 그렇구나”로 끝나고 <b>떠올리는 훈련이 통째로 없어집니다.</b> '+
     'AI는 대체가 아니라 보완이라서, 최종 3줄의 <b>1줄째에는 내 문장이 그대로 살아 있어야</b> 합니다.<br>'+
     '<b>왜 전 장을 다 하나</b> — 장별 3줄이 모이면 <b>책의 뼈대(지식 지도)</b>가 되고, 그 지도가 다음 단계 독서카드의 骨 칸으로 그대로 들어갑니다.')+
   '<div class="synchint" style="margin-bottom:10px">🔒 내 요약을 <b>10자 이상</b> 써야 그 장의 AI 보완이 열립니다. '+
   '<b>'+done+'/'+a.chapters.length+'</b>장 확정</div>'+
   exBox('1장「코스모스의 바닷가에서」',
     '<b>① 내 한 줄(책 덮고)</b> — <span class="q">“우주는 인간에게 겸손을 가르치는 가장 큰 교실이다.”</span><br>'+
     '<b>② AI 보완 제안</b> — 우주의 시공간 규모 / 인간 존재의 상대적 위치 / 그럼에도 우주를 이해하려는 과학의 시도<br>'+
     '<b>③ 나의 최종 3줄</b><br>1. 우주는 인간에게 겸손을 가르치는 가장 큰 교실이다.<br>2. 우주의 시공간 앞에서 인간의 역사는 한 점에 불과하다.<br>3. 그럼에도 그 점이 우주를 이해하려 한다는 사실이 경이롭다.<br>'+
     '<b>포인트</b> — 1줄째는 <b>내 문장이 그대로 살아 있습니다.</b> AI는 대체가 아니라 보완입니다.')+'';
  a.chapters.forEach((c,i)=>{
    const ok=c.myLine.trim().length>=10;
    h+='<div class="chcard"><div class="chhd"><span class="nm">'+(i+1)+'. '+esc(c.name)+'</span>'+
      '<span class="st'+(c.final?' ok':'')+'">'+(c.final?'확정':(ok?'AI 열림':'내 한 줄 대기'))+'</span></div>'+
      '<label class="fld"><span class="lb">① 내 한 줄 — 책을 덮고</span>'+
      '<textarea style="min-height:52px" placeholder="이 장을 한 줄로 요약하면? (기억만으로, 내 문장으로)" onchange="setChap('+i+',\'myLine\',this.value)">'+esc(c.myLine)+'</textarea></label>'+

      (ok?'':' <span class="lockn">🔒 내 생각 먼저</span>')+'</div>'+
      (c.ai?'<div class="aiout"><span class="tg">AI 보완 제안 — 그대로 받지 말 것</span>'+esc(c.ai)+'</div>':'')+
      '<label class="fld" style="margin-top:8px"><span class="lb">③ 나의 최종 3줄 — 내 언어로 다듬어 확정</span>'+

  });
  h+='<div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn ghost sm" onclick="copyGol()">📋 지식 지도 복사</button>'+nextBtn('l2')+'</div></div>';
  return h;}
function setChap(i,k,v){const b=curBook();b.ai.chapters[i][k]=v;save();
  if(k==='myLine'||k==='final')vReading(document.getElementById('view'));}
function aiChapter(btn,i){const b=curBook();const c=b.ai.chapters[i];
  const p='『'+(b.title||'')+'』「'+c.name+'」에 대한 내 한 줄 요약은 "'+c.myLine+'"이야.\n\n'+
   '놓친 핵심을 보완해 3줄 요약을 제안해줘. 단, 1줄째는 내 문장의 취지를 유지해줘. 각 줄 40자 이내.';
  askAI(btn,p,'독자의 생각을 대체하지 말고 보완합니다. 한국어 개조식.',t=>{setChap(i,'ai',t);vReading(document.getElementById('view'));});}
function golText(b){return b.ai.chapters.filter(c=>c.final||c.myLine)
  .map((c,i)=>(i+1)+'. '+c.name+'\n'+(c.final||c.myLine)).join('\n\n');}
function copyGol(){rcopy(golText(curBook()));}

/* ---------- 3단계 · 나만의 독서카드 (2강) 書 脈 骨 我 ---------- */

     '<b>왜 我 칸은 내 손으로만 쓰나</b> — <b>我 칸이 있어야 “꺼내 쓸 수 있는” 카드가 됩니다.</b> '+purp(b)[7]+'의 재료는 전부 이 칸에서 나오고, '+
     '여기 쓴 두세 줄이 다음 단계 감상록의 <b>“하고 싶은 말”로 자랍니다.</b> 이 칸을 AI로 채우면 카드는 남지만 나는 남지 않습니다.')+

   row('脈','시대 배경 · 대표 비평','왜 그 시점에 나왔고, 세상은 어떻게 평가했는가 (긍정 1 · 비판 1)','AI 조사 + 웹검색',
     '<button class="btn aibtn sm" onclick="aiMaek(this)">🤖 맥락 · 비평 조사</button>'+

function setClaim(i,k,v){const b=curBook();b.ai.review.claims[i][k]=v;save();
  if(k==='text')vReading(document.getElementById('view'));}
function authorSys(b){return '너는 책 『'+(b.title||'')+'』의 저자 '+(b.author||'')+'다. 책의 논지를 지키며, 정중하지만 날카롭게 반론하라. 3~5문장. 마지막에 독자에게 되묻는 질문 하나를 반드시 던져라.';}
function aiDebate(btn,i){const b=curBook();const c=b.ai.review.claims[i];
  const p='한 독자가 당신의 책에 대해 이렇게 주장한다.\n\n주장: '+c.text+
   (c.why?'\n근거: '+c.why:'')+(c.ex?'\n경험: '+c.ex:'')+'\n\n저자로서 반론하라.';
  askAI(btn,p,authorSys(b),t=>{c.debate.push({who:'me',text:c.text});c.debate.push({who:'au',text:t});
    save();vReading(document.getElementById('view'));});}
function aiRebut(inp,i){const v=(inp.value||'').trim();if(!v){toast('재반론을 입력하세요');return;}
  const b=curBook();const c=b.ai.review.claims[i];
  c.debate.push({who:'me',text:v});save();
  const hist=c.debate.map(m=>(m.who==='au'?'저자: ':'독자: ')+m.text).join('\n');
  const btn=inp.parentElement.querySelector('button');
  askAI(btn,'지금까지의 토론이다.\n\n'+hist+'\n\n저자로서 마지막 독자 발언에 다시 반론하라.',authorSys(b),
    t=>{c.debate.push({who:'au',text:t});save();vReading(document.getElementById('view'));});
  inp.value='';}
function debateLog(){const b=curBook();
  return b.ai.review.claims.filter(c=>c.debate.length).map((c,i)=>
    '### 하고 싶은 말 '+(i+1)+' — '+c.text+'\n'+
    c.debate.map(m=>(m.who==='au'?'**저자 '+(b.author||'')+'** ':'**나** ')+m.text).join('\n\n')).join('\n\n');}
function copyDebateLog(){const t=debateLog();if(!t){toast('아직 토론 기록이 없습니다');return;}rcopy(t);}
function assembleFull(){const b=curBook();const rv=b.ai.review;
  const parts=rv.claims.filter(c=>c.text.trim()).map((c,i)=>
    '■ 하고 싶은 말 '+['①','②','③'][i]+' — '+c.text+'\n\n'+
    (c.why?'[근거] '+c.why+'\n\n':'')+(c.ex?'[경험·감정] '+c.ex+'\n':''));
  if(!parts.length){toast('주장을 먼저 쓰세요');return;}
  const head='『'+(b.title||'')+'』'+(b.author?' — '+b.author:'')+'\n\n'+
    (b.ai.card.judgment?'[我 · 나의 판단]\n'+b.ai.card.judgment+'\n\n':'');
  rv.full=(rv.full?rv.full+'\n\n':'')+head+parts.join('\n');
  save();vReading(document.getElementById('view'));toast('초고를 합쳤습니다 — 이제 내 문장으로 고쳐 쓰세요');}
function aiFullEdit(btn){const b=curBook();

function parseSpeech(t){const map=[['hook','훅'],['core','핵심'],['msg','메시지'],['close','마무리']];
  const res={};let hit=0;
  map.forEach(k=>{const re=new RegExp('\\[\\s*'+k[1]+'[^\\]]*\\]\\s*([\\s\\S]*?)(?=\\n\\s*\\[|$)');
    const m=t.match(re);if(m&&m[1].trim()){res[k[0]]=m[1].trim();hit++;}});
  return hit>=2?res:null;}
